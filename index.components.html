  /* 8. Font Size（字号，px） */

  --line-height-none: 1;

  --outline-width-none: 0px;

/* ── body base ── */
body {
  margin: 0;
  line-height: 1.5;
  color: var(--on-surface);
  font-family: var(--font-family);
  background-color: var(--surface);
}

#root {
  min-height: 100vh;
}

/* Standard scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
  background-color: transparent;
}

::-webkit-scrollbar-corner {
  background-color: transparent;
}

::-webkit-scrollbar-track {
  background-color: transparent;
}

::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background-color: var(--color-comp-divider);
  background-clip: padding-box;
}

::-webkit-scrollbar-track-piece {
  background-color: transparent;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--primary-40);
}


/* 语义层 Light Mode（:root 默认主题）*/
:root {
  /* Font Color（文本色）*/
  --color-font-primary: var(--primary-90);
  --color-font-secondary: var(--primary-60);
  --color-font-tertiary: var(--primary-40);
  --color-font-fourth: var(--primary-20);
  --color-font-emphasize: var(--brand-font); 
  --color-font-on-primary: var(--on-primary);
  --color-font-on-secondary: var(--on-primary-60);
  --color-font-on-tertiary: var(--on-primary-40);
  --color-font-on-fourth: var(--on-primary-20);

  /* Background Color（背景色）*/
  --color-background-primary: var(--white);
  --color-background-secondary: var(--gray-01);
  --color-background-tertiary: var(--gray-02);
  --color-background-fourth: var(--gray-03);
  --color-background-emphasize: var(--brand);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--white);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-05);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary); 
  --color-comp-background-gray: var(--gray-01); 
  --color-comp-background-gray-secondary: var(--gray-01);
  --color-fg-unchecked: var(--on-primary-20);
  --color-comp-divider: var(--container-20); 

  /* Comp Border Color（组件边框色）*/
  --color-comp-border: var(--container-15); 
  --color-comp-border-hover: var(--container-20); 
  --color-comp-border-focus: var(--brand); 
  --color-comp-border-active: var(--brand); 
  --color-comp-border-disabled: var(--container-10); 

  /* Icon Color（图标色）*/
  --color-icon-primary: var(--primary-90);
  --color-icon-secondary: var(--primary-60);
  --color-icon-tertiary: var(--primary-40);
  --color-icon-fourth: var(--primary-20);
  --color-icon-emphasize: var(--brand-font);
  --color-icon-sub-emphasize: var(--brand-40);
  --color-icon-on-primary: var(--on-primary);
  --color-icon-on-secondary: var(--on-primary-60);
  --color-icon-on-tertiary: var(--on-primary-40);
  --color-icon-on-fourth: var(--on-primary-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-05); 
  --color-interactive-pressed: var(--container-10);
  --color-interactive-select: var(--brand-20); 
  --color-interactive-click: var(--container-10);

  /* Functional Color（功能色，设计师指定值，独立于 multi-color 色板）*/
  --color-error: #E84026;
  --color-alert: #ED6F21;
  --color-warning: #EFBF00;
  --color-success: #64BB5C;
  --color-info: #0A59F7;
  --color-error-container: #FDEBEB;
  --color-alert-container: #FFF0E6;
  --color-warning-container: #FFF7D6;
  --color-success-container: #EDF7EB;
  --color-info-container: #E6EEFE;

  /* Shadow（阴影）*/
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.1);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.12);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.06);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.08);
  --shadow-glow: 0 4px 32px 0 rgba(241, 243, 245, 0.8);
}


/* ==========================================================================
   主题层 Theme（AI 组件直接消费的终极语义层）
   加载顺序：base → light → theme → dark*/

:root {
  /* ── primary（品牌色族，部分占位）── */
  --primary: var(--brand);
  --on-primary: var(--white);
  --primary-hover: var(--brand-80); 
  --primary-active: var(--brand); 
  --primary-disabled: var(--brand-40);
  --primary-container: var(--brand-05); 
  --on-primary-container: var(--color-font-primary);

  /* ── surface / on-surface（已重写，引用新 light/dark 语义 token）── */
  --surface: var(--color-background-secondary);
  --surface-dim: var(--color-background-tertiary);
  --surface-bright: var(--color-background-primary);
  --on-surface: var(--color-font-primary);
  --surface-container-lowest: var(--color-background-primary);
  --surface-container-low: var(--color-background-secondary);
  --surface-container: var(--color-comp-background-tertiary);
  --surface-container-high: var(--color-background-tertiary);
  --surface-container-highest: var(--color-background-fourth);

  --inverse-surface: var(--primary);
  --inverse-on-surface: var(--color-font-on-primary);
  --inverse-on-surface-variant: var(--color-font-on-secondary);
  --inverse-primary: var(--brand);

  --error: var(--color-error);
  --on-error: var(--white);
  --error-container: var(--color-error-container);
  --on-error-container: var(--color-font-primary);

  --alert: var(--color-alert);
  --on-alert: var(--white);
  --alert-container: var(--color-alert-container);
  --on-alert-container: var(--color-font-primary);

  --warning: var(--color-warning);
  --on-warning: var(--black);
  --warning-container: var(--color-warning-container);
  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);
  --on-success: var(--white);
  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);
  --on-info: var(--white);
  --info-container: var(--color-info-container);
  --on-info-container: var(--color-font-primary);

  --text-secondary: var(--color-font-secondary);
  --text-placeholder: var(--color-font-tertiary);
  --text-disabled: var(--color-font-fourth);
  --text-inverse-disabled: var(--color-font-on-fourth);
  
  --interactive-link: var(--brand);
  --interactive-link-hover: var(--brand-80);
  --interactive-link-active: var(--brand);
  --interactive-link-visited: var(--brand);
  --interactive-link-disabled: var(--brand-40);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: var(--outline-width-base); /* 1px */
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（排印角色：字号+行高+字体族绑定，字重在其后组合）── */
  /* Display（展示文本）*/
  --font-display-sm: var(--font-size-4xl)/var(--line-height-tight) var(--font-family); /* 38px/1.25 */
  --font-display-md: var(--font-size-5xl)/var(--line-height-tight) var(--font-family); /* 48px/1.25 */
  --font-display-lg: var(--font-size-6xl)/var(--line-height-tight) var(--font-family); /* 56px/1.25 */

  /* Title（标题）*/
  --font-title-sm: var(--font-size-xl)/var(--line-height-snug) var(--font-family); /* 20px/1.375 */
  --font-title-md: var(--font-size-2xl)/var(--line-height-snug) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/var(--line-height-snug) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/

  );
}

.demo-force-press .sb-root {

    var(--color-interactive-pressed),

  );

/* focus：默认基础上叠加内部描边，内容不变 */

}

  display: block;

.sb-root {
  display: flex;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  cursor: text;
  transition: background-image var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);

/* ── 大号：填充式 ─────────────────────────────────────────────

.sb-large {

  gap: 8px;
  border-radius: 24px;
  background-color: var(--surface-container);
  font: var(--font-body-lg);
}

/* ── 小号：无填充 ─────────────────────────────────────────────

  height: 36px;
  padding: 9px 12px;
  gap: 8px;
  border-radius: var(--radius-md);
  background-color: transparent;
  font: var(--font-body-sm);
}

/* hover：comp_background_tertiary + interactive_hover（黑 5%） */
.sb-large:hover {
  background-image: linear-gradient(
    var(--color-interactive-hover),
    var(--color-interactive-hover)
  );
}

/* press：comp_background_tertiary + interactive_pressed（黑 10%） */
.sb-large:active {
  background-image: linear-gradient(
    var(--color-interactive-pressed),
    var(--color-interactive-pressed)
  );
}

/* focus：默认态 + 内部描边 2px interactive_focus（品牌蓝 100%）
   仅键盘聚焦（Tab）时出现；鼠标点击进入的「激活」「输入中」不显示描边 */
.sb-large.sb-focus-ring {
  box-shadow: inset 0 0 0 var(--border-width-thick) var(--focus-ring);
}

/* ── 图标与文字 ─────────────────────────────────────────────── */

/* 图标颜色 font_secondary（黑 60%），两种尺寸一致 */
.sb-icon {
  flex: 0 0 auto;
  color: var(--text-secondary);
}

/* 输入区：承载光标与输入框 */
.sb-field {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
}

/* 占位文字：font_secondary（黑 60%） */
.sb-input::placeholder {
  color: var(--text-secondary);
}

.sb-input {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  background: transparent;
  font: inherit;
  /* 文字行高 22px：9(上) + 22 + 9(下) = 40px 的盒子高度 */
  line-height: 22px;
  /* 输入中的文字：font_primary（黑 90%） */
  color: var(--on-surface);
  /* 原生光标不可控宽高，统一隐藏，改用自绘光标 .sb-caret */
  caret-color: transparent;
}

/* 隐藏量尺：与输入框同字体，只用来量插入点之前的文字宽度 */
.sb-measure {
  position: absolute;
  left: 0;
  top: 0;
  visibility: hidden;
  white-space: pre;
  pointer-events: none;
}

/* 小号：12px 文字，行高 16px（光标同样由自绘的 .sb-caret 提供） */
.sb-small .sb-input {
  line-height: 16px;
}

/* 小号占位文字颜色：font_tertiary（Light 黑 40%，即 --text-placeholder）
   输入中的文字仍为 font_primary（同大号，由 .sb-input 的 --on-surface 决定） */
.sb-small .sb-input::placeholder {
  color: var(--color-font-tertiary);
}

/* 自绘光标：按设计 SVG 绘制 —— 1.5×24px 圆角矩形，rx=0.75（两端半圆），纯 fill、无描边
   用 SVG 而不是 CSS 背景 + border-radius：CSS 的 1.5px 会被像素对齐撑成 2px，圆角也会被吃掉。
   注意 SVG 根元素必须是整数尺寸（24×24）：根元素尺寸为小数时 Chromium 会把视口吸附到整像素，
   1.5px 细条的圆角同样会被吃掉变直角（几何放在根元素内部用小数坐标则正常抗锯齿）
   绝对定位，不影响文字高度与盒子尺寸；24px 宽的透明画布不拦截点击 */
.sb-caret {
  display: none;
  position: absolute;
  left: -1.5px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-font-emphasize);
  pointer-events: none;
  animation: sb-caret-blink 1.1s step-end infinite;
}

/* 小号光标：形状同大号（同一个 SVG），颜色 container90
   设计 SVG：fill rgb(0,0,0) + fill-opacity 0.898（= 0.9，即 container90 Light 黑 90%） */
.sb-small .sb-caret {
  color: var(--container-90);
}

.sb-root:focus-within .sb-caret {
  display: block;
}

@keyframes sb-caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

/* ── 关闭按钮（Small cancel）：16×16，颜色同搜索图标 ── */
.sb-clear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
}

/* ── 禁用态 ─────────────────────────────────────────────────── */
.sb-disabled,
.sb-disabled .sb-input {
  cursor: not-allowed;
}

.sb-disabled:hover,
.sb-disabled:active {
  background-image: none;
}

.sb-disabled .sb-icon,
.sb-disabled .sb-clear {
  color: var(--color-icon-fourth);
}

.sb-disabled .sb-input {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

.sb-disabled .sb-input::placeholder {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

  align-content: start;
}

.button-control {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
  box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
  padding: 0 12px;
}

.button-control input::placeholder {
  color: var(--text-placeholder);
}

.button-select-wrap {
  position: relative;
  display: block;
}

.button-select-wrap::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
  padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
  background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-control select:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.button-toggle-line {
  display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-icon-select {
  margin-top: 0;
}

.button-switch {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
  position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
  background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
  transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {
  display: flex;
  min-height: 220px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

@media (max-width: 980px) {
  .button-configurator {
    grid-template-columns: 1fr;
  }

  .button-configurator-preview {
    min-height: 132px;
  }
}

@media (max-width: 760px) {

  .button-controls {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 520px) {
  .button-controls {
    grid-template-columns: 1fr;
  }
}

/* ── 交互演练区 ── */
.btn-lab {
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.btn-lab-block {
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 20px 24px 24px;
}

.btn-lab-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.btn-lab-size {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-spec {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

/* 交互演练：一列 = 一个变体（Primary / Secondary…）
   列内 Enabled 在上、Disabled 在下，两者都 align-items:center，
   因此共用同一条竖向中轴，可直接叠着看差异。 */
.btn-lab-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

@media (max-width: 860px) {
  .btn-lab-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.btn-lab-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  padding: 14px 12px 18px;
  background-color: var(--surface-container-low);
  border-radius: var(--radius-container);
}

.btn-lab-colhead {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 16px;
  text-align: center;
}

.btn-lab-colname {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-colmeta {
  font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-lab-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
}

/* 下半格用虚线把「可用 / 禁用」分开，但两个按钮仍对齐同一中轴 */
.btn-lab-slot-off {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--divider);
}

.btn-lab-slotlabel {
  font: var(--font-caption-md);
  font-weight: var(--font-weight-bold);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-placeholder);
}

/* ── 形状对照：只有规范的一个组合（outlined × small），两列并排 ── */
.btn-lab-grid--two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

/* ── 状态矩阵：按尺寸分区 ── */
.btn-matrix {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.btn-matrix-group {
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 16px 20px 20px;
  overflow-x: auto;
}

.btn-matrix-grouphead {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--divider);
}

.btn-matrix-groupname {
  font: var(--font-subtitle-md);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-groupspec {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-matrix-row {
  display: grid;
  grid-template-columns: minmax(150px, 200px) repeat(5, minmax(140px, 1fr));
  gap: 8px;
  align-items: center;
  padding: 10px 0;
}

.btn-matrix-row + .btn-matrix-row {
  border-top: 1px solid var(--divider);
}

.btn-matrix-row-head {
  padding-bottom: 4px;
}

.btn-matrix-label {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.btn-matrix-variant {
  font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.btn-matrix-meta {
  font: var(--font-caption-lg);
  color: var(--text-placeholder);
}

.btn-matrix-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 44px;
  /* 静态标本：整格不接收指针事件，真实 hover / active 不会覆盖被强制的状态 */
  pointer-events: none;
}

.btn-matrix-state {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-hint {
  font: var(--font-caption-md);
  color: var(--text-placeholder);
}

/* ── 对照表 ── */
.btn-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 24px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.btn-table th {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  background-color: var(--surface-container-low);
}

.btn-table td {
  font: var(--font-body-md);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  border-top: 1px solid var(--divider);
}

.btn-table-strong {
  display: block;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

/* token 解析值 / 变体值副行 */
.btn-table-src {
  display: block;
  margin-top: 4px;
  font: var(--font-caption-md);
  color: var(--text-placeholder);
  line-height: 1.5;
}

/* 色彩规范表：列多，外层容器允许横向滚动 */
.btn-table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-table-wrap .btn-table {
  min-width: 900px;
  border-radius: 0;
  box-shadow: none;
  margin-top: 0;
}

.btn-table-wrap .btn-table--color {
  min-width: 1180px;
}

.btn-table-wrap .btn-table--roomy {
  min-width: 920px;
}

.btn-table-wrap--spaced {
  margin-top: 24px;
}

.btn-table--roomy th,
.btn-table--roomy td {
  min-width: 110px;
}

.btn-table--color th:first-child,
.btn-table--color td:first-child {
  min-width: 112px;
}

.btn-table--color th:not(:first-child),
.btn-table--color td:not(:first-child) {
  min-width: 130px;
}

.btn-color-token {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.btn-color-token code {
  white-space: normal;
  overflow-wrap: anywhere;
}

.btn-table .btn-color-variant {
  vertical-align: top;
  color: var(--on-surface);
  font: var(--font-body-lg);
  font-weight: var(--font-weight-bold);
  background: var(--surface-container-low);
  border-top: 1px solid var(--divider);
}

.btn-table .btn-color-state {
  min-width: 110px;
  vertical-align: top;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.btn-color-state small {
  display: block;
  margin-top: 4px;
  color: var(--text-placeholder);
  font: var(--font-caption-md);
  font-weight: var(--font-weight-regular);
  white-space: nowrap;
}

.btn-color-same {
  color: var(--text-placeholder);
  font: var(--font-body-md);
}

.btn-color-group-start > th,
.btn-color-group-start > td {
  border-top: 2px solid var(--color-comp-border);
}

.btn-color-swatch {
  display: inline-block;
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  box-sizing: border-box;
  border: 1px solid var(--color-comp-border);
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--surface-container-lowest);
}

.btn-color-swatch--transparent {
  background-color: var(--surface-container-lowest);
  background-image:
    linear-gradient(45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(-45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--divider) 75%),
    linear-gradient(-45deg, transparent 75%, var(--divider) 75%);
  background-position: 0 0, 0 5px, 5px -5px, -5px 0;
  background-size: 10px 10px;
}

.btn-color-swatch--none {
  background:
    linear-gradient(
      135deg,
      transparent 44%,
      var(--text-placeholder) 46%,
      var(--text-placeholder) 54%,
      transparent 56%
    ),
    var(--surface-container-lowest);
}

.btn-color-swatch--disabled {
  opacity: 0.5;
}

/* ==========================================================================
   Button · Material 3（消费 HarmonyOS 语义色彩规范）
   --------------------------------------------------------------------------
   变体 Variant（M3 规范命名 / 别名）
     .btn--filled    M3 Filled button        高强调 · 品牌实心   （primary）
     .btn--tonal     M3 Filled tonal button  中强调 · 品牌淡底   （secondary）
     .btn--outlined  M3 Outlined button      中强调 · 描边       （tertiary）
     .btn--text      M3 Text button          低强调 · 纯文字     （plain）

   尺寸 Size             高     字号   图标   左右内边距  图标间距
     .btn--large        40px   16px   20px     16px        8px
     .btn--small        28px   14px   16px     12px        4px

   形状 Shape（几何轴，与 variant / size 正交）
     .btn--round        跑道圆  --radius-full（默认，历史外观）
     .btn--square       方圆角  --radius-lg（8px，规范上只用于 outlined × small）

   状态 State（纯 CSS，组件无内部 state）
     default → :hover → :focus-visible → :active(pressed) → :disabled
     data-state="hover|focus|pressed" 为文档/走查用的静态强制态。

   --------------------------------------------------------------------------
   色彩映射：main color = --btn-main-color → --color-icon-primary（主色，不是 brand）

   variant     背景 background                     描边 border             文字 text
   filled      --btn-main-color                   —                     --color-font-on-primary
   tonal       --color-comp-background-tertiary   —                     --btn-main-color
   outlined    透明                               --color-comp-border    --btn-main-color
   text        透明（任何状态都无背景）              —                     --color-font-emphasize

   variant     hover                          pressed                        disabled
   filled      叠 --on-primary-10             叠 --on-primary-15              沿用静止态 + 50% 透明度
   tonal       叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态 + 50% 透明度
   outlined    叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态（含描边）+ 50% 透明度
   text        字 --primary-hover              字 --primary-active             沿用静止态 + 50% 透明度

   disabled 统一模型：四个变体都保留静止态的底 / 字 / 描边，仅整体 opacity: 0.5。
   即 --btn-container-disabled / --btn-label-disabled / --btn-border-color-disabled
   默认就指向静止态变量，变体无需再各自声明。

   text 的文字态色（无叠加层，直接换字色，取 design_system 里 primary 的专用态色）：
     静止 --color-font-emphasize（brand-font）→ hover --primary-hover（brand 80%）
     → pressed --primary-active（brand 实色）；三档互不相同，按下有明确纵深。

   叠加层分两种模型（取决于静止底是浅色还是实心主色）：
   ① tonal / outlined —— 静止底是浅色 / 透明，叠中性交互层
      --color-interactive-hover / -pressed（= container-05 / container-10，暗色各加深一档），
      即「不变静止底，只叠交互层」，与 design_system.md 的「Hover/pressed on surfaces」一致。
     tonal    hover → container-05 叠 container-05 ≈ container-10 = --color-comp-background-secondary ✓
              pressed → container-10 叠 container-05 ≈ container-15 ✓
     outlined hover → container-05 = --color-comp-background-tertiary ✓
              pressed → container-10 = --color-comp-background-secondary ✓
   ② filled —— 静止底是 --btn-main-color（默认近黑 / 近白实心），中性层叠在其上对比度极低
      （视觉上接近无变化），所以改用「主色上的颜色」--on-primary-10 / -15 作叠加层。
      M3 Filled button 的 state layer 规范即为 on-primary，因此这不是特例而是对齐规范。
      该令牌明色为白基、暗色为黑基，自带翻转，一个值覆盖两个模式且方向都正确：
        Light：rgba(0,0,0,.9) 上叠白 10% → 合成后明度约从 10% 灰升到 19% 灰，比黑色浅一点 ✓
        Dark ：rgba(255,255,255,.9) 上叠黑 10% → 变深一档，反馈同样可见 ✓
      把 --btn-main-color 换成品牌色等彩色后依然成立（叠加层仍是「主色上的颜色」）。

   聚焦环：--btn-focus-ring = --black（纯黑 1px + --outline-offset-gap 间隙）。
     text 变体无容器，focus 不画描边环（--btn-focus-ring: transparent）。

   Dark Mode（html.dark）：
     filled 的底 = --color-icon-primary，暗色下翻为近白；文字跟随翻黑（见 .dark .btn--filled）。
     其叠加层 --on-primary-10 / -15 在暗色下翻为黑基，叠加方向自动变成「变深」，无需额外规则。
     其余变体的底 / 字都引用了自带翻转的语义 token，无需额外规则。

   所有 --btn-* 都是可覆盖契约，单实例定制：
     <Button className="my-btn" />  +  .my-btn { --btn-padding-inline: 32px; }
   ========================================================================== */

.btn {
  /* ── 尺寸契约（由 .btn--large / .btn--small 覆写）── */
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: 16px;
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;

  /* ── 形状契约（由 .btn--round / .btn--square 覆写）── */
  --btn-radius: var(--radius-full); /* 默认 = round，跑道圆 */

  /* ── 颜色契约（由变体类覆写）── */
  --btn-main-color: var(--color-icon-primary); /* 本套按钮主色：换主色只改这一处 */
  --btn-container: transparent; /* 静止态填充 */
  --btn-label: var(--on-surface); /* 文字色，图标 currentColor 跟随 */
  --btn-label-hover: var(--btn-label); /* hover 文字色（默认不变） */
  --btn-label-pressed: var(--btn-label); /* pressed 文字色（默认不变） */
  --btn-state-layer-hover: transparent; /* 悬停叠加层（叠在静止态填充之上） */
  --btn-state-layer-pressed: transparent; /* 按下叠加层 */
  --btn-container-disabled: var(--btn-container); /* 禁用态填充：沿用静止态 */
  --btn-label-disabled: var(--btn-label); /* 禁用态文字：沿用静止态 */
  --btn-disabled-opacity: 0.5; /* 禁用态整体透明度 */
  --btn-border-width: var(--border-width-none);
  --btn-border-color: transparent;
  --btn-border-color-disabled: var(--btn-border-color); /* 禁用态描边：沿用静止态 */
  --btn-focus-ring: var(--black); /* 聚焦描边环：纯黑（明暗通用） */

  position: relative;
  isolation: isolate; /* 让负 z-index 的叠加层留在按钮内部 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--btn-icon-gap);
  box-sizing: border-box;
  height: var(--btn-height);
  padding: 0 var(--btn-padding-inline);
  border: var(--btn-border-width) solid var(--btn-border-color);
  border-radius: var(--btn-radius);
  background-color: var(--btn-container);
  color: var(--btn-label);
  font-family: var(--font-family);
  font-size: var(--btn-font-size);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-none);
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard);
}

/* ── 状态叠加层：M3 state layer，叠在静止态填充之上 ── */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background-color: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

/* ── hover：叠加层 + 文字色（文字色默认与静止态一致）── */
.btn:hover:not(:disabled)::before,
.btn[data-state="hover"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* data-state 静态强制态与真实伪类必须成对：否则矩阵里 hover 只出叠加层、不出字色变化 */
.btn:hover:not(:disabled),
.btn[data-state="hover"] {
  color: var(--btn-label-hover);
}

/* ── pressed：规则放在 hover 之后，按下时覆盖悬停层 ── */
.btn:active:not(:disabled)::before,
.btn[data-state="pressed"]::before {
  background-color: var(--btn-state-layer-pressed);
  opacity: 1;
}

.btn:active:not(:disabled),
.btn[data-state="pressed"] {
  color: var(--btn-label-pressed);
}

/* ── 键盘聚焦：1px 纯黑描边环 + 2px 间隙（不影响布局）；text 变体不画环 ── */
.btn:focus-visible,
.btn[data-state="focus"] {
  outline: var(--outline-width-focus) solid var(--btn-focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 鼠标点击产生的非键盘焦点不画环；但 data-state="focus" 的静态强制态要保住 */
.btn:focus:not(:focus-visible):not([data-state="focus"]) {
  outline: none;
}

.btn[data-state="focus"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* ── 禁用：四个变体都沿用静止态的底 / 字 / 描边，仅整体降透明度（默认 50%）── */
.btn:disabled {
  background-color: var(--btn-container-disabled);
  color: var(--btn-label-disabled);
  border-color: var(--btn-border-color-disabled);
  opacity: var(--btn-disabled-opacity);
  cursor: not-allowed;
  outline: none;
}

/* ── 尺寸 ───────────────────────────────────────────── */
.btn--large {
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: var(--font-size-md); /* 16px */
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;
}

.btn--small {
  --btn-height: 28px;
  --btn-padding-inline: 12px;
  --btn-font-size: var(--font-size-base); /* 14px */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

/* ── 形状 Shape：与 variant / size 正交的第三个轴 ────────
   形状不并入变体名：variant 表达强调层级，shape 表达几何，
   两者相乘会让命名膨胀（filled-round / filled-square / tonal-round…）并使别名失效。 */

/* Round：跑道圆（默认外观，与历史版本一致，向后兼容） */
.btn--round {
  --btn-radius: var(--radius-full);
}

/* Square：方圆角 8px（--radius-lg）。
   design system 里只用于 outlined × small 这一个组合；组件不做静默降级，
   其它组合传了 square 也照常渲染，合规性由调用方（presets.isShapeSupported）判断。 */
.btn--square {
  --btn-radius: var(--radius-lg);
}

/* ── 变体：颜色契约 ─────────────────────────────────── */

/* Filled：main color 实心 + 纯白文字。
   hover / pressed 用「主色上的颜色」--on-primary-10 / -15 作叠加层（M3 Filled button 的
   state layer 规范即为 on-primary）：该令牌明色为白基、暗色为黑基，自带翻转，
   所以浅色下近黑实心变浅、暗色下近白实心变深，两个模式方向都对。
   disabled：沿用静止态（实心底 + 纯白文字）整体 50% 透明度。 */
.btn--filled {
  --btn-container: var(--btn-main-color);
  --btn-label: var(--color-font-on-primary);
  --btn-state-layer-hover: var(--on-primary-10);
  --btn-state-layer-pressed: var(--on-primary-15);
}

/* Filled · Dark Mode：主色实心在暗色下翻为近白（--primary-90 → rgba(255,255,255,.9)），
   文字必须随之翻成黑色，否则白底白字不可读。
   注意：style 层的 --on-primary 被 theme.css 的 :root 固定为 --white（与 base.css 的
   .dark 同权重且更晚加载，导致暗色下不翻转），所以只能按 html.dark 约定在组件内覆盖。
   只覆盖文字色，底 / 叠加层 / disabled 继续沿用上面的契约（叠加层 --on-primary-* 自带翻转）。 */
.dark .btn--filled {
  --btn-label: var(--black);
}

/* Tonal：静止 comp_background_tertiary，叠加 --color-interactive-* 得到
   hover ≈ comp_background_secondary（container-10）、pressed ≈ container-15
   （叠层规则见 design_system「Hover/pressed on surfaces」）。
   disabled：沿用静止态配色，整体 50% 透明度。 */
.btn--tonal {
  --btn-container: var(--color-comp-background-tertiary);
  --btn-label: var(--btn-main-color);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Outlined：透明底 + 1px 中性描边 + 主色文字；描边不随状态变化
   hover = comp_background_tertiary（container-05）、pressed = comp_background_secondary（container-10）
   disabled：沿用静止态配色（含描边），整体 50% 透明度。 */
.btn--outlined {
  --btn-label: var(--btn-main-color);
  --btn-border-width: var(--border-width-thin);
  --btn-border-color: var(--color-comp-border);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Text：brand 主题蓝文字，任何状态都不出现背景色
   hover / pressed 用 design_system 里 primary 的专用态色：--primary-hover（brand 80%）
   → --primary-active（brand 实色），静止态 --color-font-emphasize 与两者都不同，按下有明确纵深。
   focus：无容器，不画聚焦描边环
   disabled：沿用静止态文字色，整体 50% 透明度。 */
.btn--text {
  --btn-label: var(--color-font-emphasize);
  --btn-label-hover: var(--primary-hover);
  --btn-label-pressed: var(--primary-active);
  --btn-state-layer-hover: transparent;
  --btn-state-layer-pressed: transparent;
  --btn-focus-ring: transparent;
}

/* ── 内容 ───────────────────────────────────────────── */
.btn__icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
}

.btn__label {
  display: inline-block;
}

}

}

/* ── Configurator ── */
.button-theme-toggle {
  margin-top: 16px;
}

.button-configurator {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.button-controls {
  display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.button-control {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
  box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
  padding: 0 12px;
}

.button-control input::placeholder {
  color: var(--text-placeholder);
}

.button-select-wrap {
  position: relative;
  display: block;
}

.button-select-wrap::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
  padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
  background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-control select:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.button-toggle-line {
  display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-icon-select {
  margin-top: 0;
}

.button-switch {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
  position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
  background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
  transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {

}

.btn-color-swatch--transparent {
  background-color: var(--surface-container-lowest);
  background-image:
    linear-gradient(45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(-45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--divider) 75%),
    linear-gradient(-45deg, transparent 75%, var(--divider) 75%);
  background-position: 0 0, 0 5px, 5px -5px, -5px 0;
  background-size: 10px 10px;
}

.btn-color-swatch--none {
  background:
    linear-gradient(
      135deg,
      transparent 44%,
      var(--text-placeholder) 46%,
      var(--text-placeholder) 54%,
      transparent 56%
    ),
    var(--surface-container-lowest);
}

.btn-color-swatch--disabled {
  opacity: 0.5;
}

/* ==========================================================================
   Button · Material 3（消费 HarmonyOS 语义色彩规范）
   --------------------------------------------------------------------------
   变体 Variant（M3 规范命名 / 别名）
     .btn--filled    M3 Filled button        高强调 · 品牌实心   （primary）
     .btn--tonal     M3 Filled tonal button  中强调 · 品牌淡底   （secondary）
     .btn--outlined  M3 Outlined button      中强调 · 描边       （tertiary）
     .btn--text      M3 Text button          低强调 · 纯文字     （plain）

   尺寸 Size             高     字号   图标   左右内边距  图标间距
     .btn--large        40px   16px   20px     16px        8px
     .btn--small        28px   14px   16px     12px        4px

   形状 Shape（几何轴，与 variant / size 正交）
     .btn--round        跑道圆  --radius-full（默认，历史外观）
     .btn--square       方圆角  --radius-lg（8px，规范上只用于 outlined × small）

   状态 State（纯 CSS，组件无内部 state）
     default → :hover → :focus-visible → :active(pressed) → :disabled
     data-state="hover|focus|pressed" 为文档/走查用的静态强制态。

   --------------------------------------------------------------------------
   色彩映射：main color = --btn-main-color → --color-icon-primary（主色，不是 brand）

   variant     背景 background                     描边 border             文字 text
   filled      --btn-main-color                   —                     --color-font-on-primary
   tonal       --color-comp-background-tertiary   —                     --btn-main-color
   outlined    透明                               --color-comp-border    --btn-main-color
   text        透明（任何状态都无背景）              —                     --color-font-emphasize

   variant     hover                          pressed                        disabled
   filled      叠 --on-primary-10             叠 --on-primary-15              沿用静止态 + 50% 透明度
   tonal       叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态 + 50% 透明度
   outlined    叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态（含描边）+ 50% 透明度
   text        字 --primary-hover              字 --primary-active             沿用静止态 + 50% 透明度

   disabled 统一模型：四个变体都保留静止态的底 / 字 / 描边，仅整体 opacity: 0.5。
   即 --btn-container-disabled / --btn-label-disabled / --btn-border-color-disabled
   默认就指向静止态变量，变体无需再各自声明。

   text 的文字态色（无叠加层，直接换字色，取 design_system 里 primary 的专用态色）：
     静止 --color-font-emphasize（brand-font）→ hover --primary-hover（brand 80%）
     → pressed --primary-active（brand 实色）；三档互不相同，按下有明确纵深。

   叠加层分两种模型（取决于静止底是浅色还是实心主色）：
   ① tonal / outlined —— 静止底是浅色 / 透明，叠中性交互层
      --color-interactive-hover / -pressed（= container-05 / container-10，暗色各加深一档），
      即「不变静止底，只叠交互层」，与 design_system.md 的「Hover/pressed on surfaces」一致。
     tonal    hover → container-05 叠 container-05 ≈ container-10 = --color-comp-background-secondary ✓
              pressed → container-10 叠 container-05 ≈ container-15 ✓
     outlined hover → container-05 = --color-comp-background-tertiary ✓
              pressed → container-10 = --color-comp-background-secondary ✓
   ② filled —— 静止底是 --btn-main-color（默认近黑 / 近白实心），中性层叠在其上对比度极低
      （视觉上接近无变化），所以改用「主色上的颜色」--on-primary-10 / -15 作叠加层。
      M3 Filled button 的 state layer 规范即为 on-primary，因此这不是特例而是对齐规范。
      该令牌明色为白基、暗色为黑基，自带翻转，一个值覆盖两个模式且方向都正确：
        Light：rgba(0,0,0,.9) 上叠白 10% → 合成后明度约从 10% 灰升到 19% 灰，比黑色浅一点 ✓
        Dark ：rgba(255,255,255,.9) 上叠黑 10% → 变深一档，反馈同样可见 ✓
      把 --btn-main-color 换成品牌色等彩色后依然成立（叠加层仍是「主色上的颜色」）。

   聚焦环：--btn-focus-ring = --black（纯黑 1px + --outline-offset-gap 间隙）。
     text 变体无容器，focus 不画描边环（--btn-focus-ring: transparent）。

   Dark Mode（html.dark）：
     filled 的底 = --color-icon-primary，暗色下翻为近白；文字跟随翻黑（见 .dark .btn--filled）。
     其叠加层 --on-primary-10 / -15 在暗色下翻为黑基，叠加方向自动变成「变深」，无需额外规则。
     其余变体的底 / 字都引用了自带翻转的语义 token，无需额外规则。

   所有 --btn-* 都是可覆盖契约，单实例定制：
     <Button className="my-btn" />  +  .my-btn { --btn-padding-inline: 32px; }
   ========================================================================== */

.btn {
  /* ── 尺寸契约（由 .btn--large / .btn--small 覆写）── */
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: 16px;
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;

  /* ── 形状契约（由 .btn--round / .btn--square 覆写）── */
  --btn-radius: var(--radius-full); /* 默认 = round，跑道圆 */

  /* ── 颜色契约（由变体类覆写）── */
  --btn-main-color: var(--color-icon-primary); /* 本套按钮主色：换主色只改这一处 */
  --btn-container: transparent; /* 静止态填充 */
  --btn-label: var(--on-surface); /* 文字色，图标 currentColor 跟随 */
  --btn-label-hover: var(--btn-label); /* hover 文字色（默认不变） */
  --btn-label-pressed: var(--btn-label); /* pressed 文字色（默认不变） */
  --btn-state-layer-hover: transparent; /* 悬停叠加层（叠在静止态填充之上） */
  --btn-state-layer-pressed: transparent; /* 按下叠加层 */
  --btn-container-disabled: var(--btn-container); /* 禁用态填充：沿用静止态 */
  --btn-label-disabled: var(--btn-label); /* 禁用态文字：沿用静止态 */
  --btn-disabled-opacity: 0.5; /* 禁用态整体透明度 */
  --btn-border-width: var(--border-width-none);
  --btn-border-color: transparent;
  --btn-border-color-disabled: var(--btn-border-color); /* 禁用态描边：沿用静止态 */
  --btn-focus-ring: var(--black); /* 聚焦描边环：纯黑（明暗通用） */

  position: relative;
  isolation: isolate; /* 让负 z-index 的叠加层留在按钮内部 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--btn-icon-gap);
  box-sizing: border-box;
  height: var(--btn-height);
  padding: 0 var(--btn-padding-inline);
  border: var(--btn-border-width) solid var(--btn-border-color);
  border-radius: var(--btn-radius);
  background-color: var(--btn-container);
  color: var(--btn-label);
  font-family: var(--font-family);
  font-size: var(--btn-font-size);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-none);
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard);
}

/* ── 状态叠加层：M3 state layer，叠在静止态填充之上 ── */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background-color: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

/* ── hover：叠加层 + 文字色（文字色默认与静止态一致）── */
.btn:hover:not(:disabled)::before,
.btn[data-state="hover"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* data-state 静态强制态与真实伪类必须成对：否则矩阵里 hover 只出叠加层、不出字色变化 */
.btn:hover:not(:disabled),
.btn[data-state="hover"] {
  color: var(--btn-label-hover);
}

/* ── pressed：规则放在 hover 之后，按下时覆盖悬停层 ── */
.btn:active:not(:disabled)::before,
.btn[data-state="pressed"]::before {
  background-color: var(--btn-state-layer-pressed);
  opacity: 1;
}

.btn:active:not(:disabled),
.btn[data-state="pressed"] {
  color: var(--btn-label-pressed);
}

/* ── 键盘聚焦：1px 纯黑描边环 + 2px 间隙（不影响布局）；text 变体不画环 ── */
.btn:focus-visible,
.btn[data-state="focus"] {
  outline: var(--outline-width-focus) solid var(--btn-focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 鼠标点击产生的非键盘焦点不画环；但 data-state="focus" 的静态强制态要保住 */
.btn:focus:not(:focus-visible):not([data-state="focus"]) {
  outline: none;
}

.btn[data-state="focus"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* ── 禁用：四个变体都沿用静止态的底 / 字 / 描边，仅整体降透明度（默认 50%）── */
.btn:disabled {
  background-color: var(--btn-container-disabled);
  color: var(--btn-label-disabled);
  border-color: var(--btn-border-color-disabled);
  opacity: var(--btn-disabled-opacity);
  cursor: not-allowed;
  outline: none;
}

/* ── 尺寸 ───────────────────────────────────────────── */
.btn--large {
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: var(--font-size-md); /* 16px */
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;
}

.btn--small {
  --btn-height: 28px;
  --btn-padding-inline: 12px;
  --btn-font-size: var(--font-size-base); /* 14px */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

/* ── 形状 Shape：与 variant / size 正交的第三个轴 ────────
   形状不并入变体名：variant 表达强调层级，shape 表达几何，
   两者相乘会让命名膨胀（filled-round / filled-square / tonal-round…）并使别名失效。 */

/* Round：跑道圆（默认外观，与历史版本一致，向后兼容） */
.btn--round {
  --btn-radius: var(--radius-full);
}

/* Square：方圆角 8px（--radius-lg）。
   design system 里只用于 outlined × small 这一个组合；组件不做静默降级，
   其它组合传了 square 也照常渲染，合规性由调用方（presets.isShapeSupported）判断。 */
.btn--square {
  --btn-radius: var(--radius-lg);
}

/* ── 变体：颜色契约 ─────────────────────────────────── */

/* Filled：main color 实心 + 纯白文字。
   hover / pressed 用「主色上的颜色」--on-primary-10 / -15 作叠加层（M3 Filled button 的
   state layer 规范即为 on-primary）：该令牌明色为白基、暗色为黑基，自带翻转，
   所以浅色下近黑实心变浅、暗色下近白实心变深，两个模式方向都对。
   disabled：沿用静止态（实心底 + 纯白文字）整体 50% 透明度。 */
.btn--filled {
  --btn-container: var(--btn-main-color);
  --btn-label: var(--color-font-on-primary);
  --btn-state-layer-hover: var(--on-primary-10);
  --btn-state-layer-pressed: var(--on-primary-15);
}

/* Filled · Dark Mode：主色实心在暗色下翻为近白（--primary-90 → rgba(255,255,255,.9)），
   文字必须随之翻成黑色，否则白底白字不可读。
   注意：style 层的 --on-primary 被 theme.css 的 :root 固定为 --white（与 base.css 的
   .dark 同权重且更晚加载，导致暗色下不翻转），所以只能按 html.dark 约定在组件内覆盖。
   只覆盖文字色，底 / 叠加层 / disabled 继续沿用上面的契约（叠加层 --on-primary-* 自带翻转）。 */
.dark .btn--filled {
  --btn-label: var(--black);
}

/* Tonal：静止 comp_background_tertiary，叠加 --color-interactive-* 得到
   hover ≈ comp_background_secondary（container-10）、pressed ≈ container-15
   （叠层规则见 design_system「Hover/pressed on surfaces」）。
   disabled：沿用静止态配色，整体 50% 透明度。 */
.btn--tonal {
  --btn-container: var(--color-comp-background-tertiary);
  --btn-label: var(--btn-main-color);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Outlined：透明底 + 1px 中性描边 + 主色文字；描边不随状态变化
   hover = comp_background_tertiary（container-05）、pressed = comp_background_secondary（container-10）
   disabled：沿用静止态配色（含描边），整体 50% 透明度。 */
.btn--outlined {
  --btn-label: var(--btn-main-color);
  --btn-border-width: var(--border-width-thin);
  --btn-border-color: var(--color-comp-border);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Text：brand 主题蓝文字，任何状态都不出现背景色
   hover / pressed 用 design_system 里 primary 的专用态色：--primary-hover（brand 80%）
   → --primary-active（brand 实色），静止态 --color-font-emphasize 与两者都不同，按下有明确纵深。
   focus：无容器，不画聚焦描边环
   disabled：沿用静止态文字色，整体 50% 透明度。 */
.btn--text {
  --btn-label: var(--color-font-emphasize);
  --btn-label-hover: var(--primary-hover);
  --btn-label-pressed: var(--primary-active);
  --btn-state-layer-hover: transparent;
  --btn-state-layer-pressed: transparent;
  --btn-focus-ring: transparent;
}

/* ── 内容 ───────────────────────────────────────────── */
.btn__icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
}

.btn__label {
  display: inline-block;
}



.dropdown-theme-toggle {
  margin-top: 16px;
}

.dropdown-configurator {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.dropdown-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.dropdown-control {
  display: flex;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.dropdown-control {
  flex-direction: column;
}

.dropdown-select-wrap {
  position: relative;
  display: block;
}

.dropdown-select-wrap::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.dropdown-control select {
  width: 100%;
  height: 40px;
  padding: 0 40px 0 12px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.dropdown-control select:hover {
  background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.dropdown-control select:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.dropdown-icon-options {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.dropdown-icon-options--two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.dropdown-icon-option {
  min-width: 0;
  align-self: start;
}

.dropdown-icon-option-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 40px;
  gap: 16px;
}

.dropdown-icon-option-head > div {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 3px;
}

.dropdown-icon-option-head strong {
  color: var(--on-surface);
  font: var(--font-body-md);
  font-weight: var(--font-weight-bold);
}

.dropdown-icon-option-head span {
  color: var(--text-placeholder);
  font: var(--font-caption-lg);
}

.dropdown-switch {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.dropdown-switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.dropdown-switch-track {
  position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.dropdown-switch-track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.dropdown-switch input:checked + .dropdown-switch-track {
  background: var(--brand);
}

.dropdown-switch input:checked + .dropdown-switch-track::after {
  transform: translateX(16px);
}

.dropdown-switch input:focus-visible + .dropdown-switch-track {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.dropdown-icon-select {
  margin-top: 0;
}

.dropdown-configurator-preview {
  display: flex;
  min-height: 132px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

@media (max-width: 760px) {
  .dropdown-configurator {
    grid-template-columns: 1fr;
  }

  .dropdown-controls {
    grid-template-columns: 1fr 1fr;
  }

}

@media (max-width: 480px) {
 .dropdown-controls, .dropdown-icon-options, .dropdown-icon-options--two { grid-template-columns: minmax(0, 1fr); }
 .dropdown-configurator { padding: 16px; }
}



/* Inherit Button's variants, heights, typography, shapes and states. */
.dropdown-btn.btn--large {
  --dropdown-btn-padding-end: 12px;
}

.dropdown-btn.btn--small {
  --dropdown-btn-padding-end: 8px;
}

.dropdown-btn.btn--xs {
  --btn-height: 28px;
  --btn-padding-inline: 8px;
  --dropdown-btn-padding-end: 8px;
  --btn-font-size: var(--font-size-sm); /* 12px */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

.dropdown-btn {
  padding-inline-end: var(--dropdown-btn-padding-end);
}

/* Dropdown Plain uses neutral content and the same state fills as Tertiary. */
.dropdown-btn.btn--text {
  --btn-label: var(--btn-main-color);
  --btn-label-hover: var(--btn-label);
  --btn-label-pressed: var(--btn-label);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Compact square trigger: a dedicated exception for outlined + small. */
.dropdown-btn.btn--outlined.btn--small.btn--square {
  --btn-height: 32px;
  padding-inline-start: 8px;
  padding-inline-end: 4px;
}

/* XS Outlined is always the 8px-radius square version. */
.dropdown-btn.btn--outlined.btn--xs {
  --btn-radius: var(--radius-lg);
}

.dropdown-btn__asset {
  display: block;
  flex: 0 0 auto;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
  object-fit: contain;
}

/* The uploaded SVG is a mask so its silhouette follows the label color. */
.dropdown-btn__indicator {

const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let plusState = null; // null = probing, true = icon-plus available, false = fall back to Lucide
let plusPromise = null; // singleton getConfig probe promise
let iconConfig = null;
let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url }
const svgCache = new Map(); // "name&variant&color" -> svg text

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const m = colors.find((c) =>
      c.value.split(",").map((v) => v.trim()).includes(colorHex)
    );
    if (m) return m.id;
  }
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (cached in iconInfoMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  try {
    const resp = await fetch(
      `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
    );
    const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
    const entry = (Array.isArray(data) ? data : [data]).find(
      (d) => d.icons?.length
    );
    const selected = selectBestIcon(entry?.icons || [], name);
    if (!selected?.url) return null;
    iconInfoMap[name] = { name: selected.name, url: selected.url };
    return iconInfoMap[name];
  } catch (e) {
    return null;
  }
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
async function fetchSvg(name, variant, colorHex) {
  const info = await resolveIconInfo(name);
  if (!info) return "";
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colorId = resolveColorId(variant, colorHex);
  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(
        styleValue
      )}&color=${encodeURIComponent(colorId)}&fileType=svg`
    );
    const data = await resp.json(); // { url, name, data } or array
    const item = Array.isArray(data) ? data[0] : data;
    return item?.data || ""; // raw SVG text, injected as-is
  } catch (e) {
    return "";
  }
}

function Icon({
  name,
  src,
  size = 16,
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
}) {
  const [plus, setPlus] = useState(plusState); // reuse already-probed result
  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${color}`) || ""
  );

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${color}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, color).then((s) => {
        if (!alive) return;
        svgCache.set(key, s);
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, color]);

  // Debug/test hooks: component identity + props snapshot on the root element
  const dataAttrs = {
    "data-component": "Icon",
    "data-props": JSON.stringify({ name, src, size, color, variant, strokeWidth }),
  };

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      ...dataAttrs,
      width: size,
      height: size,
      className: className,
      alt: "",
      "aria-hidden": true,
      style: { ...style, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        ...dataAttrs,
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        style: { ...style, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ...dataAttrs,
      className,
      "aria-hidden": true,
      style: { ...style, width: size, height: size },
    });
  }

  return React.createElement("span", {
    ...dataAttrs,
    className,
    "aria-hidden": true,
    style: { ...style, width: size, height: size },
    dangerouslySetInnerHTML: { __html: svg },
  });
}

window.ComponentIcons = { Icon };
})();

</script>

function colorToken(value = "") {
  const match = value.match(/--[a-z0-9-]+/i);
  return match ? match[0] : "";
}

function ColorSpecCell({ label, detail, fallback = "", disabled = false }) {
  const isTransparent = label === "透明" || /\btransparent\b/i.test(detail);
  const isNone = label === "—";
  const token = colorToken(label) || colorToken(detail) || colorToken(fallback);
  const swatchClass = [
    "btn-color-swatch",
    isTransparent ? "btn-color-swatch--transparent" : "",
    isNone ? "btn-color-swatch--none" : "",
    disabled ? "btn-color-swatch--disabled" : "",
  ].filter(Boolean).join(" ");
  const swatchStyle = token && !isTransparent && !isNone
    ? { backgroundColor: `var(${token})` }
    : undefined;

  return (
    <>
      <span className="btn-color-token">
        <i className={swatchClass} style={swatchStyle} aria-hidden="true" />
        {isNone ? <span>—</span> : <code>{label}</code>}
      </span>
      <span className="btn-table-src">{detail}</span>
    </>
  );
}

function sampleFor(size, variant) {
  if (size === "xs" && variant === "outlined") return "打开方式";
  if (size === "xs" && variant === "text") return "单agent模式";
  return VARIANTS.find((item) => item.value === variant)?.sample || "按钮操作";
}

function colorToken(value = "") {
  const match = value.match(/--[a-z0-9-]+/i);
  return match ? match[0] : "";
}

function ColorSpecCell({ label, detail, fallback = "", disabled = false }) {
  const isTransparent = label === "透明" || /\btransparent\b/i.test(detail);
  const isNone = label === "—";
  const token = colorToken(label) || colorToken(detail) || colorToken(fallback);
  const swatchClass = [
    "btn-color-swatch",
    isTransparent ? "btn-color-swatch--transparent" : "",
    isNone ? "btn-color-swatch--none" : "",
    disabled ? "btn-color-swatch--disabled" : "",
  ].filter(Boolean).join(" ");
  const swatchStyle = token && !isTransparent && !isNone
    ? { backgroundColor: `var(${token})` }
    : undefined;

  return (
    <>
      <span className="btn-color-token">
        <i className={swatchClass} style={swatchStyle} aria-hidden="true" />
        {isNone ? <span>—</span> : <code>{label}</code>}
      </span>
      <span className="btn-table-src">{detail}</span>
    </>
  );
}

const COLOR_VARIANT_NAMES = {
  filled: "Primary",
  tonal: "Secondary",
  outlined: "Tertiary",
  text: "Text",
};

function SameDefaultCell() {
  return <span className="btn-color-same">同 Default</span>;
}

function colorStateRows(variant) {
  const isText = variant.value === "text";
  const colorValue = (label, detail) => ({ label, detail });

  return [
    {
      value: "default",
      label: "Default",
      background: colorValue(variant.container, variant.containerValue),
      outline: { label: variant.border, detail: variant.border === "—" ? "无描边" : variant.borderValue },
      text: colorValue(variant.label, variant.labelValue),
    },
    {
      value: "hover",
      label: "Hover",
      background: colorValue(variant.hover, variant.hoverValue),
      outline: null,
      text: null,
    },
    {
      value: "focus",
      label: "Focus",
      background: colorValue(variant.hover, variant.hoverValue),
      outline: isText ? null : { label: "--black", detail: "1px focus ring，offset 2px" },
      text: null,
    },
    {
      value: "pressed",
      label: "Pressed",
      background: colorValue(variant.pressed, variant.pressedValue),
      outline: null,
      text: null,
    },
    {
      value: "disabled",
      label: "Disabled",
      note: "整体 opacity 50%",
      background: null,
      outline: null,
      text: null,
    },
  ];
}

 * SegmentedButton — 分段按钮
 *
 * variant="text"（默认）：文本类按钮，总宽固定 514px，子按钮按数量等分自适应；
 * variant="icon"：纯图标类按钮，76×32 紧凑尺寸、圆角 8。
 * 文本类按钮通过 showIcon 开关图标、count 控制子按钮数量、labels 自定义文本。
 *

 */

// 依据高层参数构建分段数据（segments 直接传入时优先）
function buildSegments({ variant, count, labels, showIcon, icon }) {
  const n = Math.max(1, count);
  return Array.from({ length: n }, (_, i) => {
    const key = `s${i}`;
    const segIcon = Array.isArray(icon) ? icon[i % icon.length] : icon;
    if (variant === "icon") {
      return { key, icon: segIcon };
    }
    return {
      key,
      label: labels?.[i] ?? "文本",
      ...(showIcon && segIcon ? { icon: segIcon } : {}),
    };
  });
}

function SegmentedButton({
  variant = "text",
  count = 2,
  labels,
  showIcon = false,
  icon,
  radius = 24,
  segments,
  activeKey,
  defaultActiveKey,
  disabled = false,
  onChange,
  onSegmentClick,
  className = "",
}) {
  const resolvedSegments =
    segments ?? buildSegments({ variant, count, labels, showIcon, icon });

  const [internalActive, setInternalActive] = useState(
    defaultActiveKey ?? resolvedSegments[0]?.key
  );
  const [hoveredKey, setHoveredKey] = useState(null);
  const [pressedKey, setPressedKey] = useState(null);

  // 受控 / 非受控
  const active = activeKey !== undefined ? activeKey : internalActive;

  const handleClick = (seg, idx) => {
    if (disabled || seg.disabled) return;
    if (activeKey === undefined) setInternalActive(seg.key);
    if (onChange) onChange(seg.key, idx);
    if (onSegmentClick) onSegmentClick(seg.key, idx);
  };

  const rootClass = [
    "sb-root",
    variant === "icon" ? "sb-size-sm" : "",
    radius === 8 ? "sb-radius-8" : "",
    disabled ? "sb-disabled" : "",
    className,
  ]
    .filter(Boolean)
    .join(" ");

  return (
    <div className={rootClass} role="group" aria-label="Segmented Button">
      {resolvedSegments.map((seg, idx) => {
        const key = seg.key ?? idx;
        const isActive = key === active;
        const isHovered = hoveredKey === key;
        const isPressed = pressedKey === key;
        const isDisabled = disabled || seg.disabled;

        const classes = [
          "sb-segment",
          seg.icon ? "sb-has-icon" : "",
          isActive ? "sb-active" : "",
          isHovered ? "sb-hover" : "",
          isPressed ? "sb-pressed" : "",
        ]
          .filter(Boolean)
          .join(" ");

        return (
          <button
            key={key}
            type="button"
            className={classes}
            disabled={isDisabled}
            aria-pressed={isActive}
            onClick={() => handleClick(seg, idx)}
            onMouseEnter={() => setHoveredKey(key)}
            onMouseLeave={() => {
              setHoveredKey(null);
              setPressedKey(null);
            }}
            onMouseDown={() => setPressedKey(key)}
            onMouseUp={() => setPressedKey(null)}
          >
            {seg.icon ? (
              typeof seg.icon === "string" ? (
                <Icon
                  name={seg.icon}
                  size={16}
                  className="sb-icon"
                  color="currentColor"
                />
              ) : (
                <span className="sb-icon" aria-hidden="true">
                  {seg.icon}
                </span>
              )
            ) : null}
            {seg.label ? <span className="sb-label">{seg.label}</span> : null}
          </button>
        );
      })}
    </div>
  );
}
  Object.assign(__export, { SegmentedButton });
})();

(function(){
const __export = { ...window.ComponentIcons };

(function(){
  const { useState, useRef, useLayoutEffect } = React;
  const { Icon } = __export;
/**
 * Input 输入框组件
 * - 两种样式（variant）：outlined 描边 / filled 无描边
 * - 六种状态：默认 default / 激活 active / 输入中 typing / 输入完成 complete / 报错 error / 隐藏 hidden（密码）
 * - 状态可受控（state prop）或自动派生（由 focus + value + error 推导）
 */
function InputBox(props) {
  const {
    variant = "outlined", // "outlined" | "filled"
    width = "432px", // 输入框宽度（默认 432px）
    state: controlledState, // 受控状态，缺省时自动派生
    label,
    required = false, // 是否显示必填星号
    placeholder = "请输入内容",
    type = "text", // "text" | "password" ...
    value: valueProp,
    defaultValue = "",
    error = false, // boolean 或错误文案
    errorText = "Error",
    helperText,
    clearable = false,
    icon = true, // 是否显示尾部图标 / 按钮（键盘提示、关闭、密码切换）
    disabled = false,
    onChange,
    onFocus,
    onBlur,
  } = props;

  const isControlled = valueProp !== undefined;
  const [value, setValue] = useState(defaultValue);
  const [focused, setFocused] = useState(false);
  const [passwordVisible, setPasswordVisible] = useState(false);
  const [caretPos, setCaretPos] = useState(() =>
    isControlled ? (valueProp || "").length : (defaultValue || "").length
  );
  const [caretOffset, setCaretOffset] = useState(0);

  const measureRef = useRef(null);

  const currentValue = isControlled ? valueProp : value;
  const hasError = Boolean(error);

  // 未受控时，由焦点 / 内容 / 错误推导状态
  const derivedState = hasError
    ? "error"
    : focused
    ? currentValue
      ? "typing"
      : "active"
    : currentValue
    ? "complete"
    : "default";
  const state = controlledState || derivedState;

  const isPassword = type === "password";
  const inputType = isPassword ? (passwordVisible ? "text" : "password") : type;

  const isDotted = isPassword && !passwordVisible;
  const showCaret = !disabled;
  // 光标左偏移：密码隐藏时按圆点宽度（每点 8px + 间距 2px）计算，其余按文字宽度
  const caretLeft = isDotted
    ? Math.max(currentValue.length * 10 - 2, 0)
    : caretOffset;

  // 测量光标位置：用与输入框同字体的隐藏 span 量出“光标前的文字”宽度
  useLayoutEffect(() => {
    if (measureRef.current) {
      const w = measureRef.current.offsetWidth;
      if (w !== caretOffset) setCaretOffset(w);
    }
  }, [currentValue, caretPos, caretOffset]);

  const syncCaret = (e) => {
    const pos = e?.target?.selectionStart;
    if (typeof pos === "number") setCaretPos(pos);
  };

  const handleChange = (e) => {
    if (!isControlled) setValue(e.target.value);
    syncCaret(e);
    if (onChange) onChange(e);
  };
  const handleFocus = (e) => {
    setFocused(true);
    syncCaret(e);
    if (onFocus) onFocus(e);
  };
  const handleBlur = (e) => {
    setFocused(false);
    if (onBlur) onBlur(e);
  };
  const handleClear = () => {
    if (!isControlled) setValue("");
    setCaretPos(0);
    if (onChange) onChange({ target: { value: "" } });
  };

  return (
    <>
      {label && (
        <label className="input-label">
          {required && (
            <span className="input-required" aria-hidden="true">
              *
            </span>
          )}
          {label}
        </label>
      )}

      <div
        className={`input-root input-${variant} input-state-${state}${
          disabled ? " input-disabled" : ""
        }`}
        style={{ width }}
      >
      <div className="input-field">
        <div className="input-caret-wrap">
          <input
            className={`input-control${
              isPassword && !passwordVisible ? " input-control-dotted" : ""
            }`}
            type={inputType}
            value={currentValue}
            placeholder={placeholder}
            disabled={disabled}
            onChange={handleChange}
            onFocus={handleFocus}
            onBlur={handleBlur}
            onSelect={syncCaret}
            onKeyUp={syncCaret}
            onClick={syncCaret}
          />
          {/* 隐藏测量层：宽度 = 光标前文字宽度 */}
          <span
            ref={measureRef}
            className="input-caret-measure"
            aria-hidden="true"
          >
            {currentValue.slice(0, caretPos)}
          </span>
          {/* 蓝色光标：所有状态均显示，随文字（或密码点）移动 */}
          {showCaret && (
            <span
              className="input-caret"
              style={{ left: caretLeft }}
              aria-hidden="true"
            >
              <Icon name="cursor" size={24} />
            </span>
          )}

          {/* 密码点：隐藏时自定义渲染，每个点 8×8px、间距 2px */}
          {isPassword && !passwordVisible && currentValue.length > 0 && (
            <span className="input-dots" aria-hidden="true">
              {Array.from({ length: currentValue.length }).map((_, i) => (
                <span key={i} className="input-dot" />
              ))}
            </span>
          )}
        </div>

        {/* 默认状态：输入提示图标 */}
        {icon && state === "default" && !isPassword && !disabled && (
          <Icon name="keyboard" size={32} className="input-hint-icon" />
        )}

        {/* 非默认状态：统一关闭按钮 */}
        {icon && state !== "default" && !isPassword && !disabled && (
          <button
            type="button"
            className="input-close"
            onClick={handleClear}
            aria-label="关闭"
            tabIndex={-1}
          >
            <Icon name="close" size={32} />
          </button>
        )}

        {/* 密码可见性切换（隐藏 / 显示） */}
        {icon && isPassword && (
          <button
            type="button"
            className="input-eye"
            onClick={() => setPasswordVisible((v) => !v)}
            aria-label={passwordVisible ? "隐藏密码" : "显示密码"}
            tabIndex={-1}
          >
            <Icon name={passwordVisible ? "eye-off" : "eye"} size={32} />
          </button>
        )}
      </div>

      {hasError ? (
        <div className="input-message input-error-text">{errorText}</div>
      ) : helperText ? (
        <div className="input-message input-helper-text">{helperText}</div>
      ) : null}
      </div>
    </>
  );
}
  Object.assign(__export, { InputBox });
})();
