                        <InputBox variant={item.value} width="280px" label="字段名称" placeholder="请输入内容" icon {...stateProps(itemState.value)} />
                      </div>
                    </td>
                  ))}
                  <td><div className="input-demo-static" inert=""><InputBox variant={item.value} width="280px" label="密码" state="complete" type="password" value="123456" /></div></td>
                  <td><div className="input-demo-static" inert=""><InputBox variant={item.value} width="280px" label="字段名称" value="不可编辑" disabled /></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>

      <Section title="Color spec" description="Variant → State → Background / Outline / Text。未变化项写“同 Default”。">
        <div className="btn-table-wrap">
          <table className="btn-table btn-table--color">
            <thead><tr><th>Variant</th><th>State</th><th>Background</th><th>Outline</th><th>Text</th></tr></thead>
            <tbody>{VARIANTS.map((item) => <ColorRows key={item.value} variant={item.value} />)}</tbody>
          </table>
        </div>
      </Section>

      <Section title="Token contract" description="两种 Variant 共用尺寸、排版、caret 与尾部图标规格，仅 Outline 不同。">
        <div className="btn-table-wrap">
          <table className="btn-table btn-table--roomy">
            <thead><tr><th>Property</th><th>Value</th><th>Token / Rule</th></tr></thead>
            <tbody>
              <tr><th>Width / Height</th><td>432px / 40px</td><td>width 可由 prop 覆盖</td></tr>
              <tr><th>Padding</th><td>8px / 16px</td><td>尾部 32px 图标距右边框 4px</td></tr>
              <tr><th>Radius</th><td>24px</td><td>Outlined 与 Filled 相同</td></tr>
              <tr><th>Input text</th><td>16px</td><td><code>--font-body-lg</code></td></tr>
              <tr><th>Label</th><td>14px / 19px</td><td><code>--font-body-md</code> · regular</td></tr>
              <tr><th>Caret</th><td>2 × 24px</td><td><code>--brand</code>；禁用时隐藏</td></tr>
              <tr><th>Password dot</th><td>8 × 8px，gap 2px</td><td><code>--color-font-primary</code></td></tr>
              <tr><th>Message</th><td>12px / medium</td><td>上间距 8px；错误文字左移 12px</td></tr>
            </tbody>
          </table>
        </div>
      </Section>

      <Section title="API contract" description="受控 state 用于静态或流程驱动；缺省时由 focus、value 与 error 自动派生。">
        <div className="btn-table-wrap">
          <table className="btn-table btn-table--roomy">
            <thead><tr><th>Props</th><th>Contract</th></tr></thead>
            <tbody>
              <tr><th>variant / state / width</th><td>控制容器样式、视觉状态和宽度；state 缺省时自动派生。</td></tr>
              <tr><th>value / defaultValue / onChange</th><td>支持受控与非受控输入；onChange 接收原生风格 event。</td></tr>
              <tr><th>label / required / placeholder</th><td>required 只在存在 label 时显示必填星号。</td></tr>
              <tr><th>type</th><td>password 使用可切换的自定义圆点掩码；其他值传给原生 input。</td></tr>
              <tr><th>error / errorText / helperText</th><td>error 优先显示错误提示；否则显示 helperText。</td></tr>
              <tr><th>clearable</th><td>当前实现保留该 prop；尾部操作图标实际由 icon 与 state 决定。</td></tr>
              <tr><th>icon / disabled</th><td>icon=false 隐藏尾部提示与操作图标；disabled 同时隐藏 caret。</td></tr>
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}
  Object.assign(__export, { Demo });
})();

window.PreviewDemos["input-box"] = __export.Demo;
})();
/* END_COMPONENT_PREVIEW:input-box */

// Add future components to this registry; navigation and panels are generated together.
const COMPONENT_PREVIEWS = [{id:'button',label:'Button'}, {id:'dropdown-button',label:'Dropdown Button'}, {id:'segmented-button',label:'Segmented Button'}, {id:'input-box',label:'Input Box'}, {id:'searchbar',label:'SearchBar'}];
function ComponentGallery() {
 const tabs = COMPONENT_PREVIEWS;
 const ThemeIcon = window.ComponentIcons.Icon;
 const [active,setActive] = React.useState(() => tabs.some(t=>t.id===location.hash.slice(1)) ? location.hash.slice(1) : 'button');
 const [visited,setVisited] = React.useState(() => new Set([active]));
 const [dark,setDark] = React.useState(() => { try { return localStorage.getItem('agentbox-preview-theme')==='dark'; } catch { return false; } });
 React.useEffect(() => { document.documentElement.classList.toggle('dark',dark); document.documentElement.style.colorScheme=dark?'dark':'light'; try {localStorage.setItem('agentbox-preview-theme',dark?'dark':'light');} catch {} },[dark]);
 React.useEffect(() => { document.getElementById('tab-'+active)?.scrollIntoView({block:'nearest',inline:'nearest'}); },[active]);
 function select(id) { setActive(id); setVisited(prev=>new Set([...prev,id])); history.replaceState(null,'','#'+id); }
 function keydown(event,index) {
  let next=index;
  if(event.key==='ArrowRight') next=(index+1)%tabs.length;
  else if(event.key==='ArrowLeft') next=(index+tabs.length-1)%tabs.length;
  else if(event.key==='Home') next=0;
  else if(event.key==='End') next=tabs.length-1;
  else return;
  event.preventDefault(); select(tabs[next].id); document.getElementById('tab-'+tabs[next].id).focus();
 }
 return <>
  <header className="preview-toolbar">
   <div className="preview-heading">
    <h1><img src="./assets/uploads/logo.svg" alt="" />组件预览</h1>
    <button className="preview-theme" role="switch" aria-label="深色模式" aria-checked={dark} title={dark?'切换为浅色':'切换为深色'} onClick={()=>setDark(!dark)}>
     <ThemeIcon name="sun" size={16} className="theme-sun" />
     <ThemeIcon name="moon" size={16} className="theme-moon" />
    </button>
   </div>
   <nav className="preview-tabs" role="tablist" aria-label="组件预览">
    {tabs.map((tab,index)=><button key={tab.id} id={'tab-'+tab.id} className="preview-tab" role="tab" aria-selected={active===tab.id} aria-controls={'panel-'+tab.id} tabIndex={active===tab.id?0:-1} onKeyDown={event=>keydown(event,index)} onClick={()=>select(tab.id)}>{tab.label}</button>)}
   </nav>
  </header>
  {tabs.map(tab=>{ const Demo=window.PreviewDemos[tab.id]; return <main key={tab.id} className={'preview-'+tab.id} id={'panel-'+tab.id} role="tabpanel" aria-labelledby={'tab-'+tab.id} hidden={active!==tab.id}>{visited.has(tab.id)?<Demo/>:null}</main>; })}
 </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<ComponentGallery/>);
</script>
</body>
</html>
