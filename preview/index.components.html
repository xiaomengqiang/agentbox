  /* 8. Font Size（字号，px） */

/* ── body base ── */
body {
  margin: 0;
  line-height: 1.5;
  color: var(--on-surface);
  font-family: var(--font-family);
  background-color: var(--surface);
}

#root {
  min-height: 100vh;
}

/* Standard scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
  background-color: transparent;
}

::-webkit-scrollbar-corner {
  background-color: transparent;
}

::-webkit-scrollbar-track {
  background-color: transparent;
}

::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background-color: var(--color-comp-divider);
  background-clip: padding-box;
}

::-webkit-scrollbar-track-piece {
  background-color: transparent;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--primary-40);
}


/* 语义层 Light Mode（:root 默认主题）*/
:root {
  /* Font Color（文本色）*/
  --color-font-primary: var(--primary-90);
  --color-font-secondary: var(--primary-60);
  --color-font-tertiary: var(--primary-40);
  --color-font-fourth: var(--primary-20);
  --color-font-emphasize: var(--brand-font); 
  --color-font-on-primary: var(--on-primary);
  --color-font-on-secondary: var(--on-primary-60);
  --color-font-on-tertiary: var(--on-primary-40);
  --color-font-on-fourth: var(--on-primary-20);

  /* Background Color（背景色）*/
  --color-background-primary: var(--white);
  --color-background-secondary: var(--gray-01);
  --color-background-tertiary: var(--gray-02);
  --color-background-fourth: var(--gray-03);
  --color-background-emphasize: var(--brand);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--white);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-05);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary); 
  --color-comp-background-gray: var(--gray-01); 
  --color-comp-background-gray-secondary: var(--gray-01);
  --color-fg-unchecked: var(--on-primary-20);
  --color-comp-divider: var(--container-20); 

  /* Comp Border Color（组件边框色）*/
  --color-comp-border: var(--container-15); 
  --color-comp-border-hover: var(--container-20); 
  --color-comp-border-focus: var(--brand); 
  --color-comp-border-active: var(--brand); 
  --color-comp-border-disabled: var(--container-10); 

  /* Icon Color（图标色）*/
  --color-icon-primary: var(--primary-90);
  --color-icon-secondary: var(--primary-60);
  --color-icon-tertiary: var(--primary-40);
  --color-icon-fourth: var(--primary-20);
  --color-icon-emphasize: var(--brand-font);
  --color-icon-sub-emphasize: var(--brand-40);
  --color-icon-on-primary: var(--on-primary);
  --color-icon-on-secondary: var(--on-primary-60);
  --color-icon-on-tertiary: var(--on-primary-40);
  --color-icon-on-fourth: var(--on-primary-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-05); 
  --color-interactive-pressed: var(--container-10);
  --color-interactive-select: var(--brand-20); 
  --color-interactive-click: var(--container-10);

  /* Functional Color（功能色，设计师指定值，独立于 multi-color 色板）*/
  --color-error: #E84026;
  --color-alert: #ED6F21;
  --color-warning: #EFBF00;
  --color-success: #64BB5C;
  --color-info: #0A59F7;
  --color-error-container: #FDEBEB;
  --color-alert-container: #FFF0E6;
  --color-warning-container: #FFF7D6;
  --color-success-container: #EDF7EB;
  --color-info-container: #E6EEFE;

  /* Shadow（阴影）*/
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.1);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.12);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.06);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.08);
  --shadow-glow: 0 4px 32px 0 rgba(241, 243, 245, 0.8);
}


/* ==========================================================================
   主题层 Theme（AI 组件直接消费的终极语义层）
   加载顺序：base → light → theme → dark*/

:root {
  /* ── primary（品牌色族，部分占位）── */
  --primary: var(--brand);
  --on-primary: var(--white);
  --primary-hover: var(--brand-80); 
  --primary-active: var(--brand); 
  --primary-disabled: var(--brand-40);
  --primary-container: var(--brand-05); 
  --on-primary-container: var(--color-font-primary);

  /* ── surface / on-surface（已重写，引用新 light/dark 语义 token）── */
  --surface: var(--color-background-secondary);
  --surface-dim: var(--color-background-tertiary);
  --surface-bright: var(--color-background-primary);
  --on-surface: var(--color-font-primary);
  --surface-container-lowest: var(--color-background-primary);
  --surface-container-low: var(--color-background-secondary);
  --surface-container: var(--color-comp-background-tertiary);
  --surface-container-high: var(--color-background-tertiary);
  --surface-container-highest: var(--color-background-fourth);

  --inverse-surface: var(--primary);
  --inverse-on-surface: var(--color-font-on-primary);
  --inverse-on-surface-variant: var(--color-font-on-secondary);
  --inverse-primary: var(--brand);

  --error: var(--color-error);
  --on-error: var(--white);
  --error-container: var(--color-error-container);
  --on-error-container: var(--color-font-primary);

  --alert: var(--color-alert);
  --on-alert: var(--white);
  --alert-container: var(--color-alert-container);
  --on-alert-container: var(--color-font-primary);

  --warning: var(--color-warning);
  --on-warning: var(--black);
  --warning-container: var(--color-warning-container);
  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);
  --on-success: var(--white);
  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);
  --on-info: var(--white);
  --info-container: var(--color-info-container);
  --on-info-container: var(--color-font-primary);

  --text-primary: var(--color-font-primary);
  --text-secondary: var(--color-font-secondary);
  --text-tertiary: var(--color-font-tertiary);
  --text-error: var(--color-error);
  --text-placeholder: var(--color-font-tertiary);
  --text-disabled: var(--color-font-fourth);
  --text-inverse-disabled: var(--color-font-on-fourth);
  
  --interactive-link: var(--brand);
  --interactive-link-hover: var(--brand-80);
  --interactive-link-active: var(--brand);
  --interactive-link-visited: var(--brand);
  --interactive-link-disabled: var(--brand-40);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: var(--outline-width-base); /* 1px */
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（排印角色：字号+行高+字体族绑定，字重在其后组合）── */
  /* Line boxes follow each role ratio, rounded upward to a 2px grid.
     Use em so size overrides keep the same ratio (e.g. Tab large / medium). */
  /* Display（展示文本）*/
  --font-display-sm: var(--font-size-4xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 38px/1.25 */
  --font-display-md: var(--font-size-5xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 48px/1.25 */
  --font-display-lg: var(--font-size-6xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 56px/1.25 */

  /* Title（标题）*/
  --font-title-sm: var(--font-size-xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 20px/1.375 */
  --font-title-md: var(--font-size-2xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}


/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}


/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

/* ==========================================================================
   Button · Material 3（消费 HarmonyOS 语义色彩规范）
   --------------------------------------------------------------------------
   变体 Variant（唯一 API 命名）
     .btn--primary    M3 Primary button        高强调 · 品牌实心   （primary）
     .btn--secondary     M3 Filled secondary button  中强调 · 品牌淡底   （secondary）
     .btn--tertiary  M3 Tertiary button      中强调 · 描边       （tertiary）
     .btn--text      M3 Text button          低强调 · 纯文字     （text）

   尺寸 Size             高     字号   图标   左右内边距  图标间距
     .btn--large        40px   16px   20px     16px        8px
     .btn--medium        32px   14px   16px     12px        4px

   形状 Shape（几何轴，与 variant / size 正交）
     .btn--round        跑道圆  --radius-full（默认，历史外观）
     .btn--square       方圆角  --radius-lg（8px，全变体 × 全尺寸）

   状态 State（纯 CSS，组件无内部 state）
     default → :hover → :focus-visible → :active(pressed) → :disabled
     data-state="hover|focus|pressed" 为文档/走查用的静态强制态。

   --------------------------------------------------------------------------
   色彩映射：main color = --btn-main-color → --color-icon-primary（主色，不是 brand）

   variant     背景 background                     描边 border             文字 text
   primary      --btn-main-color                   —                     --color-background-primary
   secondary       --color-comp-background-tertiary   —                     --btn-main-color
   tertiary    透明                               --color-comp-border    --btn-main-color
   text        透明（任何状态都无背景）              —                     --color-font-emphasize

   variant     hover                          pressed                        disabled
   primary      叠 --on-primary-10             叠 --on-primary-15              沿用静止态 + 50% 透明度
   secondary       叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态 + 50% 透明度
   tertiary    叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态（含描边）+ 50% 透明度
   text        字 --primary-hover              字 --primary-active             沿用静止态 + 50% 透明度

   disabled 统一模型：四个变体都保留静止态的底 / 字 / 描边，仅整体 opacity: 0.5。
   即 --btn-container-disabled / --btn-label-disabled / --btn-border-color-disabled
   默认就指向静止态变量，变体无需再各自声明。

   text 的文字态色（无叠加层，直接换字色，取 design_system 里 primary 的专用态色）：
     静止 --color-font-emphasize（brand-font）→ hover --primary-hover（brand 80%）
     → pressed --primary-active（brand 实色）；三档互不相同，按下有明确纵深。

   叠加层分两种模型（取决于静止底是浅色还是实心主色）：
   ① secondary / tertiary —— 静止底是浅色 / 透明，叠中性交互层
      --color-interactive-hover / -pressed（= container-05 / container-10，暗色各加深一档），
      即「不变静止底，只叠交互层」，与 design_system.md 的「Hover/pressed on surfaces」一致。
     secondary    hover → container-05 叠 container-05 ≈ container-10 = --color-comp-background-secondary ✓
              pressed → container-10 叠 container-05 ≈ container-15 ✓
     tertiary hover → container-05 = --color-comp-background-tertiary ✓
              pressed → container-10 = --color-comp-background-secondary ✓
   ② primary —— 静止底是 --btn-main-color（默认近黑 / 近白实心），中性层叠在其上对比度极低
      （视觉上接近无变化），所以改用「主色上的颜色」--on-primary-10 / -15 作叠加层。
      M3 Primary button 的 state layer 规范即为 on-primary，因此这不是特例而是对齐规范。
      该令牌明色为白基、暗色为黑基，自带翻转，一个值覆盖两个模式且方向都正确：
        Light：rgba(0,0,0,.9) 上叠白 10% → 合成后明度约从 10% 灰升到 19% 灰，比黑色浅一点 ✓
        Dark ：rgba(255,255,255,.9) 上叠黑 10% → 变深一档，反馈同样可见 ✓
      把 --btn-main-color 换成品牌色等彩色后依然成立（叠加层仍是「主色上的颜色」）。

   聚焦环：--btn-focus-ring = --black（纯黑 1px + --outline-offset-gap 间隙）。
     text 变体无容器，focus 不画描边环（--btn-focus-ring: transparent）。

   Dark Mode：背景与文字均消费自动翻转的语义 token。

   所有 --btn-* 都是可覆盖契约，单实例定制：
     <Button className="my-btn" />  +  .my-btn { --btn-padding-inline: 32px; }
   ========================================================================== */

.btn {
  /* ── 尺寸契约（由 .btn--large / .btn--medium 覆写）── */
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font: var(--font-body-lg);
  --btn-font-weight: var(--font-weight-medium);
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;

  /* ── 形状契约（由 .btn--round / .btn--square 覆写）── */
  --btn-radius: var(--radius-full); /* 默认 = round，跑道圆 */

  /* ── 颜色契约（由变体类覆写）── */
  --btn-main-color: var(--color-icon-primary); /* 本套按钮主色：换主色只改这一处 */
  --btn-container: transparent; /* 静止态填充 */
  --btn-label: var(--on-surface); /* 文字色，图标 currentColor 跟随 */
  --btn-label-hover: var(--btn-label); /* hover 文字色（默认不变） */
  --btn-label-pressed: var(--btn-label); /* pressed 文字色（默认不变） */
  --btn-state-layer-hover: transparent; /* 悬停叠加层（叠在静止态填充之上） */
  --btn-state-layer-pressed: transparent; /* 按下叠加层 */
  --btn-container-disabled: var(--btn-container); /* 禁用态填充：沿用静止态 */
  --btn-label-disabled: var(--btn-label); /* 禁用态文字：沿用静止态 */
  --btn-disabled-opacity: 0.5; /* 禁用态整体透明度 */
  --btn-border-width: var(--border-width-none);
  --btn-border-color: transparent;
  --btn-border-color-disabled: var(--btn-border-color); /* 禁用态描边：沿用静止态 */
  --btn-focus-ring: var(--black); /* 聚焦描边环：纯黑（明暗通用） */

  position: relative;
  isolation: isolate; /* 让负 z-index 的叠加层留在按钮内部 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--btn-icon-gap);
  box-sizing: border-box;
  height: var(--btn-height);
  padding: 0 var(--btn-padding-inline);
  border: var(--btn-border-width) solid var(--btn-border-color);
  border-radius: var(--btn-radius);
  background-color: var(--btn-container);
  color: var(--btn-label);
  font: var(--btn-font);
  font-weight: var(--btn-font-weight);
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard);
}

/* ── 状态叠加层：M3 state layer，叠在静止态填充之上 ── */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background-color: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

/* ── hover：叠加层 + 文字色（文字色默认与静止态一致）── */
.btn:hover:not(:disabled)::before,
.btn[data-state="hover"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* data-state 静态强制态与真实伪类必须成对：否则矩阵里 hover 只出叠加层、不出字色变化 */
.btn:hover:not(:disabled),
.btn[data-state="hover"] {
  color: var(--btn-label-hover);
}

/* ── pressed：规则放在 hover 之后，按下时覆盖悬停层 ── */
.btn:active:not(:disabled)::before,
.btn[data-state="pressed"]::before {
  background-color: var(--btn-state-layer-pressed);
  opacity: 1;
}

.btn:active:not(:disabled),
.btn[data-state="pressed"] {
  color: var(--btn-label-pressed);
}

/* ── 键盘聚焦：1px 纯黑描边环 + 2px 间隙（不影响布局）；text 变体不画环 ── */
.btn:focus-visible,
.btn[data-state="focus"] {
  outline: var(--outline-width-focus) solid var(--btn-focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 鼠标点击产生的非键盘焦点不画环；但 data-state="focus" 的静态强制态要保住 */
.btn:focus:not(:focus-visible):not([data-state="focus"]) {
  outline: none;
}

.btn[data-state="focus"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* ── 禁用：四个变体都沿用静止态的底 / 字 / 描边，仅整体降透明度（默认 50%）── */
.btn:disabled {
  background-color: var(--btn-container-disabled);
  color: var(--btn-label-disabled);
  border-color: var(--btn-border-color-disabled);
  opacity: var(--btn-disabled-opacity);
  cursor: not-allowed;
  outline: none;
}

/* ── 尺寸 ───────────────────────────────────────────── */
.btn--large {
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font: var(--font-body-lg); /* 16px */
  --btn-font-weight: var(--font-weight-medium); /* 500 */
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;
}

.btn--medium {
  --btn-height: 32px;
  --btn-padding-inline: 12px;
  --btn-font: var(--font-body-md); /* 14px */
  --btn-font-weight: var(--font-weight-medium); /* 500 */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

/* ── 形状 Shape：与 variant / size 正交的第三个轴 ────────
   形状不并入变体名：variant 表达强调层级，shape 表达几何，
   两者相乘会让命名膨胀（primary-round / primary-square / secondary-round…）。 */

/* Round：跑道圆（默认外观，与历史版本一致，向后兼容） */
.btn--round {
  --btn-radius: var(--radius-full);
}

/* Square：方圆角 8px（--radius-lg），支持全部 variant × size。 */
.btn--square {
  --btn-radius: var(--radius-lg);
}

/* ── 变体：颜色契约 ─────────────────────────────────── */

/* Filled：main color 实心 + 纯白文字。
   hover / pressed 用「主色上的颜色」--on-primary-10 / -15 作叠加层（M3 Primary button 的
   state layer 规范即为 on-primary）：该令牌明色为白基、暗色为黑基，自带翻转，
   所以浅色下近黑实心变浅、暗色下近白实心变深，两个模式方向都对。
   disabled：沿用静止态（实心底 + 纯白文字）整体 50% 透明度。 */
.btn--primary {
  --btn-container: var(--btn-main-color);
  --btn-label: var(--color-background-primary);
  --btn-state-layer-hover: var(--on-primary-10);
  --btn-state-layer-pressed: var(--on-primary-15);
}

/* Primary 的反差文字使用 --color-background-primary，随主题自动翻转；不依赖 scope 外祖先选择器。 */

/* Tonal：静止 comp_background_tertiary，叠加 --color-interactive-* 得到
   hover ≈ comp_background_secondary（container-10）、pressed ≈ container-15
   （叠层规则见 design_system「Hover/pressed on surfaces」）。
   disabled：沿用静止态配色，整体 50% 透明度。 */
.btn--secondary {
  --btn-container: var(--color-comp-background-tertiary);
  --btn-label: var(--btn-main-color);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Tertiary：透明底 + 1px 中性描边 + 主色文字；描边不随状态变化
   hover = comp_background_tertiary（container-05）、pressed = comp_background_secondary（container-10）
   disabled：沿用静止态配色（含描边），整体 50% 透明度。 */
.btn--tertiary {
  --btn-label: var(--btn-main-color);
  --btn-border-width: var(--border-width-thin);
  --btn-border-color: var(--color-comp-border);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Text：brand 主题蓝文字，任何状态都不出现背景色
   hover / pressed 用 design_system 里 primary 的专用态色：--primary-hover（brand 80%）
   → --primary-active（brand 实色），静止态 --color-font-emphasize 与两者都不同，按下有明确纵深。
   focus：无容器，不画聚焦描边环
   disabled：沿用静止态文字色，整体 50% 透明度。 */
.btn--text {
  --btn-label: var(--color-font-emphasize);
  --btn-label-hover: var(--primary-hover);
  --btn-label-pressed: var(--primary-active);
  --btn-state-layer-hover: transparent;
  --btn-state-layer-pressed: transparent;
  --btn-focus-ring: transparent;
}

/* ── 内容 ───────────────────────────────────────────── */
.btn__icon {
  background-color: currentColor;
  mask-size: contain;
  mask-position: center;
  mask-repeat: no-repeat;
  -webkit-mask-size: contain;
  -webkit-mask-position: center;
  -webkit-mask-repeat: no-repeat;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
}

.btn__label {
  display: inline-block;
}


.sb-root {
  display: flex;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  cursor: text;
  transition: background-image var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}

.sb-root { padding: 9px 12px; gap: 8px; }
.sb-medium { height: 40px; font: var(--font-body-md); font-weight: var(--font-weight-regular); }
.sb-small { height: 36px; font: var(--font-body-sm); font-weight: var(--font-weight-regular); }
.sb-filled { border-radius: 24px; background-color: var(--surface-container); }
.sb-unfilled { border-radius: var(--radius-md); background-color: transparent; }

/* ── 图标与文字 ─────────────────────────────────────────────── */

/* 图标颜色 icon_secondary（黑 60%），所有尺寸一致 */
.sb-icon {
  flex: 0 0 auto;
  color: var(--color-icon-secondary);
}

/* 输入区：承载光标与输入框 */
.sb-field {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
}

/* 占位文字：text_tertiary（黑 40%） */
.sb-input::placeholder {
  color: var(--text-tertiary);
}

.sb-input {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  background: transparent;
  font: inherit;
  line-height: inherit;
  color: var(--text-primary);
  caret-color: var(--text-primary);
}
.sb-input::placeholder { opacity: 1; }

/* ── 关闭按钮（Small cancel）：16×16，颜色同搜索图标 ── */
.sb-clear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  margin: -4px;
  padding: 4px;
  box-sizing: border-box;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--color-icon-secondary);
  cursor: pointer;
}

/* ── 禁用态 ─────────────────────────────────────────────────── */
.sb-disabled,
.sb-disabled .sb-input {
  cursor: not-allowed;
}


.sb-disabled .sb-icon,
.sb-disabled .sb-clear {
  color: var(--color-icon-fourth);
}

.sb-disabled .sb-input {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

.sb-disabled .sb-input::placeholder {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

/* 使用指定 SVG 的轮廓，由语义 token 着色。 */
.sb-asset-icon {
  display: inline-block;
  flex: 0 0 auto;
  background-color: currentColor;
  mask: var(--sb-icon-source) center / contain no-repeat;

/* ===================== ChatComposer ===================== */

/* ---- 灰色外框 800 × 188（左右包裹距离 4px） ---- */
.cc-shell {
  position: relative;
  box-sizing: border-box;
  width: 800px;
  height: 188px;
  display: flex;
  flex-direction: column;
  padding: 4px;
  border-radius: var(--radius-3xl);
  background-color: var(--surface-container-low);
  color: var(--on-surface);
  font-family: var(--font-family);
}

/* ---- 白色输入卡片 792 × 140 ----
   注意：不设 z-index，避免把内部弹出的菜单关进自己的堆叠上下文，
   导致其层级反而低于下方其它卡片 */
.cc-card {
  position: relative;
  box-sizing: border-box;
  flex: 0 0 140px;
  width: 100%;
  height: 140px;
  display: flex;
  flex-direction: column;
  background-color: var(--surface-container-lowest);
  box-shadow: var(--shadow-md);
  border-radius: var(--radius-2xl);
}

/* ---- 正文输入区 ---- */
.cc-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 12px 14px 2px;
}

.cc-input {
  display: block;
  flex: 1;
  width: 100%;
  border: 0;
  outline: none;
  resize: none;
  background-color: transparent;
  color: var(--on-surface);
  font: var(--font-body-md);
  line-height: 1.7;
  caret-color: var(--primary);
}

.cc-input::placeholder {
  color: var(--text-placeholder);
}

/* ---- 底部工具栏 ---- */
.cc-toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 10px 9px;
}

.cc-tool-group {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

/* ---- 幽灵图标按钮（加号） ---- */
.cc-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: var(--radius-full);
  background-color: var(--surface-container);
  color: var(--color-icon-secondary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

.cc-ghost:hover,
.cc-ghost.is-active {
  background-color: var(--surface-container-high);
  color: var(--color-icon-primary);
}

/* ---- 图标 + 文字的下拉按钮（chip）----
   默认无灰底，悬停/展开时才出现浅色底 */
.cc-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 7px 0 8px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-chip:hover,
.cc-chip.is-active {
  background-color: var(--color-interactive-hover);
}

.cc-chip .cc-chev,
.cc-space .cc-chev {
  color: var(--color-icon-tertiary);
}

/* 完全访问被选中：红色告警态 */
.cc-chip-danger,
.cc-chip-danger .cc-chev {
  color: var(--error);
}

.cc-chip-danger:hover,
.cc-chip-danger.is-active {
  background-color: var(--error-container);
  color: var(--on-error-container);
}

.cc-chip-danger:hover .cc-chev,
.cc-chip-danger.is-active .cc-chev {
  color: var(--on-error-container);
}

.cc-chip-label {
  display: inline-flex;
  align-items: center;
  line-height: 1;
  white-space: nowrap;
}

/* ---- 发送按钮 ---- */
.cc-send {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  margin-left: 2px;
  border: none;
  border-radius: var(--radius-full);
  background-color: var(--primary);
  color: var(--on-primary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    transform var(--duration-fast) var(--ease-out);
}

.cc-send:hover:not(:disabled) {
  background-color: var(--primary-hover);
}

.cc-send:active:not(:disabled) {
  transform: scale(0.92);
}

.cc-send:disabled {
  background-color: var(--color-comp-background-tertiary);
  color: var(--color-icon-fourth);
  cursor: default;
}

.cc-send.is-sent {
  background-color: var(--success);
  color: var(--on-success);
}

/* 纸飞机扶正为向上，并整体下移使其视觉居中 */
.cc-send-plane {
  position: relative;
  top: 1.5px;
  transform: rotate(-45deg);
}

/* ---- 下拉容器与面板 ---- */
.cc-drop {
  position: relative;
}

.cc-menu {
  position: absolute;
  z-index: 50;
  top: calc(100% + 8px);
  left: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: max-content;
  min-width: 240px;
  padding: 6px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-dropdown);
}

/* 向上的面板（底部控件使用） */
.cc-drop-up .cc-menu {
  top: auto;
  bottom: calc(100% + 8px);
}

/* 靠右对齐的面板（右侧控件使用） */
.cc-drop-right .cc-menu {
  left: auto;
  right: 0;
}

/* ---- 菜单项 ---- */
.cc-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-primary);
  text-align: left;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-menu-item:hover {
  background-color: var(--color-interactive-hover);
}

.cc-mitem-icon {
  flex-shrink: 0;
  color: var(--color-icon-secondary);
}

.cc-mitem-main {
  flex: 1 1 auto;
  min-width: 0;
}

.cc-mitem-label {
  display: block;
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-regular);
  line-height: 1.4;
  white-space: nowrap;
}

.is-selected .cc-mitem-label {
  color: var(--color-font-primary);
  font-weight: var(--font-weight-bold);
}

.cc-mitem-desc {
  display: block;
  margin-top: 1px;
  color: var(--color-font-tertiary);
  font: var(--font-caption-md);
  line-height: 1.45;
  white-space: nowrap;
}

.cc-menu-check {
  flex: 0 0 18px;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  width: 18px;
  height: 18px;
  margin-left: 8px;
  color: var(--color-icon-primary);
}

/* ---- 灰色外框下方：选择项目空间 ---- */
.cc-footer {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: center;
  padding: 0 8px;
}

.cc-space {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px 0 8px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-space:hover,
.cc-space.is-active {
  background-color: var(--color-interactive-hover);
}

/* ---- 空间面板：搜索行 / 分割线 / 空态 ---- */
.cc-space-menu {
  width: max-content;
  min-width: 240px;
}

.cc-menu-search {
  display: flex;

(function () {
  const { useRef, useState } = React;
function SearchBar(props) {
  const size = props.size || "medium";
  const variant = props.variant || "filled";
  const placeholder = props.placeholder ?? "请输入搜索内容";
  const disabled = !!props.disabled;
  const clearable = props.clearable ?? true;
  const iconSize = 16;
  const inputRef = useRef(null);
  const composingRef = useRef(false);

  // 受控（传入 value）/ 非受控（defaultValue）两用
  const isControlled = props.value != null;
  const [innerValue, setInnerValue] = useState(props.defaultValue || "");
  const value = isControlled ? props.value : innerValue;
  const isEmpty = value.length === 0;

  // 聚焦状态与浏览器原生光标同步。
  const [focused, setFocused] = useState(false);

  const handleChange = (event) => {
    const next = event.target.value;
    if (!isControlled) setInnerValue(next);
    if (props.onChange) props.onChange(next);
  };

  // 回车触发搜索回调
  const handleKeyDown = (event) => {
    if (composingRef.current || event.nativeEvent.isComposing || event.keyCode === 229) return;
    if (event.key === "Enter" && props.onSearch) {
      event.preventDefault();
      props.onSearch(event.currentTarget.value);
    }
  };

  // 清空按钮：有文字时出现，点击清空（受控场景同步回调 onChange("")）
  const handleClear = () => {
    if (!isControlled) setInnerValue("");
    if (props.onChange) props.onChange("");
    if (props.onClear) props.onClear();
    inputRef.current?.focus();
  };

  const className = [
    "sb-root",
    `sb-${size}`,
    `sb-${variant}`,
    focused ? "sb-editing" : "",
    disabled ? "sb-disabled" : "",
    props.className || "",
  ]
    .join(" ")
    .trim();

  const clearButton =
    clearable && !disabled && !isEmpty ? (
      <button className="sb-clear" type="button" onClick={handleClear} aria-label="清空">
        <span className="sb-asset-icon sb-close-icon" style={{ width: iconSize, height: iconSize }} aria-hidden="true" />
      </button>
    ) : null;

  return (
    <div id={props.id} className={className} style={props.style}
      onClick={event => {
        if (!disabled && !event.target.closest("button")) inputRef.current?.focus();
      }}>
      <span className="sb-asset-icon sb-icon" style={{ width: iconSize, height: iconSize }} aria-hidden="true" />

      <span className="sb-field">
        <input
          className="sb-input"
          ref={inputRef}
          type="search"
          enterKeyHint="search"
          aria-label="搜索"
          value={value}
          placeholder={placeholder}
          disabled={disabled}
          onChange={handleChange}
          onKeyDown={handleKeyDown}
          onCompositionStart={() => { composingRef.current = true; }}
          onCompositionEnd={() => { composingRef.current = false; }}
          onFocus={() => setFocused(true)}
          onBlur={() => setFocused(false)}
        />
      </span>

      {clearButton}
    </div>
  );
}
  Object.assign(__export, { SearchBar });
})();

/* 文件卡片：取扩展名 / 图标 / 可读容量 */
function fileTypeOf(name) {
  const parts = name.split(".");
  return parts.length > 1 ? parts.pop().toUpperCase() : "FILE";
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

  "add-file": { key: "add-file", title: "添加文件", items: ADD_CHILDREN },
  skill: { key: "skill", title: "技能", items: SKILL_CHILDREN, searchable: true, manage: true },

/* ================= 通用下拉菜单面板 ================= */
function DropMenu({ options, selectedId, onPick }) {
  return (
    <div className="cc-menu">
      {options.map((o) => {
        const isSel = o.id === selectedId;
        return (
          <button
            type="button"
            key={o.id}
            className={"cc-menu-item" + (isSel ? " is-selected" : "")}
            onClick={() => onPick(o)}
          >
            {o.icon || o.src ? (
              <Icon name={o.icon} src={o.src} size={16} className="cc-mitem-icon" />
            ) : null}
            <span className="cc-mitem-main">
              <span className="cc-mitem-label">{o.label}</span>
              {o.desc ? <span className="cc-mitem-desc">{o.desc}</span> : null}
            </span>
            {/* 对号独立占位，每行统一靠右 */}
            <span className="cc-menu-check">
              {isSel ? <Icon name="check" size={14} /> : null}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ================= 主组件 ================= */
function ChatComposer(props) {
  const {
    initialMessage = "",
    modeId = "single",
    permissionId = "request",
    modelId = "auto",
    models = DEFAULT_MODELS,
    spaceId = "",
  } = props;

  // auto 固定置于选项首位，其后拼接外部传入的模型列表
  const modelOptions = [{ id: "auto", label: "Auto", icon: "zap" }].concat(models);

  const [mode, setMode] = useState(AGENT_MODES.find((m) => m.id === modeId) || AGENT_MODES[0]);
  const [permission, setPermission] = useState(
    PERMISSIONS.find((p) => p.id === permissionId) || PERMISSIONS[0]
  );
  const [model, setModel] = useState(
    modelOptions.find((m) => m.id === modelId) || modelOptions[0]
  );
  const [space, setSpace] = useState(SPACES.find((s) => s.id === spaceId) || null);

  const [msg, setMsg] = useState(initialMessage);
  const [open, setOpen] = useState(null); // 当前展开的下拉：mode / permission / model / space / attach
  const [sent, setSent] = useState(false);
  const [spaceQuery, setSpaceQuery] = useState("");
  const [spaceList, setSpaceList] = useState(SPACES);
  // 新建项目弹窗
  const [showNewProject, setShowNewProject] = useState(false);
  const [npName, setNpName] = useState("");
  const [npPath, setNpPath] = useState("");
  const [pathMenu, setPathMenu] = useState(false);
  // 完全访问二次确认弹窗
  const [confirmFull, setConfirmFull] = useState(false);
  // “/”快捷指令
  const [slashOpen, setSlashOpen] = useState(false);
  const [cmdChips, setCmdChips] = useState([]);
  // 添加文件（本地选择 → 输入框卡片）
  const fileInputRef = useRef(null);
  const [files, setFiles] = useState([]);
  // 加号(+)下拉：一级 hover 时向右侧弹出二级
  const [hoverAdd, setHoverAdd] = useState(null); // 当前悬停的一级 key
  const [attachSecQuery, setAttachSecQuery] = useState("");
  // 连接器开关状态
  const [connOn, setConnOn] = useState({});

  const canSend = msg.trim().length > 0;

  // 点击组件外部任意位置时关闭下拉
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => {
      if (!e.target.closest("[data-drop]")) setOpen(null);
    };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [open]);

  // 点击 “/”指令菜单外（且不在输入区）时关闭
  useEffect(() => {
    if (!slashOpen) return;
    const onDown = (e) => {
      if (!e.target.closest("[data-slash]") && !e.target.closest(".cc-input")) {
        setSlashOpen(false);
      }
    };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [slashOpen]);

  const toggle = (key) => setOpen(open === key ? null : key);

  // 选中菜单项：更新状态并收起
  const pick = (setter) => (item) => {
    setter(item);
    setOpen(null);
  };

  // 模拟发送：清空输入、指令胶囊与文件卡片 + 按钮闪现反馈
  const send = () => {
    if (!canSend || sent) return;
    setMsg("");
    setCmdChips([]);
    setFiles([]);
    setSent(true);
    window.setTimeout(() => setSent(false), 700);
  };

  const onKeyDown = (e) => {
    if (e.key === "Escape") {
      setSlashOpen(false);
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !e.nativeEvent.isComposing) {
      e.preventDefault();
      send();
    }
  };

  // 空间列表支持按关键词过滤
  const filteredSpaces = spaceList.filter((s) =>
    s.name.toLowerCase().includes(spaceQuery.trim().toLowerCase())
  );

  // ---- “/”指令（单层分组，保持原样）：取最后一个斜杠后的输入过滤 ----
  const slashQuery = (() => {
    const i = msg.lastIndexOf("/");
    return i === -1 ? "" : msg.slice(i + 1);
  })();
  const matchSlash = (it) => it.title.toLowerCase().includes(slashQuery.trim().toLowerCase());
  const slashAdd = matchSlash(ADD_FILE_CMD) ? [ADD_FILE_CMD] : [];
  const slashSkills = SLASH_SKILLS.filter(matchSlash);
  const slashExperts = SLASH_EXPERTS.filter(matchSlash);

  // 共用行：图标 + 左对齐标题 + 右对齐正文
  const cmdRow = (it, onPick) => (
    <button type="button" key={it.id} className="cc-slash-row" onClick={() => onPick(it)}>
      <Icon name={it.icon} size={16} className="cc-slash-icon" />
      <span className="cc-slash-title">{it.title}</span>
      {it.desc ? <span className="cc-slash-desc">{it.desc}</span> : null}
    </button>
  );

  // 键入处理：以 / 开头（后跟无空格的查询串）时保持“/”菜单展开
  const handleInput = (e) => {
    const v = e.target.value;
    setMsg(v);
    const i = v.lastIndexOf("/");
    const after = i === -1 ? "" : v.slice(i + 1);
    setSlashOpen(i !== -1 && !/[ \n]/.test(after));
  };

  // 添加胶囊（去重，支持多选）
  const addChip = (item) =>
    setCmdChips((cs) =>
      cs.some((c) => c.id === item.id)
        ? cs
        : [...cs, { id: item.id, title: item.title, icon: item.icon }]
    );

  // 选择“/”指令：清掉已输入的“/查询串”，标题作为胶囊
  const pickSlash = (item) => {
    setMsg((m) => {
      const i = m.lastIndexOf("/");
      return i === -1 ? m : m.slice(0, i);
    });
    addChip(item);
    setSlashOpen(false);
  };

  // ---- 加号(+)下拉：一级 hover 向右侧弹出二级 ----
  const toggleAttach = () => {
    setOpen((o) => (o === "attach" ? null : "attach"));
    setHoverAdd(null);
    setAttachSecQuery("");
  };

  // 选择二级里的实际指令：作为胶囊加入（多选），并关闭加号菜单
  const pickAddItem = (item) => {
    addChip(item);
    setOpen(null);
    setHoverAdd(null);
    setAttachSecQuery("");
  };

  const skillFiltered = SKILL_CHILDREN.filter((it) =>
    it.title.toLowerCase().includes(attachSecQuery.trim().toLowerCase())
  );
  const expertFiltered = EXPERT_CHILDREN.filter((it) =>
    it.title.toLowerCase().includes(attachSecQuery.trim().toLowerCase())
  );
  const connFiltered = CONN_CHILDREN.filter((it) =>
    it.title.toLowerCase().includes(attachSecQuery.trim().toLowerCase())
  );

  // 连接器行尾开关：切换启用状态
  const toggleConn = (id) => setConnOn((m) => ({ ...m, [id]: !m[id] }));

  // 二级面板内容：技能/专家为「标题在上、正文在下、无图标」，管理项为图标+标题
  const addSub = (key) => {
    if (key === "skill") {
      return (
        <>
          <label className="cc-menu-search">
            <Icon name="search" size={16} className="cc-search-icon" />
            <input
              className="cc-search-input"
              placeholder="搜索技能"
              value={attachSecQuery}
              onChange={(e) => setAttachSecQuery(e.target.value)}
            />
          </label>
          {skillFiltered.map((it) => (
            <button
              type="button"
              key={it.id}
              className="cc-add-line"
              onClick={() => pickAddItem(it)}
            >
              <span className="cc-add-line-title">{it.title}</span>
              <span className="cc-add-line-desc">{it.desc}</span>
            </button>
          ))}
          {skillFiltered.length === 0 ? (
            <div className="cc-space-empty">未找到相关选项</div>
          ) : null}
          <div className="cc-menu-divider" />
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="plus" size={15} />
            <span>添加技能</span>
          </button>
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="settings-2" size={15} />
            <span>管理技能</span>
          </button>
        </>
      );
    }
    if (key === "expert") {
      return (
        <>
          <label className="cc-menu-search">
            <Icon name="search" size={16} className="cc-search-icon" />
            <input
              className="cc-search-input"
              placeholder="搜索专家"
              value={attachSecQuery}
              onChange={(e) => setAttachSecQuery(e.target.value)}
            />
          </label>
          {expertFiltered.map((it) => (
            <button
              type="button"
              key={it.id}
              className="cc-add-line"
              onClick={() => pickAddItem(it)}
            >
              <span className="cc-add-line-title">{it.title}</span>
              <span className="cc-add-line-desc">{it.desc}</span>
            </button>
          ))}
          {expertFiltered.length === 0 ? (
            <div className="cc-space-empty">未找到相关选项</div>
          ) : null}
          <div className="cc-menu-divider" />
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="plus" size={15} />
            <span>添加专家</span>
          </button>
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="settings-2" size={15} />
            <span>管理专家</span>
          </button>
        </>
      );
    }
    if (key === "connector") {
      return (
        <>
          <label className="cc-menu-search">
            <Icon name="search" size={16} className="cc-search-icon" />
            <input
              className="cc-search-input"
              placeholder="搜索连接器"
              value={attachSecQuery}
              onChange={(e) => setAttachSecQuery(e.target.value)}
            />
          </label>
          {connFiltered.map((c) => (
            <div
              key={c.id}
              className="cc-add-conn"
              onClick={() => toggleConn(c.id)}
            >
              <Icon name={c.icon} src={c.src} size={16} className="cc-slash-icon" />
              <span className="cc-add-conn-title">{c.title}</span>
              <button
                type="button"
                className={"cc-add-toggle" + (connOn[c.id] ? " is-on" : "")}
                aria-pressed={!!connOn[c.id]}
                onClick={(e) => {
                  e.stopPropagation();
                  toggleConn(c.id);
                }}
              >
                <span className="cc-add-toggle-knob" />
              </button>
            </div>
          ))}
          {connFiltered.length === 0 ? (
            <div className="cc-space-empty">未找到相关选项</div>
          ) : null}
          <div className="cc-menu-divider" />
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="plus" size={15} />
            <span>添加连接器</span>
          </button>
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="settings-2" size={15} />
            <span>管理连接器</span>
          </button>
        </>
      );
    }
    // add-file
    return ADD_CHILDREN.map((it) => cmdRow(it, pickAddItem));
  };

  // 一级行（+ 菜单），hover 时右侧弹二级；「添加文件」无二级，点击唤起本地文件选择
  const renderAddRoot = (r) => {
    if (r.key === "add-file") {
      return (
        <div key={r.key} className="cc-add-item" onMouseEnter={() => setHoverAdd(null)}>
          <button
            type="button"
            className="cc-slash-row cc-slash-nav cc-add-root"
            onClick={handleAddFile}
          >
            <Icon name={r.icon} size={16} className="cc-slash-icon" />
            <span className="cc-slash-nav-title">{r.title}</span>
            <Icon name="chevron-right" size={14} className="cc-slash-nav-arrow" />
          </button>
        </div>
      );
    }
    return (
      <div
        key={r.key}
        className={"cc-add-item" + (hoverAdd === r.key ? " is-active" : "")}
        onMouseEnter={() => {
          setHoverAdd(r.key);
          setAttachSecQuery("");
        }}
      >
        <button type="button" className="cc-slash-row cc-slash-nav cc-add-root">
          <Icon name={r.icon} size={16} className="cc-slash-icon" />
          <span className="cc-slash-nav-title">{r.title}</span>
          <Icon name="chevron-right" size={14} className="cc-slash-nav-arrow" />
        </button>
        {/* 右侧悬浮二级面板 */}
        {hoverAdd === r.key ? <div className="cc-add-sub">{addSub(r.key)}</div> : null}
      </div>
    );
  };

  const removeChip = (id) => setCmdChips((cs) => cs.filter((c) => c.id !== id));

  // ---- 添加文件：唤起本地文件选择，选中后生成输入框卡片 ----
  const handleAddFile = () => {
    setOpen(null);
    setHoverAdd(null);
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleFileChange = (e) => {
    const picked = Array.from(e.target.files || []);
    if (!picked.length) return;
    setFiles((prev) => [
      ...prev,
      ...picked.map((f, i) => ({
        id: "file-" + Date.now() + "-" + i,
        name: f.name,
        ext: fileTypeOf(f.name),
        src: fileSrcOf(f.name),
        size: fmtSize(f.size),
      })),
    ]);
    // 允许再次选择同一文件
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const removeFile = (id) => setFiles((fs) => fs.filter((f) => f.id !== id));

  // 新建项目：关闭菜单、重置表单并弹出居中弹窗
  const openNewProject = () => {
    setOpen(null);
    setNpName("");
    setNpPath("");
    setPathMenu(false);
    setShowNewProject(true);
  };

  // 确认新建：把新项目追加进空间列表并选中
  const confirmNewProject = () => {
    const name = npName.trim();
    if (!name || !npPath.trim()) return;
    const item = { id: "sp-" + Date.now(), name };
    setSpaceList((list) => [...list, item]);
    setSpace(item);
    setSpaceQuery("");
    setShowNewProject(false);
  };

  const closeNewProject = () => {
    setShowNewProject(false);
    setPathMenu(false);
  };

  return (
    <div className="cc-shell">
      {/* ============ 输入卡片 792 × 140 ============ */}
      <div className="cc-card">
        {/* 正文输入区 */}
        <div className="cc-body">
          {files.length > 0 ? (
            <div className="cc-file-list">
              {files.map((f) => (
                <div className="cc-file-card" key={f.id}>
                  <span className="cc-file-icon">
                    <Icon src={f.src} size={30} />
                  </span>
                  <span className="cc-file-info">
                    <span className="cc-file-name" title={f.name}>
                      {f.name}
                    </span>
                    <span className="cc-file-meta">
                      {f.ext} · {f.size}
                    </span>
                  </span>
                  <button
                    type="button"
                    className="cc-file-x"
                    onClick={() => removeFile(f.id)}
                    aria-label={"移除" + f.name}
                  >
                    <Icon name="x" size={10} />
                  </button>
                </div>
              ))}
            </div>
          ) : null}
          {cmdChips.length > 0 ? (
            <div className="cc-cmd-chips">
              {cmdChips.map((c) => (
                <span className="cc-cmd-chip" key={c.id}>
                  <Icon name={c.icon} size={13} />
                  <span className="cc-cmd-chip-label">{c.title}</span>
                  <button
                    type="button"
                    className="cc-cmd-chip-x"
                    onClick={() => removeChip(c.id)}
                    aria-label={"移除" + c.title}
                  >
                    <Icon name="x" size={10} />
                  </button>
                </span>
              ))}
            </div>
          ) : null}
          <textarea
            className="cc-input"
            placeholder={cmdChips.length ? "继续输入你的需求…" : "输入 / 唤起快捷指令，或直接描述任务…"}
            value={msg}
            onChange={handleInput}
            onKeyDown={onKeyDown}
            rows={1}
            spellCheck={false}
            aria-label="消息输入"
          />
        </div>

        {/* “/”快捷指令面板位于灰色外框下方（见 shell 底部） */}

        {/* 底部工具栏 */}
        <div className="cc-toolbar">
          <div className="cc-tool-group">
            {/* 加号：二级下拉（展开时旋转 45°，菜单向下弹出） */}
            <div className={"cc-drop" + (open === "attach" ? " is-active" : "")} data-drop>
              <button
                type="button"
                className={"cc-ghost" + (open === "attach" ? " is-active" : "")}
                onClick={toggleAttach}
                title="添加内容"
                aria-label="添加内容"
              >
                <Icon
                  name="plus"
                  size={16}
                  className={"cc-plus-icon" + (open === "attach" ? " is-rot" : "")}
                />
              </button>
              {open === "attach" ? (
                <div className="cc-addmenu" onMouseLeave={() => setHoverAdd(null)}>
                  {/* 添加文件 + 分割线，与 技能/专家/连接器 分开 */}
                  {ADD_ROOTS.slice(0, 1).map(renderAddRoot)}
                  <div className="cc-menu-divider" />
                  {ADD_ROOTS.slice(1).map(renderAddRoot)}
                </div>
              ) : null}
            </div>

            {/* Agent 模式下拉 */}
            <div className={"cc-drop" + (open === "mode" ? " is-active" : "")} data-drop>
              <button
                type="button"
                className={"cc-chip" + (open === "mode" ? " is-active" : "")}
                onClick={() => toggle("mode")}
              >
                <Icon name={mode.icon} size={16} />
                <span className="cc-chip-label">{mode.label}</span>
                <Icon name="chevron-down" size={13} className="cc-chev" />
              </button>
              {open === "mode" ? (
                <DropMenu options={AGENT_MODES} selectedId={mode.id} onPick={pick(setMode)} />
              ) : null}
            </div>

            {/* 请求权限下拉 */}
            <div className={"cc-drop" + (open === "permission" ? " is-active" : "")} data-drop>
              <button
                type="button"
                className={
                  "cc-chip" +
                  (open === "permission" ? " is-active" : "") +
                  (permission.id === "full" ? " cc-chip-danger" : "")
                }
                onClick={() => toggle("permission")}
              >
                <Icon name={permission.icon} size={16} />
                <span className="cc-chip-label">{permission.label}</span>
                <Icon name="chevron-down" size={13} className="cc-chev" />
              </button>
              {open === "permission" ? (
                <DropMenu
                  options={PERMISSIONS}
                  selectedId={permission.id}
                  onPick={(item) => {
                    // 完全访问：先弹二次确认，确认后生效
                    if (item.id === "full") {
                      setOpen(null);
                      setConfirmFull(true);
                      return;
                    }
                    pick(setPermission)(item);
                  }}
                />
              ) : null}
            </div>
          </div>

          <div className="cc-tool-group">
            {/* 模型选择下拉（auto + 外部传入的模型列表，靠右对齐） */}
            <div className={"cc-drop cc-drop-right" + (open === "model" ? " is-active" : "")} data-drop>
              <button
                type="button"
                className={"cc-chip" + (open === "model" ? " is-active" : "")}
                onClick={() => toggle("model")}
              >
                <Icon name={model.icon} src={model.src} size={16} />
                <span className="cc-chip-label">{model.label}</span>
                <Icon name="chevron-down" size={13} className="cc-chev" />
              </button>
              {open === "model" ? (
                <DropMenu options={modelOptions} selectedId={model.id} onPick={pick(setModel)} />
              ) : null}
            </div>

            {/* 发送按钮 */}
            <button
              type="button"
              className={"cc-send" + (sent ? " is-sent" : "")}
              onClick={send}
              disabled={!canSend}
              aria-label="发送"
            >
              {sent ? (
                <Icon name="check" size={18} />
              ) : (
                <Icon src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0Ij4KICA8cGF0aCBkPSJNMjIgMiBMMTUgMjIgTDExIDEzIEwyIDkgWiIgZmlsbD0iI0ZGRkZGRiIgc3Ryb2tlPSIjRkZGRkZGIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPC9zdmc+Cg==" size={18} className="cc-send-plane" />
              )}
            </button>
          </div>
        </div>
      </div>

      {/* ============ 灰色外框下方：选择项目空间 ============ */}
      <div className="cc-footer">
        <div className={"cc-drop" + (open === "space" ? " is-active" : "")} data-drop>
          <button
            type="button"
            className={"cc-space" + (open === "space" ? " is-active" : "")}
            onClick={() => toggle("space")}
          >
            <Icon name="folder-open" size={14} />
            <span className="cc-chip-label">{space ? space.name : "选择项目空间"}</span>
          </button>
          {open === "space" ? (
            <div className="cc-menu cc-space-menu">
              {/* 顶部搜索：放大镜 + 输入，无底色 */}
              <label className="cc-menu-search">
                <Icon name="search" size={14} className="cc-search-icon" />
                <input
                  className="cc-search-input"
                  placeholder="搜索项目空间"
                  value={spaceQuery}
                  onChange={(e) => setSpaceQuery(e.target.value)}
                />
              </label>

              {/* 空间列表 */}
              <div className="cc-space-list">
                {filteredSpaces.map((s) => {
                  const isSel = space && space.id === s.id;
                  return (
                    <button
                      type="button"
                      key={s.id}
                      className={"cc-menu-item" + (isSel ? " is-selected" : "")}
                      onClick={() => {
                        setSpace(s);
                        setOpen(null);
                      }}
                    >
                      <Icon name="folder" size={16} className="cc-mitem-icon" />
                      <span className="cc-mitem-main">
                        <span className="cc-mitem-label">{s.name}</span>
                      </span>
                      <span className="cc-menu-check">
                        {isSel ? <Icon name="check" size={14} /> : null}
                      </span>
                    </button>
                  );
                })}
                {filteredSpaces.length === 0 ? (
                  <div className="cc-space-empty">未找到相关项目空间</div>
                ) : null}
              </div>

              {/* 横向分割线 */}
              <div className="cc-menu-divider" />

              {/* 管理操作 */}
              <button
                type="button"
                className="cc-menu-item"
                onClick={openNewProject}
              >
                <Icon name="plus" size={15} className="cc-mitem-icon" />
                <span className="cc-mitem-main">
                  <span className="cc-mitem-label">新建项目</span>
                </span>
              </button>
              <button
                type="button"
                className="cc-menu-item"
                onClick={() => {
                  setSpace(null);
                  setSpaceQuery("");
                  setOpen(null);
                }}
              >
                <Icon name="ban" size={15} className="cc-mitem-icon" />
                <span className="cc-mitem-main">
                  <span className="cc-mitem-label">不使用项目</span>
                </span>
              </button>
            </div>
          ) : null}
        </div>
      </div>

      {/* 隐藏的原生文件选择器（纯浏览器可用） */}
      <input
        type="file"
        ref={fileInputRef}
        multiple
        style={{ display: "none" }}
        tabIndex={-1}
        onChange={handleFileChange}
        aria-hidden="true"
      />

      {/* ============ “/”快捷指令面板：悬于灰色外框下方 ============ */}
      {slashOpen && (slashAdd.length > 0 || slashSkills.length > 0 || slashExperts.length > 0) ? (
        <div className="cc-slash" data-slash>
          {/* 独立小节：添加文件 */}
          {slashAdd.map((it) => cmdRow(it, pickSlash))}
          {/* 技能组 */}
          {slashSkills.length > 0 ? <div className="cc-slash-group-label">技能</div> : null}
          {slashSkills.map((it) => cmdRow(it, pickSlash))}
          {/* 专家组 */}
          {slashExperts.length > 0 ? <div className="cc-slash-group-label">专家</div> : null}
          {slashExperts.map((it) => cmdRow(it, pickSlash))}
        </div>
      ) : null}

      {/* ============ 新建项目 · 居中弹窗 ============ */}
      {showNewProject ? (
        <div
          className="cc-scrim"
          onMouseDown={(e) => {
            if (e.target === e.currentTarget) closeNewProject();
          }}
        >
          <div className="cc-modal" role="dialog" aria-modal="true" aria-label="新建项目">
            <div className="cc-modal-head">
              <h3 className="cc-modal-title">新建项目</h3>
              <button
                type="button"
                className="cc-modal-close"
                onClick={closeNewProject}
                aria-label="关闭"
              >
                <Icon name="x" size={16} />
              </button>
            </div>

            <div className="cc-modal-body">
              <label className="cc-field-label">
                项目名称 <span className="cc-required">*</span>
              </label>
              <input
                className="cc-field-input"
                placeholder="请输入项目名称"
                value={npName}
                onChange={(e) => setNpName(e.target.value)}
              />

              <label className="cc-field-label">
                项目路径 <span className="cc-required">*</span>
              </label>
              <div className="cc-path-wrap">
                <input
                  className="cc-field-input cc-path-input"
                  placeholder="点击选择本地文件夹路径"
                  value={npPath}
                  readOnly
                  onClick={() => setPathMenu((v) => !v)}
                />
                <Icon name="folder-open" size={16} className="cc-path-pick-icon" />
                {pathMenu ? (
                  <div className="cc-path-pop">
                    {MOCK_DIRS.map((d) => (
                      <button
                        type="button"
                        key={d.id}
                        className="cc-path-option"
                        onClick={() => {
                          setNpPath(d.path);
                          setPathMenu(false);
                        }}
                      >
                        <Icon name="folder" size={15} className="cc-mitem-icon" />
                        <span className="cc-path-name">{d.path}</span>
                      </button>
                    ))}
                  </div>
                ) : null}
              </div>
              <p className="cc-path-note">
                预览为模拟目录选择；桌面端接入系统对话框后可返回真实路径
              </p>
            </div>

            <div className="cc-modal-foot">
              <button type="button" className="cc-btn cc-btn-ghost" onClick={closeNewProject}>
                取消
              </button>
              <button
                type="button"
                className="cc-btn cc-btn-primary"
                disabled={!npName.trim() || !npPath.trim()}
                onClick={confirmNewProject}
              >
                确定
              </button>
            </div>
          </div>
        </div>
      ) : null}

      {/* ============ 完全访问 · 二次确认弹窗 ============ */}
      {confirmFull ? (
        <div
          className="cc-scrim"
          onMouseDown={(e) => {
            if (e.target === e.currentTarget) setConfirmFull(false);
          }}
        >
          <div
            className="cc-modal cc-modal-confirm"
            role="dialog"
            aria-modal="true"
            aria-label="确认允许完全访问？"
          >
            <div className="cc-modal-head cc-modal-head-warn">
              <Icon name="shield-alert" size={20} className="cc-confirm-warn" />
              <h3 className="cc-modal-title">确认允许完全访问？</h3>
            </div>
            <p className="cc-confirm-body">
              在完全访问模式下，AI无需你的批准即可编辑你电脑上的任何文件，并执行可联网的命令。启用完全访问权限前请谨慎评估。
            </p>
            <p className="cc-confirm-body cc-confirm-body-risk">
              此操作将显著增加数据丢失、泄露或异常行为的风险。
            </p>
            <div className="cc-modal-foot">
              <button
                type="button"
                className="cc-btn cc-btn-ghost"
                onClick={() => setConfirmFull(false)}
              >
                取消
              </button>
              <button
                type="button"
                className="cc-btn cc-btn-primary"
                onClick={() => {
                  setPermission(PERMISSIONS.find((p) => p.id === "full"));
                  setConfirmFull(false);
                }}
              >
                确认
              </button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}
  Object.assign(__export, { ChatComposer });
})();

          <p className="cw-hero-sub">可以帮您写代码、查资料、创作内容，试试下面的输入框。</p>

  Object.assign(__export, { ChatWorkspace });
})();

}
