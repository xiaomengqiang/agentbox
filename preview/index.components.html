  /* 8. Font Size（字号，px） */

/* ── body base ── */
body {
  margin: 0;
  line-height: 1.5;
  color: var(--on-surface);
  font-family: var(--font-family);
  background-color: var(--surface);
}

#root {
  min-height: 100vh;
}

/* Standard scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
  background-color: transparent;
}

::-webkit-scrollbar-corner {
  background-color: transparent;
}

::-webkit-scrollbar-track {
  background-color: transparent;
}

::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background-color: var(--color-comp-divider);
  background-clip: padding-box;
}

::-webkit-scrollbar-track-piece {
  background-color: transparent;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--primary-40);
}


/* 语义层 Light Mode（:root 默认主题）*/
:root {
  /* Font Color（文本色）*/
  --color-font-primary: var(--primary-90);
  --color-font-secondary: var(--primary-60);
  --color-font-tertiary: var(--primary-40);
  --color-font-fourth: var(--primary-20);
  --color-font-emphasize: var(--brand-font); 
  --color-font-on-primary: var(--on-primary);
  --color-font-on-secondary: var(--on-primary-60);
  --color-font-on-tertiary: var(--on-primary-40);
  --color-font-on-fourth: var(--on-primary-20);

  /* Background Color（背景色）*/
  --color-background-primary: var(--white);
  --color-background-secondary: var(--gray-01);
  --color-background-tertiary: var(--gray-02);
  --color-background-fourth: var(--gray-03);
  --color-background-emphasize: var(--brand);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--white);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-05);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary); 
  --color-comp-background-gray: var(--gray-01); 
  --color-comp-background-gray-secondary: var(--gray-01);
  --color-fg-unchecked: var(--on-primary-20);
  --color-comp-divider: var(--container-20); 

  /* Comp Border Color（组件边框色）*/
  --color-comp-border: var(--container-15); 
  --color-comp-border-hover: var(--container-20); 
  --color-comp-border-focus: var(--brand); 
  --color-comp-border-active: var(--brand); 
  --color-comp-border-disabled: var(--container-10); 

  /* Icon Color（图标色）*/
  --color-icon-primary: var(--primary-90);
  --color-icon-secondary: var(--primary-60);
  --color-icon-tertiary: var(--primary-40);
  --color-icon-fourth: var(--primary-20);
  --color-icon-emphasize: var(--brand-font);
  --color-icon-sub-emphasize: var(--brand-40);
  --color-icon-on-primary: var(--on-primary);
  --color-icon-on-secondary: var(--on-primary-60);
  --color-icon-on-tertiary: var(--on-primary-40);
  --color-icon-on-fourth: var(--on-primary-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-05); 
  --color-interactive-pressed: var(--container-10);
  --color-interactive-select: var(--brand-20); 
  --color-interactive-click: var(--container-10);

  /* Functional Color（功能色，设计师指定值，独立于 multi-color 色板）*/
  --color-error: #E84026;
  --color-alert: #ED6F21;
  --color-warning: #EFBF00;
  --color-success: #64BB5C;
  --color-info: #0A59F7;
  --color-error-container: #FDEBEB;
  --color-alert-container: #FFF0E6;
  --color-warning-container: #FFF7D6;
  --color-success-container: #EDF7EB;
  --color-info-container: #E6EEFE;

  /* Shadow（阴影）*/
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.1);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.12);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.06);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.08);
  --shadow-glow: 0 4px 32px 0 rgba(241, 243, 245, 0.8);
}


/* ==========================================================================
   主题层 Theme（AI 组件直接消费的终极语义层）
   加载顺序：base → light → theme → dark*/

:root {
  /* ── primary（品牌色族，部分占位）── */
  --primary: var(--brand);
  --on-primary: var(--white);
  --primary-hover: var(--brand-80); 
  --primary-active: var(--brand); 
  --primary-disabled: var(--brand-40);
  --primary-container: var(--brand-05); 
  --on-primary-container: var(--color-font-primary);

  /* ── surface / on-surface（已重写，引用新 light/dark 语义 token）── */
  --surface: var(--color-background-secondary);
  --surface-dim: var(--color-background-tertiary);
  --surface-bright: var(--color-background-primary);
  --on-surface: var(--color-font-primary);
  --surface-container-lowest: var(--color-background-primary);
  --surface-container-low: var(--color-background-secondary);
  --surface-container: var(--color-comp-background-tertiary);
  --surface-container-high: var(--color-background-tertiary);
  --surface-container-highest: var(--color-background-fourth);

  --inverse-surface: var(--primary);
  --inverse-on-surface: var(--color-font-on-primary);
  --inverse-on-surface-variant: var(--color-font-on-secondary);
  --inverse-primary: var(--brand);

  --error: var(--color-error);
  --on-error: var(--white);
  --error-container: var(--color-error-container);
  --on-error-container: var(--color-font-primary);

  --alert: var(--color-alert);
  --on-alert: var(--white);
  --alert-container: var(--color-alert-container);
  --on-alert-container: var(--color-font-primary);

  --warning: var(--color-warning);
  --on-warning: var(--black);
  --warning-container: var(--color-warning-container);
  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);
  --on-success: var(--white);
  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);
  --on-info: var(--white);
  --info-container: var(--color-info-container);
  --on-info-container: var(--color-font-primary);

  --text-primary: var(--color-font-primary);
  --text-secondary: var(--color-font-secondary);
  --text-tertiary: var(--color-font-tertiary);
  --text-error: var(--color-error);
  --text-placeholder: var(--color-font-tertiary);
  --text-disabled: var(--color-font-fourth);
  --text-inverse-disabled: var(--color-font-on-fourth);
  
  --interactive-link: var(--brand);
  --interactive-link-hover: var(--brand-80);
  --interactive-link-active: var(--brand);
  --interactive-link-visited: var(--brand);
  --interactive-link-disabled: var(--brand-40);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: var(--outline-width-base); /* 1px */
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（排印角色：字号+行高+字体族绑定，字重在其后组合）── */
  /* Line boxes follow each role ratio, rounded upward to a 2px grid.
     Use em so size overrides keep the same ratio (e.g. Tab large / medium). */
  /* Display（展示文本）*/
  --font-display-sm: var(--font-size-4xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 38px/1.25 */
  --font-display-md: var(--font-size-5xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 48px/1.25 */
  --font-display-lg: var(--font-size-6xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 56px/1.25 */

  /* Title（标题）*/
  --font-title-sm: var(--font-size-xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 20px/1.375 */
  --font-title-md: var(--font-size-2xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}


/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}


/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

.cw-code-title { margin: 0; color: var(--on-surface); font: var(--font-title-lg); font-weight: var(--font-weight-medium); }

.cw-brand-actions { color: var(--text-secondary); }
.cw-collapse { color: var(--text-secondary); }


/* 分割按钮根轨道：胶囊形、浅色容器底色（comp_background_tertiary） */
.sb-root {
  display: inline-flex;
  align-items: center;
  width: max-content;
  max-width: 100%;
  height: 44px;
  padding: 4px;
  background-color: var(--color-comp-background-tertiary);
  border-radius: 24px;
  box-sizing: border-box;
}

/* 圆角可选：8px（默认 24px） */
.sb-root.sb-shape-square {
  border-radius: 8px;
}

.sb-root.sb-shape-square .sb-segment {
  border-radius: 6px;
}

/* 单段按钮：等宽、胶囊、字号 14px */
.sb-segment {
  flex: 1 1 0%;
  min-width: 0;
  height: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  border: none;
  border-radius: 24px;
  background-color: transparent;
  font: var(--font-body-md); /* 14px / 22px（字体 token 向上取偶数） */
  font-weight: var(--font-weight-medium);
  color: var(--color-font-secondary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

/* Height and shape are independent for both content variants. */
.sb-root.sb-height-32 { height: 32px; padding: 2px; }
.sb-root.sb-height-36 { height: 36px; padding: 2px; }
.sb-root.sb-height-44 { height: 44px; padding: 4px; }
.sb-root.sb-icon-only .sb-segment {
  box-sizing: border-box;
  flex: 1 1 36px;
  width: 36px;
  min-width: 0;
  padding: 0;
  gap: 0;
}
.sb-root.sb-icon-only { min-width: 0; }

.sb-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 带图标的分段：文字使用 regular 粗细（400） */
.sb-segment.sb-has-icon {
  font-weight: var(--font-weight-regular);
}

.sb-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* 选中段：悬浮白底 + 主文字（对应 SVG 的 white fill + black @ 0.9） */
.sb-segment.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--color-font-primary);
}

/* 悬停：在静止底色上叠加交互层（Design Rule 3） */
.sb-segment:not(.sb-active).sb-hover {
  background-color: var(--color-interactive-hover);
}

.sb-segment.sb-active.sb-hover {
  background-color: var(--surface-container-lowest);
}

/* 按压态 */
.sb-segment:not(.sb-active).sb-pressed {
  background-color: var(--color-interactive-pressed);
}

.sb-segment.sb-active.sb-pressed {
  background-color: var(--surface-container-lowest);
}

/* 无独立 Focus 视觉态，保留原生键盘激活。 */
.sb-segment:focus {
  outline: none;
}

/* 禁用态：整组置灰、禁用文字、禁止交互 */
.sb-disabled .sb-segment {
  cursor: not-allowed;
}

.sb-disabled .sb-segment.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--text-disabled);
}

.sb-disabled .sb-segment:not(.sb-active) {
  color: var(--text-disabled);
}

/* 单段禁用 */
.sb-segment:disabled {
  cursor: not-allowed;
  color: var(--text-disabled);
}

.sb-segment:disabled.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--text-disabled);
}

/* 图标与文字独立使用各自的语义色，不依赖当前色值恰好相同。 */
.sb-icon { color: var(--color-icon-secondary); }
.sb-active .sb-icon { color: var(--color-icon-primary); }
.sb-icon-only .sb-segment { color: var(--color-icon-secondary); }
.sb-icon-only .sb-segment.sb-active { color: var(--color-icon-primary); }
.sb-icon-only .sb-icon, .sb-icon-only .sb-icon > svg { width: 14px; height: 14px; }
.sb-segment:disabled, .sb-segment:disabled .sb-icon { color: var(--text-disabled); }
.sb-segment:disabled { pointer-events: none; }


/* Image assets share the same inline alignment as the original Icon renderer. */
img[data-component="Icon"] {
  display: inline-block;
  vertical-align: middle;
}


.mi-menu {
  --mi-height: 40px;
  --mi-font: var(--font-body-md);
  --mi-icon-size: 16px;
  --mi-radius: var(--radius-container);
  --mi-scroll-duration: 6s;
  --mi-scroll-distance: 0px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: 0;
  color: var(--on-surface);
}

.mi-menu-medium {
  --mi-height: 36px;
  --mi-font: var(--font-body-md);
  --mi-radius: var(--radius-md);
}

.mi-menu-small {
  --mi-height: 32px;
  --mi-font: var(--font-body-sm);
  --mi-icon-size: 14px;
  --mi-radius: var(--radius-md);
}

.mi-menu-error {
  color: var(--color-error);
}

.mi-row {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: var(--mi-height);
  padding: 0 12px;
  border-radius: var(--mi-radius);
  background: transparent;
  color: inherit;
  font: var(--mi-font);
  font-weight: var(--font-weight-regular);
}

/* A single state layer overlays the transparent resting surface. */
.mi-row::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: transparent;
  pointer-events: none;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.mi-row:hover::before {
  background: var(--color-interactive-hover);
}

.mi-menu-error .mi-row:hover::before {
  background: var(--color-error-container);
}


.mi-main,
.mi-disclosure,
.mi-trailing-action {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 0;
  border: 0;
  outline: none;
  appearance: none;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.mi-main {
  flex: 1 1 0;
  min-width: 0;
  gap: var(--spacing-inline);
  justify-content: flex-start;
  text-align: left;
}

.mi-disclosure,
.mi-disclosure-space,
.mi-trailing-region {
  flex: 0 0 var(--mi-icon-size);
  width: var(--mi-icon-size);
  height: 100%;
}

.mi-trailing-region {
  display: flex;
  align-items: center;
}

.mi-icon {
  display: block;
  flex: 0 0 var(--mi-icon-size);
  width: var(--mi-icon-size);
  height: var(--mi-icon-size);
  background: currentColor;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  -webkit-mask-size: contain;
  mask-size: contain;
}

.mi-label {
  display: block;
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  transform: translateY(1px);
}

.mi-row-expandable { cursor: pointer; }

/* Keep icon alignment while giving More a centered 24px interaction target. */
.mi-trailing-action {
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  margin-left: calc((var(--mi-icon-size) - 24px) / 2);
  color: var(--color-icon-secondary);
}

.mi-trailing-action:hover {
  color: var(--color-icon-primary);
}


.mi-row-editing::before { background: var(--color-interactive-hover); }
.mi-menu-error .mi-row-editing::before { background: var(--color-error-container); }
.mi-rename-input {
  flex: 1 1 0;
  min-width: 0;
  box-sizing: border-box;
  height: calc(100% - 4px);
  margin: 0 -10px 0 0;
  padding: 0 8px;
  border: 1px solid var(--brand);
  border-radius: max(0px, calc(var(--mi-radius) - 2px));
  outline: none;
  background: transparent;
  color: var(--on-surface);
  caret-color: var(--brand);
  font: inherit;
  font-weight: var(--font-weight-regular);
  cursor: text;
}

.mi-leading-icon,
.mi-disclosure .mi-icon {
  color: var(--color-icon-primary);
}
.mi-menu-error .mi-leading-icon,
.mi-menu-error .mi-disclosure .mi-icon {
  color: var(--color-error);
}

.mi-label-track { display: flex; width: max-content; gap: 32px; }
.mi-label-copy { display: block; flex: none; }
.mi-label-overflow {
  -webkit-mask-image: linear-gradient(to right, black 0%, black calc(100% - 24px), transparent 100%);
  mask-image: linear-gradient(to right, black 0%, black calc(100% - 24px), transparent 100%);
}
.mi-row:hover .mi-label-overflow .mi-label-track {
  animation: mi-name-scroll var(--mi-scroll-duration) linear infinite;
}
@keyframes mi-name-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(var(--mi-scroll-distance)); }
}
@media (prefers-reduced-motion: reduce) {
  .mi-row:hover .mi-label-overflow .mi-label-track { animation: none; }
}

/* Optional conversation activity indicator. */
.mi-status-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--primary); }


/* ===================== ChatComposer ===================== */

/* ---- 灰色外框 800(高度随输入卡片自适应:无文件188 / 1行258 / 2行及以上328) ---- */
.cc-shell {
  position: relative;
  box-sizing: border-box;
  width: 800px;
  height: auto;
  display: flex;
  flex-direction: column;
  padding: 4px;
  border-radius: var(--radius-3xl);
  background-color: #eff1f3;
  color: var(--on-surface);
  font-family: var(--font-family);
}

/* 暗色模式回退到语义容器色 */
.dark .cc-shell {
  background-color: var(--surface-container-low);
}

/* 对话页模式:去掉灰色外框背景与内边距,仅保留输入卡片本体 */
.cc-shell--chat {
  padding: 0;
  background-color: transparent;
}

/* ---- 白色输入卡片 792 × 140 ----
   注意：不设 z-index，避免把内部弹出的菜单关进自己的堆叠上下文，
   导致其层级反而低于下方其它卡片 */
.cc-card {
  position: relative;
  box-sizing: border-box;
  flex: 0 0 140px;
  width: 100%;
  height: 140px;
  display: flex;
  flex-direction: column;
  background-color: var(--surface-container-lowest);
  box-shadow: var(--shadow-md);
  border-radius: var(--radius-2xl);
}

/* 输入框右上角外侧的吉祥鸟装饰插画(纯装饰,不拦截交互;整体悬于外框上方,不被卡片遮挡) */
.cc-shell-mascot {
  position: absolute;
  top: -96px;
  right: 24px;
  width: 88px;
  height: 88px;
  pointer-events: none;
}

/* ---- 正文输入区 ---- */
.cc-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 12px 14px 2px;
}

.cc-input {
  display: block;
  flex: 1;
  width: 100%;
  border: 0;
  outline: none;
  resize: none;
  background-color: transparent;
  color: var(--on-surface);
  font: var(--font-body-md);
  line-height: 1.7;
  caret-color: var(--primary);
}

.cc-input::placeholder {
  color: var(--text-placeholder);
}

/* 胶囊与输入共享一行:文字紧跟标签,单行不换行(超出横向滚动) */
.cc-input-row {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
  align-items: flex-start;
  gap: 6px;
}

.cc-input-row .cc-input {
  flex: 1 1 auto;
  width: auto;
  height: 100%;
}

.cc-input-row .cc-cmd-chips {
  flex: 0 0 auto;
  margin-bottom: 0;
}

/* ---- 底部工具栏 ---- */
.cc-toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 10px 9px;
}

.cc-tool-group {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

/* ---- 幽灵图标按钮（加号）：无底色，仅 hover 出现浅色底 ---- */
.cc-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--color-icon-secondary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

.cc-ghost:hover,
.cc-ghost.is-active {
  background-color: var(--color-interactive-hover);
  color: var(--color-icon-primary);
}

/* ---- 图标 + 文字的下拉按钮（chip）----
   默认无灰底，悬停/展开时才出现浅色底 */
.cc-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 7px 0 8px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-chip:hover,
.cc-chip.is-active {
  background-color: var(--color-interactive-hover);
}

.cc-chip .cc-chev,
.cc-space .cc-chev {
  color: var(--color-icon-tertiary);
}

/* 完全访问被选中：红色告警态 */
.cc-chip-danger,
.cc-chip-danger .cc-chev {
  color: var(--error);
}

.cc-chip-danger:hover,
.cc-chip-danger.is-active {
  background-color: var(--error-container);
  color: var(--on-error-container);
}

.cc-chip-danger:hover .cc-chev,
.cc-chip-danger.is-active .cc-chev {
  color: var(--on-error-container);
}

.cc-chip-label {
  display: inline-flex;
  align-items: center;
  line-height: 1;
  white-space: nowrap;
}

/* ---- 发送按钮:图标自带灰底白飞机圆底(send-inactive.svg),本体无底色 ---- */
.cc-send {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  margin-left: 2px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--on-primary);
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out);
}

.cc-send:hover:not(:disabled) {
  transform: scale(1.06);
}

.cc-send:active:not(:disabled) {
  transform: scale(0.92);
}

.cc-send:disabled {
  cursor: default;
}

/* 发送成功态:恢复底色以衬托对号 */
.cc-send.is-sent {
  background-color: var(--success);
  color: var(--on-success);
}

/* ---- 下拉容器与面板 ---- */
.cc-drop {
  position: relative;
}

.cc-menu {
  position: absolute;
  z-index: 50;
  top: calc(100% + 8px);
  left: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: max-content;
  min-width: 240px;
  padding: 6px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-dropdown);
}

/* 向上的面板（底部控件使用） */
.cc-drop-up .cc-menu {
  top: auto;
  bottom: calc(100% + 8px);
}

/* 自适应向上：底部空间不足时由 DropMenu 自动添加（cc-chip 下拉） */
.cc-menu--up {
  top: auto;
  bottom: calc(100% + 8px);
}

/* 对话页:加号的一级菜单同样向上弹出 */
.cc-drop-up .cc-addmenu {
  top: auto;
  bottom: calc(100% + 8px);
}

/* 靠右对齐的面板（右侧控件使用） */
.cc-drop-right .cc-menu {
  left: auto;
  right: 0;
}

/* ---- 菜单项 ---- */
.cc-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-primary);
  text-align: left;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-menu-item:hover {
  background-color: var(--color-interactive-hover);
}

.cc-mitem-icon {
  flex-shrink: 0;
  color: var(--color-icon-secondary);
}

.cc-mitem-main {
  flex: 1 1 auto;
  min-width: 0;
}

.cc-mitem-label {
  display: block;
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-regular);
  line-height: 1.4;
  white-space: nowrap;
}

.is-selected .cc-mitem-label {
  color: var(--color-font-primary);
  font-weight: var(--font-weight-bold);
}

.cc-mitem-desc {
  display: block;
  margin-top: 1px;
  color: var(--color-font-tertiary);
  font: var(--font-caption-md);
  line-height: 1.45;
  white-space: nowrap;
}

.cc-menu-check {
  flex: 0 0 18px;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  width: 18px;
  height: 18px;
  margin-left: 8px;
  color: var(--color-icon-primary);
}

/* ---- 灰色外框下方：选择项目空间 ---- */
.cc-footer {
  flex: 0 0 40px;
  display: flex;
  align-items: center;
  padding: 0 8px;
}

.cc-space {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px 0 8px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-space:hover,
.cc-space.is-active {
  background-color: var(--color-interactive-hover);
}

/* 行右侧:运行环境(本地/云端)下拉 */
.cc-drop-local {
  margin-left: auto;
}

.cc-local {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px 0 8px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--text-secondary);
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-local:hover,
.cc-local.is-active {
  background-color: var(--color-interactive-hover);
  color: var(--on-surface);
}

/* ---- 空间面板：搜索行 / 分割线 / 空态 ---- */
.cc-space-menu {
  width: max-content;
  min-width: 240px;
}

.cc-menu-search {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 6px 6px;
  margin-bottom: 2px;
  border-radius: var(--radius-sm);
  color: var(--color-icon-secondary);
}

.cc-search-icon {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
}

.cc-search-input {
  flex: 1 1 auto;
  min-width: 0;
  border: none;
  outline: none;
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-body-md);
  line-height: 1.5;
}

.cc-search-input::placeholder {
  color: var(--text-placeholder);
}

.cc-space-empty {
  padding: 6px 8px;
  color: var(--text-placeholder);
  font: var(--font-caption-lg);
}

.cc-menu-divider {
  height: 1px;
  margin: 6px 2px;
  background-color: var(--color-comp-divider);
}

/* 键盘可访问性：焦点描边 */
.cc-chip:focus-visible,
.cc-ghost:focus-visible,
.cc-send:focus-visible,
.cc-space:focus-visible,
.cc-local:focus-visible,
.cc-menu-item:focus-visible,
.cc-modal-close:focus-visible,
.cc-field-input:focus-visible,
.cc-btn:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}

/* ============ 新建项目 · 居中弹窗 ============ */
.cc-scrim {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background-color: var(--scrim);
}

.cc-modal {
  box-sizing: border-box;
  width: 420px;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  padding: 20px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-overlay);
  box-shadow: var(--shadow-modal);
}

.cc-modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.cc-modal-title {
  margin: 0;
  font: var(--font-title-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.cc-modal-confirm {
  width: 400px;
}

.cc-modal-head-warn {
  justify-content: flex-start;
  gap: 8px;
}

.cc-confirm-warn {
  flex-shrink: 0;
  color: var(--error);
}

.cc-confirm-body {
  margin: 0;
  color: var(--color-font-secondary);
  font: var(--font-body-md);
  line-height: 1.7;
}

.cc-confirm-body-risk {
  margin-top: 8px;
  color: var(--color-font-primary);
}

.cc-modal-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--color-icon-secondary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-modal-close:hover {
  background-color: var(--color-interactive-hover);
  color: var(--color-icon-primary);
}

.cc-modal-body {
  display: flex;
  flex-direction: column;
}

.cc-field-label {
  margin-bottom: 6px;
  font: var(--font-body-md);
  color: var(--color-font-primary);
}

.cc-required {
  margin-left: 2px;
  color: var(--error);
}

.cc-field-input {
  box-sizing: border-box;
  width: 100%;
  height: 38px;
  margin-bottom: 14px;
  padding: 0 14px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-full);
  outline: none;
  background-color: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
  transition: border-color var(--duration-fast) var(--ease-standard);
}

.cc-field-input::placeholder {
  color: var(--text-placeholder);
}

.cc-field-input:focus {
  border-color: var(--focus-ring);
}

.cc-path-wrap {
  position: relative;
}

.cc-path-input {
  padding-right: 14px;
  padding-left: 38px;
  cursor: pointer;
}

.cc-path-pick-icon {
  position: absolute;
  top: 10px;
  left: 13px;
  color: var(--color-icon-secondary);
  pointer-events: none;
}

/* 模拟目录选择器 */
.cc-path-pop {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-dropdown);
}

.cc-path-option {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-primary);
  text-align: left;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-path-option:hover {
  background-color: var(--color-interactive-hover);
}

.cc-path-name {
  min-width: 0;
  overflow: hidden;
  font: var(--font-body-sm);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cc-path-note {
  margin: 4px 0 0;
  font: var(--font-caption-lg);
  color: var(--text-placeholder);
}

/* ============ 指令胶囊 ============ */
.cc-cmd-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 58px;
  margin-bottom: 4px;
  overflow: auto;
}

.cc-cmd-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 24px;
  padding: 0 4px 0 8px;
  border-radius: var(--radius-full);
  background-color: var(--brand-15);
  color: var(--primary);
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-medium);
}

.cc-cmd-chip-label {
  line-height: 1;
  white-space: nowrap;
}

/* 技能类胶囊:无关闭按钮,仅展示,右内边距补偿 */
.cc-cmd-chip--info {
  padding-right: 10px;
}

.cc-cmd-chip-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--primary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-cmd-chip-x:hover {
  background-color: var(--brand-30);
}

/* ============ 本地文件卡片 184 × 58 ============ */
.cc-file-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  /* 内衬+负边距(四向):给卡片四周 hover 阴影留空间;
     右侧额外 -4px 余量抵消滚动条宽度,保证滚动态仍一行4个 */
  padding: 4px;
  margin: -4px -8px 8px;
  /* 最多完整显示两行(2×58+间隙8=124),第三行起内部滚动 */
  max-height: 124px;
  overflow-y: auto;
  /* 细滚动条(Firefox) */
  scrollbar-width: thin;
  scrollbar-color: var(--gray-04) transparent;
}

/* 细滚动条(Chromium):4px 宽,透明轨道,少占内容宽度 */
.cc-file-list::-webkit-scrollbar {
  width: 4px;
}

.cc-file-list::-webkit-scrollbar-thumb {
  border-radius: var(--radius-full);
  background-color: var(--gray-04);
}

.cc-file-list::-webkit-scrollbar-track {
  background-color: transparent;
}

.cc-file-card {
  position: relative;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 184px;
  height: 58px;
  padding: 6px 8px 6px 10px;
  background-color: var(--surface-container-lowest);
  border: 1px solid var(--gray-03);
  border-radius: var(--radius-md);
  transition: border-color var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}

/* hover：无边框 + 卡片阴影，右上角浮现 X */
.cc-file-card:hover {
  border-color: transparent;
  box-shadow: var(--shadow-card);
}

.cc-file-icon {
  flex: 0 0 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  /* 图标为内置彩色贴片，自带底色，无需额外容器背景 */
}

/* 图片类型:直接显示上传的具体图片缩略图 */
.cc-file-thumb {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  object-fit: cover;
}

.cc-file-info {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.cc-file-name {
  overflow: hidden;
  color: var(--on-surface);
  font: var(--font-body-sm);
  font-weight: var(--font-weight-medium);
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cc-file-meta {
  color: var(--text-placeholder);
  font: var(--font-caption-md);
  line-height: 1.4;
}

/* 上传失败态:左红文案 + 右蓝重试 */
.cc-file-meta-failed {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cc-file-failed {
  color: var(--error);
}

.cc-file-retry {
  padding: 0;
  border: none;
  background-color: transparent;
  color: var(--primary);
  font: var(--font-caption-md);
  cursor: pointer;
}

.cc-file-retry:hover {
  color: var(--primary-hover);
}

.cc-file-x {
  position: absolute;
  top: 4px;
  right: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  border-radius: var(--radius-full);
  background-color: var(--color-interactive-hover);
  color: var(--black);
  cursor: pointer;
  /* 叉号仅 hover 所在卡片时出现 */
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

/* 暗色模式下叉号反转为白色,保证可见 */
.dark .cc-shell .cc-file-x {
  color: var(--white);
}

.cc-file-card:hover .cc-file-x {
  opacity: 1;
}

.cc-file-x:hover {
  background-color: var(--color-icon-secondary);
  color: var(--surface-bright);
}

/* ============ “/” 快捷指令面板 ============ */
/* 加号图标旋转 45°（展开附件时） */
.cc-plus-icon {
  transition: transform var(--duration-fast) var(--ease-out);
}

.cc-plus-icon.is-rot {
  transform: rotate(45deg);
}
/* 锚定在灰色外框（cc-shell）下方，宽度与输入框一致（左右各 4px） */
.cc-slash {
  position: absolute;
  top: calc(100% + 8px);
  left: 4px;
  right: 4px;
  z-index: 60;
  box-sizing: border-box;
  max-height: 308px;
  overflow: auto;
  padding: 6px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-dropdown);
}

/* 对话页:"/"指令面板锚定到输入框上方 */
.cc-slash--up {
  top: auto;
  bottom: calc(100% + 8px);
}

.cc-slash-group-label {
  display: flex;
  align-items: center;
  padding: 8px 10px 4px;
  color: var(--text-placeholder);
  font: var(--font-caption-lg);
  letter-spacing: 0.08em;
}

.cc-slash-group-label:first-child {
  padding-top: 4px;
}

.cc-slash-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-primary);
  text-align: left;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-slash-row:hover {
  background-color: var(--color-interactive-hover);
}

.cc-slash-icon {
  flex-shrink: 0;
  color: var(--color-icon-secondary);
}

.cc-slash-title {
  flex: 0 0 110px;
  display: inline-flex;
  align-items: center;
  font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  color: var(--color-font-primary);
}

.cc-slash-desc {
  flex: 1 1 auto;
  min-width: 0;
  max-width: 648px;
  overflow: hidden;
  color: var(--color-font-tertiary);
  font: var(--font-body-sm);
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 一级菜单导航行 */
.cc-slash-nav-title {
  flex: 1 1 auto;
  font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  color: var(--color-font-primary);
}

.cc-slash-nav-arrow {
  flex-shrink: 0;
  color: var(--color-icon-tertiary);
}

/* 二级菜单返回行 */
.cc-slash-back {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 2px 8px 6px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-secondary);
  font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  text-align: left;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-slash-back:hover {
  background-color: var(--color-interactive-hover);
  color: var(--color-font-primary);
}

/* ============ 加号(+)下拉面板：hover 向右侧弹出二级 ============ */
.cc-addmenu {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 55;
  box-sizing: border-box;
  width: 240px;
  padding: 6px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-dropdown);
}

.cc-add-item {
  position: relative;
}

/* 透明桥接，保证从一级行移向右侧二级面板时 hover 不断开 */
.cc-add-item::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 100%;
  width: 6px;
}

.cc-add-item.is-active > .cc-add-root {
  background-color: var(--color-interactive-hover);
}

.cc-add-root {
  width: 100%;
}

/* 锚定在菜单整体(非所在行):切换选项时面板位置稳定,消除抖动;
   top:-6px 补偿菜单内边距,使面板与选项行顶部对齐 */
.cc-add-sub {
  position: absolute;
  top: -6px;
  left: calc(100% + 6px);
  z-index: 60;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 320px;
  max-height: 360px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-dropdown);
}

/* 对话页(菜单向上弹出):二级面板改为向上展开,对齐菜单底部,避免被视口底部裁切 */
.cc-drop-up .cc-add-sub {
  top: auto;
  bottom: -6px;
}

/* 二级里「主标题在上、正文在下」的选项行:主列 + 行尾对号列 */
.cc-add-line {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 10px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

/* 主列:标题在上、正文在下 */
.cc-add-line-main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.cc-add-line:hover {
  background-color: var(--color-interactive-hover);
}

.cc-add-line-title {
  color: var(--color-font-primary);
  font: var(--font-body-md);
  line-height: 1.4;
}

.cc-add-line-desc {
  overflow: hidden;
  color: var(--color-font-tertiary);
  font: var(--font-body-sm);
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 行尾对号列:仅在选中时渲染(未选中时文本占满整行宽度) */
.cc-add-check {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  color: var(--color-icon-primary);
}

/* 二级底部管理项：图标 + 标题 */
.cc-add-manage {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 10px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-body-md);
  text-align: left;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-add-manage:hover {
  background-color: var(--color-interactive-hover);
}

/* 连接器行：图标 + 标题 + 行尾开关 */
.cc-add-conn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-add-conn:hover {
  background-color: var(--color-interactive-hover);
}

.cc-add-conn-title {
  flex: 1 1 auto;
  min-width: 0;
  color: var(--color-font-primary);
  font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
}

.cc-add-toggle {
  position: relative;
  flex: 0 0 auto;
  box-sizing: border-box;
  width: 34px;
  height: 20px;
  padding: 0;
  border: none;
  border-radius: var(--radius-full);
  background-color: var(--surface-container-high);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-add-toggle.is-on {
  background-color: var(--primary);
}

.cc-add-toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: var(--radius-full);
  background-color: var(--surface-bright);
  box-shadow: var(--shadow-xs);
  transition: transform var(--duration-fast) var(--ease-out);
}

.cc-add-toggle.is-on .cc-add-toggle-knob {
  transform: translateX(14px);
}

/* 菜单行统一 border-box：width:100% + padding 才不会撑宽容器，避免右侧内容被挤出/裁剪 */
.cc-menu-item,
.cc-slash-row,
.cc-add-line,
.cc-add-manage,
.cc-add-conn {
  box-sizing: border-box;
}

/* 连接器开关：始终贴行末，不被其它内容挤出面板 */
.cc-add-toggle {
  margin-left: auto;
}

.cc-modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.cc-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 144px;
  height: 32px;
  padding: 0 16px;
  border: none;
  border-radius: var(--radius-full);
  font: var(--font-body-sm);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cc-btn-ghost {
  background-color: var(--surface-container);
  color: var(--color-font-primary);
}

.cc-btn-ghost:hover {
  background-color: var(--surface-container-high);
}

.cc-btn-primary {
  background-color: var(--primary);
  color: var(--on-primary);
}

.cc-btn-primary:hover:not(:disabled) {
  background-color: var(--primary-hover);
}

.cc-btn-primary:disabled {
  background-color: var(--primary-disabled);
  cursor: default;
}

/* ============ 顶部居中提示(toast) ============ */
.cc-toast {
  position: fixed;
  top: 24px;
  left: 50%;
  z-index: 1100;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(560px, calc(100vw - 48px));
  padding: 10px 12px 10px 14px;
  border-radius: var(--radius-lg);
  background-color: var(--gray-02);
  box-shadow: var(--shadow-popover);
  transform: translateX(-50%);
}

/* 红色圆底叉号 */
.cc-toast-icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: var(--radius-full);
  background-color: var(--error);
  color: var(--on-error);
}

.cc-toast-text {
  min-width: 0;
  overflow: hidden;
  color: var(--on-surface);
  font: var(--font-body-sm);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 最右侧关闭叉号 */
.cc-toast-close {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-icon-secondary);
  cursor: pointer;
}

.cc-toast-close:hover {
  color: var(--on-surface);
  background-color: var(--color-interactive-hover);
}


/* ================= 会话页面骨架 ================= */
.cs-wrap {
  display: flex;
  flex-direction: row;
  width: 100%;
  min-width: 0;
  height: 100%;
}

/* 左侧主区：顶栏 + 消息流 + 输入区（与右侧预览面板等宽） */
.cs-main {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
}

/* ---- 顶栏 ---- */
.cs-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex: 0 0 auto;
  padding: 1.125rem 1.5rem;
  font-size: 1rem;
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
}

.cs-header-main {
  min-width: 0;
}

.cs-title {
  font-size: 1rem;
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 顶栏右侧图标（纯图片展示） */
.cs-new {
  display: block;
  flex: 0 0 auto;
  width: 1rem;
  height: 1rem;
}

/* ---- 消息流 ---- */
.cs-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 28px 40px 20px;
}

.cs-inner {
  display: flex;
  flex-direction: column;
  gap: 28px;
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
}

/* ---- 用户消息 ---- */
.cs-user-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  max-width: 78%;
  margin-left: auto;
}

.cs-user-attach {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}

.cs-user-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--primary);
  font: var(--font-caption-lg);
}

.cs-user-bubble {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  border-radius: 1rem;
  /* #f1f3f5 — 等价 var(--color-background-secondary)，暗色模式自动翻转 */
  background: var(--color-background-secondary);
  color: var(--on-surface);
}

/* 气泡内标签：图标 + 文档总结 */
.cs-user-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
  height: 1.5rem;
  padding: 0 0.5rem;
  box-sizing: border-box;
  border-radius: 1rem;
  /* rgba(10,89,247,0.1) — 等价 var(--brand-10) */
  background: var(--brand-10);
  /* #0A59F7 — 等价 var(--primary) */
  color: var(--primary);
  font: var(--font-caption-lg);
}

.cs-user-text {
  font: var(--font-body-md);
  line-height: var(--line-height-relaxed);
  white-space: pre-wrap;
  word-break: break-word;
}

/* ---- Agent 消息 ---- */
.cs-agent {
  display: flex;
  align-items: flex-start;
  gap: 0.375rem;
  min-width: 0;
}

.cs-agent-avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  font-size: 0.75rem;
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
}

.cs-agent-img {
  display: block;
  width: 2.375rem;
  height: 2.375rem;
  object-fit: cover;
}

.cs-agent-main {
  flex: 1 1 auto;
  min-width: 0;
}

.cs-agent-head {
  display: flex;
  align-items: center;
  height: 2.5rem;
  margin-bottom: 12px;
  font-size: 0.75rem;
  /* #000 @ 60% — 等价 var(--text-secondary)，暗色模式自动翻转 */
  color: var(--text-secondary);
  /* #000 @ 20% — 等价 var(--divider)，暗色模式自动翻转 */
  border-bottom: 1px solid var(--divider);
}

.cs-head-sep {
  margin: 0 0.5rem;
}

.cs-head-status,
.cs-head-tokens {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

/* 状态栏分隔图标：跟随文字颜色(currentColor)，垂直居中，左间距 0.25rem */
.cs-head-toggle {
  align-self: center;
  margin-left: 0.25rem;
  flex: 0 0 auto;
}

/* ---- 操作授权弹框（悬于输入框上方，流式生成中途挂起等待用户授权） ---- */
.cs-perm-pop {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 10px;
  padding: 1rem;
  border-radius: var(--radius-overlay);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-popover);
}

.cs-perm-pop-title {
  font: var(--font-subtitle-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.cs-perm-pop-desc {
  font: var(--font-body-md);
  color: var(--text-secondary);
  line-height: var(--line-height-relaxed);
  margin: 0;
}

.cs-perm-pop-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 4px;
}

/* 拒绝：幽灵按钮（#000 @ 5% 背景，圆角 1.5rem，min-width 9rem，高 2.5rem，字号 1rem，#000 文本） */
.cs-perm-pop-deny {
  min-width: 9rem;
  height: 2.5rem;
  padding: 0 20px;
  border: 0;
  border-radius: 1.5rem;
  box-sizing: border-box;
  /* #000 @ 0.05 — 等价 var(--surface-container)，暗色模式自动翻转 */
  background: var(--surface-container);
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
  font-size: 1rem;
  cursor: pointer;
}

.cs-perm-pop-deny:hover {
  background: var(--color-interactive-hover);
}

/* 允许：下拉选择框（黑底白字，圆角 1.5rem，高 2.5rem，字号 1rem） */
.cs-perm-pop-allow {
  position: relative;
}

.cs-perm-pop-allow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 9.5rem;
  height: 2.5rem;
  padding: 0 20px;
  border: 0;
  border-radius: 1.5rem;
  /* 用户指定 #000 / #fff */
  background: var(--black);
  color: var(--white);
  font-size: 1rem;
  cursor: pointer;
  transition: opacity var(--duration-fast) var(--ease-standard);
}

.cs-perm-pop-allow-btn:hover {
  opacity: 0.85;
}

/* 实心白色倒三角（triangle 旋转 180° 并填充，无动画） */
.cs-perm-pop-caret {
  transform: rotate(180deg);
  /* #fff — 等价 var(--white) */
  color: var(--white);
  fill: currentColor;
}

.cs-perm-pop-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 100%;
  padding: 6px;
  border-radius: var(--radius-lg);
  box-sizing: border-box;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-popover);
  z-index: 100;
}

.cs-perm-pop-opt {
  display: block;
  width: 100%;
  padding: 9px 14px;
  border: 0;
  border-radius: var(--radius-sm);
  box-sizing: border-box;
  background: transparent;
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
  font-size: 1rem;
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cs-perm-pop-opt:hover {
  background: var(--color-interactive-hover);
}

/* 已处理的授权结果行（紧凑态） */
.cs-perm-done {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  margin: 4px 0 12px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  background: var(--surface-container-low);
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.cs-perm-done svg {
  color: var(--success);
}

.cs-perm-done.is-rejected svg {
  color: var(--alert);
}

/* ---- 回答正文 ---- */
.cs-answer {
  margin-top: 12px;
}

.cs-answer-p {
  font: var(--font-body-md);
  color: var(--on-surface);
  line-height: var(--line-height-relaxed);
  margin: 0 0 0.75rem;
  word-break: break-word;
}

.cs-answer-muted {
  color: var(--text-placeholder);
}

/* 开场段落节点：下间距 0.75rem */
.cs-node-intro {
  margin: 0 0 0.75rem;
}

/* 已探索状态节点：下间距 0.75rem */
.cs-node-explore {
  margin-bottom: 0.75rem;
}

/* ---- 生成失败 · 任务中断提示 ---- */
.cs-fail {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  box-sizing: border-box;
  border-radius: 1rem;
  background: var(--white);
  /* #E5E5EA — 等价 var(--surface-container-high) */
  border: 1px solid var(--surface-container-high);
}

.cs-fail-main {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font: var(--font-body-md);
  color: var(--error);
}

.cs-fail-main svg {
  flex: 0 0 auto;
}

.cs-fail-retry {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 5px 14px;
  box-sizing: border-box;
  border-radius: 0.5rem;
  background: var(--white);
  /* #000 @ 10% — 等价 var(--container-10) */
  border: 1px solid var(--container-10);
  color: var(--text-secondary);
  font: var(--font-body-sm);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-fail-retry:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

.cs-answer-li {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font: var(--font-body-md);
  color: var(--on-surface);
  line-height: var(--line-height-relaxed);
  margin: 0 0 8px;
  word-break: break-word;
}

.cs-answer-dot {
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  margin-top: 8px;
  border-radius: 50%;
  background: var(--primary);
}

/* 图标状态行（已探索文件 / 思考中 等） */
.cs-stat {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 10px;
  font: var(--font-body-sm);
  color: var(--text-secondary);
}

.cs-stat svg {
  flex: 0 0 auto;
  color: var(--text-placeholder);
}

/* 径向渐变文字（「正在读取文档」/ 生成冲刺文案）：中心白 78% 透明度 → 边缘黑 50% 透明度（用户指定） */

.cs-file-caret {

  options = [],
  variant = "text",
  shape = "round",
  size = "large",
  block = false,
  value,
  defaultValue,
  disabled = false,
  onChange,
  onSegmentClick,
  id,
  style,
  className = "",
}) {
  const resolvedSegments = options.map(option =>
    typeof option === "string" || typeof option === "number"
      ? { value: option, label: option }
      : option
  );
  const [internalActive, setInternalActive] = useState(defaultValue);
  const [hoveredKey, setHoveredKey] = useState(null);
  const [pressedKey, setPressedKey] = useState(null);
  const active = value !== undefined ? value : internalActive ?? resolvedSegments[0]?.value;
  const handleClick = (seg, idx) => {
    if (disabled || seg.disabled) return;
    if (value === undefined) setInternalActive(seg.value);
    if (seg.value !== active) onChange?.(seg.value);
    onSegmentClick?.(seg.value, idx);
  };
  const resolvedHeight = variant === "icon" ? 32 : size === "medium" ? 36 : 44;
  const rootClass = ["sb-root", `sb-height-${resolvedHeight}`, `sb-shape-${shape}`,
    variant === "icon" ? "sb-icon-only" : "", disabled ? "sb-disabled" : "", className
  ].filter(Boolean).join(" ");

  return (
    <div id={id} className={rootClass} role="group" aria-label="Segmented" style={{ ...(block ? { width: "100%" } : {}), ...style }}>
      {resolvedSegments.map((seg, idx) => {
        const key = seg.value;
        const isActive = key === active;
        const isHovered = hoveredKey === key;
        const isPressed = pressedKey === key;
        const isDisabled = disabled || seg.disabled;

        const classes = [
          "sb-segment",
          seg.icon ? "sb-has-icon" : "",
          isActive ? "sb-active" : "",
          isHovered ? "sb-hover" : "",
          isPressed ? "sb-pressed" : "",
        ]
          .filter(Boolean)
          .join(" ");

        return (
          <button
            key={key}
            type="button"
            className={classes}
            disabled={isDisabled}
            aria-pressed={isActive}
            aria-label={variant === "icon" ? (seg.ariaLabel ?? (typeof seg.label === "string" || typeof seg.label === "number" ? String(seg.label) : undefined) ?? `选项 ${idx + 1}`) : undefined}
            onClick={() => handleClick(seg, idx)}
            onMouseEnter={() => setHoveredKey(key)}
            onMouseLeave={() => {
              setHoveredKey(null);
              setPressedKey(null);
            }}
            onMouseDown={() => setPressedKey(key)}
            onMouseUp={() => setPressedKey(null)}
          >
            {seg.icon ? (
              typeof seg.icon === "string" ? (
                <Icon
                  name={seg.icon}
                  size={variant === "icon" ? 14 : 16}
                  className="sb-icon"
                  color="currentColor"
                />
              ) : (
                <span className="sb-icon" aria-hidden="true">
                  {seg.icon}
                </span>
              )
            ) : null}
            {(variant !== "icon" || !seg.icon) && seg.label != null ? <span className="sb-label">{seg.label}</span> : null}
          </button>
        );
      })}
    </div>
  );
}
  Object.assign(__export, { Segmented });
})();

(function () {
  const { useState, useRef, useEffect } = React;
const DEFAULT_ICON = "./assets/uploads/icon/sidebar/new-chat.svg";
const MORE_ICON = "./assets/uploads/icon/sidebar/more.svg";
const COLLAPSED_ICON = "./assets/uploads/icon/function/arrow-right.svg";
const EXPANDED_ICON = "./assets/uploads/icon/function/arrow-down.svg";

function MenuIcon({ src, className = "" }) {
  return <span className={`mi-icon ${className}`} aria-hidden="true" style={{
    WebkitMaskImage: `url("${src}")`, maskImage: `url("${src}")`,
  }} />;
}

function MenuLabel({ name, onDoubleClick }) {
  const viewport = useRef(null);
  const content = useRef(null);
  const [metrics, setMetrics] = useState({ overflow: false, distance: 0 });
  useEffect(() => {
    const box = viewport.current;
    const text = content.current;
    if (!box || !text) return;
    let disposed = false;
    const measure = () => {
      if (disposed) return;
      const width = text.getBoundingClientRect().width;
      const overflow = width > box.clientWidth + 1;
      const distance = width + 32;
      setMetrics(previous => previous.overflow === overflow && previous.distance === distance ? previous : { overflow, distance });
    };
    const observer = new ResizeObserver(measure);
    observer.observe(box);
    observer.observe(text);
    measure();
    document.fonts?.ready.then(measure);
    return () => { disposed = true; observer.disconnect(); };
  }, [name]);
  return <span ref={viewport} className={`mi-label${metrics.overflow ? " mi-label-overflow" : ""}`} onDoubleClick={onDoubleClick}
    style={{ "--mi-scroll-distance": `${-metrics.distance}px`, "--mi-scroll-duration": `${Math.max(6, metrics.distance / 35)}s` }}>
    <span className="mi-label-track"><span ref={content} className="mi-label-copy">{name}</span>{metrics.overflow && <span className="mi-label-copy" aria-hidden="true">{name}</span>}</span>
  </span>;
}

function MenuItem({
  id,
  className = "",
  style,
  items = [],
  size = "large",
  variant = "default",
  level = "level-1",
  dropdownIcon = true,
  leadingIcon = true,
  trailingIcon = false,
  renameable = false,
  onRename,
  defaultExpanded = false,
  onSelect,
  onToggle,
  onTrailingAction,
}) {
  return <div id={id} className={["mi-menu", `mi-menu-${size}`, `mi-menu-${variant}`, className].filter(Boolean).join(" ")} style={style} role="list">
    {items.map(item => <MenuRow key={item.id} item={item} level={level} dropdownIcon={dropdownIcon} leadingIcon={leadingIcon} trailingIcon={trailingIcon}
      renameable={renameable} onRename={onRename} defaultExpanded={defaultExpanded} onSelect={onSelect} onToggle={onToggle} onTrailingAction={onTrailingAction} />)}
  </div>;
}

function MenuRow({ initialEditing = false, inputAutoFocus = true, renameable, onRename, item, level, dropdownIcon, leadingIcon, trailingIcon, defaultExpanded, onSelect, onToggle, onTrailingAction }) {
  const [internalExpanded, setInternalExpanded] = useState(defaultExpanded);
  const [editing, setEditing] = useState(initialEditing);
  const [draft, setDraft] = useState("");
  const [renamed, setRenamed] = useState(null);
  const editingRef = useRef(initialEditing);
  const clickTimer = useRef(null);
  useEffect(() => () => clearTimeout(clickTimer.current), []);
  const name = renamed?.source === item.label ? renamed.value : item.label;
  const currentItem = { ...item, label: name };
  const expanded = item.expanded ?? internalExpanded;
  function beginRename(event) {
    if (!renameable) return;
    event.preventDefault();
    event.stopPropagation();
    clearTimeout(clickTimer.current);
    editingRef.current = true;
    setDraft("");
    setEditing(true);
  }
  function finishRename() {
    if (initialEditing) return; // Keep the documentation specimen in editing mode.
    if (!editingRef.current) return;
    editingRef.current = false;
    setEditing(false);
    if (!draft.trim() || draft === name) return;
    setRenamed({ source: item.label, value: draft });
    onRename?.(currentItem, draft);
  }
  function selectContent(event) {
    event.stopPropagation();
    const activate = () => { if (rowExpands) toggle(); else onSelect?.(currentItem); };
    // Defer only name clicks so a double click never also expands/selects the row.
    if (renameable && event.target.closest(".mi-label") && event.detail > 0) {
      clearTimeout(clickTimer.current);
      if (event.detail === 1) clickTimer.current = setTimeout(activate, 300);
    } else activate();
  }
  const rowExpands = level === "level-1" && dropdownIcon;
  function toggle() {
    const next = !expanded;
    if (item.expanded === undefined) setInternalExpanded(next);
    onToggle?.({ ...currentItem, expanded: next });
  }
  return <div className={`mi-row${rowExpands ? " mi-row-expandable" : ""}${editing ? " mi-row-editing" : ""}`} role="listitem" onClick={rowExpands && !editing ? toggle : undefined}>
    {level === "level-2" && <span className="mi-disclosure-space" aria-hidden="true" />}
    {dropdownIcon && <button type="button" className="mi-disclosure" aria-label={expanded ? "收起" : "展开"} aria-expanded={expanded} onClick={event => { event.stopPropagation(); toggle(); }}>
      <MenuIcon src={expanded ? EXPANDED_ICON : COLLAPSED_ICON} />
    </button>}
    {editing ? <>
      {leadingIcon && <MenuIcon src={item.iconSrc || DEFAULT_ICON} className="mi-leading-icon" />}
      <input className="mi-rename-input" aria-label="重命名" autoFocus={inputAutoFocus} value={draft}
        onChange={event => setDraft(event.target.value)} onBlur={finishRename}
        onClick={event => event.stopPropagation()} onDoubleClick={event => event.stopPropagation()}
        onKeyDown={event => {
          event.stopPropagation();
          if (event.key === "Enter" && !event.nativeEvent.isComposing && event.keyCode !== 229) {
            event.preventDefault();
            finishRename();
          }
        }} />
    </> : <>
      <button type="button" className="mi-main" aria-expanded={rowExpands ? expanded : undefined} onClick={selectContent}>
        {leadingIcon && <MenuIcon src={item.iconSrc || DEFAULT_ICON} className="mi-leading-icon" />}
        <MenuLabel name={name} onDoubleClick={beginRename} />
      </button>
      {trailingIcon && <span className="mi-trailing-region"><button type="button" className="mi-trailing-action" aria-label="更多" onClick={event => { event.stopPropagation(); onTrailingAction?.(currentItem); }}>{item.trailingIcon || <MenuIcon src={MORE_ICON} />}</button></span>}
      {item.statusDot && <span className="mi-status-dot" aria-hidden="true" />}
    </>}

  </div>;
}
  Object.assign(__export, { MenuItem, MenuRow });
})();

/* 自适应方向：默认向下弹出；底部空间不足时翻转到按钮上方（渲染前测量，无闪烁） */
function DropMenu({ options, selectedId, onPick }) {
  const ref = useRef(null);
  const [up, setUp] = useState(false);

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (rect.bottom > window.innerHeight - 8) setUp(true);
  }, []);

  return (
    <div ref={ref} className={"cc-menu" + (up ? " cc-menu--up" : "")}>
      {options.map((o) => {
        const isSel = o.id === selectedId;
        return (
          <button
            type="button"
            key={o.id}
            className={"cc-menu-item" + (isSel ? " is-selected" : "")}
            onClick={() => onPick(o)}
          >
            {o.icon || o.src ? (
              <Icon name={o.icon} src={o.src} size={16} className="cc-mitem-icon" />
            ) : null}
            <span className="cc-mitem-main">
              <span className="cc-mitem-label">{o.label}</span>
              {o.desc ? <span className="cc-mitem-desc">{o.desc}</span> : null}
            </span>
            {/* 对号独立占位，每行统一靠右 */}
            <span className="cc-menu-check">
              {isSel ? <Icon name="check" size={14} /> : null}
            </span>
          </button>
        );
      })}
    </div>
  );
}

  const [runtime, setRuntime] = useState(RUNTIMES[0]);

  const [msg, setMsg] = useState(initialMessage);
  const [open, setOpen] = useState(null); // 当前展开的下拉：mode / permission / model / space / attach
  const [sent, setSent] = useState(false);

  const [toast, setToast] = useState("");
  // 加号(+)下拉：一级 hover 时向右侧弹出二级
  const [hoverAdd, setHoverAdd] = useState(null); // 当前悬停的一级 key
  const [attachSecQuery, setAttachSecQuery] = useState("");

  const [connOn, setConnOn] = useState({});

  // 有内容(已传文件/指令胶囊/文字)即可发送,并驱动发送按钮激活态图标
  const canSend = files.length > 0 || cmdChips.length > 0 || msg.trim().length > 0;

  // 文件卡片行数(每行4个)驱动输入卡片高度:0文件=140 / 1行=210 / 2行及以上=280(超出滚动)
  const fileCardHeight = files.length === 0 ? 140 : Math.ceil(files.length / 4) === 1 ? 210 : 280;

  // 点击组件外部任意位置时关闭下拉
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => {
      if (!e.target.closest("[data-drop]")) setOpen(null);
    };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [open]);

  // 点击 “/”指令菜单外（且不在输入区）时关闭
  useEffect(() => {

    if (!toast) return;
    const t = window.setTimeout(() => setToast(""), 4000);
    return () => window.clearTimeout(t);
  }, [toast]);

  const toggle = (key) => setOpen(open === key ? null : key);

  const send = () => {
    if (!canSend || sent) return;

    const room = MAX_UPLOAD_FILES - files.length;

    // 100MB 上限:超大的文件进入卡片但标记为上传失败
    let firstOversized = null;
    const additions = accepted.map((f, i) => {
      const failed = f.size > MAX_UPLOAD_SIZE;

    if (overflowCount > 0) {
