/* 任务摘要页签：空白内容区 */
.cs-preview-blank {
  display: flex;
  align-items: center;
  justify-content: center;
}

.cs-preview-blank-inner {
  display: flex;
  align-items: center;
  justify-content: center;
}

.cs-preview-blank-text {
  font: var(--font-body-md);
  color: var(--text-placeholder);
  margin: 0;
}

/* 文件页签激活态 */
.cs-preview-filetab.is-active {
  border-color: var(--primary);
  color: var(--primary);
}

/* ================= 动画 ================= */
@keyframes cs-rotate {
  to {
    transform: rotate(360deg);
  }
}

@keyframes cs-blink {
  50% {
    opacity: 0;
  }
}

@keyframes cs-fade-in {
  from {
    opacity: 0;
    transform: translateY(2px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 960px) {
  .cs-list {
    padding: 20px 16px;
  }

  .cs-composer {
    padding: 4px 16px 12px;
  }

  .cs-user-wrap {
    max-width: 92%;
  }

  .cs-preview {
    flex: 1 1 auto;
    flex-basis: 100%;
    border-left: 0;
    border-top: 1px solid var(--divider);
  }
}

/* ==== views/SwarmPanel/index.css ==== */
/* ===================== SwarmPanel 蜂群任务面板(固宽650) ===================== */

.sp-panel {
  display: flex;
  flex: 0 0 650px;
  width: 650px;
  flex-direction: column;
  min-height: 0;
  box-sizing: border-box;
  background-color: var(--surface-container-lowest);
  border-left: 1px solid var(--divider);
}

/* 群聊辩论页签:面板加宽到 890 */
.sp-panel--wide {
  flex: 0 0 890px;
  width: 890px;
}

/* ---- 标题栏 ---- */
.sp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid #e4e4e5;
}

.sp-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
}

.sp-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border: none;
  border-radius: var(--radius-full);
  background-color: transparent;
  color: var(--text-secondary);
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

.sp-tab:hover {
  background-color: var(--color-interactive-hover);
  color: var(--on-surface);
}

/* 选中态:非胶囊,圆角 8 + 浅灰底 #f1f3f5,文字 #000 90% */
.sp-tab.is-active {
  background-color: #f1f3f5;
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font-weight: var(--font-weight-bold);
}

.sp-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.sp-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-icon-secondary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

.sp-action:hover {
  background-color: var(--color-interactive-hover);
  color: var(--color-icon-primary);
}

/* 展开图标选中态:与左侧选项卡同款(圆角8 + #f1f3f5) */
.sp-action.is-active {
  background-color: #f1f3f5;
  border-radius: var(--radius-container);
  color: var(--primary);
}

/* ---- 主内容区 ---- */
.sp-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 16px;
}

/* 进展标题:16px 加粗,三角图标紧随文字右侧(间距4) */
.sp-section-head {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 4px 2px 10px;
  border: none;
  background-color: transparent;
  color: var(--on-surface);
  font: var(--font-subtitle-md);
  font-weight: var(--font-weight-bold);
  cursor: pointer;
}

/* ---- 浅灰信息栏 ---- */
.sp-info {
  padding: 12px 14px;
  border-radius: var(--radius-container);
  background-color: var(--surface-container-low);
}

.sp-info-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}

.sp-info-title {
  color: var(--on-surface);
  font: var(--font-body-md);
  font-weight: var(--font-weight-bold);
}

.sp-info-stats {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-secondary);
  font: var(--font-caption-lg);
}

.sp-stat b {
  margin-left: 2px;
  color: var(--on-surface);
  font-weight: var(--font-weight-bold);
}

/* 进度区:顶部为小鸟预留空间,小鸟正好位于信息头(sp-info-head)下方 */
.sp-progress {
  position: relative;
  padding-top: 62px;
}

.sp-progress-track {
  height: 6px;
  overflow: hidden;
  border-radius: var(--radius-full);
  background-color: var(--surface-container-highest);
}

/* 进度填充:蓝色渐变(50% 透明度 → 实色) + 淡白斜纹;
   宽度由左侧流式进度驱动,0.4s 线性过渡平滑衔接 */
.sp-progress-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background-image:
    repeating-linear-gradient(
      45deg,
      rgba(255, 255, 255, 0.2) 0,
      rgba(255, 255, 255, 0.2) 3px,
      transparent 3px,
      transparent 8px
    ),
    linear-gradient(to right, rgba(10, 89, 247, 0.5), #0a59f7);
  transition: width 0.4s linear;
}

/* 完成态:绿色渐变(#64bb5c 50% → #64bb5c),斜纹保持 */
.sp-progress-fill--done {
  background-image:
    repeating-linear-gradient(
      45deg,
      rgba(255, 255, 255, 0.2) 0,
      rgba(255, 255, 255, 0.2) 3px,
      transparent 3px,
      transparent 8px
    ),
    linear-gradient(to right, rgba(100, 187, 92, 0.5), #64bb5c);
}

/* 进度小鸟:宽 108(高度自适应),前缘与激活进度条的边缘对齐(整体骑在填充段上) */
.sp-progress-bird {
  position: absolute;
  top: 0;
  width: 108px;
  margin-left: -95px;
  pointer-events: none;
  transition: left 0.4s linear;
}

/* 完成态小鸟:换图后尺寸与锚点调整(悬于进度末端) */
.sp-progress-bird--done {
  top: -7px;
  width: 72px;
  margin-left: -72px;
}

/* ---- 任务列表(进度图下方,8 项,可展开) ---- */
.sp-tasks {
  display: flex;
  flex-direction: column;
  margin-top: 14px;
}

.sp-task-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 6px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.sp-task-head:hover {
  background-color: var(--color-interactive-hover);
}

/* 状态图标:step-loading 持续旋转,step-done 静止 */
.sp-task-loading {
  flex: 0 0 auto;
  animation: sp-agent-spin 1s linear infinite;
}

.sp-task-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  color: var(--on-surface);
  font: var(--font-body-md);
  font-weight: var(--font-weight-bold);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 向下箭头:展开时旋转 180° */
.sp-task-chev {
  flex: 0 0 auto;
  color: var(--color-icon-tertiary);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.sp-task.is-open .sp-task-chev {
  transform: rotate(180deg);
}

/* 展开详情:圆角边框,左小鸟 + 右上下两行文本 */
.sp-task-detail {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 6px 10px;
  padding: 10px 12px;
  border: 1px solid #e5e5ea;
  border-radius: 12px;
  background-color: var(--surface-container-lowest);
}

.sp-task-bird {
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
}

.sp-task-lines {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sp-task-line1 {
  color: var(--on-surface);
  font: var(--font-body-sm);
  font-weight: var(--font-weight-medium);
}

.sp-task-line2 {
  color: var(--text-secondary);
  font: var(--font-caption-lg);
}

/* ---- 子智能体(距任务列表 32) ---- */
.sp-agents {
  margin-top: 32px;
}

.sp-agents-head {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 2px 16px;
}

/* 子智能体/群聊 切换按钮:选中态深色加粗,未选中浅灰 */
.sp-agents-switch {
  padding: 0;
  border: none;
  background-color: transparent;
  color: var(--text-placeholder);
  font: var(--font-subtitle-md);
  font-weight: var(--font-weight-regular);
  cursor: pointer;
  transition: color var(--duration-fast) var(--ease-standard);
}

.sp-agents-switch.is-active {
  color: var(--on-surface);
  font-weight: var(--font-weight-bold);
}

/* 群聊视图:浅灰圆角卡片,左两行文本 + 右小鸟;可点击(触发新增页签) */
.sp-groupchat {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 16px;
  border-radius: var(--radius-container);
  background-color: var(--surface-container-low);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.sp-groupchat:hover {
  background-color: var(--surface-container);
}

.sp-groupchat-text {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sp-groupchat-line1 {
  overflow: hidden;
  color: var(--on-surface);
  font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sp-groupchat-line2 {
  overflow: hidden;
  color: var(--text-secondary);
  font: var(--font-caption-lg);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sp-groupchat-bird {
  flex: 0 0 145px;
  width: 145px;
}

.sp-agents-list {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

/* 智能体胶囊:胶囊形状(全圆角)+ #d1d1d6 边框,左圆形头像 + 右两行文本,固宽 176 */
.sp-agent {
  display: flex;
  align-items: center;
  gap: 8px;
  box-sizing: border-box;
  width: 176px;
  padding: 10px;
  border: 1px solid #d1d1d6;
  border-radius: var(--radius-full);
  background-color: var(--surface-container-lowest);
}

.sp-agent-avatar {
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
}

.sp-agent-lines {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sp-agent-line1 {
  overflow: hidden;
  color: var(--on-surface);
  font: var(--font-body-sm);
  font-weight: var(--font-weight-medium);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sp-agent-line2 {
  overflow: hidden;
  color: var(--text-secondary);
  font: var(--font-caption-md);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* loading 状态图标:持续旋转 */
.sp-agent-loading {
  flex: 0 0 auto;
  animation: sp-agent-spin 1s linear infinite;
}

@keyframes sp-agent-spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---- 产物(距子智能体 32) ---- */
.sp-artifacts {
  margin-top: 32px;
}

.sp-artifacts-head {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 4px 2px 10px;
  border: none;
  background-color: transparent;
  color: var(--on-surface);
  font: var(--font-subtitle-md);
  font-weight: var(--font-weight-bold);
  cursor: pointer;
}

.sp-artifacts-list {
  display: flex;
  flex-direction: column;
}

/* 产物行:固高 40,图标 + 文件名 + 右侧进行中标注 */
.sp-artifact {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 6px;
  border-radius: var(--radius-sm);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.sp-artifact:hover {
  background-color: var(--color-interactive-hover);
}

.sp-artifact-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sp-artifact-status {
  flex: 0 0 auto;
  color: var(--text-placeholder);
  font: var(--font-caption-lg);
}

/* ---- 群聊辩论视图 ---- */
/* 胶囊搜索框:浅灰底 */
.sp-chat-search {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  box-sizing: border-box;
  padding: 0 14px;
  margin-bottom: 14px;
  border-radius: var(--radius-full);
  background-color: var(--surface-container-low);
  color: var(--color-icon-secondary);
}

.sp-chat-search-input {
  flex: 1 1 auto;
  min-width: 0;
  border: none;
  outline: none;
  background-color: transparent;
  color: var(--on-surface);
  font: var(--font-body-md);
}

.sp-chat-search-input::placeholder {
  color: var(--text-placeholder);
}

.sp-chat-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 消息头:左头像 + 标题 + 浅灰时间 */
.sp-chat-item-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.sp-chat-item-avatar {
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
}

.sp-chat-item-role {
  color: var(--on-surface);
  font: var(--font-body-md);
  font-weight: var(--font-weight-bold);
}

.sp-chat-item-time {
  margin-left: 4px;
  color: var(--text-placeholder);
  font: var(--font-caption-md);
}

/* 消息正文:与标题文字对齐(缩进=头像32+间距8),#f1f3f5 95% 背景,
   上下内边距保留,左上角无圆角,其余三角 16px */
.sp-chat-item-body {
  margin-left: 40px;
  padding: 12px 14px;
  background-color: rgba(241, 243, 245, 0.95);
  border-radius: 0 16px 16px 16px;
}

/* @提及 文本:蓝色,与后面内容间距 4px */
.sp-chat-mention {
  margin-right: 4px;
  color: var(--primary);
}

/* 段落之间不设间距(内容连排) */
.sp-chat-item-p {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-body-sm);
  line-height: 1.7;
}

/* 靠右的用户消息:头部镜像(头像最右),正文按内容自适应宽度并靠右,
   右侧缩进对齐标题文字,右上角无圆角 */
.sp-chat-item--right .sp-chat-item-head {
  flex-direction: row-reverse;
}

.sp-chat-item--right .sp-chat-item-time {
  margin-left: 0;
  margin-right: 4px;
}

.sp-chat-item--right .sp-chat-item-body {
  box-sizing: border-box;
  width: fit-content;
  max-width: calc(100% - 40px);
  margin-left: auto;
  margin-right: 40px;
  border-radius: 16px 0 16px 16px;
}

/* ==== views/ChatSession/index.css ==== */
/* ================= 会话页面骨架 ================= */
.cs-wrap {
  display: flex;
  flex-direction: row;
  width: 100%;
  min-width: 0;
  height: 100%;
}

/* 左侧主区：顶栏 + 消息流 + 输入区（与右侧预览面板等宽） */
.cs-main {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
}

/* ---- 顶栏 ---- */
.cs-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex: 0 0 auto;
  padding: 1.125rem 1.5rem;
  font-size: 1rem;
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
}

.cs-header-main {
  min-width: 0;
}

.cs-title {
  font-size: 1rem;
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 顶栏右侧图标（纯图片展示） */
.cs-new {
  display: block;
  flex: 0 0 auto;
  width: 1rem;
  height: 1rem;
}

/* ---- 消息流 ---- */
.cs-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 28px 40px 20px;
}

.cs-inner {
  display: flex;
  flex-direction: column;
  gap: 28px;
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
}

/* ---- 用户消息 ---- */
.cs-user-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  max-width: 78%;
  margin-left: auto;
}

.cs-user-attach {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}

.cs-user-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--primary);
  font: var(--font-caption-lg);
}

.cs-user-bubble {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  border-radius: 1rem;
  /* #f1f3f5 — 等价 var(--color-background-secondary)，暗色模式自动翻转 */
  background: var(--color-background-secondary);
  color: var(--on-surface);
}

/* 气泡内标签：图标 + 文档总结 */
.cs-user-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
  height: 1.5rem;
  padding: 0 0.5rem;
  box-sizing: border-box;
  border-radius: 1rem;
  /* rgba(10,89,247,0.1) — 等价 var(--brand-10) */
  background: var(--brand-10);
  /* #0A59F7 — 等价 var(--primary) */
  color: var(--primary);
  font: var(--font-caption-lg);
}

.cs-user-text {
  font: var(--font-body-md);
  line-height: var(--line-height-relaxed);
  white-space: pre-wrap;
  word-break: break-word;
}

/* ---- Agent 消息 ---- */
.cs-agent {
  display: flex;
  align-items: flex-start;
  gap: 0.375rem;
  min-width: 0;
}

.cs-agent-avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  font-size: 0.75rem;
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
}

.cs-agent-img {
  display: block;
  width: 2.375rem;
  height: 2.375rem;
  object-fit: cover;
}

.cs-agent-main {
  flex: 1 1 auto;
  min-width: 0;
}

.cs-agent-head {
  display: flex;
  align-items: center;
  height: 2.5rem;
  margin-bottom: 12px;
  font-size: 0.75rem;
  /* #000 @ 60% — 等价 var(--text-secondary)，暗色模式自动翻转 */
  color: var(--text-secondary);
  /* #000 @ 20% — 等价 var(--divider)，暗色模式自动翻转 */
  border-bottom: 1px solid var(--divider);
}

.cs-head-sep {
  margin: 0 0.5rem;
}

.cs-head-status,
.cs-head-tokens {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

/* 状态栏分隔图标：跟随文字颜色(currentColor)，垂直居中，左间距 0.25rem */
.cs-head-toggle {
  align-self: center;
  margin-left: 0.25rem;
  flex: 0 0 auto;
}

/* ---- 蜂群配置表单弹框（悬于输入框上方，上下布局） ---- */
.cs-form-pop {
  display: flex;
  flex-direction: column;
  margin-bottom: 0.25rem;
  border-radius: 1rem;
  background: var(--white);
  box-shadow: var(--shadow-popover);
  overflow: hidden;
}

/* 上部：表单内容（分页显示，关闭按钮固定右上角不随翻页移动） */
.cs-form-body {
  position: relative;
  padding: 1rem 1rem 0.875rem;
  border-bottom: 1px solid var(--divider);
}

/* 右上角关闭按钮 */
.cs-form-close {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-placeholder);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-form-close:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

/* 表单内容右侧留出关闭按钮空间 */
.cs-form-page {
  padding-right: 2rem;
}

.cs-form-title {
  font: var(--font-body-md);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 12px;
  line-height: var(--line-height-relaxed);
}

.cs-form-options {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-bottom: 4px;
}

.cs-form-radio {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font: var(--font-body-md);
  color: var(--on-surface);
}

/* 自定义单选圆圈：选中时蓝底 + 白色对勾 */
.cs-radio-circle {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--container-10);
  background: transparent;
  transition: background-color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard);
}

.cs-form-radio.is-checked .cs-radio-circle {
  /* #0A59F7 — 品牌蓝 */
  background: var(--primary);
  border-color: var(--primary);
}

.cs-radio-check {
  color: var(--white);
}

/* 下部：翻页器 + 操作按钮 */
.cs-form-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem;
}

.cs-form-pager {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cs-form-pager-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--surface-container);
  color: var(--text-secondary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-form-pager-btn:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

.cs-form-pager-text {
  font: var(--font-body-sm);
  color: var(--text-secondary);
  white-space: nowrap;
}

.cs-form-btns {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cs-form-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 9rem;
  height: 2.5rem;
  padding: 0;
  border: 0;
  border-radius: var(--radius-full);
  box-sizing: border-box;
  font-size: 1rem;
  /* #000 — 等价 var(--on-surface) */
  color: var(--on-surface);
  /* rgba(0,0,0,0.05) — 等价 var(--surface-container) */
  background: var(--surface-container);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cs-form-btn:hover {
  background: var(--color-interactive-hover);
}

.cs-form-btn.is-primary {
  /* rgba(0,0,0,0.9) — #000 @ 90% */
  background: rgba(0, 0, 0, 0.9);
  color: var(--white);
}

.cs-form-btn.is-primary:hover {
  background: var(--black);
}
.cs-perm-pop {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 10px;
  padding: 1rem;
  border-radius: var(--radius-overlay);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-popover);
}

.cs-perm-pop-title {
  font: var(--font-subtitle-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.cs-perm-pop-desc {
  font: var(--font-body-md);
  color: var(--text-secondary);
  line-height: var(--line-height-relaxed);
  margin: 0;
}

.cs-perm-pop-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 4px;
}

/* 拒绝：幽灵按钮（#000 @ 5% 背景，圆角 1.5rem，min-width 9rem，高 2.5rem，字号 1rem，#000 文本） */
.cs-perm-pop-deny {
  min-width: 9rem;
  height: 2.5rem;
  padding: 0 20px;
  border: 0;
  border-radius: 1.5rem;
  box-sizing: border-box;
  /* #000 @ 0.05 — 等价 var(--surface-container)，暗色模式自动翻转 */
  background: var(--surface-container);
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
  font-size: 1rem;
  cursor: pointer;
}

.cs-perm-pop-deny:hover {
  background: var(--color-interactive-hover);
}

/* 允许：下拉选择框（黑底白字，圆角 1.5rem，高 2.5rem，字号 1rem） */
.cs-perm-pop-allow {
  position: relative;
}

.cs-perm-pop-allow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 9.5rem;
  height: 2.5rem;
  padding: 0 20px;
  border: 0;
  border-radius: 1.5rem;
  /* 用户指定 #000 / #fff */
  background: var(--black);
  color: var(--white);
  font-size: 1rem;
  cursor: pointer;
  transition: opacity var(--duration-fast) var(--ease-standard);
}

.cs-perm-pop-allow-btn:hover {
  opacity: 0.85;
}

/* 实心白色倒三角（triangle 旋转 180° 并填充，无动画） */
.cs-perm-pop-caret {
  transform: rotate(180deg);
  /* #fff — 等价 var(--white) */
  color: var(--white);
  fill: currentColor;
}

.cs-perm-pop-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 100%;
  padding: 6px;
  border-radius: var(--radius-lg);
  box-sizing: border-box;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-popover);
  z-index: 100;
}

.cs-perm-pop-opt {
  display: block;
  width: 100%;
  padding: 9px 14px;
  border: 0;
  border-radius: var(--radius-sm);
  box-sizing: border-box;
  background: transparent;
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
  font-size: 1rem;
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cs-perm-pop-opt:hover {
  background: var(--color-interactive-hover);
}

/* 已处理的授权结果行（紧凑态） */
.cs-perm-done {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  margin: 4px 0 12px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  background: var(--surface-container-low);
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.cs-perm-done svg {
  color: var(--success);
}

.cs-perm-done.is-rejected svg {
  color: var(--alert);
}

/* ---- 回答正文 ---- */
.cs-answer {
  margin-top: 12px;
}

.cs-answer-p {
  font: var(--font-body-md);
  color: var(--on-surface);
  line-height: var(--line-height-relaxed);
  margin: 0 0 0.75rem;
  word-break: break-word;
}

.cs-answer-muted {
  color: var(--text-placeholder);
}

/* 开场段落节点：下间距 0.75rem */
.cs-node-intro {
  margin: 0 0 0.75rem;
}

/* 已探索状态节点：下间距 0.75rem */
.cs-node-explore {
  margin-bottom: 0.75rem;
}

/* ---- 生成失败 · 任务中断提示 ---- */
.cs-fail {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  box-sizing: border-box;
  border-radius: 1rem;
  background: var(--white);
  /* #E5E5EA — 等价 var(--surface-container-high) */
  border: 1px solid var(--surface-container-high);
}

.cs-fail-main {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font: var(--font-body-md);
  color: var(--error);
}

.cs-fail-main svg {
  flex: 0 0 auto;
}

.cs-fail-retry {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 5px 14px;
  box-sizing: border-box;
  border-radius: 0.5rem;
  background: var(--white);
  /* #000 @ 10% — 等价 var(--container-10) */
  border: 1px solid var(--container-10);
  color: var(--text-secondary);
  font: var(--font-body-sm);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-fail-retry:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

.cs-answer-li {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font: var(--font-body-md);
  color: var(--on-surface);
  line-height: var(--line-height-relaxed);
  margin: 0 0 8px;
  word-break: break-word;
}

.cs-answer-dot {
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  margin-top: 8px;
  border-radius: 50%;
  background: var(--primary);
}

/* 图标状态行（已探索文件 / 思考中 等） */
.cs-stat {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 10px;
  font: var(--font-body-sm);
  color: var(--text-secondary);
}

.cs-stat svg {
  flex: 0 0 auto;
  color: var(--text-placeholder);
}

/* 径向渐变文字（「正在读取文档」/ 生成冲刺文案）：中心白 78% 透明度 → 边缘黑 50% 透明度（用户指定） */
.cs-stat-grad,
.cs-stat-linear {
  background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.78), rgba(0, 0, 0, 0.5));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* 读取文档面板：随「正在读取文档」逐条输出文档相关内容 */
.cs-read {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 8px 0 12px 21px;
  padding: 10px 14px;
  border-radius: var(--radius-container);
  background: var(--surface-container-low);
}

.cs-read-item {
  animation: cs-fade-in 0.25s var(--ease-out);
}

.cs-read-item:not(:last-child) {
  padding-bottom: 10px;
  border-bottom: 1px solid var(--divider);
}

.cs-read-line {
  display: flex;
  align-items: center;
  gap: 7px;
}

.cs-read-line svg {
  flex: 0 0 auto;
  color: var(--text-placeholder);
}

.cs-read-name {
  font: var(--font-body-sm);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
}

.cs-read-excerpt {
  font: var(--font-body-sm);
  color: var(--text-placeholder);
  line-height: var(--line-height-relaxed);
  margin: 3px 0 0 21px;
}

/* ---- 蜂群模式：问题澄清卡片 ---- */
.cs-qa-card {
  border: 1px solid var(--surface-container-high);
  border-radius: 1rem;
  padding: 0 1rem;
  background: var(--white);
  margin-bottom: 0.75rem;
}

.cs-qa-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--surface-container-high);
  font-size: 0.875rem;
  color: var(--text-placeholder);
}

.cs-qa-body {
  padding: 0.75rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.cs-qa-q {
  font-size: 0.875rem;
  color: var(--on-surface);
  margin: 0 0 0.75rem;
}

.cs-qa-a {
  font-size: 0.875rem;
  color: var(--text-placeholder);
  margin: 0;
}

/* ---- 技能调取 ---- */
.cs-skill {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 0.75rem;
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.cs-skill svg,
.cs-skill img {
  flex: 0 0 auto;
  color: var(--text-secondary);
}

/* ---- 任务卡片 ---- */
.cs-task-card {
  padding: 0 1rem;
  margin-bottom: 0.75rem;
  background: var(--white);
  border-radius: 1rem;
  /* #E5E5EA — 等价 var(--surface-container-high) */
  border: 1px solid var(--surface-container-high);
}

.cs-task-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--surface-container-high);
}

.cs-task-head svg {
  flex: 0 0 auto;
  color: var(--text-secondary);
}

.cs-task-team {
  font-size: 0.875rem;
  color: var(--on-surface);
  white-space: nowrap;
}

.cs-task-sep {
  color: var(--text-placeholder);
}

.cs-task-desc {
  font-size: 0.875rem;
  color: var(--text-placeholder);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cs-task-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 0.75rem 0;
}

.cs-task-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 1.75rem;
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.cs-task-text {
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 任务行右侧负责人（头像 + 名称，固定宽度使各行头像垂直对齐） */
.cs-task-assignee {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 8.5rem;
  padding-right: 0.5rem;
  color: var(--text-secondary);
  font-size: 0.75rem;
  white-space: nowrap;
}

.cs-task-assignee-avatar {
  display: block;
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  object-fit: cover;
}

/* ---- 专家/人员标签 ---- */
.cs-agent-tag-row {
  margin-bottom: 0.75rem;
}

.cs-agent-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 2.25rem;
  padding: 0 0.75rem 0 0.5rem;
  border-radius: 1.25rem;
  /* #E5E5EA — 等价 var(--surface-container-high) */
  border: 1px solid var(--surface-container-high);
}

.cs-agent-tag-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 1.75rem;
  height: 1.75rem;
  margin-top: -0.125rem;
  border-radius: 50%;
  overflow: hidden;
}

.cs-agent-tag-icon img {
  width: 100%;
  height: 100%;
}

.cs-agent-tag-name {
  font-size: 0.75rem;
  color: var(--text-secondary);
  white-space: nowrap;
}

.cs-agent-tag-check {
  flex: 0 0 auto;
  color: var(--success);
}

/* ---- 列表块（标题 + 黑点列表项） ---- */
.cs-list-block {
  margin-bottom: 0.75rem;
}

.cs-list-block-title {
  font-size: 1rem;
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 8px;
}

.cs-list-block-items {
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
  list-style: none;
}

.cs-list-block-item {
  position: relative;
  padding-left: 16px;
  font-size: 0.875rem;
  color: var(--on-surface);
  line-height: var(--line-height-relaxed);
}

.cs-list-block-item::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--black);
}

/* ---- 带链接的文本 ---- */
.cs-text-link {
  font-size: 0.875rem;
  color: var(--on-surface);
  margin: 0 0 0.75rem;
  line-height: var(--line-height-relaxed);
}

.cs-doc-link {
  color: var(--primary);
  text-decoration: none;
  cursor: pointer;
}

.cs-doc-link:hover {
  text-decoration: underline;
}

/* ---- 核心结论/流程容器 ---- */
.cs-conclusion {
  margin-bottom: 0.75rem;
}

.cs-conclusion-title {
  font-size: 1rem;
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 0.5rem;
}

.cs-conclusion-body {
  font-size: 0.875rem;
  color: var(--on-surface);
  line-height: var(--line-height-relaxed);
  margin: 0;
}

/* ---- 生成产物：文件内容预览（无背景色） ---- */
.cs-fc {
  margin: 4px 0 12px;
}

.cs-fc-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 0;
  font: var(--font-body-sm);
  /* #000 @ 0.9 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
}

.cs-fc-head svg {
  flex: 0 0 auto;
  color: var(--text-placeholder);
}

.cs-fc-body {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 0;
}

.cs-fc-line {
  font: var(--font-body-sm);
  color: var(--text-secondary);
  line-height: var(--line-height-relaxed);
  margin: 0;
  white-space: pre-wrap;
}

/* ---- 生成产物：产物汇总标题（无卡片背景，1rem，#000 @ 90%，不加粗） ---- */
.cs-sum-title {
  font-size: 1rem;
  color: var(--on-surface);
  margin: 4px 0 0.5rem;
}

/* ---- 生成产物：产物文件卡片（边框线替代阴影） ---- */
.cs-files {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cs-file {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 1rem;
  box-sizing: border-box;
  border-radius: 1rem;
  background: var(--surface-container-lowest);
  /* #E5E5EA — 等价 var(--surface-container-high) */
  border: 1px solid var(--surface-container-high);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cs-file:hover {
  /* rgba(0,0,0,0.05) — 等价 var(--surface-container) */
  background: var(--surface-container);
}

.cs-file-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 3rem;
  height: 3rem;
  border-radius: 0.75rem;
  /* #f1f3f5 — 等价 var(--color-background-secondary)，暗色模式自动翻转 */
  background: var(--color-background-secondary);
}

.cs-file-info {
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex: 1 1 auto;
  min-width: 0;
}

.cs-file-name {
  font: var(--font-body-md);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cs-file-meta {
  font: var(--font-caption-lg);
  color: var(--text-placeholder);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 打开方式下拉（触发按钮 + 面板） */
.cs-file-drop {
  position: relative;
  flex: 0 0 auto;
}

.cs-file-more {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 4px 10px;
  box-sizing: border-box;
  /* #E5E5EA — 等价 var(--surface-container-high) */
  border: 1px solid var(--surface-container-high);
  border-radius: 0.5rem;
  background: transparent;
  color: var(--text-secondary);
  font: var(--font-body-sm);
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-file-more:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

/* 实心黑色倒三角（triangle 旋转 180° 并填充；展开时回正朝上） */
.cs-file-caret {
  transform: rotate(180deg);
  /* #000 — 等价 var(--on-surface)，暗色模式自动翻转 */
  color: var(--on-surface);
  fill: currentColor;
  transition: transform var(--duration-fast) var(--ease-standard);
}

.cs-file-caret.is-open {
  transform: rotate(0deg);
}

/* 打开方式下拉面板：样式对齐 ChatComposer 的 cc-menu（绝对定位，脱离文档流） */
.cs-file-menu {
  position: absolute;
  z-index: 50;
  top: calc(100% + 8px);
  left: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: max-content;
  padding: 6px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-dropdown);
}

/* fixed 定位变体:脱离消息列表滚动容器的裁切,可覆盖下方输入框 */
.cs-file-menu--fixed {
  position: fixed;
  z-index: 300;
}

.cs-file-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border: none;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-body-md);
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cs-file-opt:hover {
  background-color: var(--color-interactive-hover);
}

/* 打字机光标 */
.cs-caret {
  display: inline-block;
  width: 2px;
  height: 1em;
  margin-left: 2px;
  vertical-align: text-bottom;
  background: var(--primary);
  animation: cs-blink 1s step-end infinite;
}

/* ---- 底部输入区 ---- */
.cs-composer {
  flex: 0 0 auto;
  width: 100%;
  max-width: 872px;
  margin: 0 auto;
  padding: 4px 36px 24px;
  box-sizing: border-box;
}

.cs-footnote {
  font: var(--font-caption-lg);
  color: var(--text-placeholder);
  margin: 8px 0 0;
  text-align: center;
}

/* 会话页输入框贴底：加号菜单与“/”指令面板默认向下弹出会超出视口底部 —— 强制向上；
   cc-chip 下拉（cc-menu）已由 DropMenu 自适应方向（底部不足时自动翻到上方） */
.cs-composer .cc-addmenu,
.cs-composer .cc-slash {
  top: auto;
  bottom: calc(100% + 8px);
}

/* 会话页：输入框卡片宽度自适应（覆盖 ChatComposer 固定 800px） */
.cw-main--session .cc-shell {
  width: auto;
}

/* ---- 右侧预览面板：点击产物「在线预览」打开（与左侧主区等宽） ---- */
.cs-preview {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-width: 0;
  border-left: 1px solid var(--container-10);
  background: var(--white);
}

/* ---- 头部 ---- */
.cs-preview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex: 0 0 auto;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--container-10);
}

.cs-preview-head-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.cs-preview-tab {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  flex: 0 0 auto;
  padding: 0.5rem;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--white);
  color: var(--text-secondary);
  font: var(--font-body-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-preview-tab:hover {
  color: var(--on-surface);
}

.cs-preview-tab.is-active {
  /* #F1F3F5 — 等价 var(--color-background-secondary) */
  background: var(--color-background-secondary);
}

.cs-preview-vline {
  width: 1px;
  height: 14px;
  flex: 0 0 auto;
  background: var(--divider);
}

.cs-preview-filetab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: 0 0 auto;
  height: 2rem;
  padding: 0 0.5rem;
  box-sizing: border-box;
  border-radius: var(--radius-sm);
  background: var(--surface-container);
  font: var(--font-body-sm);
  color: var(--on-surface);
  white-space: nowrap;
}

.cs-preview-filetab-x {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-placeholder);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-preview-filetab-x:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

.cs-preview-head-right {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
}

/* 通用图标按钮 */
.cs-preview-iconbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 2rem;
  height: 1.75rem;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-placeholder);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-preview-iconbtn img {
  width: 100%;
  height: 100%;
}

.cs-preview-iconbtn:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

/* 会话按钮：正方形 1.75rem */
.cs-preview-toolbar .cs-preview-iconbtn[title="会话"] {
  width: 1.75rem;
}

/* 工具栏「打开方式」按钮：覆盖固定尺寸以容纳文本 */
.cs-toolbar-openwith {
  width: auto;
  gap: 0.25rem;
  padding: 0 0.5rem;
  /* rgba(0,0,0,0.1) — 等价 var(--container-10) */
  border: 1px solid var(--container-10);
  border-radius: 0.5rem;
  font: var(--font-body-sm);
  color: var(--text-secondary);
  white-space: nowrap;
}

.cs-toolbar-openwith:hover {
  color: var(--on-surface);
}

/* 头部「添加」图标按钮 */
.cs-preview-add {
  width: 1.75rem;
}

.cs-preview-add img {
  width: 1rem;
  height: 1rem;
}

/* 图标容器（非按钮，纯展示） */
.cs-preview-iconbox {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 2rem;
  height: 2rem;
}

.cs-preview-iconbox img {
  width: 100%;
  height: 100%;
}

/* ---- 操作栏 ---- */
.cs-preview-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex: 0 0 auto;
  padding: 0.5rem 1rem;
  border-bottom: 1px solid var(--container-10);
}

.cs-preview-toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

/* Segmented 组件 */
.cs-segmented {
  display: inline-flex;
  align-items: center;
  height: 2rem;
  flex: 0 0 auto;
  padding: 2px;
  border-radius: 0.5rem;
  background: var(--surface-container);
}

.cs-seg-item {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 1.75rem;
  padding: 0;
  border: 0;
  border-radius: calc(0.5rem - 2px);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.cs-seg-item.is-active {
  background: var(--surface-container-lowest);
  color: var(--on-surface);
}

/* 地址栏 */
.cs-address {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  font: var(--font-caption-lg);
  color: var(--text-placeholder);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cs-preview-toolbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

/* 缩放下拉 */
.cs-zoom {
  position: relative;
  flex: 0 0 auto;
}

.cs-zoom-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  font: var(--font-body-sm);
  cursor: pointer;
  white-space: nowrap;
}

.cs-zoom-btn:hover {
  color: var(--on-surface);
}

.cs-zoom-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: max-content;
  padding: 6px;
  border-radius: var(--radius-lg);
  background-color: var(--surface-container-lowest);
  box-shadow: var(--shadow-dropdown);
}

.cs-zoom-opt {
  display: block;
  width: 100%;
  padding: 6px 12px;
  border: 0;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-body-sm);
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cs-zoom-opt:hover {
  background-color: var(--color-interactive-hover);
}

.cs-zoom-opt.is-active {
  font-weight: var(--font-weight-bold);
  color: var(--primary);
}

/* 更多操作下拉 */
.cs-more {
  position: relative;
  flex: 0 0 auto;
}

.cs-more-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: max-content;
  padding: 6px;
  border-radius: var(--radius-lg);
  background-color: var(--surface-container-lowest);
  box-shadow: var(--shadow-dropdown);
}

.cs-more-opt {
  display: block;
  width: 100%;
  padding: 7px 12px;
  border: 0;
  border-radius: var(--radius-sm);
  background-color: transparent;
  color: var(--color-font-primary);
  font: var(--font-body-md);
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.cs-more-opt:hover {
  background-color: var(--color-interactive-hover);
}

/* ---- 预览容器 ---- */
.cs-preview-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}

.cs-preview-container {
  margin: 1.5rem 2rem;
  /* #E5E5EA — 等价 var(--surface-container-high) */
  border: 1px solid var(--surface-container-high);
  border-radius: 1.5rem;
  overflow: hidden;
}

/* 模拟文档页面 */
.cs-preview-page {
  padding: 28px;
  background: var(--surface-container-lowest);
}

.cs-preview-name {
  font: var(--font-title-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.cs-preview-eyebrow {
  font: var(--font-caption-lg);
  color: var(--text-placeholder);
  margin: 4px 0 0;
}

.cs-preview-sec {
  margin-top: 20px;
}

.cs-preview-sec h3 {
  font: var(--font-subtitle-md);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 6px;
}

.cs-preview-sec p {
  font: var(--font-body-sm);
  color: var(--text-secondary);
  line-height: var(--line-height-relaxed);
  margin: 0;
}

/* 蜂群模式：人员时间排布（一周课程表式） */
.cs-timetable {
  padding: 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  overflow-x: auto;
}

/* 表头 */
.cs-tt-head {
  display: grid;
  grid-template-columns: 7rem repeat(7, 1fr);
  gap: 2px;
  flex: 0 0 auto;
}

.cs-tt-corner,
.cs-tt-head span {
  padding: 0.5rem 0.25rem;
  text-align: center;
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
  background: var(--surface-container-low);
  border-radius: var(--radius-xs);
}

.cs-tt-corner {
  text-align: left;
  color: var(--text-placeholder);
}

/* 行 */
.cs-tt-row {
  display: grid;
  grid-template-columns: 7rem repeat(7, 1fr);
  gap: 2px;
  margin-top: 2px;
}

.cs-tt-agent {
  padding: 0.5rem 0.5rem;
  font: var(--font-body-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  display: flex;
  align-items: center;
  background: var(--surface-container-low);
  border-radius: var(--radius-xs);
  white-space: nowrap;
}

.cs-tt-cell {
  padding: 0.5rem 0.25rem;
  min-height: 2.5rem;
  border-radius: var(--radius-xs);
  background: var(--surface-container-low);
  font: var(--font-caption-lg);
  color: var(--text-placeholder);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.cs-tt-cell.is-filled {
  background: var(--brand-10);
  color: var(--primary);
  font-weight: var(--font-weight-bold);
}

/* 任务摘要页签：空白内容区 */
.cs-preview-blank {
  display: flex;
  align-items: center;
  justify-content: center;
}

.cs-preview-blank-inner {
  display: flex;
  align-items: center;
  justify-content: center;
}

.cs-preview-blank-text {
  font: var(--font-body-md);
  color: var(--text-placeholder);
  margin: 0;
}

/* 文件页签激活态 */
.cs-preview-filetab.is-active {
  border-color: var(--primary);
  color: var(--primary);
}

/* ================= 动画 ================= */
@keyframes cs-rotate {
  to {
    transform: rotate(360deg);
  }
}

@keyframes cs-blink {
  50% {
    opacity: 0;
  }
}

@keyframes cs-fade-in {
  from {
    opacity: 0;
    transform: translateY(2px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 960px) {
  .cs-list {
    padding: 20px 16px;
  }

  .cs-composer {
    padding: 4px 16px 12px;
  }

  .cs-user-wrap {
    max-width: 92%;
  }

  .cs-preview {
    flex: 1 1 auto;
    flex-basis: 100%;
    border-left: 0;
    border-top: 1px solid var(--divider);
  }
}

/* ==== views/ChatWorkspace/index.css ==== */
.cw-page {
  display: flex;
  height: 100vh;
  background: var(--color-background-primary);
}

/* ---- 左侧 AI 工具菜单 ---- */
.cw-sidebar {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  width: 316px;
  box-sizing: border-box;
  padding: 16px 12px 12px;
  background: var(--surface-container-low);
  overflow-y: auto;
}

.cw-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0 14px;
}

.cw-brand-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-container);
  overflow: hidden;
  flex: 0 0 auto;
}

.cw-brand-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cw-brand-name {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cw-collapse {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-placeholder);
  cursor: pointer;
}

.cw-collapse:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

.cw-collapse svg {
  width: 28px;
  height: 28px;
}

.cw-brand-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  flex-shrink: 0;
}

.cw-mode {
  margin: 0 0 12px;
}

.cw-menu {
  margin: 0 0 20px;
}

.cw-section {
  margin-bottom: 20px;
}

.cw-section-title {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-regular);
  color: var(--text-placeholder);
  padding: 0 10px;
  margin: 0 0 6px;
}

.cw-conversations {
  flex: 1 1 auto;
  min-height: 0;
}

.cw-sidebar-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
}

.cw-user {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.cw-avatar {
  display: block;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  flex: 0 0 auto;
}

.cw-user-name {
  font: var(--font-body-md);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cw-settings {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-placeholder);
  cursor: pointer;
}

.cw-settings:hover {
  background: var(--color-interactive-hover);
  color: var(--on-surface);
}

/* ---- 右侧工作区:欢迎区 + 输入框居中 ---- */
.cw-main {
  display: flex;
  flex: 1 1 auto;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 36px;
  padding: 48px 40px;
  background-color: #fafafc;
}

/* 暗色模式回退到语义背景色 */
.dark .cw-main {
  background-color: var(--color-background-primary);
}

/* 会话页恢复纯白背景(仅首页态使用 #fafafc) */
.cw-main--session {
  background-color: var(--surface-container-lowest);
}

/* 会话模式：占满整列，内部由 ChatSession 自行布局 */
.cw-main--session {
  align-items: stretch;
  justify-content: stretch;
  gap: 0;
  padding: 0;
}

.cw-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
}

/* 欢迎区 slogan 图片(源资源 421x68) */
.cw-hero-slogan {
  display: block;
  width: 421px;
  max-width: 100%;
  height: auto;
}

.cw-composer {
  width: 100%;
  max-width: 820px;
}

/* 底部快捷能力胶囊 */
.cw-capabilities {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.cw-cap {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 20px;
  border: none;
  border-radius: var(--radius-full);
  background-color: var(--surface-container-lowest);
  color: var(--text-secondary);
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

.cw-cap:hover {
  background-color: var(--color-interactive-hover);
  color: var(--on-surface);
}

@media (max-width: 960px) {
  .cw-sidebar {
    display: none;
  }

  .cw-main {
    padding: 32px 20px;
  }
}

.cw-code-title { margin: 0; color: var(--on-surface); font: var(--font-title-lg); font-weight: var(--font-weight-medium); }
.cw-code-subtitle { margin: 0; color: var(--text-secondary); font: var(--font-body-md); }
.cw-brand-actions { color: var(--text-secondary); }
.cw-collapse { color: var(--text-secondary); }

</style>
</head>

/* 自适应方向：默认向下弹出；底部空间不足时翻转到按钮上方（渲染前测量，无闪烁） */
function DropMenu({ options, selectedId, onPick }) {
  const ref = useRef(null);
  const [up, setUp] = useState(false);

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (rect.bottom > window.innerHeight - 8) setUp(true);
  }, []);

  return (
    <div ref={ref} className={"cc-menu" + (up ? " cc-menu--up" : "")}>
      {options.map((o) => {
        const isSel = o.id === selectedId;
        return (
          <button
            type="button"
            key={o.id}
            className={"cc-menu-item" + (isSel ? " is-selected" : "")}
            onClick={() => onPick(o)}
          >
            {o.icon || o.src ? (
              <Icon name={o.icon} src={o.src} size={16} className="cc-mitem-icon" />
            ) : null}
            <span className="cc-mitem-main">
              <span className="cc-mitem-label">{o.label}</span>
              {o.desc ? <span className="cc-mitem-desc">{o.desc}</span> : null}
            </span>
            {/* 对号独立占位，每行统一靠右 */}
            <span className="cc-menu-check">
              {isSel ? <Icon name="check" size={14} /> : null}
            </span>
          </button>
        );
      })}
    </div>
  );
}

  // 完全访问二次确认弹窗
  const [confirmFull, setConfirmFull] = useState(false);
  // “/”快捷指令
  const [slashOpen, setSlashOpen] = useState(false);
  const [cmdChips, setCmdChips] = useState([]);
  // 添加文件（本地选择 → 输入框卡片）
  const fileInputRef = useRef(null);
  const [files, setFiles] = useState([]);
  // 顶部居中提示(超限/超大等)
  const [toast, setToast] = useState("");
  // 加号(+)下拉：一级 hover 时向右侧弹出二级
  const [hoverAdd, setHoverAdd] = useState(null); // 当前悬停的一级 key
  const [attachSecQuery, setAttachSecQuery] = useState("");
  // 连接器开关状态
  const [connOn, setConnOn] = useState({});

  // 有内容(已传文件/指令胶囊/文字)即可发送,并驱动发送按钮激活态图标
  const canSend = files.length > 0 || cmdChips.length > 0 || msg.trim().length > 0;

  // 文件卡片行数(每行4个)驱动输入卡片高度:0文件=140 / 1行=210 / 2行及以上=280(超出滚动)
  const fileCardHeight = files.length === 0 ? 140 : Math.ceil(files.length / 4) === 1 ? 210 : 280;

  // 点击组件外部任意位置时关闭下拉
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => {
      if (!e.target.closest("[data-drop]")) setOpen(null);
    };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [open]);

  // 点击 “/”指令菜单外（且不在输入区）时关闭
  useEffect(() => {
    if (!slashOpen) return;
    const onDown = (e) => {
      if (!e.target.closest("[data-slash]") && !e.target.closest(".cc-input")) {
        setSlashOpen(false);
      }
    };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [slashOpen]);

  // 提示 4 秒后自动消失
  useEffect(() => {
    if (!toast) return;
    const t = window.setTimeout(() => setToast(""), 4000);
    return () => window.clearTimeout(t);
  }, [toast]);

  const toggle = (key) => setOpen(open === key ? null : key);

  // 选中菜单项：更新状态并收起
  const pick = (setter) => (item) => {
    setter(item);
    setOpen(null);
  };

  // 发送：清空输入、指令胶囊与文件卡片；若外部传入 onSend 则上报完整载荷 + 按钮闪现反馈
  const send = () => {
    if (!canSend || sent) return;
    if (onSend) {
      onSend({
        text: msg.trim(),
        chips: cmdChips.map((c) => ({ id: c.id, title: c.title, icon: c.icon })),
        files: files.map((f) => ({ id: f.id, name: f.name, src: f.src })),
        meta: {
          modeId: mode.id,
          modeLabel: mode.label,
          permissionId: permission.id,
          permissionLabel: permission.label,
          modelId: model.id,
          modelLabel: model.label,
          space,
        },
      });
    }
    setMsg("");
    setCmdChips([]);
    setFiles([]);
    setSent(true);
    window.setTimeout(() => setSent(false), 700);
  };

  const onKeyDown = (e) => {
    if (e.key === "Escape") {
      setSlashOpen(false);
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !e.nativeEvent.isComposing) {
      e.preventDefault();
      send();
    }
  };

  // 空间列表支持按关键词过滤
  const filteredSpaces = spaceList.filter((s) =>
    s.name.toLowerCase().includes(spaceQuery.trim().toLowerCase())
  );

  // ---- “/”指令（单层分组，保持原样）：取最后一个斜杠后的输入过滤 ----
  const slashQuery = (() => {
    const i = msg.lastIndexOf("/");
    return i === -1 ? "" : msg.slice(i + 1);
  })();
  const matchSlash = (it) => it.title.toLowerCase().includes(slashQuery.trim().toLowerCase());
  const slashAdd = matchSlash(ADD_FILE_CMD) ? [ADD_FILE_CMD] : [];
  const slashSkills = SLASH_SKILLS.filter(matchSlash);
  const slashExperts = SLASH_EXPERTS.filter(matchSlash);

  // 共用行：图标 + 左对齐标题 + 右对齐正文
  const cmdRow = (it, onPick) => (
    <button type="button" key={it.id} className="cc-slash-row" onClick={() => onPick(it)}>
      <Icon name={it.icon} size={16} className="cc-slash-icon" />
      <span className="cc-slash-title">{it.title}</span>
      {it.desc ? <span className="cc-slash-desc">{it.desc}</span> : null}
    </button>
  );

  // 键入处理：以 / 开头（后跟无空格的查询串）时保持“/”菜单展开
  const handleInput = (e) => {
    const v = e.target.value;
    setMsg(v);
    const i = v.lastIndexOf("/");
    const after = i === -1 ? "" : v.slice(i + 1);
    setSlashOpen(i !== -1 && !/[ \n]/.test(after));
  };

  // 添加胶囊（去重，支持多选；src/closable 随 item 透传）
  const addChip = (item) =>
    setCmdChips((cs) =>
      cs.some((c) => c.id === item.id)
        ? cs
        : [
            ...cs,
            {
              id: item.id,
              title: item.title,
              icon: item.icon,
              src: item.src,
              mask: item.mask,
              closable: item.closable,
            },
          ]
    );

  // 选择“/”指令：清掉已输入的“/查询串”，标题作为胶囊
  const pickSlash = (item) => {
    setMsg((m) => {
      const i = m.lastIndexOf("/");
      return i === -1 ? m : m.slice(0, i);
    });
    addChip(item);
    setSlashOpen(false);
  };

  // ---- 加号(+)下拉：一级 hover 向右侧弹出二级 ----
  const toggleAttach = () => {
    setOpen((o) => (o === "attach" ? null : "attach"));
    setHoverAdd(null);
    setAttachSecQuery("");
  };

  // 选择二级里的实际指令：作为胶囊加入（多选），并关闭加号菜单
  const pickAddItem = (item) => {
    addChip(item);
    setOpen(null);
    setHoverAdd(null);
    setAttachSecQuery("");
  };

  const skillFiltered = SKILL_CHILDREN.filter((it) =>
    it.title.toLowerCase().includes(attachSecQuery.trim().toLowerCase())
  );
  const expertFiltered = EXPERT_CHILDREN.filter((it) =>
    it.title.toLowerCase().includes(attachSecQuery.trim().toLowerCase())
  );
  const connFiltered = CONN_CHILDREN.filter((it) =>
    it.title.toLowerCase().includes(attachSecQuery.trim().toLowerCase())
  );

  // 连接器行尾开关：切换启用状态
  const toggleConn = (id) => setConnOn((m) => ({ ...m, [id]: !m[id] }));

  // 二级面板内容：技能/专家为「标题在上、正文在下、无图标」，管理项为图标+标题
  const addSub = (key) => {
    if (key === "skill") {
      return (
        <>
          <label className="cc-menu-search">
            <Icon name="search" size={16} className="cc-search-icon" />
            <input
              className="cc-search-input"
              placeholder="搜索技能"
              value={attachSecQuery}
              onChange={(e) => setAttachSecQuery(e.target.value)}
            />
          </label>
          {skillFiltered.map((it) => {
            // 已选中的技能再点一次 = 取消(移除胶囊与对号);面板保持打开,支持多选
            // 选中样式对齐请求权限菜单:标题不变色,对号固定占位于整行右侧
            const picked = cmdChips.some((c) => c.id === it.id);
            return (
              <button
                type="button"
                key={it.id}
                className={"cc-add-line" + (picked ? " is-picked" : "")}
                aria-pressed={picked}
                onClick={() => (picked ? removeChip(it.id) : addChip(asSkillChip(it)))}
              >
                <span className="cc-add-line-main">
                  <span className="cc-add-line-title">{it.title}</span>
                  <span className="cc-add-line-desc">{it.desc}</span>
                </span>
                {picked ? (
                  <span className="cc-add-check">
                    <Icon name="check" size={14} />
                  </span>
                ) : null}
              </button>
            );
          })}
          {skillFiltered.length === 0 ? (
            <div className="cc-space-empty">未找到相关选项</div>
          ) : null}
          <div className="cc-menu-divider" />
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon src="./assets/uploads/add-skill.svg" size={15} />
            <span>添加技能</span>
          </button>
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon src="./assets/uploads/manage-skill.svg" size={15} />
            <span>管理技能</span>
          </button>
        </>
      );
    }
    if (key === "expert") {
      return (
        <>
          <label className="cc-menu-search">
            <Icon name="search" size={16} className="cc-search-icon" />
            <input
              className="cc-search-input"
              placeholder="搜索专家"
              value={attachSecQuery}
              onChange={(e) => setAttachSecQuery(e.target.value)}
            />
          </label>
          {expertFiltered.map((it) => (
            <button
              type="button"
              key={it.id}
              className="cc-add-line"
              onClick={() => pickAddItem(it)}
            >
              <span className="cc-add-line-main">
                <span className="cc-add-line-title">{it.title}</span>
                <span className="cc-add-line-desc">{it.desc}</span>
              </span>
            </button>
          ))}
          {expertFiltered.length === 0 ? (
            <div className="cc-space-empty">未找到相关选项</div>
          ) : null}
          <div className="cc-menu-divider" />
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="plus" size={15} />
            <span>添加专家</span>
          </button>
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="settings-2" size={15} />
            <span>管理专家</span>
          </button>
        </>
      );
    }
    if (key === "connector") {
      return (
        <>
          <label className="cc-menu-search">
            <Icon name="search" size={16} className="cc-search-icon" />
            <input
              className="cc-search-input"
              placeholder="搜索连接器"
              value={attachSecQuery}
              onChange={(e) => setAttachSecQuery(e.target.value)}
            />
          </label>
          {connFiltered.map((c) => (
            <div
              key={c.id}
              className="cc-add-conn"
              onClick={() => toggleConn(c.id)}
            >
              <Icon name={c.icon} src={c.src} size={16} className="cc-slash-icon" />
              <span className="cc-add-conn-title">{c.title}</span>
              <button
                type="button"
                className={"cc-add-toggle" + (connOn[c.id] ? " is-on" : "")}
                aria-pressed={!!connOn[c.id]}
                onClick={(e) => {
                  e.stopPropagation();
                  toggleConn(c.id);
                }}
              >
                <span className="cc-add-toggle-knob" />
              </button>
            </div>
          ))}
          {connFiltered.length === 0 ? (
            <div className="cc-space-empty">未找到相关选项</div>
          ) : null}
          <div className="cc-menu-divider" />
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="plus" size={15} />
            <span>添加连接器</span>
          </button>
          <button type="button" className="cc-add-manage" onClick={() => {}}>
            <Icon name="settings-2" size={15} />
            <span>管理连接器</span>
          </button>
        </>
      );
    }
    // add-file
    return ADD_CHILDREN.map((it) => cmdRow(it, pickAddItem));
  };

  // 一级行（+ 菜单），hover 时右侧弹二级；「添加文件」无二级，点击唤起本地文件选择
  const renderAddRoot = (r) => {
    if (r.key === "add-file") {
      return (
        <div key={r.key} className="cc-add-item" onMouseEnter={() => setHoverAdd(null)}>
          <button
            type="button"
            className="cc-slash-row cc-slash-nav cc-add-root"
            onClick={handleAddFile}
          >
            <Icon name={r.icon} src={r.src} size={16} className="cc-slash-icon" />
            <span className="cc-slash-nav-title">{r.title}</span>
            <Icon name="chevron-right" size={14} className="cc-slash-nav-arrow" />
          </button>
        </div>
      );
    }
    return (
      <div
        key={r.key}
        className={"cc-add-item" + (hoverAdd === r.key ? " is-active" : "")}
        onMouseEnter={() => {
          setHoverAdd(r.key);
          setAttachSecQuery("");
        }}
      >
        <button type="button" className="cc-slash-row cc-slash-nav cc-add-root">
          <Icon name={r.icon} src={r.src} size={16} className="cc-slash-icon" />
          <span className="cc-slash-nav-title">{r.title}</span>
          <Icon name="chevron-right" size={14} className="cc-slash-nav-arrow" />
        </button>
      </div>
    );
  };

  const removeChip = (id) => setCmdChips((cs) => cs.filter((c) => c.id !== id));

  // ---- 添加文件：唤起本地文件选择，选中后生成输入框卡片 ----
  const handleAddFile = () => {
    setOpen(null);
    setHoverAdd(null);
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleFileChange = (e) => {
    const picked = Array.from(e.target.files || []);
    if (!picked.length) return;

    // 20 个上限:超出部分直接拒收
    const room = MAX_UPLOAD_FILES - files.length;
    const accepted = picked.slice(0, Math.max(0, room));
    const overflowCount = picked.length - accepted.length;

    // 100MB 上限:超大的文件进入卡片但标记为上传失败
    let firstOversized = null;
    const additions = accepted.map((f, i) => {
      const failed = f.size > MAX_UPLOAD_SIZE;
      if (failed && !firstOversized) firstOversized = f;
      return {
        id: "file-" + Date.now() + "-" + i,
        name: f.name,
        ext: fileTypeOf(f.name),
        src: fileSrcOf(f.name),
        // 图片类型:生成缩略图预览
        preview: isImageFile(f.name) ? URL.createObjectURL(f) : undefined,
        size: fmtSize(f.size),
        failed,
      };
    });

    if (additions.length) setFiles((prev) => [...prev, ...additions]);

    // 数量超限优先提示;其次提示第一个超大文件
    if (overflowCount > 0) {
      setToast("单次对话最多上传20个附件");
    } else if (firstOversized) {
      setToast(firstOversized.name + "（最大100MB）");
    }

    // 允许再次选择同一文件
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const removeFile = (id) => setFiles((fs) => fs.filter((f) => f.id !== id));

  // 重试上传(演示:重试即成功,清除失败态)
  const retryFile = (id) =>
    setFiles((fs) => fs.map((f) => (f.id === id ? { ...f, failed: false } : f)));

  // 新建项目：关闭菜单、重置表单并弹出居中弹窗
  const openNewProject = () => {
    setOpen(null);
    setNpName("");
    setNpPath("");
    setPathMenu(false);
    setShowNewProject(true);
  };

  // 确认新建：把新项目追加进空间列表并选中
  const confirmNewProject = () => {
    const name = npName.trim();
    if (!name || !npPath.trim()) return;
    const item = { id: "sp-" + Date.now(), name };
    setSpaceList((list) => [...list, item]);
    setSpace(item);
    setSpaceQuery("");
    setShowNewProject(false);
  };

  const closeNewProject = () => {
    setShowNewProject(false);
    setPathMenu(false);
  };

  return (
    <div className={"cc-shell" + (chatMode ? " cc-shell--chat" : "")}>
      {/* 输入框右上角外侧:吉祥鸟装饰(仅首页态显示) */}
      {!chatMode ? (
        <img
          className="cc-shell-mascot"
          src="./assets/uploads/mascot-bird.svg"
          alt=""
          aria-hidden="true"
        />
      ) : null}
      {/* ============ 输入卡片(高度随已选文件行数自适应) ============ */}
      <div
        className="cc-card"
        style={{ height: fileCardHeight, flexBasis: fileCardHeight }}
      >
        {/* 正文输入区 */}
        <div className="cc-body">
          {files.length > 0 ? (
            <div className="cc-file-list">
              {files.map((f) => (
                <div className="cc-file-card" key={f.id}>
                  <span className="cc-file-icon">
                    {f.preview ? (
                      <img className="cc-file-thumb" src={f.preview} alt={f.name} />
                    ) : (
                      <Icon src={f.src} size={30} />
                    )}
                  </span>
                  <span className="cc-file-info">
                    <span className="cc-file-name" title={f.name}>
                      {f.name}
                    </span>
                    {f.failed ? (
                      <span className="cc-file-meta cc-file-meta-failed">
                        <span className="cc-file-failed">上传失败</span>
                        <button
                          type="button"
                          className="cc-file-retry"
                          onClick={() => retryFile(f.id)}
                        >
                          重试
                        </button>
                      </span>
                    ) : (
                      <span className="cc-file-meta">
                        {f.ext} · {f.size}
                      </span>
                    )}
                  </span>
                  <button
                    type="button"
                    className="cc-file-x"
                    onClick={() => removeFile(f.id)}
                    aria-label={"移除" + f.name}
                  >
                    <Icon name="x" size={10} />
                  </button>
                </div>
              ))}
            </div>
          ) : null}
          {/* 胶囊与输入同行:文字紧跟标签后,单行不换行 */}
          <div className="cc-input-row">
          {cmdChips.length > 0 ? (
            <div className="cc-cmd-chips">
              {cmdChips.map((c) => (
                <span
                  className={
                    "cc-cmd-chip" + (c.closable === false ? " cc-cmd-chip--info" : "")
                  }
                  key={c.id}
                >
                  <Icon name={c.icon} src={c.src} mask={c.mask} size={13} />
                  <span className="cc-cmd-chip-label">{c.title}</span>
                  {c.closable === false ? null : (
                    <button
                      type="button"
                      className="cc-cmd-chip-x"
                      onClick={() => removeChip(c.id)}
                      aria-label={"移除" + c.title}
                    >
                      <Icon name="x" size={10} />
                    </button>
                  )}
                </span>
              ))}
            </div>
          ) : null}
          <textarea
            className="cc-input"
            placeholder={cmdChips.length ? "继续输入你的需求…" : placeholder}
            value={msg}
            onChange={handleInput}
            onKeyDown={onKeyDown}
            rows={1}
            spellCheck={false}
            aria-label="消息输入"
            wrap={cmdChips.length ? "off" : undefined}
          />
          </div>
        </div>

        {/* “/”快捷指令面板位于灰色外框下方（见 shell 底部） */}

        {/* 底部工具栏 */}
        <div className="cc-toolbar">
          <div className="cc-tool-group">
            {/* 加号：二级下拉（对话页向上弹出，避免被视口底部裁切） */}
            <div
              className={
                "cc-drop" +
                (chatMode ? " cc-drop-up" : "") +
                (open === "attach" ? " is-active" : "")
              }
              data-drop
            >
              <button
                type="button"
                className={"cc-ghost" + (open === "attach" ? " is-active" : "")}
                onClick={toggleAttach}
                title="添加内容"
                aria-label="添加内容"
              >
                {/* 展开时显示 ×(收起),收起时显示资源插画 */}
                <Icon
                  name={open === "attach" ? "x" : undefined}
                  src={open === "attach" ? undefined : "./assets/uploads/add-skill.svg"}
                  size={16}
                  className="cc-plus-icon"
                />
              </button>
              {open === "attach" ? (
                <div className="cc-addmenu" onMouseLeave={() => setHoverAdd(null)}>
                  {/* 添加文件 + 分割线，与 技能/专家/连接器 分开 */}
                  {ADD_ROOTS.slice(0, 1).map(renderAddRoot)}
                  <div className="cc-menu-divider" />
                  {ADD_ROOTS.slice(1).map(renderAddRoot)}
                  {/* 二级面板锚定在菜单整体(而非所在行):切换选项时位置不跳动,避免抖动 */}
                  {hoverAdd ? <div className="cc-add-sub">{addSub(hoverAdd)}</div> : null}
                </div>
              ) : null}
            </div>

            {/* Agent 模式下拉（对话页向上弹出） */}
            <div
              className={
                "cc-drop" +
                (chatMode ? " cc-drop-up" : "") +
                (open === "mode" ? " is-active" : "")
              }
              data-drop
            >
              <button
                type="button"
                className={"cc-chip" + (open === "mode" ? " is-active" : "")}
                onClick={() => toggle("mode")}
                disabled={chatMode}
              >
                <Icon name={mode.icon} src={mode.src} size={16} />
                <span className="cc-chip-label">{mode.label}</span>
                <Icon name="chevron-down" size={13} className="cc-chev" />
              </button>
              {open === "mode" ? (
                <DropMenu options={AGENT_MODES} selectedId={mode.id} onPick={pick(setMode)} />
              ) : null}
            </div>

            {/* 请求权限下拉（对话页向上弹出） */}
            <div
              className={
                "cc-drop" +
                (chatMode ? " cc-drop-up" : "") +
                (open === "permission" ? " is-active" : "")
              }
              data-drop
            >
              <button
                type="button"
                className={
                  "cc-chip" +
                  (open === "permission" ? " is-active" : "") +
                  (permission.id === "full" ? " cc-chip-danger" : "")
                }
                onClick={() => toggle("permission")}
              >
                <Icon name={permission.icon} src={permission.src} size={16} />
                <span className="cc-chip-label">{permission.label}</span>
                <Icon name="chevron-down" size={13} className="cc-chev" />
              </button>
              {open === "permission" ? (
                <DropMenu
                  options={PERMISSIONS}
                  selectedId={permission.id}
                  onPick={(item) => {

/* 依据发送载荷构造一次 Agent 回复：结构化回答块流。
   块类型："p" 段落 / "li" 列表项 / "status" 图标状态行（随流式逐字输出）/

   允许后继续输出其后的块；拒绝则跳过剩余内容，任务中止。 */
function buildAgentReply(payload) {
  /* 失败注入：用户消息包含「失败 / 中断 / fail」时，冲刺阶段打完文案后触发生成失败（测试失败流程） */
  const failMode = /失败|中断|fail/i.test(payload.text || "");
  const swarm = payload.meta && payload.meta.modeId === "swarm";

  /* 蜂群模式：多子Agent并行协作流程（由 swarm.jsx 独立模块处理） */
  const swarmPre = swarm ? buildSwarmBlocks(payload) : [];

  /* ---- 单Agent模式：默认流程 ---- */
  const singlePre = [
    {
      type: "p",
      cls: "cs-node-intro",
      text: "好的，我会结合你最近的讨论内容，先整理汇报结构，再通过代码生成完整的演示文件。",

    {

      src: "./assets/uploads/search.svg",
      text: "已探索 12 个文件，4 个列表",

    /* 蜂群模式：表单后插入完整协作流程，再接冲刺+产物 */

  }
  blocks.push(
    {
      type: "status",
      cls: "cs-node-sprint",
      src: "./assets/uploads/bird.webp",
      text: "咻一一青鸟正在最终冲刺中......",

        "16 团队分工 —— 角色职责与协作机制",
        "17 排期计划 —— 三期迭代里程碑",
        "18 路线图与 Q&A —— 长期规划与讨论",
      ],
    },
    {
      type: "summary",
      cls: "cs-node-summary-card",
      noPerm: true,
      title: "产物汇总",
    },
    {
      type: "artifacts",
      cls: "cs-node-artifacts",
      noPerm: true,
      files: [
        {
          id: "art-1",
          name: "汇报演示.html",
          size: "86.5 KB",
          src: "./assets/uploads/docx.svg",
        },
      ],
    },
  );
  /* 蜂群模式跳过 filecontent、summary 和冲刺节点（已在协作流程中覆盖） */
  if (swarm) {
    const fcIdx = blocks.findIndex((b) => b.type === "filecontent");
    if (fcIdx !== -1) blocks.splice(fcIdx, 1);
    const smIdx = blocks.findIndex((b) => b.type === "summary");
    if (smIdx !== -1) blocks.splice(smIdx, 1);
    const spIdx = blocks.findIndex((b) => b.cls === "cs-node-sprint");
    if (spIdx !== -1) blocks.splice(spIdx, 1);
  }

  return { blocks, failMode };
}
