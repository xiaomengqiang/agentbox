  /* 8. Font Size（字号，px） */

  --line-height-none: 1;

  --outline-width-none: 0px;

/* ── body base ── */
body {
  margin: 0;
  line-height: 1.5;
  color: var(--on-surface);
  font-family: var(--font-family);
  background-color: var(--surface);
}

#root {
  min-height: 100vh;
}

/* Standard scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
  background-color: transparent;
}

::-webkit-scrollbar-corner {
  background-color: transparent;
}

::-webkit-scrollbar-track {
  background-color: transparent;
}

::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background-color: var(--color-comp-divider);
  background-clip: padding-box;
}

::-webkit-scrollbar-track-piece {
  background-color: transparent;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--primary-40);
}


/* 语义层 Light Mode（:root 默认主题）*/
:root {
  /* Font Color（文本色）*/
  --color-font-primary: var(--primary-90);
  --color-font-secondary: var(--primary-60);
  --color-font-tertiary: var(--primary-40);
  --color-font-fourth: var(--primary-20);
  --color-font-emphasize: var(--brand-font); 
  --color-font-on-primary: var(--on-primary);
  --color-font-on-secondary: var(--on-primary-60);
  --color-font-on-tertiary: var(--on-primary-40);
  --color-font-on-fourth: var(--on-primary-20);

  /* Background Color（背景色）*/
  --color-background-primary: var(--white);
  --color-background-secondary: var(--gray-01);
  --color-background-tertiary: var(--gray-02);
  --color-background-fourth: var(--gray-03);
  --color-background-emphasize: var(--brand);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--white);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-05);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary); 
  --color-comp-background-gray: var(--gray-01); 
  --color-comp-background-gray-secondary: var(--gray-01);
  --color-fg-unchecked: var(--on-primary-20);
  --color-comp-divider: var(--container-20); 

  /* Comp Border Color（组件边框色）*/
  --color-comp-border: var(--container-15); 
  --color-comp-border-hover: var(--container-20); 
  --color-comp-border-focus: var(--brand); 
  --color-comp-border-active: var(--brand); 
  --color-comp-border-disabled: var(--container-10); 

  /* Icon Color（图标色）*/
  --color-icon-primary: var(--primary-90);
  --color-icon-secondary: var(--primary-60);
  --color-icon-tertiary: var(--primary-40);
  --color-icon-fourth: var(--primary-20);
  --color-icon-emphasize: var(--brand-font);
  --color-icon-sub-emphasize: var(--brand-40);
  --color-icon-on-primary: var(--on-primary);
  --color-icon-on-secondary: var(--on-primary-60);
  --color-icon-on-tertiary: var(--on-primary-40);
  --color-icon-on-fourth: var(--on-primary-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-05); 
  --color-interactive-pressed: var(--container-10);
  --color-interactive-select: var(--brand-20); 
  --color-interactive-click: var(--container-10);

  /* Functional Color（功能色，设计师指定值，独立于 multi-color 色板）*/
  --color-error: #E84026;
  --color-alert: #ED6F21;
  --color-warning: #EFBF00;
  --color-success: #64BB5C;
  --color-info: #0A59F7;
  --color-error-container: #FDEBEB;
  --color-alert-container: #FFF0E6;
  --color-warning-container: #FFF7D6;
  --color-success-container: #EDF7EB;
  --color-info-container: #E6EEFE;

  /* Shadow（阴影）*/
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.1);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.12);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.06);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.08);
  --shadow-glow: 0 4px 32px 0 rgba(241, 243, 245, 0.8);
}


/* ==========================================================================
   主题层 Theme（AI 组件直接消费的终极语义层）
   加载顺序：base → light → theme → dark*/

:root {
  /* ── primary（品牌色族，部分占位）── */
  --primary: var(--brand);
  --on-primary: var(--white);
  --primary-hover: var(--brand-80); 
  --primary-active: var(--brand); 
  --primary-disabled: var(--brand-40);
  --primary-container: var(--brand-05); 
  --on-primary-container: var(--color-font-primary);

  /* ── surface / on-surface（已重写，引用新 light/dark 语义 token）── */
  --surface: var(--color-background-secondary);
  --surface-dim: var(--color-background-tertiary);
  --surface-bright: var(--color-background-primary);
  --on-surface: var(--color-font-primary);
  --surface-container-lowest: var(--color-background-primary);
  --surface-container-low: var(--color-background-secondary);
  --surface-container: var(--color-comp-background-tertiary);
  --surface-container-high: var(--color-background-tertiary);
  --surface-container-highest: var(--color-background-fourth);

  --inverse-surface: var(--primary);
  --inverse-on-surface: var(--color-font-on-primary);
  --inverse-on-surface-variant: var(--color-font-on-secondary);
  --inverse-primary: var(--brand);

  --error: var(--color-error);
  --on-error: var(--white);
  --error-container: var(--color-error-container);
  --on-error-container: var(--color-font-primary);

  --alert: var(--color-alert);
  --on-alert: var(--white);
  --alert-container: var(--color-alert-container);
  --on-alert-container: var(--color-font-primary);

  --warning: var(--color-warning);
  --on-warning: var(--black);
  --warning-container: var(--color-warning-container);
  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);
  --on-success: var(--white);
  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);
  --on-info: var(--white);
  --info-container: var(--color-info-container);
  --on-info-container: var(--color-font-primary);

  --text-secondary: var(--color-font-secondary);
  --text-placeholder: var(--color-font-tertiary);
  --text-disabled: var(--color-font-fourth);
  --text-inverse-disabled: var(--color-font-on-fourth);
  
  --interactive-link: var(--brand);
  --interactive-link-hover: var(--brand-80);
  --interactive-link-active: var(--brand);
  --interactive-link-visited: var(--brand);
  --interactive-link-disabled: var(--brand-40);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: var(--outline-width-base); /* 1px */
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（排印角色：字号+行高+字体族绑定，字重在其后组合）── */
  /* Display（展示文本）*/
  --font-display-sm: var(--font-size-4xl)/var(--line-height-tight) var(--font-family); /* 38px/1.25 */
  --font-display-md: var(--font-size-5xl)/var(--line-height-tight) var(--font-family); /* 48px/1.25 */
  --font-display-lg: var(--font-size-6xl)/var(--line-height-tight) var(--font-family); /* 56px/1.25 */

  /* Title（标题）*/
  --font-title-sm: var(--font-size-xl)/var(--line-height-snug) var(--font-family); /* 20px/1.375 */
  --font-title-md: var(--font-size-2xl)/var(--line-height-snug) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/var(--line-height-snug) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/var(--line-height-base) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}


/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}


/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}


.menuitem-demo-page { width: 100%; }
.menuitem-demo-header { margin-bottom: var(--spacing-page); }
.menuitem-demo-header h1 { margin: 0; color: var(--on-surface); font: var(--font-title-lg); font-weight: var(--font-weight-bold); }
.menuitem-demo-header p { margin: 8px 0 0; color: var(--text-secondary); font: var(--font-body-md); }
.menuitem-demo-section { margin-top: 40px; }
.menuitem-demo-section > p { margin: 0 0 var(--spacing-gutter); color: var(--text-secondary); font: var(--font-body-md); }
.menuitem-prop-hint { margin: 28px 0 0; color: var(--text-secondary); font: var(--font-body-sm); }
.menuitem-prop-hint code { color: var(--on-surface); }
.menuitem-section-heading { display: flex; align-items: center; gap: var(--spacing-inline); margin-bottom: 12px; }
.menuitem-section-heading h2 { margin: 0; color: var(--on-surface); font: var(--font-title-sm); font-weight: var(--font-weight-bold); }
.menuitem-section-heading span { color: var(--text-placeholder); font: var(--font-caption-lg); }
.menuitem-configurator-title { margin: 0 0 var(--spacing-gutter); color: var(--on-surface); font: var(--font-subtitle-lg); font-weight: var(--font-weight-bold); }
.menuitem-configurator { display: grid; grid-template-columns: minmax(240px, 0.8fr) minmax(0, 1.2fr); gap: var(--spacing-gutter); }
.menuitem-controls, .menuitem-live, .menuitem-state-card { box-sizing: border-box; border-radius: var(--radius-container); background: var(--surface-container-lowest); box-shadow: var(--shadow-card); }
.menuitem-controls { display: grid; align-content: start; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-gutter); padding: var(--spacing-gutter); }
.menuitem-control { display: grid; gap: 6px; min-width: 0; color: var(--text-secondary); font: var(--font-caption-lg); font-weight: var(--font-weight-medium); }
.menuitem-control select, .menuitem-control input { width: 100%; min-height: 36px; box-sizing: border-box; padding: 0 10px; border: var(--border-width-thin) solid var(--divider); border-radius: var(--radius-action); background: var(--surface-container-lowest); color: var(--on-surface); font: var(--font-body-md); }
.menuitem-control input[type="file"] { height: auto; min-height: 36px; padding: 7px 10px; }
.menuitem-upload small { color: var(--text-placeholder); font: var(--font-caption-md); }
.menuitem-toggle { grid-template-columns: 20px 1fr; align-items: center; column-gap: 8px; }
.menuitem-toggle > span { grid-column: 1 / -1; }
.menuitem-toggle input { width: 16px; min-height: 16px; height: 16px; padding: 0; accent-color: var(--primary); }
.menuitem-toggle b { color: var(--on-surface); font: var(--font-body-md); font-weight: var(--font-weight-regular); }
.menuitem-upload small { color: var(--text-placeholder); font: var(--font-caption-md); }
.menuitem-live { display: grid; place-items: center; min-width: 0; min-height: 156px; padding: 32px; }
.menuitem-live--left { place-items: center start; }
.menuitem-live code { display: block; margin-top: 16px; color: var(--text-placeholder); font: var(--font-caption-lg); }
.menuitem-inline-gallery { display: flex; align-items: center; gap: var(--spacing-gutter); margin-top: var(--spacing-gutter); padding: var(--spacing-gutter); border-radius: var(--radius-container); background: var(--surface-container-lowest); box-shadow: var(--shadow-card); }
.menuitem-inline-gallery > span { color: var(--text-secondary); font: var(--font-body-sm); }
.menuitem-state-group { margin-top: 32px; }
.menuitem-state-group h3 { margin: 0 0 var(--spacing-gutter); color: var(--on-surface); font: var(--font-subtitle-lg); font-weight: var(--font-weight-bold); }
.menuitem-state-matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--spacing-gutter); }
.menuitem-state-matrix--single { grid-template-columns: minmax(0, 1fr); }
.menuitem-state-sample { display: grid; gap: 12px; min-width: 0; padding: 20px var(--spacing-gutter); border-radius: var(--radius-container); background: var(--surface-container-lowest); box-shadow: var(--shadow-card); }
.menuitem-state-sample > span { color: var(--text-secondary); font: var(--font-caption-lg); font-weight: var(--font-weight-medium); }
.menuitem-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-gutter); }
.menuitem-file-gallery { display: grid; gap: var(--spacing-gutter); overflow-x: auto; padding: 2px; }
.menuitem-state-card { display: grid; align-content: start; gap: 12px; min-width: 0; padding: var(--spacing-gutter); }
.menuitem-state-card > span { color: var(--text-secondary); font: var(--font-caption-lg); font-weight: var(--font-weight-medium); }
.menuitem-contract { display: grid; gap: 32px; margin-top: 56px; }
.menuitem-token-panel { padding: var(--spacing-inset); border-radius: var(--radius-container); background: var(--surface-container-lowest); box-shadow: var(--shadow-card); }
.menuitem-token-panel h2 { margin: 0; color: var(--on-surface); font: var(--font-title-sm); font-weight: var(--font-weight-bold); }
.menuitem-token-panel p { margin: 8px 0 var(--spacing-gutter); color: var(--text-secondary); font: var(--font-body-md); }
.menuitem-table-wrap { overflow-x: auto; border-radius: var(--radius-container); box-shadow: var(--shadow-card); }
.menuitem-table { width: 100%; min-width: 760px; border-collapse: collapse; background: var(--surface-container-lowest); }
.menuitem-table th { padding: 12px var(--spacing-gutter); color: var(--text-secondary); text-align: left; background: var(--surface-container-low); font: var(--font-caption-lg); font-weight: var(--font-weight-bold); }
.menuitem-table td { padding: 12px var(--spacing-gutter); border-top: var(--border-width-thin) solid var(--divider); color: var(--text-secondary); font: var(--font-body-md); }
.menuitem-table td:first-child { color: var(--on-surface); font-weight: var(--font-weight-medium); }
@media (max-width: 760px) { .menuitem-configurator { grid-template-columns: 1fr; } .menuitem-controls { grid-template-columns: 1fr; } .menuitem-gallery { grid-template-columns: 1fr; } .menuitem-live { place-items: start center; overflow-x: auto; } .menuitem-inline-gallery { align-items: flex-start; flex-direction: column; } .menuitem-state-matrix { grid-template-columns: minmax(300px, 1fr); overflow-x: auto; } }


.mi-menu {
  /* 警告卸载为设计指定色值，集中为组件 token，供文本、图标和背景一致引用。 */
  --mi-danger-font: #E02128;
  --mi-danger-icon: #E02128;
  --mi-danger-container: #FEE7E8;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* ---------- 导航内容列表（nav） ---------- */
.mi-menu-nav {
  width: 300px;
  padding: 0;
  gap: 12px;
  border-radius: var(--radius-overlay);
}

/* 无背景形态：用于单条目状态演示 */
.mi-menu-nav.mi-menu-plain {
  background: transparent;
}

/* ---------- 历史对话列表（history） ---------- */
.mi-menu-history {
  width: 300px;
  gap: 12px;
}

/* ---------- 下拉列表（dropdown） ---------- */
.mi-menu-dropdown {
  gap: 0; /* 单行条目紧贴无间距 */
}

/* 中尺寸下拉列表容器：单行条目 */
.mi-menu-dropdown-md {
  gap: 0;
}

/* ================= 条目基础 ================= */
.mi-item {
  display: flex;
  align-items: center;
  box-sizing: border-box;
  border: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

/* ---- 导航内容列表条目 ---- */
.mi-item-nav {
  gap: 8px; /* 图标与文本间距 8px */
  width: 100%; /* 300px */
  height: 40px;
  padding: 0 12px; /* 图标距左 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
}

/* ---- 历史对话列表条目 ---- */
.mi-item-history {
  justify-content: space-between;
  width: 100%; /* 300px */
  height: 40px;
  padding: 0 12px; /* 文本距左 12px，图标距右 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
}

/* ---- 下拉列表条目 ---- */
.mi-item-dropdown {
  gap: var(--spacing-inline);
  width: 152px;
  height: 32px;
  padding: 4px 12px; /* 文本与图标距容器上下各 4px */
  border-radius: var(--radius-md); /* 6px */
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px；文本行高在下方固定为 16px */
  font-weight: var(--font-weight-regular); /* 400 */
}

/* ---- 下拉列表中尺寸条目：232×36px ---- */
.mi-item-dropdown-md {
  gap: var(--spacing-inline); /* 文本与 icon 间距 8px */
  width: 232px;
  height: 36px;
  padding: 4px 12px; /* icon 距容器左 12px，文本与图标距上下各 4px */
  border-radius: var(--radius-md); /* 6px */
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px；文本行高在下方固定为 16px */
  font-weight: var(--font-weight-regular); /* 400 */
  background: var(--surface-container-lowest);
}

/* ================= 状态 ================= */
/* 导航内容列表 / 历史对话列表：悬浮、选中、非默认态均 5% 透明黑背景 */
.mi-item-nav:hover,
.mi-item-nav.mi-item-hover,
.mi-item-nav.mi-item-selected,
.mi-item-history:hover,
.mi-item-history.mi-item-active {
  background-color: var(--color-interactive-hover);
}

/* 下拉列表普通项悬浮：5% 透明黑背景 */
.mi-item-dropdown:not(:disabled):hover,
.mi-item-dropdown.mi-item-hover:not(:disabled) {
  background-color: var(--color-interactive-hover);
}

/* 下拉列表危险项：错误语义色图标与文本 */
.mi-item-dropdown.mi-item-danger {
  color: var(--mi-danger-font);
}

/* 下拉列表危险项悬浮：设计指定粉色背景 token。 */
.mi-item-dropdown.mi-item-danger:not(:disabled):hover,
.mi-item-dropdown.mi-item-danger.mi-item-hover:not(:disabled) {
  background-color: var(--mi-danger-container);
}

/* 下拉列表禁用态：整体 50% 透明度，不可点击 */
.mi-item-dropdown:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ================= 子元素 ================= */
.mi-icon {
  flex-shrink: 0;
  display: block;
}

.mi-icon--mask {
  background-color: currentColor;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  -webkit-mask-size: contain;
  mask-size: contain;
}

/* 中尺寸下拉列表选中态右侧「正确」图标：右对齐 */
.mi-check {
  flex-shrink: 0;
  margin-left: auto;
}

.mi-label {
  display: flex;
  align-self: stretch;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 下拉列表：文本 16px 行高，与 14px / 17px 图标在同一 flex 中轴居中。 */
.mi-item-dropdown .mi-label,
.mi-item-dropdown-md .mi-label {
  line-height: 16px;
  transform: translateY(1px); /* 字体上行区较大，做 1px 光学校正以落在视觉中轴 */
}

.mi-item-history .mi-label {
  text-align: left;
}

/* 左侧导航文字的字形视觉重心略高，向下校正 1px。 */
.mi-item-nav .mi-label {
  transform: translateY(1px);
}

/* 历史对话列表右侧状态图标：右对齐 12px（由按钮 padding 提供），上下 8px */
.mi-status {
  flex-shrink: 0;
  margin: 8px 0;
}

/* ================= 文件夹 / 文件列表（folder / file-level-1 / file-level-2） ================= */
.fl-list {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* 条目：602×40px */
.fl-row {
  display: flex;
  align-items: center;
  gap: 8px; /* 展开/收起图标 → 文件夹图标 → 文本，三部件间距 8px */
  box-sizing: border-box;
  width: 602px;
  height: 40px;
  padding: 0 12px; /* 内容距容器左右 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

/* 悬浮态：5% 透明黑背景 */
.fl-row:hover,
.fl-row-hover {
  background-color: var(--color-interactive-hover);
}

/* 重命名态 / 重命名输入中：5% 透明黑背景（与悬浮一致） */
.fl-row-rename {
  background-color: var(--color-interactive-hover);
}

/* 禁用态：文本与图标整体使用禁用色，不可交互 */
.fl-row-disabled {
  color: var(--text-disabled);
}

/* 展开/收起按钮 */
.fl-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  color: inherit; /* 跟随条目文字色（Lucide 图标 stroke 使用 currentColor） */
}

.fl-toggle:disabled {
  cursor: not-allowed;
}

.fl-chevron,
.fl-folder,
.fl-file {
  flex-shrink: 0;
  color: inherit;
}

/* 文件列表：一级/二级 左侧图标缩进 */
/* 一级文件列表：最左侧文件图标距外框左 12px（无展开/收起，直接由 padding 0 12px 对齐） */
.fl-row-file-1 .fl-file {
  margin-left: 0;
}

/* 二级文件列表：最左侧文件图标距外框左 36px（12px 基础缩进 + 24px = 36px） */
.fl-row-file-2 .fl-file {
  margin-left: 24px;
}

/* 重命名输入框右边缘统一对齐：folder/file-level-2 图标位 60px → 宽 540；
   file-level-1 图标位 36px → 宽 564（保证右侧同样对齐到 600px） */
.fl-row-file-1 .fl-input {
  width: 564px;
}

/* 文本 */
.fl-label {
  display: flex;
  align-self: stretch;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 悬浮态操作区（右侧评论 + 更多） */
.fl-hover-actions {
  display: inline-flex;
  align-items: center;
  gap: 12px; /* 两个操作图标间距 12px */
  flex-shrink: 0;
  margin-left: auto; /* 右对齐 */
}

.fl-hover-icon {
  display: inline-block;
  flex-shrink: 0;
}

/* 重命名输入框：540×36px，brand 蓝 1px 描边 */
.fl-input {
  position: relative;
  flex-shrink: 0; /* 固定宽度，不收缩 */
  box-sizing: border-box;
  width: 540px;
  height: 36px;
  border: 1px solid var(--primary); /* brand 蓝 #0A59F7 */
  border-radius: var(--radius-action);
  background: var(--surface-container-lowest);
}

/* 真实编辑框：透明文本/光标，覆盖整个输入框，负责交互与输入 */
.fl-input-field {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  padding: 0 8px;
  border: none;
  background: transparent;
  color: transparent;
  caret-color: transparent; /* 隐藏原生光标，改用自定义蓝竖线 */
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular);
  line-height: 19px;
  outline: none;
}

/* 可见文本 + 光标层（不接收事件） */
.fl-input-display {
  position: absolute;
  left: 8px;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  pointer-events: none;

      <div className="menuitem-state-group">
        <h3>导航条目状态</h3>
        <div className="menuitem-state-matrix">{NAV_STATES.map(option => <div className="menuitem-state-sample" key={option.value}><span>{option.label}</span><MenuItem variant="nav" items={[{ id: option.value, label: leftLabel, iconSrc: navIconSrc, state: option.value === "default" ? undefined : option.value }]} defaultSelectedId={option.value === "selected" ? option.value : undefined} /></div>)}</div>
      </div>
      <div className="menuitem-state-group">
        <h3>历史对话状态</h3>
        <div className="menuitem-state-matrix">{HISTORY_STATES.map(option => <div className="menuitem-state-sample" key={option.value}><span>{option.label}</span><MenuItem variant="history" items={[{ id: option.value, label: leftLabel, state: option.value === "default" ? undefined : option.value }]} /></div>)}</div>
      </div>
    </section>

    <section className="menuitem-demo-section">
      <div className="menuitem-section-heading"><h2>下拉列表</h2><span>variant="dropdown"</span></div>
      <p>小尺寸分为一般和警告样式；中尺寸可选择“添加”或“分支”前置图标。操作面板用于配置，下方完整展示各形态状态。</p>
      <h3 className="menuitem-configurator-title">Configurator</h3>
      <div className="menuitem-configurator">
        <div className="menuitem-controls">
          <Select label="Size · 尺寸" value={dropdownSize} onChange={value => { setDropdownSize(value); setDropdownState("default"); }} options={[{ value: "sm", label: "小尺寸 · 152 × 32" }, { value: "md", label: "中尺寸 · 232 × 36" }]} />
          {dropdownSize === "sm" && <Select label="Style · 样式" value={dropdownKind} onChange={setDropdownKind} options={[{ value: "general", label: "一般" }, { value: "warning", label: "警告 · 卸载" }]} />}
          <Select label="State · 状态" value={safeDropdownState} onChange={setDropdownState} options={dropdownStates} />
          {dropdownSize === "md" && <><Select label="Icon · 前置图标" value={dropdownIconSrc} onChange={value => { setDropdownIconSrc(value); if (value === MEDIUM_DROPDOWN_ICONS[1].value) setDropdownLabel("feature/project-dashboard"); }} options={dropdownIconOptions} /><UploadIcon label="iconSrc · 上传 SVG" onLoaded={setDropdownIconSrc} /></>}
          <TextInput label="Label · 文本" value={dropdownLabel} onChange={setDropdownLabel} />
        </div>
        <Preview align="left" code={`variant="dropdown" · size="${dropdownSize}" · state="${safeDropdownState}"`}><MenuItem variant="dropdown" size={dropdownSize} items={[{ id: "dropdown", label: isDanger ? "卸载" : dropdownLabel, iconSrc: dropdownSize === "md" ? dropdownIconSrc : isDanger ? "./assets/uploads/icon/menuitem/menuitem-dropdown-danger.svg" : "./assets/uploads/icon/menuitem/menuitem-dropdown-small-general.svg", rawIcon: dropdownSize === "sm", danger: isDanger, disabled: safeDropdownState === "disabled", state: ["default", "disabled"].includes(safeDropdownState) ? undefined : safeDropdownState }]} defaultSelectedId={safeDropdownState === "selected" ? "dropdown" : undefined} /></Preview>
      </div>
      <div className="menuitem-state-group"><h3>小尺寸 · 一般</h3><div className="menuitem-state-matrix">{SMALL_DROPDOWN_STATES.map(option => <div className="menuitem-state-sample" key={option.value}><span>{option.label}</span><MenuItem variant="dropdown" items={[{ id: option.value, label: "新建对话", iconSrc: "./assets/uploads/icon/menuitem/menuitem-dropdown-small-general.svg", rawIcon: true, disabled: option.value === "disabled", state: option.value === "hover" ? "hover" : undefined }]} /></div>)}</div></div>
      <div className="menuitem-state-group"><h3>小尺寸 · 警告</h3><div className="menuitem-state-matrix">{SMALL_DROPDOWN_STATES.map(option => <div className="menuitem-state-sample" key={option.value}><span>{option.label}</span><MenuItem variant="dropdown" items={[{ id: option.value, label: "卸载", iconSrc: "./assets/uploads/icon/menuitem/menuitem-dropdown-danger.svg", rawIcon: true, danger: true, disabled: option.value === "disabled", state: option.value === "hover" ? "hover" : undefined }]} /></div>)}</div></div>
      <div className="menuitem-state-group"><h3>中尺寸</h3><div className="menuitem-state-matrix">{MEDIUM_DROPDOWN_STATES.map(option => <div className="menuitem-state-sample" key={option.value}><span>{option.label}</span><MenuItem variant="dropdown" size="md" items={[{ id: option.value, label: "添加到工作区", iconSrc: MEDIUM_DROPDOWN_ICONS[0].value, disabled: option.value === "disabled", state: option.value === "hover" ? "hover" : option.value === "selected" ? "selected" : undefined }]} defaultSelectedId={option.value === "selected" ? option.value : undefined} /></div>)}</div></div>
    </section>

    <section className="menuitem-demo-section">
      <div className="menuitem-section-heading"><h2>右侧列表</h2><span>variant="folder" / "file-level-*"</span></div>
      <p>通过 `variant` 选择文件夹、一级文件或二级文件；文件名和状态均可编辑。</p>
      <h3 className="menuitem-configurator-title">Configurator</h3>
      <div className="menuitem-configurator">
        <div className="menuitem-controls">
          <Select label="Variant · 小形态" value={rightVariant} onChange={value => { setRightVariant(value); setRightLabel(value === "folder" ? "新建文件夹" : "产品需求文档.docx"); }} options={RIGHT_VARIANTS} />
          <Select label="State · 状态" value={rightState} onChange={setRightState} options={FILE_STATES} />
          <TextInput label="Label · 文本" value={rightLabel} onChange={setRightLabel} />
          {rightVariant === "folder" && <label className="menuitem-control menuitem-toggle"><span>expanded · 展开 / 收起</span><input type="checkbox" checked={folderExpanded} onChange={event => setFolderExpanded(event.target.checked)} /><b>{folderExpanded ? "展开" : "收起"}</b></label>}
        </div>
        <Preview code={`variant="${rightVariant}" · state="${rightState}"`}><MenuItem variant={rightVariant} items={[{ id: "right", label: rightLabel, state: rightState === "default" ? undefined : rightState, expanded: rightVariant === "folder" ? folderExpanded : undefined }]} onToggle={item => setFolderExpanded(item.expanded)} /></Preview>
      </div>
      {rightVariant === "folder" && <p className="menuitem-prop-hint">容器内的第一个图标是展开 / 收起开关；点击它会触发 <code>onToggle</code>，并更新条目的 <code>expanded</code> 值。</p>}
      <div className="menuitem-state-group"><h3>全部状态</h3><div className="menuitem-state-matrix menuitem-state-matrix--single">{FILE_STATES.map(option => <div className="menuitem-state-sample" key={option.value}><span>{option.label}</span><MenuItem variant={rightVariant} items={[{ id: option.value, label: rightLabel, state: option.value === "default" ? undefined : option.value }]} defaultExpanded /></div>)}</div></div>
    </section>
    <TokenPanel />
  </div>;
}
  Object.assign(__export, { Demo });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.Demo));
</script>
</body>
</html>
