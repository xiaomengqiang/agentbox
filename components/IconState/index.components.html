  /* 8. Font Size（字号，px） */

  --line-height-none: 1;

  --outline-width-none: 0px;

/* ── body base ── */
body {
  margin: 0;
  line-height: 1.5;
  color: var(--on-surface);
  font-family: var(--font-family);
  background-color: var(--surface);
}

#root {
  min-height: 100vh;
}

/* Standard scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
  background-color: transparent;
}

::-webkit-scrollbar-corner {
  background-color: transparent;
}

::-webkit-scrollbar-track {
  background-color: transparent;
}

::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background-color: var(--color-comp-divider);
  background-clip: padding-box;
}

::-webkit-scrollbar-track-piece {
  background-color: transparent;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--primary-40);
}


/* 语义层 Light Mode（:root 默认主题）*/
:root {
  /* Font Color（文本色）*/
  --color-font-primary: var(--primary-90);
  --color-font-secondary: var(--primary-60);
  --color-font-tertiary: var(--primary-40);
  --color-font-fourth: var(--primary-20);
  --color-font-emphasize: var(--brand-font); 
  --color-font-on-primary: var(--on-primary);
  --color-font-on-secondary: var(--on-primary-60);
  --color-font-on-tertiary: var(--on-primary-40);
  --color-font-on-fourth: var(--on-primary-20);

  /* Background Color（背景色）*/
  --color-background-primary: var(--white);
  --color-background-secondary: var(--gray-01);
  --color-background-tertiary: var(--gray-02);
  --color-background-fourth: var(--gray-03);
  --color-background-emphasize: var(--brand);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--white);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-05);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary); 
  --color-comp-background-gray: var(--gray-01); 
  --color-comp-background-gray-secondary: var(--gray-01);
  --color-fg-unchecked: var(--on-primary-20);
  --color-comp-divider: var(--container-20); 

  /* Comp Border Color（组件边框色）*/
  --color-comp-border: var(--container-15); 
  --color-comp-border-hover: var(--container-20); 
  --color-comp-border-focus: var(--brand); 
  --color-comp-border-active: var(--brand); 
  --color-comp-border-disabled: var(--container-10); 

  /* Icon Color（图标色）*/
  --color-icon-primary: var(--primary-90);
  --color-icon-secondary: var(--primary-60);
  --color-icon-tertiary: var(--primary-40);
  --color-icon-fourth: var(--primary-20);
  --color-icon-emphasize: var(--brand-font);
  --color-icon-sub-emphasize: var(--brand-40);
  --color-icon-on-primary: var(--on-primary);
  --color-icon-on-secondary: var(--on-primary-60);
  --color-icon-on-tertiary: var(--on-primary-40);
  --color-icon-on-fourth: var(--on-primary-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-05); 
  --color-interactive-pressed: var(--container-10);
  --color-interactive-select: var(--brand-20); 
  --color-interactive-click: var(--container-10);

  /* Functional Color（功能色，设计师指定值，独立于 multi-color 色板）*/
  --color-error: #E84026;
  --color-alert: #ED6F21;
  --color-warning: #EFBF00;
  --color-success: #64BB5C;
  --color-info: #0A59F7;
  --color-error-container: #FDEBEB;
  --color-alert-container: #FFF0E6;
  --color-warning-container: #FFF7D6;
  --color-success-container: #EDF7EB;
  --color-info-container: #E6EEFE;

  /* Shadow（阴影）*/
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.1);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.12);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.06);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.08);
  --shadow-glow: 0 4px 32px 0 rgba(241, 243, 245, 0.8);
}


/* ==========================================================================
   主题层 Theme（AI 组件直接消费的终极语义层）
   加载顺序：base → light → theme → dark*/

:root {
  /* ── primary（品牌色族，部分占位）── */
  --primary: var(--brand);
  --on-primary: var(--white);
  --primary-hover: var(--brand-80); 
  --primary-active: var(--brand); 
  --primary-disabled: var(--brand-40);
  --primary-container: var(--brand-05); 
  --on-primary-container: var(--color-font-primary);

  /* ── surface / on-surface（已重写，引用新 light/dark 语义 token）── */
  --surface: var(--color-background-secondary);
  --surface-dim: var(--color-background-tertiary);
  --surface-bright: var(--color-background-primary);
  --on-surface: var(--color-font-primary);
  --surface-container-lowest: var(--color-background-primary);
  --surface-container-low: var(--color-background-secondary);
  --surface-container: var(--color-comp-background-tertiary);
  --surface-container-high: var(--color-background-tertiary);
  --surface-container-highest: var(--color-background-fourth);

  --inverse-surface: var(--primary);
  --inverse-on-surface: var(--color-font-on-primary);
  --inverse-on-surface-variant: var(--color-font-on-secondary);
  --inverse-primary: var(--brand);

  --error: var(--color-error);
  --on-error: var(--white);
  --error-container: var(--color-error-container);
  --on-error-container: var(--color-font-primary);

  --alert: var(--color-alert);
  --on-alert: var(--white);
  --alert-container: var(--color-alert-container);
  --on-alert-container: var(--color-font-primary);

  --warning: var(--color-warning);
  --on-warning: var(--black);
  --warning-container: var(--color-warning-container);
  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);
  --on-success: var(--white);
  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);
  --on-info: var(--white);
  --info-container: var(--color-info-container);
  --on-info-container: var(--color-font-primary);

  --text-secondary: var(--color-font-secondary);
  --text-placeholder: var(--color-font-tertiary);
  --text-disabled: var(--color-font-fourth);
  --text-inverse-disabled: var(--color-font-on-fourth);
  
  --interactive-link: var(--brand);
  --interactive-link-hover: var(--brand-80);
  --interactive-link-active: var(--brand);
  --interactive-link-visited: var(--brand);
  --interactive-link-disabled: var(--brand-40);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: var(--outline-width-base); /* 1px */
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（排印角色：字号+行高+字体族绑定，字重在其后组合）── */
  /* Display（展示文本）*/
  --font-display-sm: var(--font-size-4xl)/var(--line-height-tight) var(--font-family); /* 38px/1.25 */
  --font-display-md: var(--font-size-5xl)/var(--line-height-tight) var(--font-family); /* 48px/1.25 */
  --font-display-lg: var(--font-size-6xl)/var(--line-height-tight) var(--font-family); /* 56px/1.25 */

  /* Title（标题）*/
  --font-title-sm: var(--font-size-xl)/var(--line-height-snug) var(--font-family); /* 20px/1.375 */
  --font-title-md: var(--font-size-2xl)/var(--line-height-snug) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/var(--line-height-snug) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/

.demo-header { margin-bottom: 48px; }

.iconstate-configurator {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, .8fr);
  gap: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}
.iconstate-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(150px, 1fr));
  gap: 18px 20px;
  align-content: start;
}
.iconstate-control {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}
.iconstate-control select,
.iconstate-control input {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
  padding: 0 12px;
}
.iconstate-control select { cursor: pointer; }
.iconstate-control input[type="color"] { padding: 4px; cursor: pointer; }
.iconstate-control input[type="file"] { height: auto; min-height: 40px; padding: 7px 8px; cursor: pointer; }
.iconstate-control input:focus-visible,
.iconstate-control select:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}
.iconstate-control small {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
  overflow-wrap: anywhere;
}
.iconstate-live {
  display: flex;
  min-width: 0;
  min-height: 180px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  box-sizing: border-box;
  padding: 24px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}
.iconstate-live-label {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
  letter-spacing: .08em;
}
.iconstate-live code {
  max-width: 100%;
  overflow-wrap: anywhere;
  text-align: center;
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}
.iconstate-gallery-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 32px 0 16px;
}
.iconstate-state-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.iconstate-state-card {
  display: flex;
  min-height: 112px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}
.iconstate-state-card span {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}
@media (max-width: 980px) {
  .iconstate-configurator { grid-template-columns: 1fr; }
  .iconstate-live { min-height: 132px; }
}

  .iconstate-controls { grid-template-columns: 1fr; }

}

  .demo-page { padding: 32px 16px 64px; }
}

  columns: "./assets/uploads/icon-columns.svg",
  fullscreen: "./assets/uploads/icon-fullscreen.svg",
  sidebar: "./assets/uploads/icon-sidebar.svg",
  // 对话框 icon 使用透明背景的 glyph，框颜色由 frameColor 控制。
  "dialog-glyph": "./assets/uploads/icon-dialog-glyph.svg",
  "dialog-pause": "./assets/uploads/icon-dialog-pause.svg",
  "dialog-add": "./assets/uploads/icon-dialog-add.svg",
  "dialog-add-active": "./assets/uploads/icon-dialog-add-active.svg",
};
const DIALOG_ICON_NAMES = new Set(["dialog-glyph", "dialog-pause", "dialog-add"]);

// 圆形框预设颜色
const FRAME_COLORS = {
  black: "#000000",
  gray: "transparent",
};

// 图标状态组件：默认 / 悬浮 / 激活 / 禁用 四种状态。
// variant 控制外形：square（方形框，默认）/ circle（圆形框）。
function IconState({
  size = 32,
  iconSize,
  icon,
  src,
  variant = "square",
  frameColor,
  iconColor,
  disabled = false,
  active = false,
  state,
  onClick,
  ariaLabel = "icon",
}) {
  // 对话框只支持发送、暂停和加号；栏目 icon 支持内置图标和自定义 SVG。
  const isCircle = variant === "circle";
  const selectedIcon = isCircle
    ? (DIALOG_ICON_NAMES.has(icon) ? icon : "dialog-glyph")
    : icon || "search";
  const baseIconSrc = (!isCircle && src) || ICON_SRC[selectedIcon] || ICON_SRC.search;

  // 视觉状态优先级：显式 state > disabled/active 布尔 > default
  const visualState =
    state || (disabled ? "disabled" : active ? "active" : "default");
  const isDisabled = visualState === "disabled";
  const isActiveAdd = isCircle && selectedIcon === "dialog-add" && visualState === "active";
  const iconSrc = isActiveAdd ? ICON_SRC["dialog-add-active"] : baseIconSrc;
  const renderedIconSize = iconSize ?? (isCircle ? (isActiveAdd ? 23 : 32) : 20);

  // gray 默认透明；black 为纯黑；也支持任意 CSS 色值（如 "#0A59F7"）。
  const selectedFrameColor = frameColor || "gray";
  const bgColor = isCircle ? FRAME_COLORS[selectedFrameColor] || selectedFrameColor : undefined;
  const foreground = iconColor || (selectedFrameColor === "gray" ? "var(--color-icon-primary)" : "#FFFFFF");

  return (
    <button
      type="button"
      className={`is-btn is-btn--${variant} is-btn--${visualState}${state ? " is-btn--forced" : ""}${isCircle ? ` is-btn--frame-${selectedFrameColor === "gray" || selectedFrameColor === "black" ? selectedFrameColor : "custom"}` : ""}${isCircle && selectedFrameColor !== "gray" ? " is-btn--frame-dark" : ""}`}
      style={{
        width: size,
        height: size,
        backgroundColor: bgColor,
      }}
      disabled={isDisabled}
      onClick={onClick}
      aria-label={ariaLabel}
      aria-disabled={isDisabled}
    >
      {isCircle ? (
        <span
          className="is-icon is-icon--mask"
          style={{
            width: renderedIconSize,
            height: renderedIconSize,
            color: foreground,
            WebkitMaskImage: `url("${iconSrc}")`,
            maskImage: `url("${iconSrc}")`,
          }}
          aria-hidden="true"
        />
      ) : (
        <Icon src={iconSrc} size={renderedIconSize} className="is-icon" />
      )}
    </button>
  );
}
  Object.assign(__export, { IconState });
})();

/* ===== demo.jsx ===== */
(function () {
  const { useState } = React;
  const { IconState } = __export;
const STATES = [
  { value: "default", label: "默认" },
  { value: "hover", label: "悬浮" },
  { value: "active", label: "点击 / 激活" },
  { value: "disabled", label: "禁用" },
];
const COLUMN_ICONS = ["search", "menu", "columns", "fullscreen", "sidebar"];
const DIALOG_ICONS = [
  { value: "dialog-glyph", label: "发送" },
  { value: "dialog-pause", label: "暂停" },
  { value: "dialog-add", label: "加号" },
];

function Select({ label, value, onChange, options }) {
  return <label className="iconstate-control"><span>{label}</span><select value={value} onChange={event => onChange(event.target.value)}>{options.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}</select></label>;
}

function uploadSvg(event, onLoaded, onError) {
  const file = event.target.files?.[0];
  if (!file) return;
  event.target.value = "";
  if (file.type !== "image/svg+xml" && !/\.svg$/i.test(file.name)) {
    onError("请选择 SVG 文件。");
    return;
  }
  const reader = new FileReader();
  reader.onload = () => onLoaded({ name: file.name, src: String(reader.result) });
  reader.onerror = () => onError("读取 SVG 失败，请重试。");
  reader.readAsDataURL(file);
}

function UploadControl({ label, uploaded, onLoaded, error, onError }) {
  return <label className="iconstate-control iconstate-upload"><span>{label}</span><input type="file" accept=".svg,image/svg+xml" onChange={event => uploadSvg(event, onLoaded, onError)} /><small>{error || (uploaded ? `已载入 ${uploaded.name}` : "选择 SVG 后自动切换为自定义图标")}</small></label>;
}

function StateGallery({ variant, icon, src, iconSize, frameColor, iconColor }) {
  return <div className="iconstate-state-grid">{STATES.map(item => <div className="iconstate-state-card" key={item.value} inert=""><IconState variant={variant} icon={icon} src={src} iconSize={iconSize} frameColor={frameColor} iconColor={iconColor} state={item.value} ariaLabel={`${variant} ${item.label}`} /><span>{item.label}</span></div>)}</div>;
}

function Demo() {
  const [columnIcon, setColumnIcon] = useState("search");
  const [columnSize, setColumnSize] = useState(20);
  const [columnState, setColumnState] = useState("default");
  const [columnUpload, setColumnUpload] = useState(null);
  const [columnError, setColumnError] = useState("");
  const [dialogIcon, setDialogIcon] = useState("dialog-glyph");
  const [dialogState, setDialogState] = useState("default");
  const [frameMode, setFrameMode] = useState("gray");
  const [customColor, setCustomColor] = useState("#0A59F7");
  const frameColor = frameMode === "custom" ? customColor : frameMode;
  const columnSrc = columnIcon === "custom" ? columnUpload?.src : undefined;
  const columnOptions = [...COLUMN_ICONS.map(icon => ({ value: icon, label: icon })), ...(columnUpload ? [{ value: "custom", label: `上传 · ${columnUpload.name}` }] : [])];

  return <div className="demo-page">
    <header className="demo-header"><h1 className="demo-title">IconState 图标状态</h1><p className="demo-subtitle">两类图标分别配置；选择项直接传给 IconState 的 props。</p></header>

    <section className="demo-section">
      <div className="demo-section-header"><h2 className="demo-section-name">栏目 icon</h2><span className="demo-section-tag">Square · 32px</span></div>
      <p className="demo-section-desc">选择状态、20px / 16px 图标尺寸和内置图标，也可以上传自己的 SVG。</p>
      <div className="iconstate-configurator">
        <div className="iconstate-controls">
          <Select label="State · 状态" value={columnState} onChange={setColumnState} options={STATES} />
          <Select label="Icon size · 图标大小" value={String(columnSize)} onChange={value => setColumnSize(Number(value))} options={[{ value: "20", label: "20px" }, { value: "16", label: "16px" }]} />
          <Select label="Icon · 图标" value={columnIcon} onChange={setColumnIcon} options={columnOptions} />
          <UploadControl label="Upload SVG · 上传图标" uploaded={columnUpload} error={columnError} onError={setColumnError} onLoaded={file => { setColumnUpload(file); setColumnIcon("custom"); setColumnError(""); }} />
        </div>
        <div className="iconstate-live"><span className="iconstate-live-label">LIVE PREVIEW</span><IconState variant="square" icon={columnIcon} src={columnSrc} iconSize={columnSize} state={columnState} ariaLabel={`栏目 ${columnIcon} ${columnState}`} /><code>variant="square" · iconSize={'{'}{columnSize}{'}'} · state="{columnState}"</code></div>
      </div>
      <h3 className="iconstate-gallery-title">State matrix · {columnIcon === "custom" ? columnUpload?.name : columnIcon}</h3>
      <StateGallery variant="square" icon={columnIcon} src={columnSrc} iconSize={columnSize} />
    </section>

    <section className="demo-section">
      <div className="demo-section-header"><h2 className="demo-section-name">对话框 icon</h2><span className="demo-section-tag">Circle · 32px</span></div>
      <p className="demo-section-desc">圆形框颜色、状态和图标可选择。灰色默认透明，悬浮和激活使用 5% 黑色背景。</p>
      <div className="iconstate-configurator">
        <div className="iconstate-controls">
          <Select label="Frame color · 框颜色" value={frameMode} onChange={setFrameMode} options={[{ value: "gray", label: "灰色" }, { value: "black", label: "黑色" }, { value: "custom", label: "自定义颜色" }]} />
          {frameMode === "custom" ? <label className="iconstate-control"><span>Custom color · 自定义色值</span><input type="color" value={customColor} onChange={event => setCustomColor(event.target.value)} /></label> : null}
          <Select label="State · 状态" value={dialogState} onChange={setDialogState} options={STATES} />
          <Select label="Icon · 图标" value={dialogIcon} onChange={setDialogIcon} options={DIALOG_ICONS} />
        </div>
        <div className="iconstate-live"><span className="iconstate-live-label">LIVE PREVIEW</span><IconState variant="circle" icon={dialogIcon} frameColor={frameColor} state={dialogState} ariaLabel={`对话框 ${DIALOG_ICONS.find(item => item.value === dialogIcon)?.label} ${dialogState}`} /><code>variant="circle" · icon="{dialogIcon}" · frameColor="{frameColor}" · state="{dialogState}"</code></div>
      </div>
      <h3 className="iconstate-gallery-title">State matrix · {DIALOG_ICONS.find(item => item.value === dialogIcon)?.label}</h3>
      <StateGallery variant="circle" icon={dialogIcon} frameColor={frameColor} />
    </section>
  </div>;
}
  Object.assign(__export, { Demo });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.Demo));
</script>
</body>
</html>
