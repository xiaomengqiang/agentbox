.demo-page {
max-width: 1400px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

.demo-header {
margin-bottom: 48px;
}

.demo-title {
display: flex;
  align-items: center;
  gap: 10px;
  font: var(--font-title-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 8px;
}

.demo-title-icon {
color: var(--primary);
}

.demo-subtitle {
font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0;
}

.demo-section {
margin-bottom: 64px;
}

.demo-section-header {
display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.demo-section-name {
font: var(--font-title-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.demo-section-tag {
display: inline-flex;
  align-items: center;
  gap: 4px;
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--primary);
  background-color: var(--primary-container);
  padding: 2px 10px;
  border-radius: var(--radius-full);
}

.demo-section-desc {
font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0 0 28px;
}

.demo-grid {
display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 32px;
  align-items: start;
}

.demo-grid-2 {
grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 48px 40px;
}

.demo-card {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
grid-column: 1 / -1;
}

.demo-card-flush {
padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
margin: 0;
}

.demo-card-title {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
min-width: 0;
}

.demo-item-title {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

code {
font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--color-font-emphasize);
  background-color: var(--surface-container);
  padding: 1px 5px;
  border-radius: var(--radius-xs);
}

.button-theme-toggle {
margin-top: 16px;
}

.button-configurator {
display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.button-controls {
display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.button-control {
display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
padding: 0 12px;
}

.button-control input::placeholder {
color: var(--text-placeholder);
}

.button-select-wrap {
position: relative;
  display: block;
}

.button-select-wrap::after {
content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-control select:disabled {
cursor: not-allowed;
  opacity: 0.5;
}

.button-toggle-line {
display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
color: var(--on-surface);
  font: var(--font-body-md);
}

.button-icon-select {
margin-top: 0;
}

.button-switch {
position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {
display: flex;
  min-height: 220px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

@media (max-width: 980px) {
.button-configurator {
grid-template-columns: 1fr;
}

.button-configurator-preview {
min-height: 132px;
}

}

@media (max-width: 760px) {
.button-controls {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

}

@media (max-width: 520px) {
.button-controls {
grid-template-columns: 1fr;
}

}

.btn-lab {
display: flex;
  flex-direction: column;
  gap: 32px;
}

.btn-lab-block {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 20px 24px 24px;
}

.btn-lab-head {
display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.btn-lab-size {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-spec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-lab-grid {
display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

@media (max-width: 860px) {
.btn-lab-grid {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

}

.btn-lab-col {
display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  padding: 14px 12px 18px;
  background-color: var(--surface-container-low);
  border-radius: var(--radius-container);
}

.btn-lab-colhead {
display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 16px;
  text-align: center;
}

.btn-lab-colname {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-colmeta {
font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-lab-slot {
display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.btn-lab-slot-off {
margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--divider);
}

.btn-lab-slotlabel {
font: var(--font-caption-md);
  font-weight: var(--font-weight-bold);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-placeholder);
}

.btn-lab-grid--two {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

.btn-matrix {
display: flex;
  flex-direction: column;
  gap: 24px;
}

.btn-matrix-group {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 16px 20px 20px;
  overflow-x: auto;
}

.btn-matrix-grouphead {
display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--divider);
}

.btn-matrix-groupname {
font: var(--font-subtitle-md);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-groupspec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-matrix-row {
display: grid;
  grid-template-columns: minmax(150px, 200px) repeat(5, minmax(140px, 1fr));
  gap: 8px;
  align-items: center;
  padding: 10px 0;
}

.btn-matrix-row + .btn-matrix-row {
border-top: 1px solid var(--divider);
}

.btn-matrix-row-head {
padding-bottom: 4px;
}

.btn-matrix-label {
display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.btn-matrix-variant {
font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.btn-matrix-meta {
font: var(--font-caption-lg);
  color: var(--text-placeholder);
}

.btn-matrix-cell {
display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 44px;
  
  pointer-events: none;
}

.btn-matrix-state {
font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-hint {
font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-table {
width: 100%;
  border-collapse: collapse;
  margin-top: 24px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.btn-table th {
font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  background-color: var(--surface-container-low);
}

.btn-table td {
font: var(--font-body-md);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  border-top: 1px solid var(--divider);
}

.btn-table-strong {
display: block;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.btn-table-src {
display: block;
  margin-top: 4px;
  font: var(--font-caption-md);
  color: var(--text-placeholder);
  line-height: 1.5;
}

.btn-table-wrap {
overflow-x: auto;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-table-wrap .btn-table {
min-width: 900px;
  border-radius: 0;
  box-shadow: none;
  margin-top: 0;
}

.btn-table-wrap .btn-table--color {
min-width: 1180px;
}

.btn-table-wrap .btn-table--roomy {
min-width: 920px;
}

.btn-table-wrap--spaced {
margin-top: 24px;
}

.btn-table--roomy th,
.btn-table--roomy td {
min-width: 110px;
}

.btn-table--color th:first-child,
.btn-table--color td:first-child {
min-width: 112px;
}

.btn-table--color th:not(:first-child),
.btn-table--color td:not(:first-child) {
min-width: 130px;
}

.btn-color-token {
display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.btn-color-token code {
white-space: normal;
  overflow-wrap: anywhere;
}

.btn-table .btn-color-variant {
vertical-align: top;
  color: var(--on-surface);
  font: var(--font-body-lg);
  font-weight: var(--font-weight-bold);
  background: var(--surface-container-low);
  border-top: 1px solid var(--divider);
}

.btn-table .btn-color-state {
min-width: 110px;
  vertical-align: top;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.btn-color-state small {
display: block;
  margin-top: 4px;
  color: var(--text-placeholder);
  font: var(--font-caption-md);
  font-weight: var(--font-weight-regular);
  white-space: nowrap;
}

.btn-color-same {
color: var(--text-placeholder);
  font: var(--font-body-md);
}

.btn-color-group-start > th,
.btn-color-group-start > td {
border-top: 2px solid var(--color-comp-border);
}

.btn-color-swatch {
display: inline-block;
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  box-sizing: border-box;
  border: 1px solid var(--color-comp-border);
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--surface-container-lowest);
}

.btn-color-swatch--transparent {
background-color: var(--surface-container-lowest);
  background-image:
    linear-gradient(45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(-45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--divider) 75%),
    linear-gradient(-45deg, transparent 75%, var(--divider) 75%);
  background-position: 0 0, 0 5px, 5px -5px, -5px 0;
  background-size: 10px 10px;
}

.btn-color-swatch--none {
background:
    linear-gradient(
      135deg,
      transparent 44%,
      var(--text-placeholder) 46%,
      var(--text-placeholder) 54%,
      transparent 56%
    ),
    var(--surface-container-lowest);
}

.btn-color-swatch--disabled {
opacity: 0.5;
}


.search-demo-live {
min-width:0; padding:32px; box-sizing:border-box;
}

.search-demo-notice {
font:var(--font-caption-lg); color:var(--text-secondary); min-height:20px; overflow-wrap:anywhere;
}

.search-demo-gallery {
display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px;

@scope (.preview-tag) {
/* ===== Tag =====
   三种形态：diff 增删标签 / icon 图标文字标签 / tab 可选中圆角标签 */

.tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: auto;

    color var(--duration-fast) var(--ease-standard);
}

.tag__icon {

}

/* ── 1. 代码增删标签：12px 文字 / 18px 行高，左右内边距 4px、上下 0，全圆角（999px）──
   上下内边距为 0，标签高度即行高 18px；行高显式写死 18px，
   避免日后调整字号时被 font 简写的比例行高带偏。 */
.tag--diff-add,
.tag--diff-remove {
  padding: 0 4px;
  border-radius: var(--radius-full); /* 999px */
  font: var(--font-caption-lg); /* 12px / 1.5 */
  line-height: 18px;
}

/* 用户指定色：绿底绿字 / 红底红字 */

  background-color: #D5F2DC;
  color: #01802B;
}

.tag--diff-remove {
  background-color: #FCE3E0;
  color: #BF0A1C;
}

/* 增删一体容器：绿 + 红两个标签固定成对，间距 4px */
.tag-diff-pair {
  display: inline-flex;
  align-items: center;
  width: auto;
}

/* ── 2. 图标 + 文字标签：14px 图标 + 12px 文字，间距 4px，container5 底色，8/4 内边距 ── */
.tag--icon {
  gap: 4px;
  padding: 4px 8px;
  border-radius: var(--radius-badge);
  background-color: var(--container-05);
  color: var(--color-font-primary);
  font: var(--font-caption-lg); /* 12px / 1.5 */
  line-height: 16px;
}

.tag--icon .tag__icon {
  color: var(--color-icon-primary);
}

/* ── 3. 可选中圆角标签：16px 图标 + 16px 文字 / 20px 行高，间距 6px，16/8 内边距 ──
   行高按规格固定 20px（非 16×1.5），标签高度 = 20 + 8×2 = 36px。 */
.tag--tab {
  --tag-tab-bg: var(--color-comp-background-tertiary);
  --tag-tab-bg-hover: var(--container-10);
  --tag-tab-bg-selected: var(--container-90);
  --tag-tab-bg-selected-hover: var(--container-80);

  gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius-3xl); /* 20px */
  background-color: var(--tag-tab-bg);
  color: var(--color-font-secondary);
  font: var(--font-body-lg); /* 16px / 1.5 */
  line-height: 20px; /* 规格：行高 20px */
  font-weight: var(--font-weight-regular);
  cursor: pointer;
}

.tag--tab .tag__icon {
  color: var(--container-60);
}

.tag--tab:hover:not(.tag--disabled):not(.tag--static) {
  background-color: var(--tag-tab-bg-hover);
}

.tag--tab:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 禁用态：静态形态（span）与交互形态（button）表现一致 */
.tag--tab.tag--disabled {
  color: var(--text-disabled);
  cursor: not-allowed;
}

.tag--tab.tag--disabled .tag__icon {
  color: var(--text-disabled);
}

/* 选中态：container90 底 + font_on_primary 文字 + Medium 字重 */

  background-color: var(--tag-tab-bg-selected);
  color: var(--color-font-on-primary);
  font-weight: var(--font-weight-medium);
}

.tag--tab.tag--selected .tag__icon {
  color: var(--color-icon-on-primary);
}

  background-color: var(--tag-tab-bg-selected-hover);
}

/* 静态形态：仅展示，不响应 hover、不显示手型 */
.tag--tab.tag--static {
  cursor: default;

font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--color-font-emphasize);
  background-color: var(--surface-container);
  padding: 1px 5px;
  border-radius: var(--radius-xs);
}

.button-theme-toggle {
margin-top: 16px;
}

.button-configurator {
display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.button-controls {
display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.button-control {
display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
padding: 0 12px;
}

.button-control input::placeholder {
color: var(--text-placeholder);
}

.button-select-wrap {
position: relative;
  display: block;
}

.button-select-wrap::after {
content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-control select:disabled {
cursor: not-allowed;
  opacity: 0.5;
}

.button-toggle-line {
display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
color: var(--on-surface);
  font: var(--font-body-md);
}

.button-icon-select {
margin-top: 0;
}

.button-switch {
position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {
display: flex;
  min-height: 220px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

grid-template-columns: 1fr;

}

@media (max-width: 760px) {

grid-template-columns: repeat(2, minmax(0, 1fr));

}

@media (max-width: 520px) {

@scope (.preview-menuitem) {
.mi-menu {
  /* 警告卸载为设计指定色值，集中为组件 token，供文本、图标和背景一致引用。 */
  --mi-danger-font: #E02128;
  --mi-danger-icon: #E02128;
  --mi-danger-container: #FEE7E8;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* ---------- 导航内容列表（nav） ---------- */
.mi-menu-nav {
  width: 300px;
  padding: 0;
  gap: 12px;
  border-radius: var(--radius-overlay);
}

/* 无背景形态：用于单条目状态演示 */
.mi-menu-nav.mi-menu-plain {
  background: transparent;
}

/* ---------- 历史对话列表（history） ---------- */
.mi-menu-history {
  width: 300px;
  gap: 12px;
}

/* ---------- 下拉列表（dropdown） ---------- */
.mi-menu-dropdown {
  gap: 0; /* 单行条目紧贴无间距 */
}

/* 中尺寸下拉列表容器：单行条目 */
.mi-menu-dropdown-md {
  gap: 0;
}

/* ================= 条目基础 ================= */
.mi-item {
  display: flex;
  align-items: center;
  box-sizing: border-box;
  border: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

/* ---- 导航内容列表条目 ---- */
.mi-item-nav {
  gap: 8px; /* 图标与文本间距 8px */
  width: 100%; /* 300px */
  height: 40px;
  padding: 0 12px; /* 图标距左 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
}

/* ---- 历史对话列表条目 ---- */
.mi-item-history {
  justify-content: space-between;
  width: 100%; /* 300px */
  height: 40px;
  padding: 0 12px; /* 文本距左 12px，图标距右 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
}

/* ---- 下拉列表条目 ---- */
.mi-item-dropdown {
  gap: var(--spacing-inline);
  width: 152px;
  height: 32px;
  padding: 4px 12px; /* 文本与图标距容器上下各 4px */
  border-radius: var(--radius-md); /* 6px */
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px；文本行高在下方固定为 16px */
  font-weight: var(--font-weight-regular); /* 400 */
}

/* ---- 下拉列表中尺寸条目：232×36px ---- */
.mi-item-dropdown-md {
  gap: var(--spacing-inline); /* 文本与 icon 间距 8px */
  width: 232px;
  height: 36px;
  padding: 4px 12px; /* icon 距容器左 12px，文本与图标距上下各 4px */
  border-radius: var(--radius-md); /* 6px */
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px；文本行高在下方固定为 16px */
  font-weight: var(--font-weight-regular); /* 400 */
  background: var(--surface-container-lowest);
}

/* ================= 状态 ================= */
/* 导航内容列表 / 历史对话列表：悬浮、选中、非默认态均 5% 透明黑背景 */
.mi-item-nav:hover,
.mi-item-nav.mi-item-hover,
.mi-item-nav.mi-item-selected,
.mi-item-history:hover,
.mi-item-history.mi-item-active {
  background-color: var(--color-interactive-hover);
}

/* 下拉列表普通项悬浮：5% 透明黑背景 */
.mi-item-dropdown:not(:disabled):hover,
.mi-item-dropdown.mi-item-hover:not(:disabled) {
  background-color: var(--color-interactive-hover);
}

/* 下拉列表危险项：错误语义色图标与文本 */
.mi-item-dropdown.mi-item-danger {
  color: var(--mi-danger-font);
}

/* 下拉列表危险项悬浮：设计指定粉色背景 token。 */
.mi-item-dropdown.mi-item-danger:not(:disabled):hover,
.mi-item-dropdown.mi-item-danger.mi-item-hover:not(:disabled) {
  background-color: var(--mi-danger-container);
}

/* 下拉列表禁用态：整体 50% 透明度，不可点击 */
.mi-item-dropdown:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ================= 子元素 ================= */
.mi-icon {
  flex-shrink: 0;
  display: block;
}

.mi-icon--mask {
  background-color: currentColor;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  -webkit-mask-size: contain;
  mask-size: contain;
}

/* 中尺寸下拉列表选中态右侧「正确」图标：右对齐 */
.mi-check {
  flex-shrink: 0;
  margin-left: auto;
}

.mi-label {
  display: flex;
  align-self: stretch;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 下拉列表：文本 16px 行高，与 14px / 17px 图标在同一 flex 中轴居中。 */
.mi-item-dropdown .mi-label,
.mi-item-dropdown-md .mi-label {
  line-height: 16px;
  transform: translateY(1px); /* 字体上行区较大，做 1px 光学校正以落在视觉中轴 */
}

.mi-item-history .mi-label {
  text-align: left;
}

/* 左侧导航文字的字形视觉重心略高，向下校正 1px。 */
.mi-item-nav .mi-label {
  transform: translateY(1px);
}

/* 历史对话列表右侧状态图标：右对齐 12px（由按钮 padding 提供），上下 8px */
.mi-status {
  flex-shrink: 0;
  margin: 8px 0;
}

/* ================= 文件夹 / 文件列表（folder / file-level-1 / file-level-2） ================= */
.fl-list {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* 条目：602×40px */
.fl-row {
  display: flex;
  align-items: center;
  gap: 8px; /* 展开/收起图标 → 文件夹图标 → 文本，三部件间距 8px */
  box-sizing: border-box;
  width: 602px;
  height: 40px;
  padding: 0 12px; /* 内容距容器左右 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

/* 悬浮态：5% 透明黑背景 */
.fl-row:hover,
.fl-row-hover {
  background-color: var(--color-interactive-hover);
}

/* 重命名态 / 重命名输入中：5% 透明黑背景（与悬浮一致） */
.fl-row-rename {
  background-color: var(--color-interactive-hover);
}

/* 禁用态：文本与图标整体使用禁用色，不可交互 */
.fl-row-disabled {
  color: var(--text-disabled);
}

/* 展开/收起按钮 */
.fl-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  color: inherit; /* 跟随条目文字色（Lucide 图标 stroke 使用 currentColor） */
}

.fl-toggle:disabled {
  cursor: not-allowed;
}

.fl-chevron,
.fl-folder,
.fl-file {
  flex-shrink: 0;
  color: inherit;
}

/* 文件列表：一级/二级 左侧图标缩进 */
/* 一级文件列表：最左侧文件图标距外框左 12px（无展开/收起，直接由 padding 0 12px 对齐） */
.fl-row-file-1 .fl-file {
  margin-left: 0;
}

/* 二级文件列表：最左侧文件图标距外框左 36px（12px 基础缩进 + 24px = 36px） */

}

/* 重命名输入框右边缘统一对齐：folder/file-level-2 图标位 60px → 宽 540；

.fl-row-file-1 .fl-input {
  width: 564px;
}

/* 文本 */
.fl-label {
  display: flex;
  align-self: stretch;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 悬浮态操作区（右侧评论 + 更多） */
.fl-hover-actions {
  display: inline-flex;
  align-items: center;
  gap: 12px; /* 两个操作图标间距 12px */
  flex-shrink: 0;
  margin-left: auto; /* 右对齐 */
}

.fl-hover-icon {
  display: inline-block;
  flex-shrink: 0;
}

/* 重命名输入框：540×36px，brand 蓝 1px 描边 */
.fl-input {
  position: relative;
  flex-shrink: 0; /* 固定宽度，不收缩 */

  width: 540px;
  height: 36px;
  border: 1px solid var(--primary); /* brand 蓝 #0A59F7 */
  border-radius: var(--radius-action);
  background: var(--surface-container-lowest);
}

/* 真实编辑框：透明文本/光标，覆盖整个输入框，负责交互与输入 */
.fl-input-field {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  padding: 0 8px;
  border: none;
  background: transparent;
  color: transparent;
  caret-color: transparent; /* 隐藏原生光标，改用自定义蓝竖线 */
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular);
  line-height: 19px;
  outline: none;
}

/* 可见文本 + 光标层（不接收事件） */
.fl-input-display {
  position: absolute;
  left: 8px;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  pointer-events: none;
  font: var(--font-body-md);
  font-weight: var(--font-weight-regular);
  line-height: 19px;
  color: var(--on-surface);
}

/* 蓝色竖线光标：2×24px，文本后 2px（重命名输入中显示） */
.fl-caret {
  display: inline-block;
  flex-shrink: 0;
  width: 2px;
  height: 24px;
  margin-left: 2px;
  vertical-align: middle;
  background: var(--primary);
}
