/* Standard scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
  background-color: transparent;
}

  background-color: transparent;
}

  background-color: transparent;
}

::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background-color: var(--color-comp-divider);
  background-clip: padding-box;
}

  background-color: transparent;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--primary-40);
}

/* ==========================================================================
   主题层 Theme（AI 组件直接消费的终极语义层）
   加载顺序：base → light → theme → dark*/

:root {
  /* ── primary（品牌色族，部分占位）── */
  --primary: var(--brand);
  --on-primary: var(--white);
  --primary-hover: var(--brand-80); 
  --primary-active: var(--brand); 
  --primary-disabled: var(--brand-40);
  --primary-container: var(--brand-05); 
  --on-primary-container: var(--color-font-primary);

  /* ── surface / on-surface（已重写，引用新 light/dark 语义 token）── */
  --surface: var(--color-background-secondary);
  --surface-dim: var(--color-background-tertiary);
  --surface-bright: var(--color-background-primary);
  --on-surface: var(--color-font-primary);
  --surface-container-lowest: var(--color-background-primary);
  --surface-container-low: var(--color-background-secondary);
  --surface-container: var(--color-comp-background-tertiary);
  --surface-container-high: var(--color-background-tertiary);
  --surface-container-highest: var(--color-background-fourth);

  --inverse-surface: var(--primary);
  --inverse-on-surface: var(--color-font-on-primary);
  --inverse-on-surface-variant: var(--color-font-on-secondary);
  --inverse-primary: var(--brand);

  --error: var(--color-error);
  --on-error: var(--white);
  --error-container: var(--color-error-container);
  --on-error-container: var(--color-font-primary);

  --alert: var(--color-alert);
  --on-alert: var(--white);
  --alert-container: var(--color-alert-container);
  --on-alert-container: var(--color-font-primary);

  --warning: var(--color-warning);
  --on-warning: var(--black);
  --warning-container: var(--color-warning-container);
  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);
  --on-success: var(--white);
  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);
  --on-info: var(--white);
  --info-container: var(--color-info-container);
  --on-info-container: var(--color-font-primary);

  --text-primary: var(--color-font-primary);
  --text-secondary: var(--color-font-secondary);
  --text-tertiary: var(--color-font-tertiary);
  --text-error: var(--color-error);
  --text-placeholder: var(--color-font-tertiary);
  --text-disabled: var(--color-font-fourth);
  --text-inverse-disabled: var(--color-font-on-fourth);
  
  --interactive-link: var(--brand);
  --interactive-link-hover: var(--brand-80);
  --interactive-link-active: var(--brand);
  --interactive-link-visited: var(--brand);
  --interactive-link-disabled: var(--brand-40);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: var(--outline-width-base); /* 1px */
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（排印角色：字号+行高+字体族绑定，字重在其后组合）── */
  /* Display（展示文本）*/
  --font-display-sm: var(--font-size-4xl)/var(--line-height-tight) var(--font-family); /* 38px/1.25 */
  --font-display-md: var(--font-size-5xl)/var(--line-height-tight) var(--font-family); /* 48px/1.25 */
  --font-display-lg: var(--font-size-6xl)/var(--line-height-tight) var(--font-family); /* 56px/1.25 */

  /* Title（标题）*/
  --font-title-sm: var(--font-size-xl)/var(--line-height-snug) var(--font-family); /* 20px/1.375 */
  --font-title-md: var(--font-size-2xl)/var(--line-height-snug) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/var(--line-height-snug) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/var(--line-height-base) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}

/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}

/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

.demo-subtitle {

.demo-section {

.demo-section-header {

  margin-bottom: 8px;
}

.demo-section-name {

}

.demo-section-tag {

.demo-grid {

}

.demo-grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));

}

.demo-card {
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
  grid-column: 1 / -1;
}

.demo-card-flush {
  padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
  padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
  margin: 0;
}

.demo-card-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
  min-width: 0;
}

.demo-item-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

.demo-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

/* 可交互区：与大号 / 小号两列对齐 */
.demo-live {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  gap: 28px 40px;
}

/* ── 状态色板：每状态列出背景色 / 文字色（色块 + token + 值） ── */
.demo-color-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 460px) minmax(0, 400px);
  align-items: start;
  justify-content: start;
  gap: 24px 40px;
}

.demo-color-cell {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.demo-color-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
}

.demo-color-key {
  flex: 0 0 auto;
  min-width: 28px;
  font: var(--font-caption-lg);
  line-height: 20px;
  color: var(--text-placeholder);
}

.demo-color-items {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
  min-width: 0;
}

.demo-color-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 20px;
}

.demo-swatch {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid var(--divider);
}

/* 无填充：虚线边 + 斜线，表示 transparent */
.demo-swatch-none {
  border-style: dashed;
  background-image: linear-gradient(
    45deg,
    transparent 44%,
    var(--text-placeholder) 44%,
    var(--text-placeholder) 56%,
    transparent 56%
  );
}

.demo-color-token {
  font: var(--font-body-sm);
  color: var(--on-surface);
}

.demo-color-value,
.demo-color-use,
.demo-color-empty {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.demo-color-use {
  color: var(--text-placeholder);
}

/* ── 状态对照表：左列状态名 / 大号 / 小号 ── */
.demo-state-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  justify-content: start;
  gap: 28px 40px;
}

.demo-col-title {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
}

.demo-state-name {
  font: var(--font-body-md);
  color: var(--on-surface);
}

/* 静态状态演示：把 SearchBar 的 :hover / :active / :focus-within 落成常驻类 */
.demo-force-hover .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-hover),
    var(--color-interactive-hover)
  );
}

.demo-force-press .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-pressed),
    var(--color-interactive-pressed)
  );
}

/* focus：默认基础上叠加内部描边，内容不变 */
.demo-force-focus .sb-root {
  background-image: none;
  box-shadow: inset 0 0 0 var(--border-width-thick) var(--focus-ring);
}

/* 激活：聚焦 + 空内容 → 只有自绘光标，无描边 */
.demo-force-active .sb-caret {
  display: block;
}

/* 激活（小号）：无描边，仅自绘光标 */
.demo-force-caret .sb-caret {
  display: block;
}

@scope (.preview-button) {
/* ==========================================================================
   Button · Material 3（消费 HarmonyOS 语义色彩规范）
   --------------------------------------------------------------------------
   变体 Variant（M3 规范命名 / 别名）
     .btn--filled    M3 Filled button        高强调 · 品牌实心   （primary）
     .btn--tonal     M3 Filled tonal button  中强调 · 品牌淡底   （secondary）
     .btn--outlined  M3 Outlined button      中强调 · 描边       （tertiary）
     .btn--text      M3 Text button          低强调 · 纯文字     （plain）

   尺寸 Size             高     字号   图标   左右内边距  图标间距
     .btn--large        40px   16px   20px     16px        8px
     .btn--small        28px   14px   16px     12px        4px

   形状 Shape（几何轴，与 variant / size 正交）
     .btn--round        跑道圆  --radius-full（默认，历史外观）
     .btn--square       方圆角  --radius-lg（8px，规范上只用于 outlined × small）

   状态 State（纯 CSS，组件无内部 state）
     default → :hover → :focus-visible → :active(pressed) → :disabled
     data-state="hover|focus|pressed" 为文档/走查用的静态强制态。

   --------------------------------------------------------------------------
   色彩映射：main color = --btn-main-color → --color-icon-primary（主色，不是 brand）

   variant     背景 background                     描边 border             文字 text
   filled      --btn-main-color                   —                     --color-font-on-primary
   tonal       --color-comp-background-tertiary   —                     --btn-main-color
   outlined    透明                               --color-comp-border    --btn-main-color
   text        透明（任何状态都无背景）              —                     --color-font-emphasize

   variant     hover                          pressed                        disabled
   filled      叠 --on-primary-10             叠 --on-primary-15              沿用静止态 + 50% 透明度
   tonal       叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态 + 50% 透明度
   outlined    叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态（含描边）+ 50% 透明度
   text        字 --primary-hover              字 --primary-active             沿用静止态 + 50% 透明度

   disabled 统一模型：四个变体都保留静止态的底 / 字 / 描边，仅整体 opacity: 0.5。
   即 --btn-container-disabled / --btn-label-disabled / --btn-border-color-disabled
   默认就指向静止态变量，变体无需再各自声明。

   text 的文字态色（无叠加层，直接换字色，取 design_system 里 primary 的专用态色）：
     静止 --color-font-emphasize（brand-font）→ hover --primary-hover（brand 80%）
     → pressed --primary-active（brand 实色）；三档互不相同，按下有明确纵深。

   叠加层分两种模型（取决于静止底是浅色还是实心主色）：
   ① tonal / outlined —— 静止底是浅色 / 透明，叠中性交互层
      --color-interactive-hover / -pressed（= container-05 / container-10，暗色各加深一档），
      即「不变静止底，只叠交互层」，与 design_system.md 的「Hover/pressed on surfaces」一致。
     tonal    hover → container-05 叠 container-05 ≈ container-10 = --color-comp-background-secondary ✓
              pressed → container-10 叠 container-05 ≈ container-15 ✓
     outlined hover → container-05 = --color-comp-background-tertiary ✓
              pressed → container-10 = --color-comp-background-secondary ✓
   ② filled —— 静止底是 --btn-main-color（默认近黑 / 近白实心），中性层叠在其上对比度极低
      （视觉上接近无变化），所以改用「主色上的颜色」--on-primary-10 / -15 作叠加层。
      M3 Filled button 的 state layer 规范即为 on-primary，因此这不是特例而是对齐规范。
      该令牌明色为白基、暗色为黑基，自带翻转，一个值覆盖两个模式且方向都正确：
        Light：rgba(0,0,0,.9) 上叠白 10% → 合成后明度约从 10% 灰升到 19% 灰，比黑色浅一点 ✓
        Dark ：rgba(255,255,255,.9) 上叠黑 10% → 变深一档，反馈同样可见 ✓
      把 --btn-main-color 换成品牌色等彩色后依然成立（叠加层仍是「主色上的颜色」）。

   聚焦环：--btn-focus-ring = --black（纯黑 1px + --outline-offset-gap 间隙）。
     text 变体无容器，focus 不画描边环（--btn-focus-ring: transparent）。

   Dark Mode（html.dark）：
     filled 的底 = --color-icon-primary，暗色下翻为近白；文字跟随翻黑（见 .dark .btn--filled）。
     其叠加层 --on-primary-10 / -15 在暗色下翻为黑基，叠加方向自动变成「变深」，无需额外规则。
     其余变体的底 / 字都引用了自带翻转的语义 token，无需额外规则。

   所有 --btn-* 都是可覆盖契约，单实例定制：
     <Button className="my-btn" />  +  .my-btn { --btn-padding-inline: 32px; }
   ========================================================================== */

.btn {
  /* ── 尺寸契约（由 .btn--large / .btn--small 覆写）── */
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: var(--font-size-md);
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;

  /* ── 形状契约（由 .btn--round / .btn--square 覆写）── */
  --btn-radius: var(--radius-full); /* 默认 = round，跑道圆 */

  /* ── 颜色契约（由变体类覆写）── */
  --btn-main-color: var(--color-icon-primary); /* 本套按钮主色：换主色只改这一处 */
  --btn-container: transparent; /* 静止态填充 */
  --btn-label: var(--on-surface); /* 文字色，图标 currentColor 跟随 */
  --btn-label-hover: var(--btn-label); /* hover 文字色（默认不变） */
  --btn-label-pressed: var(--btn-label); /* pressed 文字色（默认不变） */
  --btn-state-layer-hover: transparent; /* 悬停叠加层（叠在静止态填充之上） */
  --btn-state-layer-pressed: transparent; /* 按下叠加层 */
  --btn-container-disabled: var(--btn-container); /* 禁用态填充：沿用静止态 */
  --btn-label-disabled: var(--btn-label); /* 禁用态文字：沿用静止态 */
  --btn-disabled-opacity: 0.5; /* 禁用态整体透明度 */
  --btn-border-width: var(--border-width-none);
  --btn-border-color: transparent;
  --btn-border-color-disabled: var(--btn-border-color); /* 禁用态描边：沿用静止态 */
  --btn-focus-ring: var(--black); /* 聚焦描边环：纯黑（明暗通用） */

  position: relative;
  isolation: isolate; /* 让负 z-index 的叠加层留在按钮内部 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--btn-icon-gap);
  box-sizing: border-box;
  height: var(--btn-height);
  padding: 0 var(--btn-padding-inline);
  border: var(--btn-border-width) solid var(--btn-border-color);
  border-radius: var(--btn-radius);
  background-color: var(--btn-container);
  color: var(--btn-label);
  font-family: var(--font-family);
  font-size: var(--btn-font-size);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-none);
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard);
}

/* ── 状态叠加层：M3 state layer，叠在静止态填充之上 ── */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background-color: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

/* ── hover：叠加层 + 文字色（文字色默认与静止态一致）── */
.btn:hover:not(:disabled)::before,
.btn[data-state="hover"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* data-state 静态强制态与真实伪类必须成对：否则矩阵里 hover 只出叠加层、不出字色变化 */
.btn:hover:not(:disabled),
.btn[data-state="hover"] {
  color: var(--btn-label-hover);
}

/* ── pressed：规则放在 hover 之后，按下时覆盖悬停层 ── */
.btn:active:not(:disabled)::before,
.btn[data-state="pressed"]::before {
  background-color: var(--btn-state-layer-pressed);
  opacity: 1;
}

.btn:active:not(:disabled),
.btn[data-state="pressed"] {
  color: var(--btn-label-pressed);
}

/* ── 键盘聚焦：1px 纯黑描边环 + 2px 间隙（不影响布局）；text 变体不画环 ── */
.btn:focus-visible,
.btn[data-state="focus"] {
  outline: var(--outline-width-focus) solid var(--btn-focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 鼠标点击产生的非键盘焦点不画环；但 data-state="focus" 的静态强制态要保住 */
.btn:focus:not(:focus-visible):not([data-state="focus"]) {
  outline: none;
}

.btn[data-state="focus"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* ── 禁用：四个变体都沿用静止态的底 / 字 / 描边，仅整体降透明度（默认 50%）── */
.btn:disabled {
  background-color: var(--btn-container-disabled);
  color: var(--btn-label-disabled);
  border-color: var(--btn-border-color-disabled);
  opacity: var(--btn-disabled-opacity);
  cursor: not-allowed;
  outline: none;
}

/* ── 尺寸 ───────────────────────────────────────────── */
.btn--large {
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: var(--font-size-md); /* 16px */
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;
}

.btn--small {
  --btn-height: 28px;
  --btn-padding-inline: 12px;
  --btn-font-size: var(--font-size-base); /* 14px */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

/* ── 形状 Shape：与 variant / size 正交的第三个轴 ────────
   形状不并入变体名：variant 表达强调层级，shape 表达几何，
   两者相乘会让命名膨胀（filled-round / filled-square / tonal-round…）并使别名失效。 */

/* Round：跑道圆（默认外观，与历史版本一致，向后兼容） */
.btn--round {
  --btn-radius: var(--radius-full);
}

/* Square：方圆角 8px（--radius-lg）。
   design system 里只用于 outlined × small 这一个组合；组件不做静默降级，
   其它组合传了 square 也照常渲染，合规性由调用方（presets.isShapeSupported）判断。 */
.btn--square {
  --btn-radius: var(--radius-lg);
}

/* ── 变体：颜色契约 ─────────────────────────────────── */

/* Filled：main color 实心 + 纯白文字。
   hover / pressed 用「主色上的颜色」--on-primary-10 / -15 作叠加层（M3 Filled button 的
   state layer 规范即为 on-primary）：该令牌明色为白基、暗色为黑基，自带翻转，
   所以浅色下近黑实心变浅、暗色下近白实心变深，两个模式方向都对。
   disabled：沿用静止态（实心底 + 纯白文字）整体 50% 透明度。 */
.btn--filled {
  --btn-container: var(--btn-main-color);
  --btn-label: var(--color-font-on-primary);
  --btn-state-layer-hover: var(--on-primary-10);
  --btn-state-layer-pressed: var(--on-primary-15);
}

/* Filled · Dark Mode：主色实心在暗色下翻为近白（--primary-90 → rgba(255,255,255,.9)），
   文字必须随之翻成黑色，否则白底白字不可读。
   注意：style 层的 --on-primary 被 theme.css 的 :root 固定为 --white（与 base.css 的
   .dark 同权重且更晚加载，导致暗色下不翻转），所以只能按 html.dark 约定在组件内覆盖。
   只覆盖文字色，底 / 叠加层 / disabled 继续沿用上面的契约（叠加层 --on-primary-* 自带翻转）。 */
.dark .btn--filled {
  --btn-label: var(--black);
}

/* Tonal：静止 comp_background_tertiary，叠加 --color-interactive-* 得到
   hover ≈ comp_background_secondary（container-10）、pressed ≈ container-15
   （叠层规则见 design_system「Hover/pressed on surfaces」）。
   disabled：沿用静止态配色，整体 50% 透明度。 */
.btn--tonal {
  --btn-container: var(--color-comp-background-tertiary);
  --btn-label: var(--btn-main-color);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Outlined：透明底 + 1px 中性描边 + 主色文字；描边不随状态变化
   hover = comp_background_tertiary（container-05）、pressed = comp_background_secondary（container-10）
   disabled：沿用静止态配色（含描边），整体 50% 透明度。 */
.btn--outlined {
  --btn-label: var(--btn-main-color);
  --btn-border-width: var(--border-width-thin);
  --btn-border-color: var(--color-comp-border);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Text：brand 主题蓝文字，任何状态都不出现背景色
   hover / pressed 用 design_system 里 primary 的专用态色：--primary-hover（brand 80%）
   → --primary-active（brand 实色），静止态 --color-font-emphasize 与两者都不同，按下有明确纵深。
   focus：无容器，不画聚焦描边环
   disabled：沿用静止态文字色，整体 50% 透明度。 */
.btn--text {
  --btn-label: var(--color-font-emphasize);
  --btn-label-hover: var(--primary-hover);
  --btn-label-pressed: var(--primary-active);
  --btn-state-layer-hover: transparent;
  --btn-state-layer-pressed: transparent;
  --btn-focus-ring: transparent;
}

/* ── 内容 ───────────────────────────────────────────── */
.btn__icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
}

  display: inline-block;
}

@scope (.preview-dropdown-button) {
/* ==========================================================================
   Button · Material 3（消费 HarmonyOS 语义色彩规范）
   --------------------------------------------------------------------------
   变体 Variant（M3 规范命名 / 别名）
     .btn--filled    M3 Filled button        高强调 · 品牌实心   （primary）
     .btn--tonal     M3 Filled tonal button  中强调 · 品牌淡底   （secondary）
     .btn--outlined  M3 Outlined button      中强调 · 描边       （tertiary）
     .btn--text      M3 Text button          低强调 · 纯文字     （plain）

   尺寸 Size             高     字号   图标   左右内边距  图标间距
     .btn--large        40px   16px   20px     16px        8px
     .btn--small        28px   14px   16px     12px        4px

   形状 Shape（几何轴，与 variant / size 正交）
     .btn--round        跑道圆  --radius-full（默认，历史外观）
     .btn--square       方圆角  --radius-lg（8px，规范上只用于 outlined × small）

   状态 State（纯 CSS，组件无内部 state）
     default → :hover → :focus-visible → :active(pressed) → :disabled
     data-state="hover|focus|pressed" 为文档/走查用的静态强制态。

   --------------------------------------------------------------------------
   色彩映射：main color = --btn-main-color → --color-icon-primary（主色，不是 brand）

   variant     背景 background                     描边 border             文字 text
   filled      --btn-main-color                   —                     --color-font-on-primary
   tonal       --color-comp-background-tertiary   —                     --btn-main-color
   outlined    透明                               --color-comp-border    --btn-main-color
   text        透明（任何状态都无背景）              —                     --color-font-emphasize

   variant     hover                          pressed                        disabled
   filled      叠 --on-primary-10             叠 --on-primary-15              沿用静止态 + 50% 透明度
   tonal       叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态 + 50% 透明度
   outlined    叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态（含描边）+ 50% 透明度
   text        字 --primary-hover              字 --primary-active             沿用静止态 + 50% 透明度

   disabled 统一模型：四个变体都保留静止态的底 / 字 / 描边，仅整体 opacity: 0.5。
   即 --btn-container-disabled / --btn-label-disabled / --btn-border-color-disabled
   默认就指向静止态变量，变体无需再各自声明。

   text 的文字态色（无叠加层，直接换字色，取 design_system 里 primary 的专用态色）：
     静止 --color-font-emphasize（brand-font）→ hover --primary-hover（brand 80%）
     → pressed --primary-active（brand 实色）；三档互不相同，按下有明确纵深。

   叠加层分两种模型（取决于静止底是浅色还是实心主色）：
   ① tonal / outlined —— 静止底是浅色 / 透明，叠中性交互层
      --color-interactive-hover / -pressed（= container-05 / container-10，暗色各加深一档），
      即「不变静止底，只叠交互层」，与 design_system.md 的「Hover/pressed on surfaces」一致。
     tonal    hover → container-05 叠 container-05 ≈ container-10 = --color-comp-background-secondary ✓
              pressed → container-10 叠 container-05 ≈ container-15 ✓
     outlined hover → container-05 = --color-comp-background-tertiary ✓
              pressed → container-10 = --color-comp-background-secondary ✓
   ② filled —— 静止底是 --btn-main-color（默认近黑 / 近白实心），中性层叠在其上对比度极低
      （视觉上接近无变化），所以改用「主色上的颜色」--on-primary-10 / -15 作叠加层。
      M3 Filled button 的 state layer 规范即为 on-primary，因此这不是特例而是对齐规范。
      该令牌明色为白基、暗色为黑基，自带翻转，一个值覆盖两个模式且方向都正确：
        Light：rgba(0,0,0,.9) 上叠白 10% → 合成后明度约从 10% 灰升到 19% 灰，比黑色浅一点 ✓
        Dark ：rgba(255,255,255,.9) 上叠黑 10% → 变深一档，反馈同样可见 ✓
      把 --btn-main-color 换成品牌色等彩色后依然成立（叠加层仍是「主色上的颜色」）。

   聚焦环：--btn-focus-ring = --black（纯黑 1px + --outline-offset-gap 间隙）。
     text 变体无容器，focus 不画描边环（--btn-focus-ring: transparent）。

   Dark Mode（html.dark）：
     filled 的底 = --color-icon-primary，暗色下翻为近白；文字跟随翻黑（见 .dark .btn--filled）。
     其叠加层 --on-primary-10 / -15 在暗色下翻为黑基，叠加方向自动变成「变深」，无需额外规则。
     其余变体的底 / 字都引用了自带翻转的语义 token，无需额外规则。

   所有 --btn-* 都是可覆盖契约，单实例定制：
     <Button className="my-btn" />  +  .my-btn { --btn-padding-inline: 32px; }
   ========================================================================== */

.btn {
  /* ── 尺寸契约（由 .btn--large / .btn--small 覆写）── */
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: var(--font-size-md);
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;

  /* ── 形状契约（由 .btn--round / .btn--square 覆写）── */
  --btn-radius: var(--radius-full); /* 默认 = round，跑道圆 */

  /* ── 颜色契约（由变体类覆写）── */
  --btn-main-color: var(--color-icon-primary); /* 本套按钮主色：换主色只改这一处 */
  --btn-container: transparent; /* 静止态填充 */
  --btn-label: var(--on-surface); /* 文字色，图标 currentColor 跟随 */
  --btn-label-hover: var(--btn-label); /* hover 文字色（默认不变） */
  --btn-label-pressed: var(--btn-label); /* pressed 文字色（默认不变） */
  --btn-state-layer-hover: transparent; /* 悬停叠加层（叠在静止态填充之上） */
  --btn-state-layer-pressed: transparent; /* 按下叠加层 */
  --btn-container-disabled: var(--btn-container); /* 禁用态填充：沿用静止态 */
  --btn-label-disabled: var(--btn-label); /* 禁用态文字：沿用静止态 */
  --btn-disabled-opacity: 0.5; /* 禁用态整体透明度 */
  --btn-border-width: var(--border-width-none);
  --btn-border-color: transparent;
  --btn-border-color-disabled: var(--btn-border-color); /* 禁用态描边：沿用静止态 */
  --btn-focus-ring: var(--black); /* 聚焦描边环：纯黑（明暗通用） */

  position: relative;
  isolation: isolate; /* 让负 z-index 的叠加层留在按钮内部 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--btn-icon-gap);
  box-sizing: border-box;
  height: var(--btn-height);
  padding: 0 var(--btn-padding-inline);
  border: var(--btn-border-width) solid var(--btn-border-color);
  border-radius: var(--btn-radius);
  background-color: var(--btn-container);
  color: var(--btn-label);
  font-family: var(--font-family);
  font-size: var(--btn-font-size);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-none);
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard);
}

/* ── 状态叠加层：M3 state layer，叠在静止态填充之上 ── */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background-color: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

/* ── hover：叠加层 + 文字色（文字色默认与静止态一致）── */
.btn:hover:not(:disabled)::before,
.btn[data-state="hover"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* data-state 静态强制态与真实伪类必须成对：否则矩阵里 hover 只出叠加层、不出字色变化 */
.btn:hover:not(:disabled),
.btn[data-state="hover"] {
  color: var(--btn-label-hover);
}

/* ── pressed：规则放在 hover 之后，按下时覆盖悬停层 ── */
.btn:active:not(:disabled)::before,
.btn[data-state="pressed"]::before {
  background-color: var(--btn-state-layer-pressed);
  opacity: 1;
}

.btn:active:not(:disabled),
.btn[data-state="pressed"] {
  color: var(--btn-label-pressed);
}

/* ── 键盘聚焦：1px 纯黑描边环 + 2px 间隙（不影响布局）；text 变体不画环 ── */
.btn:focus-visible,
.btn[data-state="focus"] {
  outline: var(--outline-width-focus) solid var(--btn-focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 鼠标点击产生的非键盘焦点不画环；但 data-state="focus" 的静态强制态要保住 */
.btn:focus:not(:focus-visible):not([data-state="focus"]) {
  outline: none;
}

.btn[data-state="focus"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* ── 禁用：四个变体都沿用静止态的底 / 字 / 描边，仅整体降透明度（默认 50%）── */
.btn:disabled {
  background-color: var(--btn-container-disabled);
  color: var(--btn-label-disabled);
  border-color: var(--btn-border-color-disabled);
  opacity: var(--btn-disabled-opacity);
  cursor: not-allowed;
  outline: none;
}

/* ── 尺寸 ───────────────────────────────────────────── */
.btn--large {
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: var(--font-size-md); /* 16px */
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;
}

.btn--small {
  --btn-height: 28px;
  --btn-padding-inline: 12px;
  --btn-font-size: var(--font-size-base); /* 14px */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

/* ── 形状 Shape：与 variant / size 正交的第三个轴 ────────
   形状不并入变体名：variant 表达强调层级，shape 表达几何，
   两者相乘会让命名膨胀（filled-round / filled-square / tonal-round…）并使别名失效。 */

/* Round：跑道圆（默认外观，与历史版本一致，向后兼容） */
.btn--round {
  --btn-radius: var(--radius-full);
}

/* Square：方圆角 8px（--radius-lg）。
   design system 里只用于 outlined × small 这一个组合；组件不做静默降级，
   其它组合传了 square 也照常渲染，合规性由调用方（presets.isShapeSupported）判断。 */
.btn--square {
  --btn-radius: var(--radius-lg);
}

/* ── 变体：颜色契约 ─────────────────────────────────── */

/* Filled：main color 实心 + 纯白文字。
   hover / pressed 用「主色上的颜色」--on-primary-10 / -15 作叠加层（M3 Filled button 的
   state layer 规范即为 on-primary）：该令牌明色为白基、暗色为黑基，自带翻转，
   所以浅色下近黑实心变浅、暗色下近白实心变深，两个模式方向都对。
   disabled：沿用静止态（实心底 + 纯白文字）整体 50% 透明度。 */
.btn--filled {
  --btn-container: var(--btn-main-color);
  --btn-label: var(--color-font-on-primary);
  --btn-state-layer-hover: var(--on-primary-10);
  --btn-state-layer-pressed: var(--on-primary-15);
}

/* Filled · Dark Mode：主色实心在暗色下翻为近白（--primary-90 → rgba(255,255,255,.9)），
   文字必须随之翻成黑色，否则白底白字不可读。
   注意：style 层的 --on-primary 被 theme.css 的 :root 固定为 --white（与 base.css 的
   .dark 同权重且更晚加载，导致暗色下不翻转），所以只能按 html.dark 约定在组件内覆盖。
   只覆盖文字色，底 / 叠加层 / disabled 继续沿用上面的契约（叠加层 --on-primary-* 自带翻转）。 */
.dark .btn--filled {
  --btn-label: var(--black);
}

/* Tonal：静止 comp_background_tertiary，叠加 --color-interactive-* 得到
   hover ≈ comp_background_secondary（container-10）、pressed ≈ container-15
   （叠层规则见 design_system「Hover/pressed on surfaces」）。
   disabled：沿用静止态配色，整体 50% 透明度。 */
.btn--tonal {
  --btn-container: var(--color-comp-background-tertiary);
  --btn-label: var(--btn-main-color);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Outlined：透明底 + 1px 中性描边 + 主色文字；描边不随状态变化
   hover = comp_background_tertiary（container-05）、pressed = comp_background_secondary（container-10）
   disabled：沿用静止态配色（含描边），整体 50% 透明度。 */
.btn--outlined {
  --btn-label: var(--btn-main-color);
  --btn-border-width: var(--border-width-thin);
  --btn-border-color: var(--color-comp-border);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Text：brand 主题蓝文字，任何状态都不出现背景色
   hover / pressed 用 design_system 里 primary 的专用态色：--primary-hover（brand 80%）
   → --primary-active（brand 实色），静止态 --color-font-emphasize 与两者都不同，按下有明确纵深。
   focus：无容器，不画聚焦描边环
   disabled：沿用静止态文字色，整体 50% 透明度。 */
.btn--text {
  --btn-label: var(--color-font-emphasize);
  --btn-label-hover: var(--primary-hover);
  --btn-label-pressed: var(--primary-active);
  --btn-state-layer-hover: transparent;
  --btn-state-layer-pressed: transparent;
  --btn-focus-ring: transparent;
}

/* ── 内容 ───────────────────────────────────────────── */
.btn__icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
}

.btn__label {
  display: inline-block;
}


/* Inherit Button's variants, heights, typography, shapes and states. */
.dropdown-btn.btn--large {
  --dropdown-btn-padding-end: 12px;
}

.dropdown-btn.btn--small {
  --dropdown-btn-padding-end: 8px;
}

.dropdown-btn.btn--xs {
  --btn-height: 28px;
  --btn-padding-inline: 8px;
  --dropdown-btn-padding-end: 8px;
  --btn-font-size: var(--font-size-sm); /* 12px */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

.dropdown-btn {
  padding-inline-end: var(--dropdown-btn-padding-end);
}

/* Dropdown Plain uses neutral content and the same state fills as Tertiary. */
.dropdown-btn.btn--text {
  --btn-label: var(--btn-main-color);
  --btn-label-hover: var(--btn-label);
  --btn-label-pressed: var(--btn-label);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Compact square trigger: a dedicated exception for outlined + small. */
.dropdown-btn.btn--outlined.btn--small.btn--square {
  --btn-height: 32px;
  padding-inline-start: 8px;
  padding-inline-end: 4px;
}

/* XS Outlined is always the 8px-radius square version. */
.dropdown-btn.btn--outlined.btn--xs {
  --btn-radius: var(--radius-lg);
}

.dropdown-btn__asset {
  display: block;
  flex: 0 0 auto;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
  object-fit: contain;
}

/* The uploaded SVG is a mask so its silhouette follows the label color. */
.dropdown-btn__indicator {
  display: inline-block;
  flex: 0 0 auto;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
  background-color: currentColor;
  mask: var(--dropdown-btn-icon) center / contain no-repeat;

}

.demo-page {
max-width: 1400px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

.demo-header {
margin-bottom: 48px;
}

.demo-title {
display: flex;
  align-items: center;
  gap: 10px;
  font: var(--font-title-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 8px;
}

.demo-title-icon {
color: var(--primary);
}

.demo-subtitle {
font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0;
}

.demo-section {
margin-bottom: 64px;
}

.demo-section-header {
display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.demo-section-name {
font: var(--font-title-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.demo-section-tag {
display: inline-flex;
  align-items: center;
  gap: 4px;
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--primary);
  background-color: var(--primary-container);
  padding: 2px 10px;
  border-radius: var(--radius-full);
}

.demo-section-desc {
font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0 0 28px;
}

.demo-grid {
display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 32px;
  align-items: start;
}

.demo-grid-2 {
grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 48px 40px;
}

.demo-card {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
grid-column: 1 / -1;
}

.demo-card-flush {
padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
margin: 0;
}

.demo-card-title {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
min-width: 0;
}

.demo-item-title {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

code {
font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--color-font-emphasize);
  background-color: var(--surface-container);
  padding: 1px 5px;
  border-radius: var(--radius-xs);
}

.button-theme-toggle {
margin-top: 16px;
}

.button-configurator {
display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.button-controls {
display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.button-control {
display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
padding: 0 12px;
}

.button-control input::placeholder {
color: var(--text-placeholder);
}

.button-select-wrap {
position: relative;
  display: block;
}

.button-select-wrap::after {
content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-control select:disabled {
cursor: not-allowed;
  opacity: 0.5;
}

.button-toggle-line {
display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
color: var(--on-surface);
  font: var(--font-body-md);
}

.button-icon-select {
margin-top: 0;
}

.button-switch {
position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {
display: flex;
  min-height: 220px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

@media (max-width: 980px) {
.button-configurator {
grid-template-columns: 1fr;
}

.button-configurator-preview {
min-height: 132px;
}

}

@media (max-width: 760px) {
.button-controls {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

}

@media (max-width: 520px) {
.button-controls {
grid-template-columns: 1fr;
}

}

.btn-lab {
display: flex;
  flex-direction: column;
  gap: 32px;
}

.btn-lab-block {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 20px 24px 24px;
}

.btn-lab-head {
display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.btn-lab-size {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-spec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-lab-grid {
display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;

}

.btn-lab-col {
display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  padding: 14px 12px 18px;
  background-color: var(--surface-container-low);

  flex-direction: column;
  align-items: center;

.btn-matrix {
display: flex;
  flex-direction: column;
  gap: 24px;

@scope (.preview-segmented-button) {
/* 分割按钮根轨道：胶囊形、浅色容器底色（comp_background_tertiary） */
.sb-root {
  display: inline-flex;
  align-items: center;
  width: 514px;
  max-width: 100%;
  height: 44px;
  padding: 4px;
  background-color: var(--color-comp-background-tertiary);
  border-radius: 24px;
  box-sizing: border-box;
}

/* 圆角可选：8px（默认 24px） */
.sb-root.sb-radius-8 {
  height: 36px;
  padding: 2px;
  border-radius: 8px;
}

.sb-root.sb-radius-8 .sb-segment {
  border-radius: 6px;
}

/* 单段按钮：等宽、胶囊、字号 14px */
.sb-segment {
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  border: none;
  border-radius: 24px;
  background-color: transparent;
  font: var(--font-body-md); /* 14px/1.5 + family */
  line-height: 19px;
  font-weight: var(--font-weight-medium);
  color: var(--color-font-secondary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

/* Icon：32px 轨道、2px 内边距、36 × 28px 按钮、14px 居中图标。 */
.sb-root.sb-size-sm {
  width: max-content;
  height: 32px;
  padding: 2px;
  border-radius: 8px;
}
.sb-root.sb-size-sm .sb-segment {
  box-sizing: border-box;
  flex: 0 0 36px;
  width: 36px;
  padding: 0;
  gap: 0;
}

.sb-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 带图标的分段：文字使用 regular 粗细（400） */
.sb-segment.sb-has-icon {
  font-weight: var(--font-weight-regular);
}

.sb-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* 选中段：悬浮白底 + 主文字（对应 SVG 的 white fill + black @ 0.9） */
.sb-segment.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--color-font-primary);
}

/* 悬停：在静止底色上叠加交互层（Design Rule 3） */
.sb-segment:not(.sb-active).sb-hover {
  background-color: var(--color-interactive-hover);
}

.sb-segment.sb-active.sb-hover {
  background-color: var(--surface-container-lowest);
}

/* 按压态 */
.sb-segment:not(.sb-active).sb-pressed {
  background-color: var(--color-interactive-pressed);
}

.sb-segment.sb-active.sb-pressed {
  background-color: var(--surface-container-lowest);
}

/* 无独立 Focus 视觉态，保留原生键盘激活。 */
.sb-segment:focus {
  outline: none;
}

/* 禁用态：整组置灰、禁用文字、禁止交互 */
.sb-disabled .sb-segment {
  cursor: not-allowed;
}

.sb-disabled .sb-segment.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--text-disabled);
}

.sb-disabled .sb-segment:not(.sb-active) {
  color: var(--text-disabled);
}

/* 单段禁用 */
.sb-segment:disabled {
  cursor: not-allowed;
  color: var(--text-disabled);
}

.sb-segment:disabled.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--text-disabled);
}

/* 图标与文字独立使用各自的语义色，不依赖当前色值恰好相同。 */
.sb-icon { color: var(--color-icon-secondary); }
.sb-active .sb-icon { color: var(--color-icon-primary); }
.sb-size-sm .sb-segment { color: var(--color-icon-secondary); }
.sb-size-sm .sb-segment.sb-active { color: var(--color-icon-primary); }
.sb-size-sm .sb-icon, .sb-size-sm .sb-icon > svg { width: 14px; height: 14px; }
.sb-segment:disabled, .sb-segment:disabled .sb-icon { color: var(--text-disabled); }
.sb-segment:disabled { pointer-events: none; }

  flex-wrap: wrap;
  margin-bottom: 4px;
}

.btn-lab-size {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-spec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-lab-grid {
display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

@media (max-width: 860px) {
.btn-lab-grid {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

}

.btn-lab-col {
display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  padding: 14px 12px 18px;
  background-color: var(--surface-container-low);
  border-radius: var(--radius-container);
}

.btn-lab-colhead {
display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 16px;
  text-align: center;
}

.btn-lab-colname {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-colmeta {
font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-lab-slot {
display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.btn-lab-slot-off {
margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--divider);
}

.btn-lab-slotlabel {
font: var(--font-caption-md);
  font-weight: var(--font-weight-bold);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-placeholder);
}

.btn-lab-grid--two {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

.btn-matrix {
display: flex;
  flex-direction: column;
  gap: 24px;
}

.btn-matrix-group {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 16px 20px 20px;
  overflow-x: auto;
}

.btn-matrix-grouphead {
display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--divider);
}

.btn-matrix-groupname {
font: var(--font-subtitle-md);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-groupspec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-matrix-row {
display: grid;
  grid-template-columns: minmax(150px, 200px) repeat(5, minmax(140px, 1fr));
  gap: 8px;
  align-items: center;
  padding: 10px 0;
}

.btn-matrix-row + .btn-matrix-row {
border-top: 1px solid var(--divider);
}

.btn-matrix-row-head {
padding-bottom: 4px;
}

.btn-matrix-label {
display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.btn-matrix-variant {
font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.btn-matrix-meta {
font: var(--font-caption-lg);
  color: var(--text-placeholder);
}

.btn-matrix-cell {
display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 44px;
  
  pointer-events: none;
}

.btn-matrix-state {
font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-hint {
font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-table {
width: 100%;
  border-collapse: collapse;
  margin-top: 24px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.btn-table th {
font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  background-color: var(--surface-container-low);
}

.btn-table td {
font: var(--font-body-md);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  border-top: 1px solid var(--divider);
}

.btn-table-strong {
display: block;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.btn-table-src {
display: block;
  margin-top: 4px;
  font: var(--font-caption-md);
  color: var(--text-placeholder);
  line-height: 1.5;
}

.btn-table-wrap {
overflow-x: auto;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-table-wrap .btn-table {
min-width: 900px;
  border-radius: 0;
  box-shadow: none;
  margin-top: 0;
}

.btn-table-wrap .btn-table--color {
min-width: 1180px;
}

.btn-table-wrap .btn-table--roomy {
min-width: 920px;
}

.btn-table-wrap--spaced {
margin-top: 24px;
}

.btn-table--roomy th,
.btn-table--roomy td {
min-width: 110px;
}

.btn-table--color th:first-child,
.btn-table--color td:first-child {
min-width: 112px;
}

.btn-table--color th:not(:first-child),
.btn-table--color td:not(:first-child) {
min-width: 130px;
}

.btn-color-token {
display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.btn-color-token code {
white-space: normal;
  overflow-wrap: anywhere;
}

.btn-table .btn-color-variant {
vertical-align: top;
  color: var(--on-surface);
  font: var(--font-body-lg);
  font-weight: var(--font-weight-bold);
  background: var(--surface-container-low);
  border-top: 1px solid var(--divider);
}

.btn-table .btn-color-state {
min-width: 110px;
  vertical-align: top;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.btn-color-state small {
display: block;
  margin-top: 4px;
  color: var(--text-placeholder);
  font: var(--font-caption-md);
  font-weight: var(--font-weight-regular);
  white-space: nowrap;
}

.btn-color-same {
color: var(--text-placeholder);
  font: var(--font-body-md);
}

.btn-color-group-start > th,
.btn-color-group-start > td {
border-top: 2px solid var(--color-comp-border);
}

.btn-color-swatch {
display: inline-block;
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  box-sizing: border-box;
  border: 1px solid var(--color-comp-border);
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--surface-container-lowest);
}

.btn-color-swatch--transparent {
background-color: var(--surface-container-lowest);
  background-image:
    linear-gradient(45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(-45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--divider) 75%),
    linear-gradient(-45deg, transparent 75%, var(--divider) 75%);
  background-position: 0 0, 0 5px, 5px -5px, -5px 0;
  background-size: 10px 10px;
}

.btn-color-swatch--none {
background:
    linear-gradient(
      135deg,
      transparent 44%,
      var(--text-placeholder) 46%,
      var(--text-placeholder) 54%,
      transparent 56%
    ),
    var(--surface-container-lowest);
}

.btn-color-swatch--disabled {
opacity: 0.5;
}


.seg-demo-live {
min-width: 0; overflow: auto;
}

.seg-demo-gallery {
display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;
}

.seg-demo-card {
min-width: 0; overflow: auto; padding: 24px; border-radius: var(--radius-xl); background: var(--surface-container-lowest); box-shadow: var(--shadow-card);
}

.seg-demo-card h3 {
margin: 0 0 20px; font: var(--font-subtitle-sm); color: var(--on-surface);
}

.seg-demo-static {
pointer-events: none;
}

.seg-demo-matrix {
min-width: 1280px !important;
}

.seg-demo-matrix td {
min-width: 210px;
}

.seg-demo-matrix .sb-root {
transform-origin: left center;
}

.seg-demo-force-hover .sb-segment:nth-child(2) {
background-color: var(--color-interactive-hover);
}

.seg-demo-force-pressed .sb-segment:nth-child(2) {
background-color: var(--color-interactive-pressed);
}

@media (max-width: 760px) {
.seg-demo-gallery {
grid-template-columns: minmax(0, 1fr);
}

}

.preview-segmented-button .seg-demo-live {
  box-sizing: border-box;
  min-width: 0;
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
}
.preview-segmented-button .seg-demo-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.preview-segmented-button .seg-demo-card { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.preview-segmented-button .seg-demo-card h3 { align-self: flex-start; margin: 0; }
.preview-segmented-button .btn-table thead th {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
  background: var(--surface-container-low);
  padding: 12px 16px;
}
.preview-segmented-button .btn-table tbody td,
.preview-segmented-button .btn-table tbody th {
  font: var(--font-body-md);
  padding: 12px 16px;
  vertical-align: top;
  border-right: 0;
}
.preview-segmented-button .btn-table tbody th:not(.btn-color-variant),
.preview-segmented-button .btn-table tbody td:first-child:not(.btn-color-state) {
  background: transparent;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}
.preview-segmented-button .btn-table tbody .btn-color-variant {
  font: var(--font-body-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  background: var(--surface-container-low);
  min-width: 150px;
}
.preview-segmented-button .btn-table .btn-color-state { font-weight: var(--font-weight-medium); }
.preview-segmented-button .btn-table .btn-table-src { font: var(--font-caption-md); color: var(--text-placeholder); }
.preview-segmented-button .seg-demo-matrix { min-width: 1280px; }
@media (max-width: 760px) {
  .preview-segmented-button .seg-demo-gallery { grid-template-columns: minmax(0, 1fr); }
  .preview-segmented-button .seg-demo-live { padding: 24px; }
}

.preview-segmented-button .seg-gallery-heading { margin: 28px 0 16px; font: var(--font-subtitle-sm); color: var(--on-surface); }

.tf-root:has(.tf-password:focus-visible) .tf-box { box-shadow: inset 0 0 0 1px var(--container-40); }
.tf-root.tf-error .tf-box { box-shadow: inset 0 0 0 1px var(--error); }
.tf-helper { margin: 8px 0 0; padding: 0; font: var(--font-caption-lg); color: var(--text-tertiary); }
.tf-error .tf-helper { color: var(--text-error); }
.tf-disabled .tf-input, .tf-disabled .tf-input::placeholder { color: var(--text-disabled); -webkit-text-fill-color: var(--text-disabled); }
.tf-disabled .tf-label, .tf-disabled .tf-helper, .tf-disabled .tf-required { color: var(--text-disabled); }
.tf-disabled .tf-password { color: var(--color-icon-primary); }
.tf-disabled .tf-input, .tf-disabled .tf-password { cursor: not-allowed; }

.tf-root.tf-unbordered .tf-box { box-shadow: var(--shadow-card); }

.tf-password-root .tf-box { padding-right: 12px; }
/* Fixed 10px character cells keep native password hit-testing aligned with 8px dots. */
.tf-masked .tf-input { font-family: monospace; font-size: var(--font-size-base); letter-spacing: calc(10px - 1ch); color: transparent; -webkit-text-fill-color: transparent; }
.tf-dots-viewport { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.tf-dots { display: flex; align-items: center; height: 22px; width: max-content; }
.tf-dot { flex: 0 0 8px; width: 8px; height: 8px; margin-right: 2px; border-radius: 50%; background: var(--text-primary); }
.tf-disabled .tf-dot { background: var(--text-disabled); }

/* Overlay centered in the 16px text-to-border gap; never reserves text width. */
.tf-multiline .tf-input::-webkit-scrollbar { display: none; width: 0; height: 0; }
.tf-scrollbar { position: absolute; top: 12px; right: 0; width: 16px; pointer-events: none; }
.tf-scrollbar-thumb { position: absolute; top: 0; right: 0; width: 16px; pointer-events: auto; touch-action: none; cursor: grab; user-select: none; }
.tf-scrollbar-thumb::before { content: ""; position: absolute; inset: 0 6px; background: var(--container-40); border-radius: var(--radius-full); }
.tf-scrollbar-thumb:active { cursor: grabbing; }

.demo-page {
max-width: 1400px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

.demo-header {
margin-bottom: 48px;
}

.demo-title {
display: flex;
  align-items: center;
  gap: 10px;
  font: var(--font-title-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 8px;
}

.demo-title-icon {
color: var(--primary);
}

.demo-subtitle {
font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0;
}

.demo-section {
margin-bottom: 64px;
}

.demo-section-header {
display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.demo-section-name {
font: var(--font-title-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.demo-section-tag {
display: inline-flex;
  align-items: center;
  gap: 4px;
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--primary);
  background-color: var(--primary-container);
  padding: 2px 10px;
  border-radius: var(--radius-full);
}

.demo-section-desc {
font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0 0 28px;
}

.demo-grid {
display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 32px;
  align-items: start;
}

.demo-grid-2 {
grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 48px 40px;
}

.demo-card {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
grid-column: 1 / -1;
}

.demo-card-flush {
padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
margin: 0;
}

.demo-card-title {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
min-width: 0;
}

.demo-item-title {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

code {
font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--color-font-emphasize);
  background-color: var(--surface-container);
  padding: 1px 5px;
  border-radius: var(--radius-xs);
}

.button-theme-toggle {
margin-top: 16px;
}

.button-configurator {
display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.button-controls {
display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.button-control {
display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
padding: 0 12px;
}

.button-control input::placeholder {
color: var(--text-placeholder);
}

.button-select-wrap {
position: relative;
  display: block;
}

.button-select-wrap::after {
content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-control select:disabled {
cursor: not-allowed;
  opacity: 0.5;
}

.button-toggle-line {
display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
color: var(--on-surface);
  font: var(--font-body-md);
}

.button-icon-select {
margin-top: 0;
}

.button-switch {
position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

@scope (.preview-searchbar) {
.sb-root {
  display: flex;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  cursor: text;
  transition: background-image var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}

/* ── 大号：填充式 ─────────────────────────────────────────────
   底色 comp_background_tertiary（Light 黑 5%）
   上下 9px / 左右 12px，行高 22px → 整体高 40px，圆角 24px */
.sb-large {
  padding: 9px 12px;
  gap: 8px;
  border-radius: 24px;
  background-color: var(--surface-container);
  font: var(--font-body-md);
}

/* ── 小号：无填充 ─────────────────────────────────────────────
   背景透明，12px 字号，圆角 6px；无 hover / press / focus 状态
   固定高 36px（border-box），上下 9px / 左右 12px，图标与文字间距 8px（同大号） */
.sb-small {
  height: 36px;
  padding: 9px 12px;
  gap: 8px;
  border-radius: var(--radius-md);
  background-color: transparent;
  font: var(--font-body-sm);
}

/* ── 状态叠加（仅大号；Design Rule 3：底色不变，叠加交互浮层）── */

/* hover：comp_background_tertiary + interactive_hover（黑 5%） */
.sb-large:hover {
  background-image: linear-gradient(
    var(--color-interactive-hover),
    var(--color-interactive-hover)
  );
}

/* ── 图标与文字 ─────────────────────────────────────────────── */

/* 图标颜色 icon_secondary（黑 60%），两种尺寸一致 */
.sb-icon {
  flex: 0 0 auto;
  color: var(--color-icon-secondary);
}

/* 输入区：承载光标与输入框 */
.sb-field {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
}

/* 占位文字：text_tertiary（黑 40%） */
.sb-input::placeholder {
  color: var(--text-tertiary);
}

.sb-input {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  background: transparent;
  font: inherit;
  /* 文字行高 22px：9(上) + 22 + 9(下) = 40px 的盒子高度 */
  line-height: 22px;
  /* 输入中的文字：text_primary（黑 90%） */
  color: var(--text-primary);
  /* 原生光标不可控宽高，统一隐藏，改用自绘光标 .sb-caret */
  caret-color: transparent;
}

/* 隐藏量尺：与输入框同字体，只用来量插入点之前的文字宽度 */
.sb-measure {
  position: absolute;
  left: 0;
  top: 0;
  visibility: hidden;
  white-space: pre;
  pointer-events: none;
}

/* 小号：12px 文字，行高 16px（光标同样由自绘的 .sb-caret 提供） */
.sb-small .sb-input {
  line-height: 16px;
}

/* 自绘光标：按设计 SVG 绘制 —— 1.5×24px 圆角矩形，rx=0.75（两端半圆），纯 fill、无描边
   用 SVG 而不是 CSS 背景 + border-radius：CSS 的 1.5px 会被像素对齐撑成 2px，圆角也会被吃掉。
   注意 SVG 根元素必须是整数尺寸（24×24）：根元素尺寸为小数时 Chromium 会把视口吸附到整像素，
   1.5px 细条的圆角同样会被吃掉变直角（几何放在根元素内部用小数坐标则正常抗锯齿）
   绝对定位，不影响文字高度与盒子尺寸；24px 宽的透明画布不拦截点击 */
.sb-caret {
  display: none;
  position: absolute;
  left: -1.5px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-primary);
  pointer-events: none;
  animation: sb-caret-blink 1.1s step-end infinite;
}

.sb-root.sb-editing .sb-caret {
  display: block;
}

@keyframes sb-caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

/* ── 关闭按钮（Small cancel）：16×16，颜色同搜索图标 ── */
.sb-clear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--color-icon-secondary);
  cursor: pointer;
}

/* ── 禁用态 ─────────────────────────────────────────────────── */
.sb-disabled,
.sb-disabled .sb-input {
  cursor: not-allowed;
}

.sb-disabled:hover,
.sb-disabled:active {
  background-image: none;
}

.sb-disabled .sb-icon,
.sb-disabled .sb-clear {
  color: var(--color-icon-fourth);
}

.sb-disabled .sb-input {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

.sb-disabled .sb-input::placeholder {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}
