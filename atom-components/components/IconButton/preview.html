  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/var(--line-height-base) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}

/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}

/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

.demo-subtitle {

.demo-section {

.demo-section-header {

  margin-bottom: 8px;
}

.demo-section-name {

}

.demo-section-tag {

.demo-grid {

}

.demo-grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));

}

.demo-card {
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
  grid-column: 1 / -1;
}

.demo-card-flush {
  padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
  padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
  margin: 0;
}

.demo-card-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
  min-width: 0;
}

.demo-item-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

.demo-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

/* 可交互区：与大号 / 小号两列对齐 */
.demo-live {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  gap: 28px 40px;
}

/* ── 状态色板：每状态列出背景色 / 文字色（色块 + token + 值） ── */
.demo-color-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 460px) minmax(0, 400px);
  align-items: start;
  justify-content: start;
  gap: 24px 40px;
}

.demo-color-cell {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.demo-color-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
}

.demo-color-key {
  flex: 0 0 auto;
  min-width: 28px;
  font: var(--font-caption-lg);
  line-height: 20px;
  color: var(--text-placeholder);
}

.demo-color-items {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
  min-width: 0;
}

.demo-color-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 20px;
}

.demo-swatch {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid var(--divider);
}

/* 无填充：虚线边 + 斜线，表示 transparent */
.demo-swatch-none {
  border-style: dashed;
  background-image: linear-gradient(
    45deg,
    transparent 44%,
    var(--text-placeholder) 44%,
    var(--text-placeholder) 56%,
    transparent 56%
  );
}

.demo-color-token {
  font: var(--font-body-sm);
  color: var(--on-surface);
}

.demo-color-value,
.demo-color-use,
.demo-color-empty {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.demo-color-use {
  color: var(--text-placeholder);
}

/* ── 状态对照表：左列状态名 / 大号 / 小号 ── */
.demo-state-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  justify-content: start;
  gap: 28px 40px;
}

.demo-col-title {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
}

.demo-state-name {
  font: var(--font-body-md);
  color: var(--on-surface);
}

/* 静态状态演示：把 SearchBar 的 :hover / :active / :focus-within 落成常驻类 */
.demo-force-hover .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-hover),
    var(--color-interactive-hover)
  );
}

.demo-force-press .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-pressed),
    var(--color-interactive-pressed)
  );
}

/* focus：默认基础上叠加内部描边，内容不变 */
.demo-force-focus .sb-root {
  background-image: none;
  box-shadow: inset 0 0 0 var(--border-width-thick) var(--focus-ring);
}

/* 激活：聚焦 + 空内容 → 只有自绘光标，无描边 */
.demo-force-active .sb-caret {
  display: block;
}

/* 激活（小号）：无描边，仅自绘光标 */
.demo-force-caret .sb-caret {
  display: block;
}

@scope (.preview-icon-button) {
.icon-button {
  --icon-color: var(--color-icon-primary);
  --icon-bg: transparent;
  --icon-hover: var(--color-interactive-hover);
  --icon-pressed: var(--color-interactive-pressed);
  --icon-color-hover: var(--icon-color);
  --icon-color-pressed: var(--icon-color);
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  box-sizing: border-box;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  background: var(--icon-bg);
  color: var(--icon-color);
  cursor: pointer;
  transition: color var(--duration-fast) var(--ease-standard), opacity var(--duration-fast) var(--ease-standard);
}
.icon-button--small { --icon-color: var(--color-icon-secondary); }
.icon-button--primary {
  --icon-bg: var(--color-icon-primary);
  --icon-color: var(--color-font-on-primary);
  --icon-hover: var(--on-primary-10);
  --icon-pressed: var(--on-primary-15);
}
.dark .icon-button--primary { --icon-color: var(--black); }
.icon-button--secondary {
  --icon-color: var(--color-icon-primary);
  --icon-hover: var(--color-interactive-hover);
  --icon-pressed: var(--color-interactive-pressed);
}
.icon-button::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  pointer-events: none;
}
.icon-button:not([data-state]):not(:disabled):hover,
.icon-button[data-state="hover"] { color: var(--icon-color-hover); }
.icon-button:not([data-state]):not(:disabled):hover::before,
.icon-button[data-state="hover"]::before { background: var(--icon-hover); }
.icon-button:not([data-state]):not(:disabled):active,
.icon-button[data-state="pressed"] { color: var(--icon-color-pressed); }
.icon-button:not([data-state]):not(:disabled):active::before,
.icon-button[data-state="pressed"]::before { background: var(--icon-pressed); }
.icon-button:focus { outline: none; }
.icon-button:disabled { opacity: .5; cursor: not-allowed; outline: none; }
.icon-button__glyph {
  width: 20px;
  height: 20px;
  flex: none;
  background: currentColor;
  mask: no-repeat center / contain;
  -webkit-mask: no-repeat center / contain;
}
.icon-button--small .icon-button__glyph,
.icon-button--dialog .icon-button__glyph { width: 16px; height: 16px; }

.btn-color-swatch--none {

}

}

.icon-preview-gallery { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.icon-preview-sample { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 32px 24px; border: none; background: var(--surface-container-lowest); box-shadow: var(--shadow-card); border-radius: var(--radius-xl); }
.icon-preview-sample small { color: var(--text-secondary); }

@media(max-width: 480px) { .icon-preview-gallery { grid-template-columns: 1fr; } }

body { background: var(--surface); color: var(--on-surface); font-family: var(--font-family); }

.preview-panel-title { margin: 0 0 12px; font: var(--font-title-md); }
.preview-theme:focus-visible, .preview-tab:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
@media (max-width: 600px) { .preview-toolbar { padding: 24px 16px 0; } .gallery-library-label { font-size: 12px; } }
