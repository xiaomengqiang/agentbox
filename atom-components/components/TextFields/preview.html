  --alert: var(--color-alert);

  --warning: var(--color-warning);

  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);

  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);

  --info-container: var(--color-info-container);

  --text-primary: var(--color-font-primary);

  --interactive-link: var(--brand);

  --interactive-link-visited: var(--brand);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */

  --font-title-md: var(--font-size-2xl)/var(--line-height-snug) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/var(--line-height-snug) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/var(--line-height-base) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}

/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}

/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

.demo-subtitle {

.demo-section {

.demo-section-header {

  margin-bottom: 8px;
}

.demo-section-name {

}

.demo-section-tag {

.demo-grid {

}

.demo-grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));

}

.demo-card {
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
  grid-column: 1 / -1;
}

.demo-card-flush {
  padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
  padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
  margin: 0;
}

.demo-card-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
  min-width: 0;
}

.demo-item-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

.demo-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

/* 可交互区：与大号 / 小号两列对齐 */
.demo-live {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  gap: 28px 40px;
}

/* ── 状态色板：每状态列出背景色 / 文字色（色块 + token + 值） ── */
.demo-color-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 460px) minmax(0, 400px);
  align-items: start;
  justify-content: start;
  gap: 24px 40px;
}

.demo-color-cell {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.demo-color-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
}

.demo-color-key {
  flex: 0 0 auto;
  min-width: 28px;
  font: var(--font-caption-lg);
  line-height: 20px;
  color: var(--text-placeholder);
}

.demo-color-items {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
  min-width: 0;
}

.demo-color-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 20px;
}

.demo-swatch {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid var(--divider);
}

/* 无填充：虚线边 + 斜线，表示 transparent */
.demo-swatch-none {
  border-style: dashed;
  background-image: linear-gradient(
    45deg,
    transparent 44%,
    var(--text-placeholder) 44%,
    var(--text-placeholder) 56%,
    transparent 56%
  );
}

.demo-color-token {
  font: var(--font-body-sm);
  color: var(--on-surface);
}

.demo-color-value,
.demo-color-use,
.demo-color-empty {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.demo-color-use {
  color: var(--text-placeholder);
}

/* ── 状态对照表：左列状态名 / 大号 / 小号 ── */
.demo-state-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  justify-content: start;
  gap: 28px 40px;
}

.demo-col-title {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
}

.demo-state-name {
  font: var(--font-body-md);
  color: var(--on-surface);
}

/* 静态状态演示：把 SearchBar 的 :hover / :active / :focus-within 落成常驻类 */
.demo-force-hover .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-hover),
    var(--color-interactive-hover)
  );
}

.demo-force-press .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-pressed),
    var(--color-interactive-pressed)
  );
}

/* focus：默认基础上叠加内部描边，内容不变 */
.demo-force-focus .sb-root {
  background-image: none;
  box-shadow: inset 0 0 0 var(--border-width-thick) var(--focus-ring);
}

/* 激活：聚焦 + 空内容 → 只有自绘光标，无描边 */
.demo-force-active .sb-caret {
  display: block;
}

/* 激活（小号）：无描边，仅自绘光标 */
.demo-force-caret .sb-caret {
  display: block;
}

  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;

}
.preview-segmented-button .seg-demo-gallery {
 grid-template-columns: repeat(2, minmax(0, 1fr)); 
}
.preview-segmented-button .seg-demo-card {
 display: flex; flex-direction: column; align-items: center; gap: 20px; 
}
.preview-segmented-button .seg-demo-card h3 {
 align-self: flex-start; margin: 0; 
}
.preview-segmented-button .btn-table thead th {

  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
  background: var(--surface-container-low);
  padding: 12px 16px;

}
.preview-segmented-button .btn-table tbody td,
.preview-segmented-button .btn-table tbody th {

  font: var(--font-body-md);
  padding: 12px 16px;
  vertical-align: top;
  border-right: 0;

}
.preview-segmented-button .btn-table tbody th:not(.btn-color-variant),
.preview-segmented-button .btn-table tbody td:first-child:not(.btn-color-state) {

  background: transparent;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);

}
.preview-segmented-button .btn-table tbody .btn-color-variant {

  font: var(--font-body-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  background: var(--surface-container-low);
  min-width: 150px;

}
.preview-segmented-button .btn-table .btn-color-state {
 font-weight: var(--font-weight-medium); 
}
.preview-segmented-button .btn-table .btn-table-src {
 font: var(--font-caption-md); color: var(--text-placeholder); 
}
.preview-segmented-button .seg-demo-matrix {
 min-width: 1280px; 
}
@media (max-width: 760px) {

  .preview-segmented-button .seg-demo-gallery { grid-template-columns: minmax(0, 1fr); }
  .preview-segmented-button .seg-demo-live { padding: 24px; }

}
.preview-segmented-button .seg-gallery-heading {
 margin: 28px 0 16px; font: var(--font-subtitle-sm); color: var(--on-surface); 
}
/* Shared Button classes own the page, configurator, controls and state matrices.
   Only layout safety and table-body semantics are scoped overrides here. */
:is(.preview-iconstate,.preview-menuitem) .button-configurator { min-width: 0; }
:is(.preview-iconstate,.preview-menuitem) .inspection-live { box-sizing: border-box; min-width: 0; padding: 32px; overflow-x: auto; }
:is(.preview-iconstate,.preview-menuitem) .inspection-specimen { flex: none; margin-inline: auto; }
:is(.preview-iconstate,.preview-menuitem) .inspection-matrix-title { margin: 32px 0 16px; font: var(--font-subtitle-md); font-weight: var(--font-weight-bold); color: var(--on-surface); }
:is(.preview-iconstate,.preview-menuitem) .btn-matrix { min-width: 0; }
:is(.preview-iconstate,.preview-menuitem) .btn-matrix-group { min-width: 0; }
:is(.preview-iconstate,.preview-menuitem) .button-control input[type="file"] { height: auto; min-height: 40px; padding: 8px 12px; }
:is(.preview-iconstate,.preview-menuitem) .button-control small { font: var(--font-caption-lg); color: var(--text-placeholder); }
:is(.preview-iconstate,.preview-menuitem) [inert] { pointer-events: none; }
:is(.preview-iconstate,.preview-menuitem) .btn-table-wrap { overflow-x: auto; max-width: 100%; border-radius: var(--radius-xl); box-shadow: var(--shadow-card); background: var(--surface-container-lowest); }
:is(.preview-iconstate,.preview-menuitem) .btn-table { width: 100%; min-width: 900px; border-collapse: collapse; margin: 0; box-shadow: none; border-radius: 0; }
:is(.preview-iconstate,.preview-menuitem) .btn-table :is(th,td) { padding: 12px 16px; border-bottom: 1px solid var(--divider); text-align: left; }
:is(.preview-iconstate,.preview-menuitem) .btn-table thead th { font: var(--font-caption-lg); font-weight: var(--font-weight-bold); color: var(--text-secondary); background: var(--surface-container-low); }
:is(.preview-iconstate,.preview-menuitem) .btn-table tbody td { font: var(--font-body-md); color: var(--text-secondary); vertical-align: top; }
:is(.preview-iconstate,.preview-menuitem) .btn-table tbody th { font: var(--font-body-md); font-weight: var(--font-weight-medium); color: var(--on-surface); background: transparent; }
:is(.preview-iconstate,.preview-menuitem) .btn-table tbody .btn-color-variant { font: var(--font-body-lg); font-weight: var(--font-weight-bold); background: var(--surface-container-low); vertical-align: top; min-width: 112px; }
:is(.preview-iconstate,.preview-menuitem) .btn-table tbody .btn-color-state { font-weight: var(--font-weight-medium); color: var(--on-surface); }
:is(.preview-iconstate,.preview-menuitem) .btn-color-state small { white-space: normal; }
:is(.preview-iconstate,.preview-menuitem) .btn-color-group-start > * { border-top: 2px solid var(--color-comp-border); }
:is(.preview-iconstate,.preview-menuitem) .btn-table--color { min-width: 1180px; }
:is(.preview-iconstate,.preview-menuitem) .btn-color-swatch { width: 18px; height: 18px; flex: 0 0 18px; }
:is(.preview-iconstate,.preview-menuitem) .btn-color-token code { overflow-wrap: anywhere; }

@media(max-width: 600px) {
 :is(.preview-iconstate,.preview-menuitem) .inspection-live { padding: 24px; }
}

@scope (.preview-text-fields) {
.tf-root { max-width: 100%; min-width: 0; box-sizing: border-box; }
.tf-label { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; color: var(--text-primary); font: var(--font-body-md); }
.tf-required { color: var(--text-error); }
.tf-box { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 24px; background: var(--color-background-primary); box-shadow: inset 0 0 0 1px var(--color-comp-border); font: var(--font-body-md); transition: box-shadow var(--duration-fast) var(--ease-standard); }
.tf-root:not(.tf-disabled):not(.tf-editing):not(.tf-error):not(:has(.tf-password:focus-visible)):hover .tf-box { box-shadow: inset 0 0 0 1px var(--color-comp-border-hover); }
.tf-root.tf-editing .tf-box { box-shadow: inset 0 0 0 1px var(--container-40); }
.tf-field { position: relative; flex: 1 1 auto; min-width: 0; clip-path: inset(-2px 0 -2px -2px); }
.tf-input { display: block; box-sizing: border-box; width: 100%; min-width: 0; padding: 0; margin: 0; border: 0; outline: none; background: transparent; font: inherit; line-height: 22px; color: var(--text-primary); caret-color: transparent; }
.tf-input::placeholder { color: var(--text-tertiary); opacity: 1; }
.tf-mirror { position: absolute; top: 0; left: 0; visibility: hidden; white-space: pre; font: inherit; line-height: 22px; pointer-events: none; }
.tf-caret { position: absolute; color: var(--text-primary); pointer-events: none; animation: tf-blink 1.1s step-end infinite; }
@keyframes tf-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.tf-multiline .tf-box { position: relative; min-height: 140px; box-sizing: border-box; flex-direction: column; align-items: stretch; gap: 0; padding: 12px 8px 8px; border-radius: var(--tf-radius, 8px); }
.tf-multiline .tf-field { flex: 0 0 auto; margin-inline: 8px; }
.tf-multiline .tf-input { height: 22px; resize: none; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }
.tf-actions { display: flex; align-items: center; flex: 0 0 32px; height: 32px; min-width: 0; gap: 8px; margin-top: 8px; }
.tf-multiline .tf-mirror { white-space: pre-wrap; overflow-wrap: break-word; }
.tf-password { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 20px; width: 20px; height: 22px; border: 0; outline: none; padding: 0; background: transparent; color: var(--color-icon-primary); cursor: pointer; }
.tf-password-icon { display: block; width: 20px; height: 20px; background: currentColor; mask: var(--tf-icon) center / contain no-repeat; -webkit-mask: var(--tf-icon) center / contain no-repeat; }

.tf-root.tf-error .tf-box { box-shadow: inset 0 0 0 1px var(--error); }
.tf-helper { margin: 8px 0 0; padding: 0; font: var(--font-caption-lg); color: var(--text-tertiary); }
.tf-error .tf-helper { color: var(--text-error); }
.tf-disabled .tf-input, .tf-disabled .tf-input::placeholder { color: var(--text-disabled); -webkit-text-fill-color: var(--text-disabled); }
.tf-disabled .tf-label, .tf-disabled .tf-helper, .tf-disabled .tf-required { color: var(--text-disabled); }

/* Fixed 10px character cells keep native password hit-testing aligned with 8px dots. */
.tf-masked .tf-input { font-family: monospace; font-size: var(--font-size-base); letter-spacing: calc(10px - 1ch); color: transparent; -webkit-text-fill-color: transparent; }
.tf-dots-viewport { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

.tf-dot { flex: 0 0 8px; width: 8px; height: 8px; margin-right: 2px; border-radius: 50%; background: var(--text-primary); }
.tf-disabled .tf-dot { background: var(--text-disabled); }

/* Overlay centered in the 16px text-to-border gap; never reserves text width. */
.tf-multiline .tf-input::-webkit-scrollbar { display: none; width: 0; height: 0; }
.tf-scrollbar { position: absolute; top: 12px; right: 0; width: 16px; pointer-events: none; }
.tf-scrollbar-thumb { position: absolute; top: 0; right: 0; width: 16px; pointer-events: auto; touch-action: none; cursor: grab; user-select: none; }
.tf-scrollbar-thumb::before { content: ""; position: absolute; inset: 0 6px; background: var(--container-40); border-radius: var(--radius-full); }

  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {

}

.button-switch input:checked + .button-switch-track::after {
transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-width: 320px; }
body { background: var(--surface); color: var(--on-surface); font-family: var(--font-family); }
[hidden] { display: none !important; }
.preview-toolbar { max-width: 1400px; margin: 0 auto; padding: 32px 24px 0; }
.preview-heading { display: flex; align-items: center; gap: 14px; }
.preview-heading h1 { margin: 0; font: var(--font-title-lg); }
.gallery-library-label { margin-left: auto; color: var(--text-secondary); font: var(--font-body-md); }
/* Shared by standalone previews and both component galleries. */
.preview-theme { position: relative; flex: 0 0 auto; width: 68px; height: 36px; padding: 3px; border: 1px solid var(--divider); border-radius: 999px; display: inline-flex; align-items: center; justify-content: space-around; color: var(--text-secondary); background: var(--surface-container); cursor: pointer; }
.preview-theme::before { content: ""; position: absolute; left: 3px; top: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-container-lowest); box-shadow: var(--shadow-sm); transition: transform 160ms ease; }
.preview-theme[aria-checked="true"]::before { transform: translateX(32px); }
.preview-theme > span { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; }
.preview-theme[aria-checked="false"] .theme-sun, .preview-theme[aria-checked="true"] .theme-moon { color: var(--on-surface); }
@media (prefers-reduced-motion: reduce) { .preview-theme::before { transition: none; } }

.preview-tabs { display: flex; gap: 24px; margin-top: 24px; overflow-x: auto; border-bottom: 1px solid var(--divider); }
.preview-tab { flex-shrink: 0; padding: 12px 0; border: 0; border-bottom: 2px solid transparent; color: var(--text-secondary); background: none; font: var(--font-body-md); cursor: pointer; }
.preview-tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
