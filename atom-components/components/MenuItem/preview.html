  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */

  --font-title-md: var(--font-size-2xl)/var(--line-height-snug) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/var(--line-height-snug) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/var(--line-height-base) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}

/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}

/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

.demo-subtitle {

.demo-section {

.demo-section-header {

  margin-bottom: 8px;
}

.demo-section-name {

}

.demo-section-tag {

.demo-grid {

}

.demo-grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));

}

.demo-card {
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
  grid-column: 1 / -1;
}

.demo-card-flush {
  padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
  padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
  margin: 0;
}

.demo-card-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
  min-width: 0;
}

.demo-item-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

.demo-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

/* 可交互区：与大号 / 小号两列对齐 */
.demo-live {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  gap: 28px 40px;
}

/* ── 状态色板：每状态列出背景色 / 文字色（色块 + token + 值） ── */
.demo-color-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 460px) minmax(0, 400px);
  align-items: start;
  justify-content: start;
  gap: 24px 40px;
}

.demo-color-cell {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.demo-color-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
}

.demo-color-key {
  flex: 0 0 auto;
  min-width: 28px;
  font: var(--font-caption-lg);
  line-height: 20px;
  color: var(--text-placeholder);
}

.demo-color-items {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
  min-width: 0;
}

.demo-color-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 20px;
}

.demo-swatch {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid var(--divider);
}

/* 无填充：虚线边 + 斜线，表示 transparent */
.demo-swatch-none {
  border-style: dashed;
  background-image: linear-gradient(
    45deg,
    transparent 44%,
    var(--text-placeholder) 44%,
    var(--text-placeholder) 56%,
    transparent 56%
  );
}

.demo-color-token {
  font: var(--font-body-sm);
  color: var(--on-surface);
}

.demo-color-value,
.demo-color-use,
.demo-color-empty {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.demo-color-use {
  color: var(--text-placeholder);
}

/* ── 状态对照表：左列状态名 / 大号 / 小号 ── */
.demo-state-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  justify-content: start;
  gap: 28px 40px;
}

.demo-col-title {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
}

.demo-state-name {
  font: var(--font-body-md);
  color: var(--on-surface);
}

/* 静态状态演示：把 SearchBar 的 :hover / :active / :focus-within 落成常驻类 */
.demo-force-hover .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-hover),
    var(--color-interactive-hover)
  );
}

.demo-force-press .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-pressed),
    var(--color-interactive-pressed)
  );
}

/* focus：默认基础上叠加内部描边，内容不变 */
.demo-force-focus .sb-root {
  background-image: none;
  box-shadow: inset 0 0 0 var(--border-width-thick) var(--focus-ring);
}

/* 激活：聚焦 + 空内容 → 只有自绘光标，无描边 */
.demo-force-active .sb-caret {
  display: block;
}

/* 激活（小号）：无描边，仅自绘光标 */
.demo-force-caret .sb-caret {
  display: block;
}

:is(.preview-iconstate,.preview-menuitem) .btn-table { width: 100%; min-width: 900px; border-collapse: collapse; margin: 0; box-shadow: none; border-radius: 0; }

:is(.preview-iconstate,.preview-menuitem) .btn-table tbody td { font: var(--font-body-md); color: var(--text-secondary); vertical-align: top; }

:is(.preview-iconstate,.preview-menuitem) .btn-table tbody .btn-color-variant { font: var(--font-body-lg); font-weight: var(--font-weight-bold); background: var(--surface-container-low); vertical-align: top; min-width: 112px; }

@scope (.preview-menuitem) {
.mi-menu {
  /* 警告卸载为设计指定色值，集中为组件 token，供文本、图标和背景一致引用。 */
  --mi-danger-font: #E02128;
  --mi-danger-icon: #E02128;
  --mi-danger-container: #FEE7E8;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* ---------- 导航内容列表（nav） ---------- */
.mi-menu-nav {
  width: 300px;
  padding: 0;
  gap: 12px;
  border-radius: var(--radius-overlay);
}

/* 无背景形态：用于单条目状态演示 */
.mi-menu-nav.mi-menu-plain {
  background: transparent;
}

/* ---------- 历史对话列表（history） ---------- */
.mi-menu-history {
  width: 300px;
  gap: 12px;
}

/* ---------- 下拉列表（dropdown） ---------- */
.mi-menu-dropdown {
  gap: 0; /* 单行条目紧贴无间距 */
}

/* 中尺寸下拉列表容器：单行条目 */
.mi-menu-dropdown-md {
  gap: 0;
}

/* ================= 条目基础 ================= */
.mi-item {
  display: flex;
  align-items: center;
  box-sizing: border-box;
  border: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

/* ---- 导航内容列表条目 ---- */
.mi-item-nav {
  gap: 8px; /* 图标与文本间距 8px */
  width: 100%; /* 300px */
  height: 40px;
  padding: 0 12px; /* 图标距左 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
}

/* ---- 历史对话列表条目 ---- */
.mi-item-history {
  justify-content: space-between;
  width: 100%; /* 300px */
  height: 40px;
  padding: 0 12px; /* 文本距左 12px，图标距右 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
}

/* ---- 下拉列表条目 ---- */
.mi-item-dropdown {
  gap: var(--spacing-inline);
  width: 152px;
  height: 32px;
  padding: 4px 12px; /* 文本与图标距容器上下各 4px */
  border-radius: var(--radius-md); /* 6px */
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px；文本行高在下方固定为 16px */
  font-weight: var(--font-weight-regular); /* 400 */
}

/* ---- 下拉列表中尺寸条目：232×36px ---- */
.mi-item-dropdown-md {
  gap: var(--spacing-inline); /* 文本与 icon 间距 8px */
  width: 232px;
  height: 36px;
  padding: 4px 12px; /* icon 距容器左 12px，文本与图标距上下各 4px */
  border-radius: var(--radius-md); /* 6px */
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px；文本行高在下方固定为 16px */
  font-weight: var(--font-weight-regular); /* 400 */
  background: var(--surface-container-lowest);
}

/* ================= 状态 ================= */
/* 导航内容列表 / 历史对话列表：悬浮、选中、非默认态均 5% 透明黑背景 */
.mi-item-nav:hover,
.mi-item-nav.mi-item-hover,
.mi-item-nav.mi-item-selected,
.mi-item-history:hover,
.mi-item-history.mi-item-active {
  background-color: var(--color-interactive-hover);
}

/* 下拉列表普通项悬浮：5% 透明黑背景 */
.mi-item-dropdown:not(:disabled):hover,
.mi-item-dropdown.mi-item-hover:not(:disabled) {
  background-color: var(--color-interactive-hover);
}

/* 下拉列表危险项：错误语义色图标与文本 */
.mi-item-dropdown.mi-item-danger {
  color: var(--mi-danger-font);
}

/* 下拉列表危险项悬浮：设计指定粉色背景 token。 */
.mi-item-dropdown.mi-item-danger:not(:disabled):hover,
.mi-item-dropdown.mi-item-danger.mi-item-hover:not(:disabled) {
  background-color: var(--mi-danger-container);
}

/* 下拉列表禁用态：整体 50% 透明度，不可点击 */
.mi-item-dropdown:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ================= 子元素 ================= */
.mi-icon {
  flex-shrink: 0;
  display: block;
}

.mi-icon--mask {
  background-color: currentColor;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  -webkit-mask-size: contain;
  mask-size: contain;
}

/* 中尺寸下拉列表选中态右侧「正确」图标：右对齐 */
.mi-check {
  flex-shrink: 0;
  margin-left: auto;
}

.mi-label {
  display: flex;
  align-self: stretch;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 下拉列表：文本 16px 行高，与 14px / 17px 图标在同一 flex 中轴居中。 */
.mi-item-dropdown .mi-label,
.mi-item-dropdown-md .mi-label {
  line-height: 16px;
  transform: translateY(1px); /* 字体上行区较大，做 1px 光学校正以落在视觉中轴 */
}

.mi-item-history .mi-label {
  text-align: left;
}

/* 左侧导航文字的字形视觉重心略高，向下校正 1px。 */
.mi-item-nav .mi-label {
  transform: translateY(1px);
}

/* 历史对话列表右侧状态图标：右对齐 12px（由按钮 padding 提供），上下 8px */
.mi-status {
  flex-shrink: 0;
  margin: 8px 0;
}

/* ================= 文件夹 / 文件列表（folder / file-level-1 / file-level-2） ================= */
.fl-list {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* 条目：602×40px */
.fl-row {
  display: flex;
  align-items: center;
  gap: 8px; /* 展开/收起图标 → 文件夹图标 → 文本，三部件间距 8px */
  box-sizing: border-box;
  width: 602px;
  height: 40px;
  padding: 0 12px; /* 内容距容器左右 12px */
  border-radius: var(--radius-container);
  color: var(--on-surface);
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular); /* 400 */
  line-height: 19px;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

/* 悬浮态：5% 透明黑背景 */
.fl-row:hover,
.fl-row-hover {
  background-color: var(--color-interactive-hover);
}

/* 重命名态 / 重命名输入中：5% 透明黑背景（与悬浮一致） */
.fl-row-rename {
  background-color: var(--color-interactive-hover);
}

/* 禁用态：文本与图标整体使用禁用色，不可交互 */
.fl-row-disabled {
  color: var(--text-disabled);
}

/* 展开/收起按钮 */
.fl-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  color: inherit; /* 跟随条目文字色（Lucide 图标 stroke 使用 currentColor） */
}

.fl-toggle:disabled {
  cursor: not-allowed;
}

.fl-chevron,
.fl-folder,
.fl-file {
  flex-shrink: 0;
  color: inherit;
}

/* 文件列表：一级/二级 左侧图标缩进 */
/* 一级文件列表：最左侧文件图标距外框左 12px（无展开/收起，直接由 padding 0 12px 对齐） */
.fl-row-file-1 .fl-file {
  margin-left: 0;
}

/* 二级文件列表：最左侧文件图标距外框左 36px（12px 基础缩进 + 24px = 36px） */
.fl-row-file-2 .fl-file {
  margin-left: 24px;
}

/* 重命名输入框右边缘统一对齐：folder/file-level-2 图标位 60px → 宽 540；
   file-level-1 图标位 36px → 宽 564（保证右侧同样对齐到 600px） */
.fl-row-file-1 .fl-input {
  width: 564px;
}

/* 文本 */
.fl-label {
  display: flex;
  align-self: stretch;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 悬浮态操作区（右侧评论 + 更多） */
.fl-hover-actions {
  display: inline-flex;
  align-items: center;
  gap: 12px; /* 两个操作图标间距 12px */
  flex-shrink: 0;
  margin-left: auto; /* 右对齐 */
}

.fl-hover-icon {
  display: inline-block;
  flex-shrink: 0;
}

/* 重命名输入框：540×36px，brand 蓝 1px 描边 */
.fl-input {
  position: relative;
  flex-shrink: 0; /* 固定宽度，不收缩 */
  box-sizing: border-box;
  width: 540px;
  height: 36px;
  border: 1px solid var(--primary); /* brand 蓝 #0A59F7 */
  border-radius: var(--radius-action);
  background: var(--surface-container-lowest);
}

/* 真实编辑框：透明文本/光标，覆盖整个输入框，负责交互与输入 */
.fl-input-field {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  padding: 0 8px;
  border: none;
  background: transparent;
  color: transparent;
  caret-color: transparent; /* 隐藏原生光标，改用自定义蓝竖线 */
  font: var(--font-body-md); /* 14px */
  font-weight: var(--font-weight-regular);
  line-height: 19px;
  outline: none;
}

/* 可见文本 + 光标层（不接收事件） */
.fl-input-display {
  position: absolute;
  left: 8px;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  pointer-events: none;
  font: var(--font-body-md);
  font-weight: var(--font-weight-regular);
  line-height: 19px;
  color: var(--on-surface);
}

/* 蓝色竖线光标：2×24px，文本后 2px（重命名输入中显示） */
.fl-caret {
  display: inline-block;
  flex-shrink: 0;
  width: 2px;
  height: 24px;
  margin-left: 2px;
  vertical-align: middle;
  background: var(--primary);
}

  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {
display: flex;
  min-height: 220px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

@media (max-width: 980px) {
.button-configurator {
grid-template-columns: 1fr;
}

.button-configurator-preview {
min-height: 132px;
}

}

@media (max-width: 760px) {
.button-controls {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

}

@media (max-width: 520px) {
.button-controls {
grid-template-columns: 1fr;
}

}

.btn-lab {
display: flex;
  flex-direction: column;
  gap: 32px;
}

.btn-lab-block {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 20px 24px 24px;
}

.btn-lab-head {
display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.btn-lab-size {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-spec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-lab-grid {
display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

@media (max-width: 860px) {
.btn-lab-grid {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

}

.btn-lab-col {
display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  padding: 14px 12px 18px;
  background-color: var(--surface-container-low);
  border-radius: var(--radius-container);
}

.btn-lab-colhead {
display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 16px;
  text-align: center;
}

.btn-lab-colname {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-colmeta {
font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-lab-slot {
display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.btn-lab-slot-off {
margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--divider);
}

.btn-lab-slotlabel {
font: var(--font-caption-md);
  font-weight: var(--font-weight-bold);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-placeholder);
}

.btn-lab-grid--two {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

.btn-matrix {
display: flex;
  flex-direction: column;
  gap: 24px;
}

.btn-matrix-group {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 16px 20px 20px;
  overflow-x: auto;
}

.btn-matrix-grouphead {
display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--divider);
}

.btn-matrix-groupname {
font: var(--font-subtitle-md);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-groupspec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-matrix-row {
display: grid;
  grid-template-columns: minmax(150px, 200px) repeat(5, minmax(140px, 1fr));
  gap: 8px;
  align-items: center;
  padding: 10px 0;
}

.btn-matrix-row + .btn-matrix-row {
border-top: 1px solid var(--divider);
}

.btn-matrix-row-head {
padding-bottom: 4px;
}

.btn-matrix-label {
display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.btn-matrix-variant {
font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.btn-matrix-meta {
font: var(--font-caption-lg);
  color: var(--text-placeholder);
}

.btn-matrix-cell {
display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 44px;
  
  pointer-events: none;
}

.btn-matrix-state {
font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-hint {
font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-table {
width: 100%;
  border-collapse: collapse;
  margin-top: 24px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.btn-table th {
font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  background-color: var(--surface-container-low);
}

.btn-table td {
font: var(--font-body-md);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  border-top: 1px solid var(--divider);
}

.btn-table-strong {
display: block;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.btn-table-src {
display: block;
  margin-top: 4px;
  font: var(--font-caption-md);
  color: var(--text-placeholder);
  line-height: 1.5;
}

.btn-table-wrap {
overflow-x: auto;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-table-wrap .btn-table {
min-width: 900px;
  border-radius: 0;
  box-shadow: none;
  margin-top: 0;
}

.btn-table-wrap .btn-table--color {
min-width: 1180px;
}

.btn-table-wrap .btn-table--roomy {
min-width: 920px;
}

.btn-table-wrap--spaced {
margin-top: 24px;
}

.btn-table--roomy th,
.btn-table--roomy td {
min-width: 110px;
}

.btn-table--color th:first-child,
.btn-table--color td:first-child {
min-width: 112px;
}

.btn-table--color th:not(:first-child),
.btn-table--color td:not(:first-child) {
min-width: 130px;
}

.btn-color-token {
display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.btn-color-token code {
white-space: normal;
  overflow-wrap: anywhere;
}

.btn-table .btn-color-variant {
vertical-align: top;
  color: var(--on-surface);
  font: var(--font-body-lg);
  font-weight: var(--font-weight-bold);
  background: var(--surface-container-low);
  border-top: 1px solid var(--divider);
}

.btn-table .btn-color-state {
min-width: 110px;
  vertical-align: top;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.btn-color-state small {
display: block;
  margin-top: 4px;
  color: var(--text-placeholder);
  font: var(--font-caption-md);
  font-weight: var(--font-weight-regular);
  white-space: nowrap;
}

.btn-color-same {
color: var(--text-placeholder);
  font: var(--font-body-md);
}

.btn-color-group-start > th,
.btn-color-group-start > td {
border-top: 2px solid var(--color-comp-border);
}

.btn-color-swatch {
display: inline-block;
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  box-sizing: border-box;
  border: 1px solid var(--color-comp-border);
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--surface-container-lowest);
}

.btn-color-swatch--transparent {
background-color: var(--surface-container-lowest);
  background-image:
    linear-gradient(45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(-45deg, var(--divider) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--divider) 75%),
    linear-gradient(-45deg, transparent 75%, var(--divider) 75%);
  background-position: 0 0, 0 5px, 5px -5px, -5px 0;
  background-size: 10px 10px;
}

.btn-color-swatch--none {
background:
    linear-gradient(
      135deg,
      transparent 44%,
      var(--text-placeholder) 46%,
      var(--text-placeholder) 54%,
      transparent 56%
    ),
    var(--surface-container-lowest);
}

.btn-color-swatch--disabled {
opacity: 0.5;
}
