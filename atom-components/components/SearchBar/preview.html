  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */

  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */

  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */

  --font-title-lg: var(--font-size-3xl)/var(--line-height-snug) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/var(--line-height-base) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}

/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}

/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

.demo-subtitle {

.demo-section {

.demo-section-header {

  margin-bottom: 8px;
}

.demo-section-name {

}

.demo-section-tag {

.demo-grid {

}

.demo-grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));

}

.demo-card {
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
  grid-column: 1 / -1;
}

.demo-card-flush {
  padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
  padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
  margin: 0;
}

.demo-card-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
  min-width: 0;
}

.demo-item-title {
  font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

.demo-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

/* 可交互区：与大号 / 小号两列对齐 */
.demo-live {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  gap: 28px 40px;
}

/* ── 状态色板：每状态列出背景色 / 文字色（色块 + token + 值） ── */
.demo-color-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 460px) minmax(0, 400px);
  align-items: start;
  justify-content: start;
  gap: 24px 40px;
}

.demo-color-cell {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.demo-color-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
}

.demo-color-key {
  flex: 0 0 auto;
  min-width: 28px;
  font: var(--font-caption-lg);
  line-height: 20px;
  color: var(--text-placeholder);
}

.demo-color-items {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
  min-width: 0;
}

.demo-color-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 20px;
}

.demo-swatch {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid var(--divider);
}

/* 无填充：虚线边 + 斜线，表示 transparent */
.demo-swatch-none {
  border-style: dashed;
  background-image: linear-gradient(
    45deg,
    transparent 44%,
    var(--text-placeholder) 44%,
    var(--text-placeholder) 56%,
    transparent 56%
  );
}

.demo-color-token {
  font: var(--font-body-sm);
  color: var(--on-surface);
}

.demo-color-value,
.demo-color-use,
.demo-color-empty {
  font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.demo-color-use {
  color: var(--text-placeholder);
}

/* ── 状态对照表：左列状态名 / 大号 / 小号 ── */
.demo-state-table {
  display: grid;
  grid-template-columns: 72px minmax(0, 420px) minmax(0, 300px);
  align-items: center;
  justify-content: start;
  gap: 28px 40px;
}

.demo-col-title {
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
}

.demo-state-name {
  font: var(--font-body-md);
  color: var(--on-surface);
}

/* 静态状态演示：把 SearchBar 的 :hover / :active / :focus-within 落成常驻类 */
.demo-force-hover .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-hover),
    var(--color-interactive-hover)
  );
}

.demo-force-press .sb-root {
  background-image: linear-gradient(
    var(--color-interactive-pressed),
    var(--color-interactive-pressed)
  );
}

/* focus：默认基础上叠加内部描边，内容不变 */
.demo-force-focus .sb-root {
  background-image: none;
  box-shadow: inset 0 0 0 var(--border-width-thick) var(--focus-ring);
}

/* 激活：聚焦 + 空内容 → 只有自绘光标，无描边 */
.demo-force-active .sb-caret {
  display: block;
}

/* 激活（小号）：无描边，仅自绘光标 */
.demo-force-caret .sb-caret {
  display: block;
}

/* Shared Button classes own the page, configurator, controls and state matrices.
   Only layout safety and table-body semantics are scoped overrides here. */
:is(.preview-iconstate,.preview-menuitem) .button-configurator { min-width: 0; }
:is(.preview-iconstate,.preview-menuitem) .inspection-live { box-sizing: border-box; min-width: 0; padding: 32px; overflow-x: auto; }
:is(.preview-iconstate,.preview-menuitem) .inspection-specimen { flex: none; margin-inline: auto; }
:is(.preview-iconstate,.preview-menuitem) .inspection-matrix-title { margin: 32px 0 16px; font: var(--font-subtitle-md); font-weight: var(--font-weight-bold); color: var(--on-surface); }
:is(.preview-iconstate,.preview-menuitem) .btn-matrix { min-width: 0; }
:is(.preview-iconstate,.preview-menuitem) .btn-matrix-group { min-width: 0; }

:is(.preview-iconstate,.preview-menuitem) .button-control small { font: var(--font-caption-lg); color: var(--text-placeholder); }
:is(.preview-iconstate,.preview-menuitem) [inert] { pointer-events: none; }
:is(.preview-iconstate,.preview-menuitem) .btn-table-wrap { overflow-x: auto; max-width: 100%; border-radius: var(--radius-xl); box-shadow: var(--shadow-card); background: var(--surface-container-lowest); }
:is(.preview-iconstate,.preview-menuitem) .btn-table { width: 100%; min-width: 900px; border-collapse: collapse; margin: 0; box-shadow: none; border-radius: 0; }
:is(.preview-iconstate,.preview-menuitem) .btn-table :is(th,td) { padding: 12px 16px; border-bottom: 1px solid var(--divider); text-align: left; }
:is(.preview-iconstate,.preview-menuitem) .btn-table thead th { font: var(--font-caption-lg); font-weight: var(--font-weight-bold); color: var(--text-secondary); background: var(--surface-container-low); }
:is(.preview-iconstate,.preview-menuitem) .btn-table tbody td { font: var(--font-body-md); color: var(--text-secondary); vertical-align: top; }
:is(.preview-iconstate,.preview-menuitem) .btn-table tbody th { font: var(--font-body-md); font-weight: var(--font-weight-medium); color: var(--on-surface); background: transparent; }
:is(.preview-iconstate,.preview-menuitem) .btn-table tbody .btn-color-variant { font: var(--font-body-lg); font-weight: var(--font-weight-bold); background: var(--surface-container-low); vertical-align: top; min-width: 112px; }
:is(.preview-iconstate,.preview-menuitem) .btn-table tbody .btn-color-state { font-weight: var(--font-weight-medium); color: var(--on-surface); }
:is(.preview-iconstate,.preview-menuitem) .btn-color-state small { white-space: normal; }
:is(.preview-iconstate,.preview-menuitem) .btn-color-group-start > * { border-top: 2px solid var(--color-comp-border); }
:is(.preview-iconstate,.preview-menuitem) .btn-table--color { min-width: 1180px; }
:is(.preview-iconstate,.preview-menuitem) .btn-color-swatch { width: 18px; height: 18px; flex: 0 0 18px; }
:is(.preview-iconstate,.preview-menuitem) .btn-color-token code { overflow-wrap: anywhere; }

@media(max-width: 600px) {
 :is(.preview-iconstate,.preview-menuitem) .inspection-live { padding: 24px; }
}

@scope (.preview-searchbar) {
.sb-root {
  display: flex;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  cursor: text;
  transition: background-image var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}

/* ── 大号：填充式 ─────────────────────────────────────────────
   底色 comp_background_tertiary（Light 黑 5%）
   上下 9px / 左右 12px，行高 22px → 整体高 40px，圆角 24px */
.sb-large {
  padding: 9px 12px;
  gap: 8px;
  border-radius: 24px;
  background-color: var(--surface-container);
  font: var(--font-body-md);
}

/* ── 小号：无填充 ─────────────────────────────────────────────
   背景透明，12px 字号，圆角 6px；无 hover / press / focus 状态
   固定高 36px（border-box），上下 9px / 左右 12px，图标与文字间距 8px（同大号） */
.sb-small {
  height: 36px;
  padding: 9px 12px;
  gap: 8px;
  border-radius: var(--radius-md);
  background-color: transparent;
  font: var(--font-body-sm);
}

/* ── 状态叠加（仅大号；Design Rule 3：底色不变，叠加交互浮层）── */

/* hover：comp_background_tertiary + interactive_hover（黑 5%） */
.sb-large:hover {
  background-image: linear-gradient(
    var(--color-interactive-hover),
    var(--color-interactive-hover)
  );
}

/* ── 图标与文字 ─────────────────────────────────────────────── */

/* 图标颜色 icon_secondary（黑 60%），两种尺寸一致 */
.sb-icon {
  flex: 0 0 auto;
  color: var(--color-icon-secondary);
}

/* 输入区：承载光标与输入框 */
.sb-field {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
}

/* 占位文字：text_tertiary（黑 40%） */
.sb-input::placeholder {
  color: var(--text-tertiary);
}

.sb-input {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  background: transparent;
  font: inherit;
  /* 文字行高 22px：9(上) + 22 + 9(下) = 40px 的盒子高度 */
  line-height: 22px;
  /* 输入中的文字：text_primary（黑 90%） */
  color: var(--text-primary);
  /* 原生光标不可控宽高，统一隐藏，改用自绘光标 .sb-caret */
  caret-color: transparent;
}

/* 隐藏量尺：与输入框同字体，只用来量插入点之前的文字宽度 */
.sb-measure {
  position: absolute;
  left: 0;
  top: 0;
  visibility: hidden;
  white-space: pre;
  pointer-events: none;
}

/* 小号：12px 文字，行高 16px（光标同样由自绘的 .sb-caret 提供） */
.sb-small .sb-input {
  line-height: 16px;
}

/* 自绘光标：按设计 SVG 绘制 —— 1.5×24px 圆角矩形，rx=0.75（两端半圆），纯 fill、无描边
   用 SVG 而不是 CSS 背景 + border-radius：CSS 的 1.5px 会被像素对齐撑成 2px，圆角也会被吃掉。
   注意 SVG 根元素必须是整数尺寸（24×24）：根元素尺寸为小数时 Chromium 会把视口吸附到整像素，
   1.5px 细条的圆角同样会被吃掉变直角（几何放在根元素内部用小数坐标则正常抗锯齿）
   绝对定位，不影响文字高度与盒子尺寸；24px 宽的透明画布不拦截点击 */
.sb-caret {
  display: none;
  position: absolute;
  left: -1.5px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-primary);
  pointer-events: none;
  animation: sb-caret-blink 1.1s step-end infinite;
}

.sb-root.sb-editing .sb-caret {
  display: block;
}

@keyframes sb-caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

/* ── 关闭按钮（Small cancel）：16×16，颜色同搜索图标 ── */
.sb-clear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--color-icon-secondary);
  cursor: pointer;
}

/* ── 禁用态 ─────────────────────────────────────────────────── */
.sb-disabled,
.sb-disabled .sb-input {
  cursor: not-allowed;
}

.sb-disabled:hover,
.sb-disabled:active {
  background-image: none;
}

.sb-disabled .sb-icon,
.sb-disabled .sb-clear {
  color: var(--color-icon-fourth);
}

.sb-disabled .sb-input {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

.sb-disabled .sb-input::placeholder {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

/* 使用指定 SVG 的轮廓，由语义 token 着色。 */
.sb-asset-icon {
  display: inline-block;
  flex: 0 0 auto;
  background-color: currentColor;
  mask: var(--sb-icon-source) center / contain no-repeat;
  -webkit-mask: var(--sb-icon-source) center / contain no-repeat;

.demo-page {
max-width: 1400px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

.demo-header {
margin-bottom: 48px;
}

.demo-title {
display: flex;
  align-items: center;
  gap: 10px;
  font: var(--font-title-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 8px;
}

.demo-title-icon {
color: var(--primary);
}

.demo-subtitle {
font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0;
}

.demo-section {
margin-bottom: 64px;
}

.demo-section-header {
display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.demo-section-name {
font: var(--font-title-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.demo-section-tag {
display: inline-flex;
  align-items: center;
  gap: 4px;
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--primary);
  background-color: var(--primary-container);
  padding: 2px 10px;
  border-radius: var(--radius-full);
}

.demo-section-desc {
font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0 0 28px;
}

.demo-grid {
display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 32px;
  align-items: start;
}

.demo-grid-2 {
grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 48px 40px;
}

.demo-card {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-card-wide {
grid-column: 1 / -1;
}

.demo-card-flush {
padding: 0;
  overflow: hidden;
}

.demo-flush-footer {
padding: 14px 24px 20px;
}

.demo-flush-footer .demo-note {
margin: 0;
}

.demo-card-title {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 20px;
}

.demo-item {
min-width: 0;
}

.demo-item-title {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0 0 24px;
}

.demo-note {
font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

.demo-hint {
display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--info);
  background-color: var(--info-container);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
}

code {
font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--color-font-emphasize);
  background-color: var(--surface-container);
  padding: 1px 5px;
  border-radius: var(--radius-xs);
}

.button-theme-toggle {
margin-top: 16px;
}

.button-configurator {
display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.button-controls {
display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.button-control {
display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
padding: 0 12px;
}

.button-control input::placeholder {
color: var(--text-placeholder);
}

.button-select-wrap {
position: relative;
  display: block;
}

.button-select-wrap::after {
content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-control select:disabled {
cursor: not-allowed;
  opacity: 0.5;
}

.button-toggle-line {
display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
color: var(--on-surface);
  font: var(--font-body-md);
}

.button-icon-select {
margin-top: 0;
}

.button-switch {
position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {
display: flex;
  min-height: 220px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

@media (max-width: 980px) {
.button-configurator {
grid-template-columns: 1fr;
}

.button-configurator-preview {
min-height: 132px;
}

}

@media (max-width: 760px) {
.button-controls {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

}

@media (max-width: 520px) {
.button-controls {
grid-template-columns: 1fr;
}

}

.btn-lab {
display: flex;
  flex-direction: column;
  gap: 32px;
}

.btn-lab-block {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 20px 24px 24px;
}

.btn-lab-head {

  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.btn-lab-size {

  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-spec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-lab-grid {
display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.btn-lab-grid {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

}

.btn-lab-col {
display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  padding: 14px 12px 18px;
  background-color: var(--surface-container-low);
  border-radius: var(--radius-container);
}

.btn-lab-colhead {
display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 16px;
  text-align: center;
}

.btn-lab-colname {
font: var(--font-subtitle-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-lab-colmeta {
font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-lab-slot {
display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.btn-lab-slot-off {
margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--divider);
}

.btn-lab-slotlabel {
font: var(--font-caption-md);
  font-weight: var(--font-weight-bold);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-placeholder);
}

.btn-lab-grid--two {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

.btn-matrix {
display: flex;
  flex-direction: column;
  gap: 24px;
}

.btn-matrix-group {
background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 16px 20px 20px;
  overflow-x: auto;
}

.btn-matrix-grouphead {
display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  margin-bottom: 4px;

}

.btn-matrix-groupname {
font: var(--font-subtitle-md);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-groupspec {
font: var(--font-caption-lg);
  color: var(--text-secondary);
}

.btn-matrix-row {
display: grid;
  grid-template-columns: minmax(150px, 200px) repeat(5, minmax(140px, 1fr));
  gap: 8px;
  align-items: center;
  padding: 10px 0;
}

.btn-matrix-row + .btn-matrix-row {
border-top: 1px solid var(--divider);
}

.btn-matrix-row-head {
padding-bottom: 4px;
}

.btn-matrix-label {
display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.btn-matrix-variant {
font: var(--font-body-md);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.btn-matrix-meta {
font: var(--font-caption-lg);
  color: var(--text-placeholder);
}

.btn-matrix-cell {

  justify-content: center;

}

.btn-matrix-state {
font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.btn-matrix-hint {
font: var(--font-caption-md);
  color: var(--text-placeholder);
}

.btn-table {

  border-collapse: collapse;
  margin-top: 24px;
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.btn-table th {
font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  background-color: var(--surface-container-low);
}

.btn-table td {
font: var(--font-body-md);
  color: var(--text-secondary);
  text-align: left;
  padding: 12px 16px;
  border-top: 1px solid var(--divider);
}

.btn-table-strong {
display: block;
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.btn-table-src {

  margin-top: 4px;
  font: var(--font-caption-md);
  color: var(--text-placeholder);
  line-height: 1.5;
}

.btn-table-wrap {

  box-shadow: var(--shadow-card);
}

.btn-table-wrap .btn-table {

  margin-top: 0;
}

.btn-table-wrap .btn-table--color {

}

.btn-table-wrap .btn-table--roomy {
min-width: 920px;

.btn-table--roomy td {

  overflow-wrap: anywhere;
}

  color: var(--on-surface);

  font-weight: var(--font-weight-bold);
  background: var(--surface-container-low);
  border-top: 1px solid var(--divider);
