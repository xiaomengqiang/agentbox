  /* 8. Font Size（字号，px） */

/* ── body base ── */
body {
  margin: 0;
  line-height: 1.5;
  color: var(--on-surface);
  font-family: var(--font-family);
  background-color: var(--surface);
}

#root {
  min-height: 100vh;
}

/* Standard scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
  background-color: transparent;
}

::-webkit-scrollbar-corner {
  background-color: transparent;
}

::-webkit-scrollbar-track {
  background-color: transparent;
}

::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background-color: var(--color-comp-divider);
  background-clip: padding-box;
}

::-webkit-scrollbar-track-piece {
  background-color: transparent;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--primary-40);
}


/* 语义层 Light Mode（:root 默认主题）*/
:root {
  /* Font Color（文本色）*/
  --color-font-primary: var(--primary-90);
  --color-font-secondary: var(--primary-60);
  --color-font-tertiary: var(--primary-40);
  --color-font-fourth: var(--primary-20);
  --color-font-emphasize: var(--brand-font); 
  --color-font-on-primary: var(--on-primary);
  --color-font-on-secondary: var(--on-primary-60);
  --color-font-on-tertiary: var(--on-primary-40);
  --color-font-on-fourth: var(--on-primary-20);

  /* Background Color（背景色）*/
  --color-background-primary: var(--white);
  --color-background-secondary: var(--gray-01);
  --color-background-tertiary: var(--gray-02);
  --color-background-fourth: var(--gray-03);
  --color-background-emphasize: var(--brand);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--white);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-05);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary); 
  --color-comp-background-gray: var(--gray-01); 
  --color-comp-background-gray-secondary: var(--gray-01);
  --color-fg-unchecked: var(--on-primary-20);
  --color-comp-divider: var(--container-20); 

  /* Comp Border Color（组件边框色）*/
  --color-comp-border: var(--container-15); 
  --color-comp-border-hover: var(--container-20); 
  --color-comp-border-focus: var(--brand); 
  --color-comp-border-active: var(--brand); 
  --color-comp-border-disabled: var(--container-10); 

  /* Icon Color（图标色）*/
  --color-icon-primary: var(--primary-90);
  --color-icon-secondary: var(--primary-60);
  --color-icon-tertiary: var(--primary-40);
  --color-icon-fourth: var(--primary-20);
  --color-icon-emphasize: var(--brand-font);
  --color-icon-sub-emphasize: var(--brand-40);
  --color-icon-on-primary: var(--on-primary);
  --color-icon-on-secondary: var(--on-primary-60);
  --color-icon-on-tertiary: var(--on-primary-40);
  --color-icon-on-fourth: var(--on-primary-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-05); 
  --color-interactive-pressed: var(--container-10);
  --color-interactive-select: var(--brand-20); 
  --color-interactive-click: var(--container-10);

  /* Functional Color（功能色，设计师指定值，独立于 multi-color 色板）*/
  --color-error: #E84026;
  --color-alert: #ED6F21;
  --color-warning: #EFBF00;
  --color-success: #64BB5C;
  --color-info: #0A59F7;
  --color-error-container: #FDEBEB;
  --color-alert-container: #FFF0E6;
  --color-warning-container: #FFF7D6;
  --color-success-container: #EDF7EB;
  --color-info-container: #E6EEFE;

  /* Shadow（阴影）*/
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.1);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.12);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.06);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.08);
  --shadow-glow: 0 4px 32px 0 rgba(241, 243, 245, 0.8);
}


/* ==========================================================================
   主题层 Theme（AI 组件直接消费的终极语义层）
   加载顺序：base → light → theme → dark*/

:root {
  /* ── primary（品牌色族，部分占位）── */
  --primary: var(--brand);
  --on-primary: var(--white);
  --primary-hover: var(--brand-80); 
  --primary-active: var(--brand); 
  --primary-disabled: var(--brand-40);
  --primary-container: var(--brand-05); 
  --on-primary-container: var(--color-font-primary);

  /* ── surface / on-surface（已重写，引用新 light/dark 语义 token）── */
  --surface: var(--color-background-secondary);
  --surface-dim: var(--color-background-tertiary);
  --surface-bright: var(--color-background-primary);
  --on-surface: var(--color-font-primary);
  --surface-container-lowest: var(--color-background-primary);
  --surface-container-low: var(--color-background-secondary);
  --surface-container: var(--color-comp-background-tertiary);
  --surface-container-high: var(--color-background-tertiary);
  --surface-container-highest: var(--color-background-fourth);

  --inverse-surface: var(--primary);
  --inverse-on-surface: var(--color-font-on-primary);
  --inverse-on-surface-variant: var(--color-font-on-secondary);
  --inverse-primary: var(--brand);

  --error: var(--color-error);
  --on-error: var(--white);
  --error-container: var(--color-error-container);
  --on-error-container: var(--color-font-primary);

  --alert: var(--color-alert);
  --on-alert: var(--white);
  --alert-container: var(--color-alert-container);
  --on-alert-container: var(--color-font-primary);

  --warning: var(--color-warning);
  --on-warning: var(--black);
  --warning-container: var(--color-warning-container);
  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);
  --on-success: var(--white);
  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);
  --on-info: var(--white);
  --info-container: var(--color-info-container);
  --on-info-container: var(--color-font-primary);

  --text-primary: var(--color-font-primary);
  --text-secondary: var(--color-font-secondary);
  --text-tertiary: var(--color-font-tertiary);
  --text-error: var(--color-error);
  --text-placeholder: var(--color-font-tertiary);
  --text-disabled: var(--color-font-fourth);
  --text-inverse-disabled: var(--color-font-on-fourth);
  
  --interactive-link: var(--brand);
  --interactive-link-hover: var(--brand-80);
  --interactive-link-active: var(--brand);
  --interactive-link-visited: var(--brand);
  --interactive-link-disabled: var(--brand-40);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: var(--outline-width-base); /* 1px */
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（排印角色：字号+行高+字体族绑定，字重在其后组合）── */
  /* Line boxes follow each role ratio, rounded upward to a 2px grid.
     Use em so size overrides keep the same ratio (e.g. Tab large / medium). */
  /* Display（展示文本）*/
  --font-display-sm: var(--font-size-4xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 38px/1.25 */
  --font-display-md: var(--font-size-5xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 48px/1.25 */
  --font-display-lg: var(--font-size-6xl)/round(up, calc(1em * var(--line-height-tight)), 2px) var(--font-family); /* 56px/1.25 */

  /* Title（标题）*/
  --font-title-sm: var(--font-size-xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 20px/1.375 */
  --font-title-md: var(--font-size-2xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/round(up, calc(1em * var(--line-height-snug)), 2px) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/round(up, calc(1em * var(--line-height-base)), 2px) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}


/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}


/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

code {

}

.button-theme-toggle {
margin-top: 16px;
}

.button-configurator {
display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.button-controls {
display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.button-control {
display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
padding: 0 12px;
}

.button-control input::placeholder {
color: var(--text-placeholder);
}

.button-select-wrap {
position: relative;
  display: block;
}

.button-select-wrap::after {
content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-control select:disabled {
cursor: not-allowed;
  opacity: 0.5;
}

.button-toggle-line {
display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
color: var(--on-surface);
  font: var(--font-body-md);
}

.button-icon-select {
margin-top: 0;
}

.button-switch {
position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {
display: flex;
  min-height: 220px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

/* ==========================================================================
   Button · Material 3（消费 HarmonyOS 语义色彩规范）
   --------------------------------------------------------------------------
   变体 Variant（唯一 API 命名）
     .btn--primary    M3 Primary button        高强调 · 品牌实心   （primary）
     .btn--secondary     M3 Filled secondary button  中强调 · 品牌淡底   （secondary）
     .btn--tertiary  M3 Tertiary button      中强调 · 描边       （tertiary）
     .btn--text      M3 Text button          低强调 · 纯文字     （text）

   尺寸 Size             高     字号   图标   左右内边距  图标间距
     .btn--large        40px   16px   20px     16px        8px
     .btn--medium        32px   14px   16px     12px        4px

   形状 Shape（几何轴，与 variant / size 正交）
     .btn--round        跑道圆  --radius-full（默认，历史外观）
     .btn--square       方圆角  --radius-lg（8px，全变体 × 全尺寸）

   状态 State（纯 CSS，组件无内部 state）
     default → :hover → :focus-visible → :active(pressed) → :disabled
     data-state="hover|focus|pressed" 为文档/走查用的静态强制态。

   --------------------------------------------------------------------------
   色彩映射：main color = --btn-main-color → --color-icon-primary（主色，不是 brand）

   variant     背景 background                     描边 border             文字 text
   primary      --btn-main-color                   —                     --color-background-primary
   secondary       --color-comp-background-tertiary   —                     --btn-main-color
   tertiary    透明                               --color-comp-border    --btn-main-color
   text        透明（任何状态都无背景）              —                     --color-font-emphasize

   variant     hover                          pressed                        disabled
   primary      叠 --on-primary-10             叠 --on-primary-15              沿用静止态 + 50% 透明度
   secondary       叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态 + 50% 透明度
   tertiary    叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态（含描边）+ 50% 透明度
   text        字 --primary-hover              字 --primary-active             沿用静止态 + 50% 透明度

   disabled 统一模型：四个变体都保留静止态的底 / 字 / 描边，仅整体 opacity: 0.5。
   即 --btn-container-disabled / --btn-label-disabled / --btn-border-color-disabled
   默认就指向静止态变量，变体无需再各自声明。

   text 的文字态色（无叠加层，直接换字色，取 design_system 里 primary 的专用态色）：
     静止 --color-font-emphasize（brand-font）→ hover --primary-hover（brand 80%）
     → pressed --primary-active（brand 实色）；三档互不相同，按下有明确纵深。

   叠加层分两种模型（取决于静止底是浅色还是实心主色）：
   ① secondary / tertiary —— 静止底是浅色 / 透明，叠中性交互层
      --color-interactive-hover / -pressed（= container-05 / container-10，暗色各加深一档），
      即「不变静止底，只叠交互层」，与 design_system.md 的「Hover/pressed on surfaces」一致。
     secondary    hover → container-05 叠 container-05 ≈ container-10 = --color-comp-background-secondary ✓
              pressed → container-10 叠 container-05 ≈ container-15 ✓
     tertiary hover → container-05 = --color-comp-background-tertiary ✓
              pressed → container-10 = --color-comp-background-secondary ✓
   ② primary —— 静止底是 --btn-main-color（默认近黑 / 近白实心），中性层叠在其上对比度极低
      （视觉上接近无变化），所以改用「主色上的颜色」--on-primary-10 / -15 作叠加层。
      M3 Primary button 的 state layer 规范即为 on-primary，因此这不是特例而是对齐规范。
      该令牌明色为白基、暗色为黑基，自带翻转，一个值覆盖两个模式且方向都正确：
        Light：rgba(0,0,0,.9) 上叠白 10% → 合成后明度约从 10% 灰升到 19% 灰，比黑色浅一点 ✓
        Dark ：rgba(255,255,255,.9) 上叠黑 10% → 变深一档，反馈同样可见 ✓
      把 --btn-main-color 换成品牌色等彩色后依然成立（叠加层仍是「主色上的颜色」）。

   聚焦环：--btn-focus-ring = --black（纯黑 1px + --outline-offset-gap 间隙）。
     text 变体无容器，focus 不画描边环（--btn-focus-ring: transparent）。

   Dark Mode：背景与文字均消费自动翻转的语义 token。

   所有 --btn-* 都是可覆盖契约，单实例定制：
     <Button className="my-btn" />  +  .my-btn { --btn-padding-inline: 32px; }
   ========================================================================== */

.btn {
  /* ── 尺寸契约（由 .btn--large / .btn--medium 覆写）── */
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font: var(--font-body-lg);
  --btn-font-weight: var(--font-weight-medium);
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;

  /* ── 形状契约（由 .btn--round / .btn--square 覆写）── */
  --btn-radius: var(--radius-full); /* 默认 = round，跑道圆 */

  /* ── 颜色契约（由变体类覆写）── */
  --btn-main-color: var(--color-icon-primary); /* 本套按钮主色：换主色只改这一处 */
  --btn-container: transparent; /* 静止态填充 */
  --btn-label: var(--on-surface); /* 文字色，图标 currentColor 跟随 */
  --btn-label-hover: var(--btn-label); /* hover 文字色（默认不变） */
  --btn-label-pressed: var(--btn-label); /* pressed 文字色（默认不变） */
  --btn-state-layer-hover: transparent; /* 悬停叠加层（叠在静止态填充之上） */
  --btn-state-layer-pressed: transparent; /* 按下叠加层 */
  --btn-container-disabled: var(--btn-container); /* 禁用态填充：沿用静止态 */
  --btn-label-disabled: var(--btn-label); /* 禁用态文字：沿用静止态 */
  --btn-disabled-opacity: 0.5; /* 禁用态整体透明度 */
  --btn-border-width: var(--border-width-none);
  --btn-border-color: transparent;
  --btn-border-color-disabled: var(--btn-border-color); /* 禁用态描边：沿用静止态 */
  --btn-focus-ring: var(--black); /* 聚焦描边环：纯黑（明暗通用） */

  position: relative;
  isolation: isolate; /* 让负 z-index 的叠加层留在按钮内部 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--btn-icon-gap);
  box-sizing: border-box;
  height: var(--btn-height);
  padding: 0 var(--btn-padding-inline);
  border: var(--btn-border-width) solid var(--btn-border-color);
  border-radius: var(--btn-radius);
  background-color: var(--btn-container);
  color: var(--btn-label);
  font: var(--btn-font);
  font-weight: var(--btn-font-weight);
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard);
}

/* ── 状态叠加层：M3 state layer，叠在静止态填充之上 ── */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background-color: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

/* ── hover：叠加层 + 文字色（文字色默认与静止态一致）── */
.btn:hover:not(:disabled)::before,
.btn[data-state="hover"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* data-state 静态强制态与真实伪类必须成对：否则矩阵里 hover 只出叠加层、不出字色变化 */
.btn:hover:not(:disabled),
.btn[data-state="hover"] {
  color: var(--btn-label-hover);
}

/* ── pressed：规则放在 hover 之后，按下时覆盖悬停层 ── */
.btn:active:not(:disabled)::before,
.btn[data-state="pressed"]::before {
  background-color: var(--btn-state-layer-pressed);
  opacity: 1;
}

.btn:active:not(:disabled),
.btn[data-state="pressed"] {
  color: var(--btn-label-pressed);
}

/* ── 键盘聚焦：1px 纯黑描边环 + 2px 间隙（不影响布局）；text 变体不画环 ── */
.btn:focus-visible,
.btn[data-state="focus"] {
  outline: var(--outline-width-focus) solid var(--btn-focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 鼠标点击产生的非键盘焦点不画环；但 data-state="focus" 的静态强制态要保住 */
.btn:focus:not(:focus-visible):not([data-state="focus"]) {
  outline: none;
}

.btn[data-state="focus"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* ── 禁用：四个变体都沿用静止态的底 / 字 / 描边，仅整体降透明度（默认 50%）── */
.btn:disabled {
  background-color: var(--btn-container-disabled);
  color: var(--btn-label-disabled);
  border-color: var(--btn-border-color-disabled);
  opacity: var(--btn-disabled-opacity);
  cursor: not-allowed;
  outline: none;
}

/* ── 尺寸 ───────────────────────────────────────────── */
.btn--large {
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font: var(--font-body-lg); /* 16px */
  --btn-font-weight: var(--font-weight-medium); /* 500 */
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;
}

.btn--medium {
  --btn-height: 32px;
  --btn-padding-inline: 12px;
  --btn-font: var(--font-body-md); /* 14px */
  --btn-font-weight: var(--font-weight-medium); /* 500 */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

/* ── 形状 Shape：与 variant / size 正交的第三个轴 ────────
   形状不并入变体名：variant 表达强调层级，shape 表达几何，
   两者相乘会让命名膨胀（primary-round / primary-square / secondary-round…）。 */

/* Round：跑道圆（默认外观，与历史版本一致，向后兼容） */
.btn--round {
  --btn-radius: var(--radius-full);
}

/* Square：方圆角 8px（--radius-lg），支持全部 variant × size。 */
.btn--square {
  --btn-radius: var(--radius-lg);
}

/* ── 变体：颜色契约 ─────────────────────────────────── */

/* Filled：main color 实心 + 纯白文字。
   hover / pressed 用「主色上的颜色」--on-primary-10 / -15 作叠加层（M3 Primary button 的
   state layer 规范即为 on-primary）：该令牌明色为白基、暗色为黑基，自带翻转，
   所以浅色下近黑实心变浅、暗色下近白实心变深，两个模式方向都对。
   disabled：沿用静止态（实心底 + 纯白文字）整体 50% 透明度。 */
.btn--primary {
  --btn-container: var(--btn-main-color);
  --btn-label: var(--color-background-primary);
  --btn-state-layer-hover: var(--on-primary-10);
  --btn-state-layer-pressed: var(--on-primary-15);
}

/* Primary 的反差文字使用 --color-background-primary，随主题自动翻转；不依赖 scope 外祖先选择器。 */

/* Tonal：静止 comp_background_tertiary，叠加 --color-interactive-* 得到
   hover ≈ comp_background_secondary（container-10）、pressed ≈ container-15
   （叠层规则见 design_system「Hover/pressed on surfaces」）。
   disabled：沿用静止态配色，整体 50% 透明度。 */
.btn--secondary {
  --btn-container: var(--color-comp-background-tertiary);
  --btn-label: var(--btn-main-color);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Tertiary：透明底 + 1px 中性描边 + 主色文字；描边不随状态变化
   hover = comp_background_tertiary（container-05）、pressed = comp_background_secondary（container-10）
   disabled：沿用静止态配色（含描边），整体 50% 透明度。 */
.btn--tertiary {
  --btn-label: var(--btn-main-color);
  --btn-border-width: var(--border-width-thin);
  --btn-border-color: var(--color-comp-border);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Text：brand 主题蓝文字，任何状态都不出现背景色
   hover / pressed 用 design_system 里 primary 的专用态色：--primary-hover（brand 80%）
   → --primary-active（brand 实色），静止态 --color-font-emphasize 与两者都不同，按下有明确纵深。
   focus：无容器，不画聚焦描边环
   disabled：沿用静止态文字色，整体 50% 透明度。 */
.btn--text {
  --btn-label: var(--color-font-emphasize);
  --btn-label-hover: var(--primary-hover);
  --btn-label-pressed: var(--primary-active);
  --btn-state-layer-hover: transparent;
  --btn-state-layer-pressed: transparent;
  --btn-focus-ring: transparent;
}

/* ── 内容 ───────────────────────────────────────────── */
.btn__icon {
  background-color: currentColor;
  mask-size: contain;
  mask-position: center;
  mask-repeat: no-repeat;
  -webkit-mask-size: contain;
  -webkit-mask-position: center;
  -webkit-mask-repeat: no-repeat;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
}

.btn__label {
  display: inline-block;
}


/* Inherit Button's variants, heights, typography, shapes and states. */
.dropdown-btn {
  --dropdown-asset: none;
}
.dropdown-btn.btn--large {
  --dropdown-btn-padding-end: 12px;
}

.dropdown-btn.btn--medium {
  --dropdown-btn-padding-end: 8px;
}

.dropdown-btn.btn--small {
  --btn-height: 28px;
  --btn-padding-inline: 8px;
  padding-inline-start: 8px;
  --dropdown-btn-padding-end: 8px;
  --btn-font: var(--font-body-sm); /* 12px */
  --btn-font-weight: var(--font-weight-regular); /* 400 */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

.dropdown-btn {
  padding-inline-end: var(--dropdown-btn-padding-end);
}

/* Dropdown Text uses neutral content and the same state fills as Tertiary. */
.dropdown-btn.btn--text {
  --btn-label: var(--btn-main-color);
  --btn-label-hover: var(--btn-label);
  --btn-label-pressed: var(--btn-label);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Compact square trigger: a dedicated exception for tertiary + medium. */
.dropdown-btn.btn--tertiary.btn--medium.btn--square {
  padding-inline-start: 8px;
  padding-inline-end: 4px;
}

  display: block;
  flex: 0 0 auto;
  width: var(--btn-icon-size);

  height: var(--btn-icon-size);

/* Image assets share the same inline alignment as the original Icon renderer. */
img[data-component="Icon"] {
  display: inline-block;
  vertical-align: middle;
}


/* 分割按钮根轨道：胶囊形、浅色容器底色（comp_background_tertiary） */
.sb-root {
  display: inline-flex;
  align-items: center;
  width: max-content;
  max-width: 100%;
  height: 44px;
  padding: 4px;
  background-color: var(--color-comp-background-tertiary);
  border-radius: 24px;
  box-sizing: border-box;
}

/* 圆角可选：8px（默认 24px） */
.sb-root.sb-shape-square {
  border-radius: 8px;
}

.sb-root.sb-shape-square .sb-segment {
  border-radius: 6px;
}

/* 单段按钮：等宽、胶囊、字号 14px */
.sb-segment {
  flex: 1 1 0%;
  min-width: 0;
  height: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  border: none;
  border-radius: 24px;
  background-color: transparent;
  font: var(--font-body-md); /* 14px / 22px（字体 token 向上取偶数） */
  font-weight: var(--font-weight-medium);
  color: var(--color-font-secondary);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

/* Height and shape are independent for both content variants. */
.sb-root.sb-height-32 { height: 32px; padding: 2px; }
.sb-root.sb-height-36 { height: 36px; padding: 2px; }
.sb-root.sb-height-44 { height: 44px; padding: 4px; }
.sb-root.sb-icon-only .sb-segment {
  box-sizing: border-box;
  flex: 1 1 36px;
  width: 36px;
  min-width: 0;
  padding: 0;
  gap: 0;
}
.sb-root.sb-icon-only { min-width: 0; }

.sb-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 带图标的分段：文字使用 regular 粗细（400） */
.sb-segment.sb-has-icon {
  font-weight: var(--font-weight-regular);
}

.sb-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* 选中段：悬浮白底 + 主文字（对应 SVG 的 white fill + black @ 0.9） */
.sb-segment.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--color-font-primary);
}

/* 悬停：在静止底色上叠加交互层（Design Rule 3） */
.sb-segment:not(.sb-active).sb-hover {
  background-color: var(--color-interactive-hover);
}

.sb-segment.sb-active.sb-hover {
  background-color: var(--surface-container-lowest);
}

/* 按压态 */
.sb-segment:not(.sb-active).sb-pressed {
  background-color: var(--color-interactive-pressed);
}

.sb-segment.sb-active.sb-pressed {
  background-color: var(--surface-container-lowest);
}

/* 无独立 Focus 视觉态，保留原生键盘激活。 */
.sb-segment:focus {
  outline: none;
}

/* 禁用态：整组置灰、禁用文字、禁止交互 */
.sb-disabled .sb-segment {
  cursor: not-allowed;
}

.sb-disabled .sb-segment.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--text-disabled);
}

.sb-disabled .sb-segment:not(.sb-active) {
  color: var(--text-disabled);
}

/* 单段禁用 */
.sb-segment:disabled {
  cursor: not-allowed;
  color: var(--text-disabled);
}

.sb-segment:disabled.sb-active {
  background-color: var(--surface-container-lowest);
  color: var(--text-disabled);
}

/* 图标与文字独立使用各自的语义色，不依赖当前色值恰好相同。 */
.sb-icon { color: var(--color-icon-secondary); }
.sb-active .sb-icon { color: var(--color-icon-primary); }
.sb-icon-only .sb-segment { color: var(--color-icon-secondary); }
.sb-icon-only .sb-segment.sb-active { color: var(--color-icon-primary); }
.sb-icon-only .sb-icon, .sb-icon-only .sb-icon > svg { width: 14px; height: 14px; }
.sb-segment:disabled, .sb-segment:disabled .sb-icon { color: var(--text-disabled); }
.sb-segment:disabled { pointer-events: none; }


.tf-root { max-width: 100%; min-width: 0; box-sizing: border-box; --tf-radius: var(--radius-container); }
.tf-label { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; color: var(--text-primary); font: var(--font-body-md); }
.tf-required { color: var(--text-error); }
.tf-box { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 24px; background: var(--color-background-primary); box-shadow: inset 0 0 0 1px var(--color-comp-border); font: var(--font-body-md); transition: box-shadow var(--duration-fast) var(--ease-standard); }
.tf-root:not(.tf-disabled):not(.tf-editing):not(.tf-error):not(:has(.tf-password:focus-visible)):hover .tf-box { box-shadow: inset 0 0 0 1px var(--color-comp-border-hover); }
.tf-root.tf-editing .tf-box { box-shadow: inset 0 0 0 1px var(--brand), 0 0 0 2px var(--brand-10); }
.tf-field { position: relative; flex: 1 1 auto; min-width: 0; clip-path: inset(-2px 0 -2px -2px); }
.tf-input { display: block; box-sizing: border-box; width: 100%; min-width: 0; padding: 0; margin: 0; border: 0; outline: none; background: transparent; font: inherit; color: var(--text-primary); caret-color: var(--text-primary); }
.tf-input::placeholder { color: var(--text-tertiary); opacity: 1; }
.tf-multiline .tf-box { position: relative; box-sizing: border-box; flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; border-radius: var(--tf-radius, var(--radius-container)); resize: vertical; }
.tf-multiline .tf-field { flex: 1 1 auto; min-height: 0; margin-inline: var(--spacing-4); clip-path: inset(0 0 0 -2px); }
.tf-multiline .tf-input { height: 100%; padding-block: var(--spacing-2); resize: none; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }

.tf-password-icon { display: block; width: 20px; height: 20px; background: currentColor; mask: var(--tf-icon) center / contain no-repeat; -webkit-mask: var(--tf-icon) center / contain no-repeat; }

.tf-root:has(.tf-password:focus-visible) .tf-box { box-shadow: inset 0 0 0 1px var(--brand), 0 0 0 2px var(--brand-10); }
.tf-root.tf-error .tf-box { box-shadow: inset 0 0 0 1px var(--error); }
.tf-helper { margin: 0; padding: 0; font: var(--font-caption-lg); color: var(--text-tertiary); }
.tf-error .tf-helper { color: var(--text-error); }
.tf-disabled .tf-input, .tf-disabled .tf-input::placeholder { color: var(--text-disabled); -webkit-text-fill-color: var(--text-disabled); }
.tf-disabled .tf-label, .tf-disabled .tf-helper, .tf-disabled .tf-required { color: var(--text-disabled); }
.tf-disabled .tf-password { color: var(--color-icon-primary); }
.tf-disabled .tf-input, .tf-disabled .tf-password { cursor: not-allowed; }


.tf-password-root .tf-box { padding-right: 12px; }
.tf-password-root .tf-input { caret-color: var(--text-primary); }

/* Overlay centered in the 16px text-to-border gap; never reserves text width. */
.tf-multiline .tf-input::-webkit-scrollbar { display: none; width: 0; height: 0; }
.tf-scrollbar { position: absolute; top: 8px; bottom: 16px; right: 0; width: 16px; pointer-events: none; }
.tf-scrollbar-thumb { position: absolute; top: 0; right: 0; width: 16px; pointer-events: auto; touch-action: none; cursor: grab; user-select: none; }
.tf-scrollbar-thumb::before { content: ""; position: absolute; inset: 0 6px; background: var(--container-40); border-radius: var(--radius-full); }
.tf-scrollbar-thumb:active { cursor: grabbing; }

.tf-root, .tf-label, .tf-box, .tf-input, .tf-input::placeholder, .tf-helper, .tf-support, .tf-counter { font-weight: var(--font-weight-regular); }
.tf-support { display: flex; align-items: flex-start; gap: var(--spacing-4); margin-top: var(--spacing-1); padding: 0; box-sizing: border-box; }
.tf-helper { flex: 1 1 auto; min-width: 0; }
.tf-counter { flex: 0 0 auto; margin-left: auto; text-align: right; white-space: nowrap; font: var(--font-caption-lg); font-weight: var(--font-weight-regular); font-variant-numeric: tabular-nums; color: var(--text-tertiary); }
.tf-counter-over, .tf-error .tf-counter { color: var(--text-error); }
.tf-disabled .tf-counter { color: var(--text-disabled); }

/* The native bottom-right resize grip remains outside the text column. */
.tf-disabled.tf-multiline .tf-box { resize: none; }
.tf-root.tf-error:not(.tf-disabled).tf-editing .tf-box,
.tf-root.tf-error:not(.tf-disabled):has(.tf-password:focus-visible) .tf-box { box-shadow: inset 0 0 0 1px var(--error), 0 0 0 2px var(--error-container); }


/* Fixed 12px masking cells: 8px dot + 4px gap. Keep the real password input. */
.tf-password-root.tf-masked .tf-input { font-family: monospace; font-size: var(--font-size-base); letter-spacing: calc(12px - 1ch); color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--text-primary); }
.tf-password-root .tf-input { height: 22px; }
.tf-dots-viewport { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.tf-dots { display: flex; align-items: center; height: 100%; width: max-content; }
.tf-dot { flex: 0 0 var(--spacing-2); width: var(--spacing-2); height: var(--spacing-2); margin-right: var(--spacing-1); border-radius: var(--radius-full); background: var(--text-primary); }
.tf-disabled .tf-dot { background: var(--text-disabled); }

/* Fade only clipped content, leaving the border, icon and support row intact. */
.tf-field { --tf-fade-start: 0px; --tf-fade-end: 0px; --tf-fade-direction: to right; mask-image: linear-gradient(var(--tf-fade-direction), transparent 0, #000 var(--tf-fade-start), #000 calc(100% - var(--tf-fade-end)), transparent 100%); -webkit-mask-image: linear-gradient(var(--tf-fade-direction), transparent 0, #000 var(--tf-fade-start), #000 calc(100% - var(--tf-fade-end)), transparent 100%); }
.tf-multiline .tf-field { --tf-fade-direction: to bottom; }


.sb-root {
  display: flex;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  cursor: text;
  transition: background-image var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}

.sb-root { padding: 9px 12px; gap: 8px; }
.sb-medium { height: 40px; font: var(--font-body-md); font-weight: var(--font-weight-regular); }
.sb-small { height: 36px; font: var(--font-body-sm); font-weight: var(--font-weight-regular); }
.sb-filled { border-radius: 24px; background-color: var(--surface-container); }
.sb-unfilled { border-radius: var(--radius-md); background-color: transparent; }

/* ── 图标与文字 ─────────────────────────────────────────────── */

/* 图标颜色 icon_secondary（黑 60%），所有尺寸一致 */
.sb-icon {
  flex: 0 0 auto;
  color: var(--color-icon-secondary);
}

/* 输入区：承载光标与输入框 */
.sb-field {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
}

/* 占位文字：text_tertiary（黑 40%） */
.sb-input::placeholder {
  color: var(--text-tertiary);
}

.sb-input {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  background: transparent;
  font: inherit;
  line-height: inherit;
  color: var(--text-primary);
  caret-color: var(--text-primary);
}
.sb-input::placeholder { opacity: 1; }

/* ── 关闭按钮（Small cancel）：16×16，颜色同搜索图标 ── */
.sb-clear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  margin: -4px;
  padding: 4px;
  box-sizing: border-box;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--color-icon-secondary);
  cursor: pointer;
}

/* ── 禁用态 ─────────────────────────────────────────────────── */
.sb-disabled,
.sb-disabled .sb-input {
  cursor: not-allowed;
}


.sb-disabled .sb-icon,
.sb-disabled .sb-clear {
  color: var(--color-icon-fourth);
}

.sb-disabled .sb-input {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

.sb-disabled .sb-input::placeholder {
  color: var(--text-disabled);
  -webkit-text-fill-color: var(--text-disabled);
}

/* 使用指定 SVG 的轮廓，由语义 token 着色。 */
.sb-asset-icon {
  display: inline-block;
  flex: 0 0 auto;
  background-color: currentColor;
  mask: var(--sb-icon-source) center / contain no-repeat;
  -webkit-mask: var(--sb-icon-source) center / contain no-repeat;

}

.tt-list::-webkit-scrollbar {

.tt-tab {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-2);

  margin: 0;
  padding: 0;
  border: none;
  background: none;

  white-space: nowrap;
  transition: color var(--duration-fast) var(--ease-standard);
}

.tt-tab:not(.tt-tab-active):hover {

}

  outline-offset: var(--outline-offset-gap);

}

}

.tt-size-medium {

.icon-button {
  --icon-color: var(--color-icon-primary);
  --icon-bg: transparent;
  --icon-hover: var(--color-interactive-hover);
  --icon-pressed: var(--color-interactive-pressed);
  --icon-color-hover: var(--icon-color);
  --icon-color-pressed: var(--icon-color);
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  box-sizing: border-box;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  background: var(--icon-bg);
  color: var(--icon-color);
  cursor: pointer;
  transition: color var(--duration-fast) var(--ease-standard), opacity var(--duration-fast) var(--ease-standard);
}
.icon-button--square { border-radius: var(--radius-md); }
.icon-button--round { border-radius: var(--radius-full); }
.icon-button--filled {
  --icon-bg: var(--color-icon-primary);
  --icon-color: var(--color-background-primary);
  --icon-hover: var(--on-primary-10);
  --icon-pressed: var(--on-primary-15);
}
.icon-button--unfilled {
  --icon-color: var(--color-icon-primary);
  --icon-hover: var(--color-interactive-hover);
  --icon-pressed: var(--color-interactive-pressed);
}
.icon-button::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  pointer-events: none;
}
.icon-button:not(:disabled):hover { color: var(--icon-color-hover); }
.icon-button:not(:disabled):hover::before { background: var(--icon-hover); }
.icon-button:not(:disabled):active { color: var(--icon-color-pressed); }
.icon-button:not(:disabled):active::before { background: var(--icon-pressed); }
.icon-button:focus { outline: none; }
.icon-button:disabled { opacity: .5; cursor: not-allowed; outline: none; }
.icon-button__glyph {
  width: 16px;
  height: 16px;
  flex: none;
  background: currentColor;
  mask: no-repeat center / contain;
  -webkit-mask: no-repeat center / contain;
}
.icon-button--small { width: 28px; height: 28px; }


/* ── 固定尺寸：轨道 36 × 20，滑块 16，四周内边距 2 ── */
.tg-root {
  --tg-track-w: 36px;
  --tg-track-h: 20px;
  --tg-knob-size: 16px;
  --tg-pad: 2px;
  --tg-travel: calc(var(--tg-track-w) - var(--tg-knob-size) - var(--tg-pad) * 2);

  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: auto;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── 轨道（button 本体）── */
.tg-switch {
  position: relative;
  flex: 0 0 auto;
  box-sizing: border-box;
  width: var(--tg-track-w);
  height: var(--tg-track-h);
  padding: 0;
  border: none;
  border-radius: var(--radius-full);
  appearance: none;
  -webkit-appearance: none;
  cursor: inherit;
  outline: none;
  background-color: var(--color-comp-background-secondary); /* 关：黑 10% */
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.tg-switch-on {
  background-color: var(--color-comp-background-emphasize); /* 开：Light/Brand #0A59F7 */
}

/* 按下叠加层（不改变静息底色）*/
.tg-switch::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius-full);
  pointer-events: none;
  opacity: 0;
  background-color: var(--color-interactive-pressed);
  transition: opacity var(--duration-fast) var(--ease-standard);
}

.tg-root:not(.tg-root-disabled) .tg-switch:active::after {
  opacity: 1;
}

.tg-switch:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* ── 圆形滑块 ── */
.tg-knob {
  position: absolute;
  z-index: 1;
  top: 50%;
  left: var(--tg-pad);
  box-sizing: border-box;
  width: var(--tg-knob-size);
  height: var(--tg-knob-size);
  border-radius: var(--radius-full);
  background-color: var(--color-comp-background-primary); /* contrary：白色 */
  transform: translate(0, -50%);
  outline: var(--border-width-thin) solid transparent;
  outline-offset: 0;
  transition:
    transform var(--duration-medium) var(--ease-standard),
    outline-color var(--duration-fast) var(--ease-standard);
}

.tg-switch-on .tg-knob {
  transform: translate(var(--tg-travel), -50%);
}

/* 未选中：滑块外部 1px 描边 comp_background_tertiary（黑 5%）*/
.tg-switch-off .tg-knob {
  outline-color: var(--color-comp-background-tertiary);
}

/* 深色模式下滑块恒为白色，保证在深色轨道上始终对比可见 */
.dark .tg-root .tg-knob {
  background-color: var(--white);
}

/* ── 文案 ── */
.tg-label {
  font: var(--font-body-md);
  color: var(--on-surface);
}

/* ── 禁用：整体透明度 50% ── */
.tg-root-disabled {
  opacity: 0.5;
  cursor: not-allowed;
}


/* Checkbox —— 方形 / 圆形勾选组件
   容器 24×24，实际方框边长 20px
   未选中：描边 icon-tertiary + 填充 fg_color_unchecked
   选中：底色 comp_background_emphasize，勾为白色（内部 1px 描边 + 阴影）
   禁用：可用态整体 40% 不透明度 */

.cbx {

function sampleFor(size, variant) {
  return VARIANTS.find((item) => item.value === variant)?.sample || "按钮操作";
}

const COLOR_VARIANT_NAMES = {
  primary: "Primary",
  secondary: "Secondary",
  tertiary: "Tertiary",
  text: "Text",
};

function colorStateRows(variant) {
  const isText = variant.value === "text";
  const colorValue = (label, detail) => ({ label, detail });

  return [
    {
      value: "default",
      label: "Default",
      background: colorValue(variant.container, variant.containerValue),
      outline: { label: variant.border, detail: variant.border === "—" ? "无描边" : variant.borderValue },
      text: colorValue(variant.label, variant.labelValue),
    },
    {
      value: "hover",
      label: "Hover",
      background: colorValue(variant.hover, variant.hoverValue),
      outline: null,
      text: null,
    },
    {
      value: "focus",
      label: "Focus",
      background: colorValue(variant.hover, variant.hoverValue),
      outline: isText ? null : { label: "--black", detail: "1px focus ring，offset 2px" },
      text: null,
    },
    {
      value: "pressed",
      label: "Pressed",
      background: colorValue(variant.pressed, variant.pressedValue),
      outline: null,
      text: null,
    },
    {
      value: "disabled",
      label: "Disabled",
      note: "整体 opacity 50%",
      background: null,
      outline: null,
      text: null,
    },
  ];
}

(function () {
  const { useState } = React;
  const { Icon } = __export;
/** Segmented — options determines the items; shape and layout are independent; Text is 36/44px, Icon is 32px. */
function Segmented({
  options = [],
  variant = "text",
  shape = "round",
  size = "large",
  block = false,
  value,
  defaultValue,
  disabled = false,
  onChange,
  onSegmentClick,
  id,
  style,
  className = "",
}) {
  const resolvedSegments = options.map(option =>
    typeof option === "string" || typeof option === "number"
      ? { value: option, label: option }
      : option
  );
  const [internalActive, setInternalActive] = useState(defaultValue);
  const [hoveredKey, setHoveredKey] = useState(null);
  const [pressedKey, setPressedKey] = useState(null);
  const active = value !== undefined ? value : internalActive ?? resolvedSegments[0]?.value;
  const handleClick = (seg, idx) => {
    if (disabled || seg.disabled) return;
    if (value === undefined) setInternalActive(seg.value);
    if (seg.value !== active) onChange?.(seg.value);
    onSegmentClick?.(seg.value, idx);
  };
  const resolvedHeight = variant === "icon" ? 32 : size === "medium" ? 36 : 44;
  const rootClass = ["sb-root", `sb-height-${resolvedHeight}`, `sb-shape-${shape}`,
    variant === "icon" ? "sb-icon-only" : "", disabled ? "sb-disabled" : "", className
  ].filter(Boolean).join(" ");

  return (
    <div id={id} className={rootClass} role="group" aria-label="Segmented" style={{ ...(block ? { width: "100%" } : {}), ...style }}>
      {resolvedSegments.map((seg, idx) => {
        const key = seg.value;
        const isActive = key === active;
        const isHovered = hoveredKey === key;
        const isPressed = pressedKey === key;
        const isDisabled = disabled || seg.disabled;

        const classes = [
          "sb-segment",
          seg.icon ? "sb-has-icon" : "",
          isActive ? "sb-active" : "",
          isHovered ? "sb-hover" : "",
          isPressed ? "sb-pressed" : "",
        ]
          .filter(Boolean)
          .join(" ");

        return (
          <button
            key={key}
            type="button"
            className={classes}
            disabled={isDisabled}
            aria-pressed={isActive}
            aria-label={variant === "icon" ? (seg.ariaLabel ?? (typeof seg.label === "string" || typeof seg.label === "number" ? String(seg.label) : undefined) ?? `选项 ${idx + 1}`) : undefined}
            onClick={() => handleClick(seg, idx)}
            onMouseEnter={() => setHoveredKey(key)}
            onMouseLeave={() => {
              setHoveredKey(null);
              setPressedKey(null);
            }}
            onMouseDown={() => setPressedKey(key)}
            onMouseUp={() => setPressedKey(null)}
          >
            {seg.icon ? (
              typeof seg.icon === "string" ? (
                <Icon
                  name={seg.icon}
                  size={variant === "icon" ? 14 : 16}
                  className="sb-icon"
                  color="currentColor"
                />
              ) : (
                <span className="sb-icon" aria-hidden="true">
                  {seg.icon}
                </span>
              )
            ) : null}
            {(variant !== "icon" || !seg.icon) && seg.label != null ? <span className="sb-label">{seg.label}</span> : null}
          </button>
        );
      })}
    </div>
  );
}
  Object.assign(__export, { Segmented });
})();

(function () {
  const { useRef, useState } = React;
function SearchBar(props) {
  const size = props.size || "medium";
  const variant = props.variant || "filled";
  const placeholder = props.placeholder ?? "请输入搜索内容";
  const disabled = !!props.disabled;
  const clearable = props.clearable ?? true;
  const iconSize = 16;
  const inputRef = useRef(null);
  const composingRef = useRef(false);

  // 受控（传入 value）/ 非受控（defaultValue）两用
  const isControlled = props.value != null;
  const [innerValue, setInnerValue] = useState(props.defaultValue || "");
  const value = isControlled ? props.value : innerValue;
  const isEmpty = value.length === 0;

  // 聚焦状态与浏览器原生光标同步。
  const [focused, setFocused] = useState(false);

  const handleChange = (event) => {
    const next = event.target.value;
    if (!isControlled) setInnerValue(next);
    if (props.onChange) props.onChange(next);
  };

  // 回车触发搜索回调
  const handleKeyDown = (event) => {
    if (composingRef.current || event.nativeEvent.isComposing || event.keyCode === 229) return;
    if (event.key === "Enter" && props.onSearch) {
      event.preventDefault();
      props.onSearch(event.currentTarget.value);
    }
  };

  // 清空按钮：有文字时出现，点击清空（受控场景同步回调 onChange("")）
  const handleClear = () => {
    if (!isControlled) setInnerValue("");
    if (props.onChange) props.onChange("");
    if (props.onClear) props.onClear();
    inputRef.current?.focus();
  };

  const className = [
    "sb-root",
    `sb-${size}`,
    `sb-${variant}`,
    focused ? "sb-editing" : "",
    disabled ? "sb-disabled" : "",
    props.className || "",
  ]
    .join(" ")
    .trim();

  const clearButton =
    clearable && !disabled && !isEmpty ? (
      <button className="sb-clear" type="button" onClick={handleClear} aria-label="清空">
        <span className="sb-asset-icon sb-close-icon" style={{ width: iconSize, height: iconSize }} aria-hidden="true" />
      </button>
    ) : null;

  return (
    <div id={props.id} className={className} style={props.style}
      onClick={event => {
        if (!disabled && !event.target.closest("button")) inputRef.current?.focus();
      }}>
      <span className="sb-asset-icon sb-icon" style={{ width: iconSize, height: iconSize }} aria-hidden="true" />

      <span className="sb-field">
        <input
          className="sb-input"
          ref={inputRef}
          type="search"
          enterKeyHint="search"
          aria-label="搜索"
          value={value}
          placeholder={placeholder}
          disabled={disabled}
          onChange={handleChange}
          onKeyDown={handleKeyDown}
          onCompositionStart={() => { composingRef.current = true; }}
          onCompositionEnd={() => { composingRef.current = false; }}
          onFocus={() => setFocused(true)}
          onBlur={() => setFocused(false)}
        />
      </span>

      {clearButton}
    </div>
  );
}
  Object.assign(__export, { SearchBar });
})();

  );
}

(function () {
function Tag({ variant = "default", size = "medium", shape = "round", icon, children, title, id, style, className = "" }) {
  return <span id={id} style={style} title={title} className={["tag", `tag--${variant}`, `tag--${size}`, `tag--${shape}`, className].filter(Boolean).join(" ")}>
    {icon && <span aria-hidden="true" className="tag__icon" style={{maskImage:`url("${icon}")`,WebkitMaskImage:`url("${icon}")`}} />}
    <span className="tag__label">{children}</span>
  </span>;
}

function formatDiffValue(value, sign) {
  const text = String(value);
  return (/^[+-]/.test(text) ? text : sign + text).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function DiffTags({ added, removed, gap = 4, id, style, className = "" }) {
  if (added == null && removed == null) return null;
  return <span id={id} className={["tag-diff-pair", className].filter(Boolean).join(" ")} style={{gap, ...style}}>
    {added != null && <Tag variant="green" size="small">{formatDiffValue(added, "+")}</Tag>}
    {removed != null && <Tag variant="red" size="small">{formatDiffValue(removed, "-")}</Tag>}
  </span>;
}
  Object.assign(__export, { Tag, DiffTags });
})();

(function () {
  const { useState } = React;
function Chip({ selected = false, disabled = false, icon, children, onClick, id, style, className = "", title }) {
  return <button type="button" id={id} style={style} title={title}
    className={["chip", selected && "chip--selected", disabled && "chip--disabled", className].filter(Boolean).join(" ")}
    disabled={disabled} aria-pressed={selected} onClick={onClick}>
    {icon && <span aria-hidden="true" className="chip__icon" style={{maskImage:`url("${icon}")`,WebkitMaskImage:`url("${icon}")`}} />}
    <span className="chip__label">{children}</span>
  </button>;
}

function ChipGroup({ items = [], value, defaultValue, onChange, gap = 8, id, style, className = "" }) {
  const [innerValue, setInnerValue] = useState(() => defaultValue !== undefined ? defaultValue : items[0]?.id ?? null);
  const current = value !== undefined ? value : innerValue;
  const selected = key => current === key;
  function choose(item) {
    if (item.disabled) return;
    const next = item.id;
    if (value === undefined) setInnerValue(next);
    onChange?.(next, item);
  }
  return <div id={id} className={["chip-group", className].filter(Boolean).join(" ")} style={{gap, ...style}}>
    {items.map(item => <Chip key={item.id} icon={item.icon} title={item.title || item.label} selected={selected(item.id)} disabled={item.disabled} onClick={() => choose(item)}>{item.label}</Chip>)}
  </div>;
}
  Object.assign(__export, { Chip, ChipGroup });
})();

(function () {
  const { useEffect, useRef, useState } = React;
  const { IconButton } = __export;
/**
 * Tab — 可带前置图标的标签导航。
 * 选中态：黑色 100% + Bold；未选中态：黑色 40%；large 为 18px / 24px，medium 为 16px / 20px。
 */
function Tab(props) {
  const items = props.items || [];
  const size = props.size === "medium" ? "medium" : "large";
  const onChange = props.onChange;
  const isControlled = props.activeId != null;

  // 非受控时组件自己维护选中项，默认选中第一项
  const [internalId, setInternalId] = useState(
    props.defaultActiveId != null
      ? props.defaultActiveId
      : items.length > 0
        ? items[0].id
        : null
  );
  const activeId = isControlled ? props.activeId : (items.some(item => item.id === internalId) ? internalId : items[0]?.id);
  const listRef = useRef(null);
  const navRef = useRef(null);
  const trackRef = useRef(null);
  const [overflow, setOverflow] = useState(false);
  const [edges, setEdges] = useState({ left: false, right: false });

  const updateEdges = () => {
    const list = listRef.current;
    if (!list) return;
    const left = list.scrollLeft > 1;
    const right = list.scrollWidth - list.clientWidth - list.scrollLeft > 1;
    setEdges(previous => previous.left === left && previous.right === right ? previous : { left, right });
  };

  useEffect(() => {
    const nav = navRef.current;
    const track = trackRef.current;
    if (!nav || !track) return;
    const measure = () => {
      setOverflow(track.scrollWidth > nav.clientWidth + 1);
      updateEdges();
    };
    measure();
    const observer = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
    observer?.observe(nav);
    observer?.observe(track);
    window.addEventListener("resize", measure);
    return () => { observer?.disconnect(); window.removeEventListener("resize", measure); };
  }, [items, size]);

  useEffect(() => { updateEdges(); }, [overflow]);

  const revealTab = id => {
    const list = listRef.current;
    const el = getTabNode(id);
    if (!list || !el) return;
    const bounds = list.getBoundingClientRect();
    const target = el.getBoundingClientRect();
    const inset = overflow ? 56 : 0;
    const left = bounds.left + inset;
    const right = bounds.right - inset;
    const offset = target.left < left ? target.left - left
      : target.right > right ? target.right - right : 0;
    if (offset) list.scrollBy({ left: offset, behavior: "instant" });
  };

  useEffect(() => { revealTab(activeId); }, [activeId, overflow, size, items]);

  const scrollTabs = direction => {
    const list = listRef.current;
    if (!list) return;
    list.scrollBy({ left: direction * Math.max(80, list.clientWidth * 0.75),
      behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
  };

  // 找到某个 tab 对应的 DOM 节点（用于滚动可见 / 焦点管理）
  const getTabNode = (id) => {
    const node = listRef.current;
    if (!node || !node.querySelector) return null;
    return Array.from(node.querySelectorAll("[data-tab-id]")).find(tab => tab.dataset.tabId === String(id));
  };

  const selectTab = (item) => {
    if (!isControlled) setInternalId(item.id);
    if (onChange) onChange(item);
    // 列表横向滚动时，保证选中项可见
    revealTab(item.id);
  };

  // 键盘导航：左右方向键循环切换，Home / End 跳首尾，焦点跟随选中项
  const handleKeyDown = (event) => {
    const key = event.key;
    if (key !== "ArrowLeft" && key !== "ArrowRight" && key !== "Home" && key !== "End") return;
    event.preventDefault();
    if (items.length === 0) return;

    const currentIndex = items.findIndex((it) => it.id === activeId);
    let nextIndex = currentIndex < 0 ? 0 : currentIndex;
    if (key === "ArrowLeft") nextIndex = currentIndex <= 0 ? items.length - 1 : currentIndex - 1;
    if (key === "ArrowRight") nextIndex = currentIndex >= items.length - 1 ? 0 : currentIndex + 1;
    if (key === "Home") nextIndex = 0;
    if (key === "End") nextIndex = items.length - 1;

    const nextItem = items[nextIndex];
    if (!nextItem) return;
    selectTab(nextItem);
    const el = getTabNode(nextItem.id);
    if (el && el.focus) el.focus({ preventScroll: true });
  };

  if (items.length === 0) return null;

  const activeItem = items.find(item => item.id === activeId);

  return (
    <div id={props.id} style={props.style} className={["tt-root", `tt-size-${size}`, props.className].filter(Boolean).join(" ")}>
      <div className={`tt-nav${overflow ? " tt-nav-overflow" : ""}`} ref={navRef}>
      {overflow && <IconButton icon="arrow-left" size="small" shape="round" variant="unfilled" ariaLabel="向左滚动标签" className={`tt-scroll-button tt-scroll-left${edges.left ? "" : " tt-scroll-hidden"}`} tabIndex={edges.left ? 0 : -1} onClick={() => scrollTabs(-1)} />}
      <div
        className={`tt-list${overflow && edges.left ? " tt-fade-left" : ""}${overflow && edges.right ? " tt-fade-right" : ""}`}
        onScroll={updateEdges}
        role="tablist"
        ref={listRef}
        onKeyDown={handleKeyDown}
      >
        <div className="tt-track" ref={trackRef}>
        {items.map((item) => {
          const active = item.id === activeId;
          return (
            <button
              key={item.id}
              type="button"
              role="tab"
              data-tab-id={item.id}
              aria-selected={active}
              tabIndex={active ? 0 : -1}
              className={active ? "tt-tab tt-tab-active" : "tt-tab"}
              onClick={() => selectTab(item)}
            >
              {item.icon != null && <span className="tt-icon" aria-hidden="true">{item.icon}</span>}
              <span className="tt-label">
                {item.label}
              </span>
            </button>
          );
        })}
        </div>
      </div>
      {overflow && <IconButton icon="arrow-right" size="small" shape="round" variant="unfilled" ariaLabel="向右滚动标签" className={`tt-scroll-button tt-scroll-right${edges.right ? "" : " tt-scroll-hidden"}`} tabIndex={edges.right ? 0 : -1} onClick={() => scrollTabs(1)} />}
      </div>
      {activeItem?.children != null && (
        <div key={activeItem.id} className="tt-panel" role="tabpanel">
          {activeItem.children}
        </div>
      )}
    </div>
  );
}
  Object.assign(__export, { Tab });
})();

(function () {
  const { useState } = React;
/**
 * Switch 开关（36 × 20）
 * 支持 选中 / 未选中 × 可用 / 禁用 四态，受控与非受控两种用法。
 * 颜色：开态轨道 = Light/Brand(#0A59F7)，关态轨道 = comp_background_secondary(黑 10%)，
 * 圆形滑块 = comp_background_primary_contrary(白色)，关态滑块带 comp_background_tertiary 1px 外描边。
 */
function Switch(props) {
  const disabled = !!props.disabled;
  const label = props.label;
  // checked 传入即为受控；否则由内部 state 维护
  const controlled = props.checked !== undefined && props.checked !== null;
  const [innerChecked, setInnerChecked] = useState(!!props.defaultChecked);
  const checked = controlled ? !!props.checked : innerChecked;

  const handleSwitch = (event) => {
    if (disabled) return;

(function () {
  const { useState } = React;
  const { Icon } = __export;
// 勾的几何参数（方框容器/边长见 index.css；Lucide 图标 viewBox 为 24）
const ICON_SIZE = 15;
const UNIT = 24 / ICON_SIZE;
const CHECK_STROKE = 2 * UNIT;
const CHECK_STROKE_OUTLINE = 4 * UNIT;

/**
 * Checkbox 勾选组件
 * - 容器 24×24，实际方框边长 20px
 * - shape: "square" 方形（4px 圆角） | "circle" 圆形
 * - 选中底色 Light/comp_background_emphasize，勾为白色并带内部 1px 描边 + 阴影
 * - 未选中：描边 icon-tertiary、填充 fg_color_unchecked
 * - disabled：在可用态基础上整体 40% 不透明度
 */
function Checkbox(props) {
  const shape = props.shape || "square";
  const disabled = props.disabled === true;
  const label = props.label;

  // 受控 / 非受控：传了 checked 即为受控
  const isControlled = props.checked != null;
  const [innerChecked, setInnerChecked] = useState(props.defaultChecked === true);
  const checked = isControlled ? props.checked === true : innerChecked;

  const toggle = () => {
    if (disabled) return;
    if (!isControlled) setInnerChecked(!checked);
    if (props.onChange) props.onChange(!checked);
  };

  const handleKeyDown = (e) => {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      toggle();
    }
  };

  const rootClass = [
    "cbx",
    "cbx-" + shape,
    checked ? "is-checked" : "is-unchecked",
    disabled ? "is-disabled" : "is-enabled",
  ].join(" ");

  return (
    <span
      className={rootClass}
      role="checkbox"
      aria-checked={checked}
      aria-disabled={disabled}
      tabIndex={disabled ? -1 : 0}
      onClick={toggle}
      onKeyDown={handleKeyDown}
    >
      {/* 容器 24×24，方框居中为 20×20 */}
      <span className="cbx-control">
        <span className="cbx-box">
          <span className="cbx-check" aria-hidden="true">
            <Icon
              name="check"
              size={ICON_SIZE}
              strokeWidth={CHECK_STROKE_OUTLINE}
              className="cbx-check-outline"
            />
            <Icon
              name="check"
              size={ICON_SIZE}
              strokeWidth={CHECK_STROKE}
              className="cbx-check-mark"
            />
          </span>
        </span>
      </span>
      {label ? <span className="cbx-label">{label}</span> : null}
    </span>
  );
}
  Object.assign(__export, { Checkbox });
})();

function MenuIcon({ src, className = "" }) {
  return <span className={`mi-icon ${className}`} aria-hidden="true" style={{
    WebkitMaskImage: `url("${src}")`, maskImage: `url("${src}")`,
  }} />;
}

function MenuLabel({ name, onDoubleClick }) {
  const viewport = useRef(null);
  const content = useRef(null);
  const [metrics, setMetrics] = useState({ overflow: false, distance: 0 });
  useEffect(() => {
    const box = viewport.current;
    const text = content.current;
    if (!box || !text) return;
    let disposed = false;
    const measure = () => {
      if (disposed) return;
      const width = text.getBoundingClientRect().width;
      const overflow = width > box.clientWidth + 1;
      const distance = width + 32;
      setMetrics(previous => previous.overflow === overflow && previous.distance === distance ? previous : { overflow, distance });
    };
    const observer = new ResizeObserver(measure);
    observer.observe(box);
    observer.observe(text);
    measure();
    document.fonts?.ready.then(measure);
    return () => { disposed = true; observer.disconnect(); };
  }, [name]);
  return <span ref={viewport} className={`mi-label${metrics.overflow ? " mi-label-overflow" : ""}`} onDoubleClick={onDoubleClick}
    style={{ "--mi-scroll-distance": `${-metrics.distance}px`, "--mi-scroll-duration": `${Math.max(6, metrics.distance / 35)}s` }}>
    <span className="mi-label-track"><span ref={content} className="mi-label-copy">{name}</span>{metrics.overflow && <span className="mi-label-copy" aria-hidden="true">{name}</span>}</span>
  </span>;
}

function MenuItem({
  id,
  className = "",
  style,
  items = [],
  size = "large",
  variant = "default",
  level = "level-1",
  dropdownIcon = true,
  leadingIcon = true,
  trailingIcon = false,
  renameable = false,
  onRename,
  defaultExpanded = false,
  onSelect,
  onToggle,
  onTrailingAction,
}) {
  return <div id={id} className={["mi-menu", `mi-menu-${size}`, `mi-menu-${variant}`, className].filter(Boolean).join(" ")} style={style} role="list">
    {items.map(item => <MenuRow key={item.id} item={item} level={level} dropdownIcon={dropdownIcon} leadingIcon={leadingIcon} trailingIcon={trailingIcon}
      renameable={renameable} onRename={onRename} defaultExpanded={defaultExpanded} onSelect={onSelect} onToggle={onToggle} onTrailingAction={onTrailingAction} />)}
  </div>;
}

function MenuRow({ initialEditing = false, inputAutoFocus = true, renameable, onRename, item, level, dropdownIcon, leadingIcon, trailingIcon, defaultExpanded, onSelect, onToggle, onTrailingAction }) {
  const [internalExpanded, setInternalExpanded] = useState(defaultExpanded);
  const [editing, setEditing] = useState(initialEditing);
  const [draft, setDraft] = useState("");
  const [renamed, setRenamed] = useState(null);
  const editingRef = useRef(initialEditing);
  const clickTimer = useRef(null);
  useEffect(() => () => clearTimeout(clickTimer.current), []);
  const name = renamed?.source === item.label ? renamed.value : item.label;
  const currentItem = { ...item, label: name };
  const expanded = item.expanded ?? internalExpanded;
  function beginRename(event) {
    if (!renameable) return;
    event.preventDefault();
    event.stopPropagation();
    clearTimeout(clickTimer.current);
    editingRef.current = true;
    setDraft("");
    setEditing(true);
  }
  function finishRename() {
    if (initialEditing) return; // Keep the documentation specimen in editing mode.
    if (!editingRef.current) return;
    editingRef.current = false;
    setEditing(false);
    if (!draft.trim() || draft === name) return;
    setRenamed({ source: item.label, value: draft });
    onRename?.(currentItem, draft);
  }
  function selectContent(event) {
    event.stopPropagation();
    const activate = () => { if (rowExpands) toggle(); else onSelect?.(currentItem); };
    // Defer only name clicks so a double click never also expands/selects the row.
    if (renameable && event.target.closest(".mi-label") && event.detail > 0) {
      clearTimeout(clickTimer.current);
      if (event.detail === 1) clickTimer.current = setTimeout(activate, 300);
    } else activate();
  }
  const rowExpands = level === "level-1" && dropdownIcon;
  function toggle() {
    const next = !expanded;
    if (item.expanded === undefined) setInternalExpanded(next);
    onToggle?.({ ...currentItem, expanded: next });
  }
  return <div className={`mi-row${rowExpands ? " mi-row-expandable" : ""}${editing ? " mi-row-editing" : ""}`} role="listitem" onClick={rowExpands && !editing ? toggle : undefined}>
    {level === "level-2" && <span className="mi-disclosure-space" aria-hidden="true" />}
    {dropdownIcon && <button type="button" className="mi-disclosure" aria-label={expanded ? "收起" : "展开"} aria-expanded={expanded} onClick={event => { event.stopPropagation(); toggle(); }}>
      <MenuIcon src={expanded ? EXPANDED_ICON : COLLAPSED_ICON} />
    </button>}
    {editing ? <>
      {leadingIcon && <MenuIcon src={item.iconSrc || DEFAULT_ICON} className="mi-leading-icon" />}
      <input className="mi-rename-input" aria-label="重命名" autoFocus={inputAutoFocus} value={draft}
        onChange={event => setDraft(event.target.value)} onBlur={finishRename}
        onClick={event => event.stopPropagation()} onDoubleClick={event => event.stopPropagation()}
        onKeyDown={event => {
          event.stopPropagation();
          if (event.key === "Enter" && !event.nativeEvent.isComposing && event.keyCode !== 229) {
            event.preventDefault();
            finishRename();
          }
        }} />
    </> : <>
      <button type="button" className="mi-main" aria-expanded={rowExpands ? expanded : undefined} onClick={selectContent}>
        {leadingIcon && <MenuIcon src={item.iconSrc || DEFAULT_ICON} className="mi-leading-icon" />}
        <MenuLabel name={name} onDoubleClick={beginRename} />
      </button>
      {trailingIcon && <span className="mi-trailing-region"><button type="button" className="mi-trailing-action" aria-label="更多" onClick={event => { event.stopPropagation(); onTrailingAction?.(currentItem); }}><MenuIcon src={MORE_ICON} /></button></span>}
    </>}

  </div>;
}
  Object.assign(__export, { MenuItem, MenuRow });
})();

  return <label className="button-control"><span>{label}</span><span className="button-select-wrap"><select value={value} onChange={event => onChange(event.target.value)}>{values.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}</select></span></label>;
}
function Toggle({ label, value, onChange }) {
  return <div className="button-control"><span>{label}</span><div className="button-toggle-line"><span>{value ? "开启" : "关闭"}</span><label className="button-switch"><input type="checkbox" aria-label={label} checked={value} onChange={event => onChange(event.target.checked)} /><span className="button-switch-track" /></label></div></div>;
}
function Table({ title, headers, rows }) {
  return <section className="demo-section"><div className="demo-section-header"><h2 className="demo-section-name">{title}</h2></div><div className="btn-table-wrap"><table className="btn-table"><thead><tr>{headers.map(header => <th key={header}>{header}</th>)}</tr></thead><tbody>{rows.map((row, i) => <tr key={i}>{row.map((cell, j) => j === 0 ? <th scope="row" key={j}>{cell}</th> : <td key={j}>{cell}</td>)}</tr>)}</tbody></table></div></section>;
}
