  /* 8. Font Size（字号，px） */

  --line-height-none: 1;

  --outline-width-none: 0px;

/* ── body base ── */
body {
  margin: 0;
  line-height: 1.5;
  color: var(--on-surface);
  font-family: var(--font-family);
  background-color: var(--surface);
}

#root {
  min-height: 100vh;
}

/* Standard scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
  background-color: transparent;
}

::-webkit-scrollbar-corner {
  background-color: transparent;
}

::-webkit-scrollbar-track {
  background-color: transparent;
}

::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background-color: var(--color-comp-divider);
  background-clip: padding-box;
}

::-webkit-scrollbar-track-piece {
  background-color: transparent;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--primary-40);
}


/* 语义层 Light Mode（:root 默认主题）*/
:root {
  /* Font Color（文本色）*/
  --color-font-primary: var(--primary-90);
  --color-font-secondary: var(--primary-60);
  --color-font-tertiary: var(--primary-40);
  --color-font-fourth: var(--primary-20);
  --color-font-emphasize: var(--brand-font); 
  --color-font-on-primary: var(--on-primary);
  --color-font-on-secondary: var(--on-primary-60);
  --color-font-on-tertiary: var(--on-primary-40);
  --color-font-on-fourth: var(--on-primary-20);

  /* Background Color（背景色）*/
  --color-background-primary: var(--white);
  --color-background-secondary: var(--gray-01);
  --color-background-tertiary: var(--gray-02);
  --color-background-fourth: var(--gray-03);
  --color-background-emphasize: var(--brand);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--white);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-05);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary); 
  --color-comp-background-gray: var(--gray-01); 
  --color-comp-background-gray-secondary: var(--gray-01);
  --color-fg-unchecked: var(--on-primary-20);
  --color-comp-divider: var(--container-20); 

  /* Comp Border Color（组件边框色）*/
  --color-comp-border: var(--container-15); 
  --color-comp-border-hover: var(--container-20); 
  --color-comp-border-focus: var(--brand); 
  --color-comp-border-active: var(--brand); 
  --color-comp-border-disabled: var(--container-10); 

  /* Icon Color（图标色）*/
  --color-icon-primary: var(--primary-90);
  --color-icon-secondary: var(--primary-60);
  --color-icon-tertiary: var(--primary-40);
  --color-icon-fourth: var(--primary-20);
  --color-icon-emphasize: var(--brand-font);
  --color-icon-sub-emphasize: var(--brand-40);
  --color-icon-on-primary: var(--on-primary);
  --color-icon-on-secondary: var(--on-primary-60);
  --color-icon-on-tertiary: var(--on-primary-40);
  --color-icon-on-fourth: var(--on-primary-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-05); 
  --color-interactive-pressed: var(--container-10);
  --color-interactive-select: var(--brand-20); 
  --color-interactive-click: var(--container-10);

  /* Functional Color（功能色，设计师指定值，独立于 multi-color 色板）*/
  --color-error: #E84026;
  --color-alert: #ED6F21;
  --color-warning: #EFBF00;
  --color-success: #64BB5C;
  --color-info: #0A59F7;
  --color-error-container: #FDEBEB;
  --color-alert-container: #FFF0E6;
  --color-warning-container: #FFF7D6;
  --color-success-container: #EDF7EB;
  --color-info-container: #E6EEFE;

  /* Shadow（阴影）*/
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.1);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.12);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.06);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.08);
  --shadow-glow: 0 4px 32px 0 rgba(241, 243, 245, 0.8);
}


/* ==========================================================================
   主题层 Theme（AI 组件直接消费的终极语义层）
   加载顺序：base → light → theme → dark*/

:root {
  /* ── primary（品牌色族，部分占位）── */
  --primary: var(--brand);
  --on-primary: var(--white);
  --primary-hover: var(--brand-80); 
  --primary-active: var(--brand); 
  --primary-disabled: var(--brand-40);
  --primary-container: var(--brand-05); 
  --on-primary-container: var(--color-font-primary);

  /* ── surface / on-surface（已重写，引用新 light/dark 语义 token）── */
  --surface: var(--color-background-secondary);
  --surface-dim: var(--color-background-tertiary);
  --surface-bright: var(--color-background-primary);
  --on-surface: var(--color-font-primary);
  --surface-container-lowest: var(--color-background-primary);
  --surface-container-low: var(--color-background-secondary);
  --surface-container: var(--color-comp-background-tertiary);
  --surface-container-high: var(--color-background-tertiary);
  --surface-container-highest: var(--color-background-fourth);

  --inverse-surface: var(--primary);
  --inverse-on-surface: var(--color-font-on-primary);
  --inverse-on-surface-variant: var(--color-font-on-secondary);
  --inverse-primary: var(--brand);

  --error: var(--color-error);
  --on-error: var(--white);
  --error-container: var(--color-error-container);
  --on-error-container: var(--color-font-primary);

  --alert: var(--color-alert);
  --on-alert: var(--white);
  --alert-container: var(--color-alert-container);
  --on-alert-container: var(--color-font-primary);

  --warning: var(--color-warning);
  --on-warning: var(--black);
  --warning-container: var(--color-warning-container);
  --on-warning-container: var(--color-font-primary);

  --success: var(--color-success);
  --on-success: var(--white);
  --success-container: var(--color-success-container);
  --on-success-container: var(--color-font-primary);

  --info: var(--color-info);
  --on-info: var(--white);
  --info-container: var(--color-info-container);
  --on-info-container: var(--color-font-primary);

  --text-secondary: var(--color-font-secondary);
  --text-placeholder: var(--color-font-tertiary);
  --text-disabled: var(--color-font-fourth);
  --text-inverse-disabled: var(--color-font-on-fourth);
  
  --interactive-link: var(--brand);
  --interactive-link-hover: var(--brand-80);
  --interactive-link-active: var(--brand);
  --interactive-link-visited: var(--brand);
  --interactive-link-disabled: var(--brand-40);

  --scrim: var(--container-15);
  --divider: var(--color-comp-divider);
  --focus-ring: var(--color-comp-border-focus);
  --selected: var(--color-comp-border-focus);

  /* ── spacing → 语义间距（引用 base --spacing-*）── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);     /* 12px */
  --spacing-gutter: var(--spacing-4);    /* 16px */
  --spacing-inset: var(--spacing-6);     /* 24px */
  --spacing-section: var(--spacing-4);   /* 16px */
  --spacing-page: var(--spacing-6);      /* 24px */

  /* ── shadow → 用途别名（引用 light/dark 已定义的 --shadow-* 尺阶）── */
  --shadow-none: none;
  --shadow-card: var(--shadow-sm);
  --shadow-dropdown: var(--shadow-md);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-2xl);

  /* ── radius → 用途别名（完整刻度用 base --radius-*）── */
  --radius-badge: var(--radius-sm);     /* 4px */
  --radius-action: var(--radius-sm);    /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── borderWidth → 语义边框宽度（引用 base）── */
  --border-width-thin: var(--border-width-base);    /* 1px，常规描边 */
  --border-width-thick: var(--border-width-medium);  /* 2px，粗描边/强调 */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: var(--outline-width-base); /* 1px */
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（排印角色：字号+行高+字体族绑定，字重在其后组合）── */
  /* Display（展示文本）*/
  --font-display-sm: var(--font-size-4xl)/var(--line-height-tight) var(--font-family); /* 38px/1.25 */
  --font-display-md: var(--font-size-5xl)/var(--line-height-tight) var(--font-family); /* 48px/1.25 */
  --font-display-lg: var(--font-size-6xl)/var(--line-height-tight) var(--font-family); /* 56px/1.25 */

  /* Title（标题）*/
  --font-title-sm: var(--font-size-xl)/var(--line-height-snug) var(--font-family); /* 20px/1.375 */
  --font-title-md: var(--font-size-2xl)/var(--line-height-snug) var(--font-family); /* 24px/1.375 */
  --font-title-lg: var(--font-size-3xl)/var(--line-height-snug) var(--font-family); /* 30px/1.375 */

  /* Subtitle（副标题）*/
  --font-subtitle-sm: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-subtitle-md: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */
  --font-subtitle-lg: var(--font-size-lg)/var(--line-height-base) var(--font-family); /* 18px/1.5 */

  /* Body（正文）*/
  --font-body-sm: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */
  --font-body-md: var(--font-size-base)/var(--line-height-base) var(--font-family); /* 14px/1.5 */
  --font-body-lg: var(--font-size-md)/var(--line-height-base) var(--font-family); /* 16px/1.5 */

  /* Caption（注释，源表仅 m/l 两档）*/
  --font-caption-md: var(--font-size-xs)/var(--line-height-base) var(--font-family); /* 10px/1.5 */
  --font-caption-lg: var(--font-size-sm)/var(--line-height-base) var(--font-family); /* 12px/1.5 */

  /* ── fontFamily（已在 base 定义，此处保留兼容）── */
  --font-family: 'HarmonyOS Sans', 'Microsoft YaHei', Arial, 'PingFang SC', 'San Francisco', sans-serif;
}


/* 语义层 Dark Mode（html 加 class="dark" 生效）*/
.dark {
  /* 以下仅重定义与浅色引用不同的 token，其余继承 :root 的 var() 引用并随 base 层 .dark 翻转 */
  /* Background Color（背景色）*/
  --color-background-primary: var(--black);

  /* Comp Background Color（组件背景色）*/
  --color-comp-background-primary: var(--gray-02);
  --color-comp-background-secondary: var(--container-10);
  --color-comp-background-tertiary: var(--container-10);
  --color-comp-background-emphasize: var(--brand);
  --color-comp-emphasize-secondary: var(--brand-20);
  --color-comp-emphasize-tertiary: var(--brand-10);
  --color-comp-background-list-card: var(--on-primary-10); /* 需坐在 gray-02+ 容器上才可见 */
  --color-comp-background-gray-secondary: var(--gray-02); /* 底部面板/非模态背景 dark */
  --color-comp-background-gray: var(--gray-01); /* 灰色背景（与浅色同引用，随 base 翻转）*/
  --color-comp-divider: var(--container-20);

  /* Interactive Color（交互色）*/
  --color-interactive-focus: var(--brand);
  --color-interactive-hover: var(--container-10);
  --color-interactive-pressed: var(--container-15);
  --color-interactive-select: var(--brand-20);
  --color-interactive-click: var(--container-15);

  /* Functional Color（功能色）Dark Mode */
  --color-error: #E85B49;
  --color-alert: #F28A4B;
  --color-warning: #F2C94C;
  --color-success: #5BA854;
  --color-info: #317AF7;
  --color-error-container: #3D211E;
  --color-alert-container: #3D291D;
  --color-warning-container: #393116;
  --color-success-container: #20351F;
  --color-info-container: rgba(49, 122, 247, 0.3);

  /* Shadow（阴影）Dark Mode */
  --shadow-xs: 0 0 4px 0 rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 8px 0 rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 6px 24px 0 rgba(0, 0, 0, 0.4);
  --shadow-2xl: 0 8px 48px 0 rgba(0, 0, 0, 0.3);
  --shadow-strong: 0 4px 16px 0 rgba(0, 0, 0, 0.5);
  --shadow-l-sm: -2px 0 12px 0 rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
}


/* ==========================================================================
   Glass（玻璃材质工具类，5 档）
   依赖 build.mjs HTML 模板中预制的 SVG filter（#glass-xs…xl，Chromium 生效）
   不支持 url() 的浏览器自动降级为纯 blur 毛玻璃（两行式写法）
   最佳载体：图片/渐变/彩色内容之上；纯白背景上几乎不可见
   不含 border-radius —— 圆角由组件用 --radius-* 自决
   ========================================================================== */

.glass-xs {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
  backdrop-filter: blur(4px) url(#glass-xs);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
}

.glass-sm {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  backdrop-filter: blur(8px) url(#glass-sm);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.glass-md {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  backdrop-filter: blur(12px) url(#glass-md);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

.glass-lg {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(16px);
  backdrop-filter: blur(16px) url(#glass-lg);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.glass-xl {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(24px);
  backdrop-filter: blur(24px) url(#glass-xl);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}


/* ==========================================================================
   预览页壳：标题 + 主题开关 + 组件 Tab
   ========================================================================== */

.demo-page {
  max-width: 1400px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

.demo-header {
  margin-bottom: 24px;
}

.demo-headline {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.demo-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font: var(--font-title-lg);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.demo-title-icon {
  color: var(--primary);
}

.demo-subtitle {
  font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 8px 0 0;
}

/* 主题开关：一个 switch，太阳 / 月亮两个图标，高亮当前主题 */
.demo-theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: none;
  border-radius: var(--radius-full);
  background-color: var(--surface-container-high);
  cursor: pointer;
}

.demo-theme-toggle > span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 24px;
  border-radius: var(--radius-full);
  color: var(--text-placeholder);
}

.demo-theme-toggle > span.is-on {
  background-color: var(--surface-container-lowest);
  color: var(--on-surface);
  box-shadow: var(--shadow-xs);
}

.demo-theme-toggle:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 组件 Tab：单独一行，可横向滚动，选中态使用主题蓝 */
.demo-tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--divider);
  margin-bottom: 40px;
}

.demo-tab {
  flex: 0 0 auto;
  padding: 10px 16px;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font: var(--font-body-lg);
  font-weight: var(--font-weight-medium);
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard);
}

.demo-tab:hover {
  color: var(--on-surface);
}

.demo-tab[aria-selected="true"] {
  color: var(--brand);
  border-bottom-color: var(--brand);
}

.demo-tab:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: calc(-1 * var(--outline-offset-gap));
}

/* 面板标题：英文名 + 中文名 + 关键属性摘要 */
.demo-panel-head {
  margin-bottom: 8px;
}

.demo-panel-name {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-title-md);
  font-weight: var(--font-weight-bold);
}

.demo-panel-summary {
  margin: 6px 0 0;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

/* ==========================================================================
   通用区块
   ========================================================================== */

.demo-section {
  margin-bottom: 64px;
}

.demo-section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.demo-section-name {
  font: var(--font-title-sm);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  margin: 0;
}

.demo-section-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font: var(--font-caption-lg);
  font-weight: var(--font-weight-bold);
  color: var(--primary);
  background-color: var(--primary-container);
  padding: 2px 10px;
  border-radius: var(--radius-full);
}

.demo-section-desc {
  font: var(--font-body-md);
  color: var(--text-secondary);
  margin: 0 0 28px;
}

.demo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 32px;
  align-items: start;
}

.demo-card {
  background-color: var(--surface-container-lowest);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 24px;
}

.demo-note {
  font: var(--font-caption-lg);
  line-height: 1.6;
  color: var(--text-secondary);
  margin: 18px 0 0;
}

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--color-font-emphasize);

  padding: 1px 5px;
  border-radius: var(--radius-xs);
}

/* ==========================================================================
   配置器（复用 Button / SearchBar 展示页的控件样式）
   ========================================================================== */

.button-configurator {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
  gap: 24px;
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-card);
}

.button-controls {
  display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px 20px;
  align-content: start;
}

.button-control {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 8px;
  color: var(--text-secondary);
  font: var(--font-body-md);
}

.button-control input,
.button-control select {
  box-sizing: border-box;
  width: 100%;
  height: 40px;
  border: 1px solid var(--color-comp-border);
  border-radius: var(--radius-container);
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-control input {
  padding: 0 12px;
}

.button-control input::placeholder {
  color: var(--text-placeholder);
}

.button-select-wrap {
  position: relative;
  display: block;
}

.button-select-wrap::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 15px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid var(--color-icon-primary);
  border-bottom: 1.5px solid var(--color-icon-primary);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.button-control select {
  padding: 0 40px 0 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.button-control input:hover,
.button-control select:hover:not(:disabled) {
  background: var(--surface-container-low);
  border-color: var(--color-comp-border-hover);
}

.button-control input:focus-visible,
.button-control select:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-toggle-line {
  display: flex;
  min-height: 40px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.button-toggle-line > span {
  color: var(--on-surface);
  font: var(--font-body-md);
}

.button-switch {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  cursor: pointer;
}

.button-switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.button-switch-track {
  position: relative;
  display: block;
  width: 36px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-comp-background-secondary);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.button-switch-track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-container-lowest);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-fast) var(--ease-standard);
}

.button-switch input:checked + .button-switch-track {
  background: var(--brand);
}

.button-switch input:checked + .button-switch-track::after {
  transform: translateX(16px);
}

.button-switch input:focus-visible + .button-switch-track {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

.button-configurator-preview {
  display: flex;
  min-height: 220px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: var(--radius-lg);
  background: var(--surface-container-low);
}

@media (max-width: 980px) {
  .button-configurator {
    grid-template-columns: 1fr;
  }

  .button-configurator-preview {
    min-height: 132px;
  }
}

@media (max-width: 760px) {
  .button-controls {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 520px) {
  .button-controls {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Button · Material 3（消费 HarmonyOS 语义色彩规范）
   --------------------------------------------------------------------------
   变体 Variant（M3 规范命名 / 别名）
     .btn--filled    M3 Filled button        高强调 · 品牌实心   （primary）
     .btn--tonal     M3 Filled tonal button  中强调 · 品牌淡底   （secondary）
     .btn--outlined  M3 Outlined button      中强调 · 描边       （tertiary）
     .btn--text      M3 Text button          低强调 · 纯文字     （plain）

   尺寸 Size             高     字号   图标   左右内边距  图标间距
     .btn--large        40px   16px   20px     16px        8px
     .btn--small        28px   14px   16px     12px        4px

   形状 Shape（几何轴，与 variant / size 正交）
     .btn--round        跑道圆  --radius-full（默认，历史外观）
     .btn--square       方圆角  --radius-lg（8px，规范上只用于 outlined × small）

   状态 State（纯 CSS，组件无内部 state）
     default → :hover → :focus-visible → :active(pressed) → :disabled
     data-state="hover|focus|pressed" 为文档/走查用的静态强制态。

   --------------------------------------------------------------------------
   色彩映射：main color = --btn-main-color → --color-icon-primary（主色，不是 brand）

   variant     背景 background                     描边 border             文字 text
   filled      --btn-main-color                   —                     --color-font-on-primary
   tonal       --color-comp-background-tertiary   —                     --btn-main-color
   outlined    透明                               --color-comp-border    --btn-main-color
   text        透明（任何状态都无背景）              —                     --color-font-emphasize

   variant     hover                          pressed                        disabled
   filled      叠 --on-primary-10             叠 --on-primary-15              沿用静止态 + 50% 透明度
   tonal       叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态 + 50% 透明度
   outlined    叠 --color-interactive-hover    叠 --color-interactive-pressed  沿用静止态（含描边）+ 50% 透明度
   text        字 --primary-hover              字 --primary-active             沿用静止态 + 50% 透明度

   disabled 统一模型：四个变体都保留静止态的底 / 字 / 描边，仅整体 opacity: 0.5。
   即 --btn-container-disabled / --btn-label-disabled / --btn-border-color-disabled
   默认就指向静止态变量，变体无需再各自声明。

   text 的文字态色（无叠加层，直接换字色，取 design_system 里 primary 的专用态色）：
     静止 --color-font-emphasize（brand-font）→ hover --primary-hover（brand 80%）
     → pressed --primary-active（brand 实色）；三档互不相同，按下有明确纵深。

   叠加层分两种模型（取决于静止底是浅色还是实心主色）：
   ① tonal / outlined —— 静止底是浅色 / 透明，叠中性交互层
      --color-interactive-hover / -pressed（= container-05 / container-10，暗色各加深一档），
      即「不变静止底，只叠交互层」，与 design_system.md 的「Hover/pressed on surfaces」一致。
     tonal    hover → container-05 叠 container-05 ≈ container-10 = --color-comp-background-secondary ✓
              pressed → container-10 叠 container-05 ≈ container-15 ✓
     outlined hover → container-05 = --color-comp-background-tertiary ✓
              pressed → container-10 = --color-comp-background-secondary ✓
   ② filled —— 静止底是 --btn-main-color（默认近黑 / 近白实心），中性层叠在其上对比度极低
      （视觉上接近无变化），所以改用「主色上的颜色」--on-primary-10 / -15 作叠加层。
      M3 Filled button 的 state layer 规范即为 on-primary，因此这不是特例而是对齐规范。
      该令牌明色为白基、暗色为黑基，自带翻转，一个值覆盖两个模式且方向都正确：
        Light：rgba(0,0,0,.9) 上叠白 10% → 合成后明度约从 10% 灰升到 19% 灰，比黑色浅一点 ✓
        Dark ：rgba(255,255,255,.9) 上叠黑 10% → 变深一档，反馈同样可见 ✓
      把 --btn-main-color 换成品牌色等彩色后依然成立（叠加层仍是「主色上的颜色」）。

   聚焦环：--btn-focus-ring = --black（纯黑 1px + --outline-offset-gap 间隙）。
     text 变体无容器，focus 不画描边环（--btn-focus-ring: transparent）。

   Dark Mode（html.dark）：
     filled 的底 = --color-icon-primary，暗色下翻为近白；文字跟随翻黑（见 .dark .btn--filled）。
     其叠加层 --on-primary-10 / -15 在暗色下翻为黑基，叠加方向自动变成「变深」，无需额外规则。
     其余变体的底 / 字都引用了自带翻转的语义 token，无需额外规则。

   所有 --btn-* 都是可覆盖契约，单实例定制：
     <Button className="my-btn" />  +  .my-btn { --btn-padding-inline: 32px; }
   ========================================================================== */

.btn {
  /* ── 尺寸契约（由 .btn--large / .btn--small 覆写）── */
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: 16px;
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;

  /* ── 形状契约（由 .btn--round / .btn--square 覆写）── */
  --btn-radius: var(--radius-full); /* 默认 = round，跑道圆 */

  /* ── 颜色契约（由变体类覆写）── */
  --btn-main-color: var(--color-icon-primary); /* 本套按钮主色：换主色只改这一处 */
  --btn-container: transparent; /* 静止态填充 */
  --btn-label: var(--on-surface); /* 文字色，图标 currentColor 跟随 */
  --btn-label-hover: var(--btn-label); /* hover 文字色（默认不变） */
  --btn-label-pressed: var(--btn-label); /* pressed 文字色（默认不变） */
  --btn-state-layer-hover: transparent; /* 悬停叠加层（叠在静止态填充之上） */
  --btn-state-layer-pressed: transparent; /* 按下叠加层 */
  --btn-container-disabled: var(--btn-container); /* 禁用态填充：沿用静止态 */
  --btn-label-disabled: var(--btn-label); /* 禁用态文字：沿用静止态 */
  --btn-disabled-opacity: 0.5; /* 禁用态整体透明度 */
  --btn-border-width: var(--border-width-none);
  --btn-border-color: transparent;
  --btn-border-color-disabled: var(--btn-border-color); /* 禁用态描边：沿用静止态 */
  --btn-focus-ring: var(--black); /* 聚焦描边环：纯黑（明暗通用） */

  position: relative;
  isolation: isolate; /* 让负 z-index 的叠加层留在按钮内部 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--btn-icon-gap);
  box-sizing: border-box;
  height: var(--btn-height);
  padding: 0 var(--btn-padding-inline);
  border: var(--btn-border-width) solid var(--btn-border-color);
  border-radius: var(--btn-radius);
  background-color: var(--btn-container);
  color: var(--btn-label);
  font-family: var(--font-family);
  font-size: var(--btn-font-size);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-none);
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard);
}

/* ── 状态叠加层：M3 state layer，叠在静止态填充之上 ── */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background-color: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

/* ── hover：叠加层 + 文字色（文字色默认与静止态一致）── */
.btn:hover:not(:disabled)::before,
.btn[data-state="hover"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* data-state 静态强制态与真实伪类必须成对：否则矩阵里 hover 只出叠加层、不出字色变化 */
.btn:hover:not(:disabled),
.btn[data-state="hover"] {
  color: var(--btn-label-hover);
}

/* ── pressed：规则放在 hover 之后，按下时覆盖悬停层 ── */
.btn:active:not(:disabled)::before,
.btn[data-state="pressed"]::before {
  background-color: var(--btn-state-layer-pressed);
  opacity: 1;
}

.btn:active:not(:disabled),
.btn[data-state="pressed"] {
  color: var(--btn-label-pressed);
}

/* ── 键盘聚焦：1px 纯黑描边环 + 2px 间隙（不影响布局）；text 变体不画环 ── */
.btn:focus-visible,
.btn[data-state="focus"] {
  outline: var(--outline-width-focus) solid var(--btn-focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 鼠标点击产生的非键盘焦点不画环；但 data-state="focus" 的静态强制态要保住 */
.btn:focus:not(:focus-visible):not([data-state="focus"]) {
  outline: none;
}

.btn[data-state="focus"]::before {
  background-color: var(--btn-state-layer-hover);
  opacity: 1;
}

/* ── 禁用：四个变体都沿用静止态的底 / 字 / 描边，仅整体降透明度（默认 50%）── */
.btn:disabled {
  background-color: var(--btn-container-disabled);
  color: var(--btn-label-disabled);
  border-color: var(--btn-border-color-disabled);
  opacity: var(--btn-disabled-opacity);
  cursor: not-allowed;
  outline: none;
}

/* ── 尺寸 ───────────────────────────────────────────── */
.btn--large {
  --btn-height: 40px;
  --btn-padding-inline: 16px;
  --btn-font-size: var(--font-size-md); /* 16px */
  --btn-icon-size: 20px;
  --btn-icon-gap: 8px;
}

.btn--small {
  --btn-height: 28px;
  --btn-padding-inline: 12px;
  --btn-font-size: var(--font-size-base); /* 14px */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

/* ── 形状 Shape：与 variant / size 正交的第三个轴 ────────
   形状不并入变体名：variant 表达强调层级，shape 表达几何，
   两者相乘会让命名膨胀（filled-round / filled-square / tonal-round…）并使别名失效。 */

/* Round：跑道圆（默认外观，与历史版本一致，向后兼容） */
.btn--round {
  --btn-radius: var(--radius-full);
}

/* Square：方圆角 8px（--radius-lg）。
   design system 里只用于 outlined × small 这一个组合；组件不做静默降级，
   其它组合传了 square 也照常渲染，合规性由调用方（presets.isShapeSupported）判断。 */
.btn--square {
  --btn-radius: var(--radius-lg);
}

/* ── 变体：颜色契约 ─────────────────────────────────── */

/* Filled：main color 实心 + 纯白文字。
   hover / pressed 用「主色上的颜色」--on-primary-10 / -15 作叠加层（M3 Filled button 的
   state layer 规范即为 on-primary）：该令牌明色为白基、暗色为黑基，自带翻转，
   所以浅色下近黑实心变浅、暗色下近白实心变深，两个模式方向都对。
   disabled：沿用静止态（实心底 + 纯白文字）整体 50% 透明度。 */
.btn--filled {
  --btn-container: var(--btn-main-color);
  --btn-label: var(--color-font-on-primary);
  --btn-state-layer-hover: var(--on-primary-10);
  --btn-state-layer-pressed: var(--on-primary-15);
}

/* Filled · Dark Mode：主色实心在暗色下翻为近白（--primary-90 → rgba(255,255,255,.9)），
   文字必须随之翻成黑色，否则白底白字不可读。
   注意：style 层的 --on-primary 被 theme.css 的 :root 固定为 --white（与 base.css 的
   .dark 同权重且更晚加载，导致暗色下不翻转），所以只能按 html.dark 约定在组件内覆盖。
   只覆盖文字色，底 / 叠加层 / disabled 继续沿用上面的契约（叠加层 --on-primary-* 自带翻转）。 */
.dark .btn--filled {
  --btn-label: var(--black);
}

/* Tonal：静止 comp_background_tertiary，叠加 --color-interactive-* 得到
   hover ≈ comp_background_secondary（container-10）、pressed ≈ container-15
   （叠层规则见 design_system「Hover/pressed on surfaces」）。
   disabled：沿用静止态配色，整体 50% 透明度。 */
.btn--tonal {
  --btn-container: var(--color-comp-background-tertiary);
  --btn-label: var(--btn-main-color);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Outlined：透明底 + 1px 中性描边 + 主色文字；描边不随状态变化
   hover = comp_background_tertiary（container-05）、pressed = comp_background_secondary（container-10）
   disabled：沿用静止态配色（含描边），整体 50% 透明度。 */
.btn--outlined {
  --btn-label: var(--btn-main-color);
  --btn-border-width: var(--border-width-thin);
  --btn-border-color: var(--color-comp-border);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Text：brand 主题蓝文字，任何状态都不出现背景色
   hover / pressed 用 design_system 里 primary 的专用态色：--primary-hover（brand 80%）
   → --primary-active（brand 实色），静止态 --color-font-emphasize 与两者都不同，按下有明确纵深。
   focus：无容器，不画聚焦描边环
   disabled：沿用静止态文字色，整体 50% 透明度。 */
.btn--text {
  --btn-label: var(--color-font-emphasize);
  --btn-label-hover: var(--primary-hover);
  --btn-label-pressed: var(--primary-active);
  --btn-state-layer-hover: transparent;
  --btn-state-layer-pressed: transparent;
  --btn-focus-ring: transparent;
}

/* ── 内容 ───────────────────────────────────────────── */
.btn__icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
}

.btn__label {
  display: inline-block;
}



/* Inherit Button's variants, heights, typography, shapes and states. */
.dropdown-btn.btn--large {
  --dropdown-btn-padding-end: 12px;
}

.dropdown-btn.btn--small {
  --dropdown-btn-padding-end: 8px;
}

.dropdown-btn.btn--xs {
  --btn-height: 28px;
  --btn-padding-inline: 8px;
  --dropdown-btn-padding-end: 8px;
  --btn-font-size: var(--font-size-sm); /* 12px */
  --btn-icon-size: 16px;
  --btn-icon-gap: 4px;
}

.dropdown-btn {
  padding-inline-end: var(--dropdown-btn-padding-end);
}

/* Dropdown Plain uses neutral content and the same state fills as Tertiary. */
.dropdown-btn.btn--text {
  --btn-label: var(--btn-main-color);
  --btn-label-hover: var(--btn-label);
  --btn-label-pressed: var(--btn-label);
  --btn-state-layer-hover: var(--color-interactive-hover);
  --btn-state-layer-pressed: var(--color-interactive-pressed);
}

/* Compact square trigger: a dedicated exception for outlined + small. */
.dropdown-btn.btn--outlined.btn--small.btn--square {
  --btn-height: 32px;
  padding-inline-start: 8px;
  padding-inline-end: 4px;
}

/* XS Outlined is always the 8px-radius square version. */
.dropdown-btn.btn--outlined.btn--xs {
  --btn-radius: var(--radius-lg);
}

.dropdown-btn__asset {
  display: block;
  flex: 0 0 auto;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
  object-fit: contain;
}

/* The uploaded SVG is a mask so its silhouette follows the label color. */
.dropdown-btn__indicator {
  display: inline-block;
  flex: 0 0 auto;
  width: var(--btn-icon-size);
  height: var(--btn-icon-size);
  background-color: currentColor;
  mask: var(--dropdown-btn-icon) center / contain no-repeat;
  -webkit-mask: var(--dropdown-btn-icon) center / contain no-repeat;
}

.dropdown-btn__indicator--caret-down-filled {
  --dropdown-btn-icon: url('assets/uploads/icon/dropdown/caret-down-filled.svg');
}

.dropdown-btn__indicator--chevron-down {
  --dropdown-btn-icon: url('assets/uploads/icon/dropdown/chevron-down.svg');
}


/* ===== Tag =====
   三种形态：diff 增删标签 / icon 图标文字标签 / tab 可选中圆角标签 */

.tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: auto;
  white-space: nowrap;
  font-family: var(--font-family);
  transition: background-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard);
}

.tag__icon {
  flex-shrink: 0;
}

/* ── 1. 代码增删标签：12px 文字 / 18px 行高，左右内边距 4px、上下 0，全圆角（999px）──
   上下内边距为 0，标签高度即行高 18px；行高显式写死 18px，
   避免日后调整字号时被 font 简写的比例行高带偏。 */
.tag--diff-add,
.tag--diff-remove {
  padding: 0 4px;
  border-radius: var(--radius-full); /* 999px */
  font: var(--font-caption-lg); /* 12px / 1.5 */
  line-height: 18px;
}

/* 用户指定色：绿底绿字 / 红底红字 */
.tag--diff-add {
  background-color: #D5F2DC;
  color: #01802B;
}

.tag--diff-remove {
  background-color: #FCE3E0;
  color: #BF0A1C;
}

/* 增删一体容器：绿 + 红两个标签固定成对，间距 4px */
.tag-diff-pair {
  display: inline-flex;
  align-items: center;
  width: auto;
}

/* ── 2. 图标 + 文字标签：14px 图标 + 12px 文字，间距 4px，container5 底色，8/4 内边距 ── */
.tag--icon {
  gap: 4px;
  padding: 4px 8px;
  border-radius: var(--radius-badge);
  background-color: var(--container-05);
  color: var(--color-font-primary);
  font: var(--font-caption-lg); /* 12px / 1.5 */
  line-height: 16px;
}

.tag--icon .tag__icon {
  color: var(--color-icon-primary);
}

/* ── 3. 可选中圆角标签：16px 图标 + 16px 文字 / 20px 行高，间距 6px，16/8 内边距 ──
   行高按规格固定 20px（非 16×1.5），标签高度 = 20 + 8×2 = 36px。 */
.tag--tab {
  --tag-tab-bg: var(--color-comp-background-tertiary);
  --tag-tab-bg-hover: var(--container-10);
  --tag-tab-bg-selected: var(--container-90);
  --tag-tab-bg-selected-hover: var(--container-80);

  gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius-3xl); /* 20px */
  background-color: var(--tag-tab-bg);
  color: var(--color-font-secondary);
  font: var(--font-body-lg); /* 16px / 1.5 */
  line-height: 20px; /* 规格：行高 20px */
  font-weight: var(--font-weight-regular);
  cursor: pointer;
}

.tag--tab .tag__icon {
  color: var(--container-60);
}

.tag--tab:hover:not(.tag--disabled):not(.tag--static) {
  background-color: var(--tag-tab-bg-hover);
}

.tag--tab:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 禁用态：静态形态（span）与交互形态（button）表现一致 */
.tag--tab.tag--disabled {
  color: var(--text-disabled);
  cursor: not-allowed;
}

.tag--tab.tag--disabled .tag__icon {
  color: var(--text-disabled);
}

/* 选中态：container90 底 + font_on_primary 文字 + Medium 字重 */
.tag--tab.tag--selected {
  background-color: var(--tag-tab-bg-selected);
  color: var(--color-font-on-primary);
  font-weight: var(--font-weight-medium);
}

.tag--tab.tag--selected .tag__icon {
  color: var(--color-icon-on-primary);
}

.tag--tab.tag--selected:hover:not(.tag--disabled):not(.tag--static) {
  background-color: var(--tag-tab-bg-selected-hover);
}

/* 静态形态：仅展示，不响应 hover、不显示手型 */
.tag--tab.tag--static {
  cursor: default;
}

.tag--tab.tag--static.tag--disabled {
  cursor: not-allowed;
}

/* dark 模式下 container90 会翻转为浅色，与白色文字冲突 —— 改用深灰底保持对比 */
.dark .tag--tab {
  --tag-tab-bg-hover: var(--container-15);
  --tag-tab-bg-selected: var(--gray-02);
  --tag-tab-bg-selected-hover: var(--gray-03);
}

/* ── 标签行容器 ── */
.tag-group {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
}


/* ===== TaskTemplateCard · 定时任务模版卡片 =====
   单卡：icon(32 线性) / 标题(20 medium，单行省略) / 描述(14 medium，双行省略)
   垂直排布、间距 20px；白底、无描边、圆角 24px、内边距 20px 24px；静止态无阴影。
   结构仅「图标 + 文字」，不承载其他原子组件。
   唯一的状态是悬浮：可点击卡片悬浮时只抬起一层阴影，填充色与描边都保持不变。 */

.task-template-card {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-5); /* 20px */
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  padding: var(--spacing-5) var(--spacing-6); /* 上下 20px / 左右 24px */
  border-radius: 24px;
  background-color: var(--surface-container-lowest);
}

/* 可点击：hover 只抬起一层阴影，填充色、描边与静止态完全一致（不做交互色叠加） */
.task-template-card--clickable {

  cursor: pointer;
  transition: box-shadow var(--duration-fast) var(--ease-standard);
}

/* 悬浮抬起：只有可点击卡片参与；未传 onClick 的静态卡没有悬浮态 */
.task-template-card--clickable:hover {
  box-shadow: var(--task-template-card-hover-shadow);
}

.task-template-card--clickable:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* 第一行：32px 线性图标，灰色 tertiary */
.task-template-card__icon {
  flex: 0 0 auto;
  color: var(--color-icon-tertiary);
}

/* 第二行：标题，单行超出省略 */
.task-template-card__title {
  overflow: hidden;
  margin: 0;
  color: var(--on-surface);
  font: var(--font-title-sm); /* 20px / 1.375 */
  font-weight: var(--font-weight-medium);
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* 第三行：描述，14px / 行高 24px，最多两行，超出省略 */
.task-template-card__desc {
  display: -webkit-box;
  overflow: hidden;
  margin: 0;
  color: var(--container-50); /* Light: #000 50% / Dark: #fff 50% */
  font: var(--font-body-md); /* 14px / 1.5 */
  font-weight: var(--font-weight-medium);
  line-height: 24px;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
}

/* 卡片组：水平排布 + 自动换行，卡间距 16px；
   min() 让窄容器下降为两列，保证「一行最少两张」。 */
.task-template-card-group {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, calc(50% - 8px)), 1fr));
  gap: var(--spacing-4); /* 16px */
  width: 100%;
}


/* ===== TaskCard · 定时任务卡片 =====
   两种形态共用同一套内容与文字规格，只有排布容器不同：
   - short（默认，窄卡）：标题行（标题 + 右侧开关）→12px→ 标签 →20px→ 描述 →20px→ 底部信息行。
   - long（宽卡）：首行「标题 / 标签 / 开关」并列（标题 ↔ 标签 12px，开关靠最右）
     →12px→ 描述 →12px→ 底部信息行。
   底部信息行两形态完全一致：左「时间周期」、右「下次执行」，14px regular、container30 弱化色。
   卡片：白底、无描边无阴影、24px 圆角、内边距上下 20px / 左右 24px（与 TaskTemplateCard 同族）。
   卡片本身是静态容器 —— 唯一可交互元素是右侧开关，因此没有悬浮/按下态。 */

.task-card {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-5); /* 20px：标题组 ↔ 描述 ↔ 底部信息行 */
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  padding: var(--spacing-5) var(--spacing-6); /* 上下 20px / 左右 24px */
  border-radius: 24px;
  background-color: var(--surface-container-lowest);
}

/* ── 短卡：标题行与标签上下叠放 ── */
.task-card__top {
  display: flex;
  flex-direction: column;
  align-items: flex-start; /* 标签按内容宽度，不拉伸 */
  gap: var(--spacing-3); /* 12px：标题行 ↔ 标签 */
  min-width: 0;
}

/* 标题行：标题占满剩余宽度，开关固定在最右 */
.task-card__head {
  display: flex;
  align-items: center;
  gap: var(--spacing-4); /* 16px：标题 ↔ 开关 */
  width: 100%;
  min-width: 0;
}

/* ── 长卡：标题 / 标签 / 开关 并列成一行 ── */
.task-card__row {
  display: flex;
  align-items: center;
  gap: var(--spacing-3); /* 12px：标题 ↔ 标签 */
  width: 100%;
  min-width: 0;
}

/* 标题：20px medium，行高 27px（设计规格固定值），单行超出省略（与 TaskTemplateCard 同规格） */
.task-card__title {
  flex: 1 1 auto;
  overflow: hidden;
  margin: 0;
  min-width: 0;
  color: var(--on-surface);
  font: var(--font-title-sm); /* 20px / 1.375 */
  font-weight: var(--font-weight-medium);
  line-height: 27px; /* 设计规格固定值（token 1.375 → 27.5px） */
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* 标签：形态由原子 Tag 决定（icon 形态 = 14px 图标 + 12px 文字） */
.task-card__label {
  flex: 0 0 auto;
}

/* 开关：不参与拉伸，尺寸由原子 Toggle 自带（36 × 20） */
.task-card__switch {
  flex: 0 0 auto;
}

/* 长卡：标题按内容宽度紧贴标签，多余空间全部让给最右侧的开关；
   标题过长时先于标签收缩并显示省略号 */
.task-card--long .task-card__title {
  flex: 0 1 auto;
}

.task-card--long .task-card__switch {
  margin-left: auto;
}

/* 描述：14px medium / 行高 24px（单行 24px、两行 48px），最多两行，超出省略（与 TaskTemplateCard 同规格） */
.task-card__desc {
  display: -webkit-box;
  overflow: hidden;
  margin: 0;
  color: var(--container-50); /* Light: #000 50% / Dark: #fff 50% */
  font: var(--font-body-md); /* 14px / 1.5 */
  font-weight: var(--font-weight-medium);
  line-height: 24px;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
}

/* 底部信息行：左右分布，整行统一 14px regular / 行高 19px + container30 弱化色（图标随文字同色） */
.task-card__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-4); /* 16px */
  min-width: 0;
  color: var(--container-30); /* Light: #000 30% / Dark: #fff 30% */
  font: var(--font-body-md); /* 14px / 1.5 */
  font-weight: var(--font-weight-regular);
  line-height: 19px; /* 单行元信息收紧行高（token 1.375 → 19.25px） */
}

.task-card__schedule {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1); /* 4px：图标 ↔ 文字 */
  min-width: 0;
}

.task-card__time-icon {
  flex: 0 0 auto;
}

  overflow: hidden;
  min-width: 0;
  white-space: nowrap;
  text-overflow: ellipsis;

  flex: 0 0 auto;

}

  display: grid;

  gap: var(--spacing-4); /* 16px */
  width: 100%;
}

.tg-root {
  --tg-track-w: 36px;
  --tg-track-h: 20px;
  --tg-knob-size: 16px;
  --tg-pad: 2px;
  --tg-travel: calc(var(--tg-track-w) - var(--tg-knob-size) - var(--tg-pad) * 2);

  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: auto;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── 轨道（button 本体）── */
.tg-switch {
  position: relative;
  flex: 0 0 auto;
  box-sizing: border-box;
  width: var(--tg-track-w);
  height: var(--tg-track-h);
  padding: 0;
  border: none;
  border-radius: var(--radius-full);
  appearance: none;
  -webkit-appearance: none;
  cursor: inherit;
  outline: none;
  background-color: var(--color-comp-background-secondary); /* 关：黑 10% */
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.tg-switch-on {
  background-color: var(--color-comp-background-emphasize); /* 开：Light/Brand #0A59F7 */
}

/* 交互叠加层：hover / 按下（不改变静息底色）*/
.tg-switch::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius-full);
  pointer-events: none;
  opacity: 0;
  background-color: var(--color-interactive-hover);
  transition: opacity var(--duration-fast) var(--ease-standard);
}

.tg-root:not(.tg-root-disabled) .tg-switch:hover::after {
  opacity: 1;
}

.tg-root:not(.tg-root-disabled) .tg-switch:active::after {
  opacity: 1;
  background-color: var(--color-interactive-pressed);
}

.tg-switch:focus-visible {
  outline: var(--outline-width-focus) solid var(--focus-ring);
  outline-offset: var(--outline-offset-gap);
}

/* ── 圆形滑块 ── */
.tg-knob {
  position: absolute;
  z-index: 1;
  top: 50%;
  left: var(--tg-pad);
  box-sizing: border-box;
  width: var(--tg-knob-size);
  height: var(--tg-knob-size);
  border-radius: var(--radius-full);
  background-color: var(--color-comp-background-primary); /* contrary：白色 */
  transform: translate(0, -50%);
  outline: var(--border-width-thin) solid transparent;
  outline-offset: 0;
  transition:
    transform var(--duration-medium) var(--ease-standard),
    outline-color var(--duration-fast) var(--ease-standard);
}

.tg-switch-on .tg-knob {
  transform: translate(var(--tg-travel), -50%);
}

/* 未选中：滑块外部 1px 描边 comp_background_tertiary（黑 5%）*/
.tg-switch-off .tg-knob {
  outline-color: var(--color-comp-background-tertiary);
}

/* 深色模式下滑块恒为白色，保证在深色轨道上始终对比可见 */
.dark .tg-root .tg-knob {
  background-color: var(--white);
}

/* ── 文案 ── */
.tg-label {
  font: var(--font-body-md);
  color: var(--on-surface);
}

/* ── 禁用：整体透明度 50% ── */
.tg-root-disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

  keyboard: KeyboardIcon,

  eye: EyeIcon,

// ---- icon-plus (联通) online flow, same as packages/previewpc ----
const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let plusState = null; // null = probing, true = icon-plus available, false = fall back to Lucide
let plusPromise = null; // singleton getConfig probe promise
let iconConfig = null;
let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url }
const svgCache = new Map(); // "name&variant&color" -> svg text

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const m = colors.find((c) =>
      c.value.split(",").map((v) => v.trim()).includes(colorHex)
    );
    if (m) return m.id;
  }
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (cached in iconInfoMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  try {
    const resp = await fetch(
      `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
    );
    const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
    const entry = (Array.isArray(data) ? data : [data]).find(
      (d) => d.icons?.length
    );
    const selected = selectBestIcon(entry?.icons || [], name);
    if (!selected?.url) return null;
    iconInfoMap[name] = { name: selected.name, url: selected.url };
    return iconInfoMap[name];
  } catch (e) {
    return null;
  }
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
async function fetchSvg(name, variant, colorHex) {
  const info = await resolveIconInfo(name);
  if (!info) return "";
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colorId = resolveColorId(variant, colorHex);
  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(
        styleValue
      )}&color=${encodeURIComponent(colorId)}&fileType=svg`
    );
    const data = await resp.json(); // { url, name, data } or array
    const item = Array.isArray(data) ? data[0] : data;
    return item?.data || ""; // raw SVG text, injected as-is
  } catch (e) {
    return "";
  }
}

    () => svgCache.get(`${name}&${variant}&${color}`) || ""

    "data-component": "Icon",
    "data-props": JSON.stringify({ name, src, size, color, variant, strokeWidth }),

(function () {
  const { useState } = React;
/**
 * Toggle 开关（36 × 20）
 * 支持 选中 / 未选中 × 可用 / 禁用 四态，受控与非受控两种用法。
 * 颜色：开态轨道 = Light/Brand(#0A59F7)，关态轨道 = comp_background_secondary(黑 10%)，
 * 圆形滑块 = comp_background_primary_contrary(白色)，关态滑块带 comp_background_tertiary 1px 外描边。
 */
function Toggle(props) {
  const disabled = !!props.disabled;
  const label = props.label;
  // checked 传入即为受控；否则由内部 state 维护
  const controlled = props.checked !== undefined && props.checked !== null;
  const [innerChecked, setInnerChecked] = useState(!!props.defaultChecked);
  const checked = controlled ? !!props.checked : innerChecked;

  const handleToggle = (event) => {
    if (disabled) return;
    const next = !checked;
    if (!controlled) setInnerChecked(next);
    if (props.onChange) props.onChange(next, event);
  };

  const rootClass = "tg-root" + (disabled ? " tg-root-disabled" : "") + (props.className ? " " + props.className : "");

  return (
    // label 包裹 button：点击文字同样可切换，且文字自动成为开关的可访问名称
    <label className={rootClass}>
      <button
        type="button"
        role="switch"
        aria-checked={checked}
        disabled={disabled}
        className={"tg-switch " + (checked ? "tg-switch-on" : "tg-switch-off")}
        onClick={handleToggle}
      >
        <span className="tg-knob" />
      </button>
      {label ? <span className="tg-label">{label}</span> : null}
    </label>
  );
}
  Object.assign(__export, { Toggle });
})();

        </p>
      </div>

      <Section
        title="Configurator"
        tag="实时配置"
        description="实时调整 props；开关走受控用法（与下方预览联动）。标签留空即不渲染标签，执行时间与下次执行留空即不渲染整条信息行。"
      >
        <div className="button-configurator">
          <div className="button-controls">
            <Select
              label="形态"
              value={variant}
              onChange={setVariant}
              options={[
                { value: "short", label: "short · 垂直短卡" },
                { value: "long", label: "long · 横向长卡" },
              ]}
            />
            <Select
              label="标签图标"
              value={labelIcon}
              onChange={setLabelIcon}
              options={TASK_LABEL_ICONS.map((c) => ({ value: c.icon, label: c.label }))}
            />
            <label className="button-control">
              <span>Title</span>
              <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="请输入标题" />
            </label>
            <label className="button-control">
              <span>标签</span>
              <input value={label} onChange={(e) => setLabel(e.target.value)} placeholder="留空则不渲染标签" />
            </label>
            <label className="button-control">
              <span>Description</span>
              <input value={description} onChange={(e) => setDescription(e.target.value)} placeholder="留空则不渲染描述" />
            </label>
            <label className="button-control">
              <span>执行时间</span>
              <input value={schedule} onChange={(e) => setSchedule(e.target.value)} placeholder="如 每周一 09:00" />
            </label>
            <label className="button-control">
              <span>下次执行</span>
              <input value={nextRun} onChange={(e) => setNextRun(e.target.value)} placeholder="如 2026/09/28 09:00" />
            </label>
            <Toggle label="开关" value={enabled} onChange={setEnabled} />
          </div>
          <div className="button-configurator-preview tc-demo-live">
            <span className="btn-lab-slotlabel">LIVE PREVIEW</span>
            <div className={"tc-demo-specimen tc-demo-specimen--" + variant}>
              <TaskCard
                variant={variant}
                title={title}
                label={label || undefined}
                labelIcon={labelIcon}
                description={description || undefined}
                schedule={schedule || undefined}
                nextRun={nextRun || undefined}
                checked={enabled}
                onChange={setEnabled}
              />
            </div>
          </div>
        </div>
      </Section>

      <Section
        title="组件陈列"
        description="短卡横向排列：由 TaskCardGroup 负责自动换行与 16px 间距，窄容器下降为两列、保证一行最少两张；长卡是宽卡，直接纵向排列。short 用于信息密度高的卡片墙，long 用于列表中的宽行。"
      >
        <div className="tc-demo-gallery">
          <div className="tc-demo-block">
            <span className="btn-lab-slotlabel">variant=&quot;short&quot; · 横向排列的短卡组（间距 16px）</span>
            <TaskCardGroup>
              {TASK_CARDS.map((item) => (
                <TaskCard
                  key={item.title}
                  variant="short"
                  title={item.title}
                  label={item.label}
                  labelIcon={item.labelIcon}
                  description={item.description}
                  schedule={item.schedule}
                  nextRun={item.nextRun}
                  defaultChecked={item.checked}
                />
              ))}
            </TaskCardGroup>
          </div>

          <div className="tc-demo-block">
            <span className="btn-lab-slotlabel">variant=&quot;long&quot; · 宽卡（标题 / 标签 / 开关 并列一行）</span>
            <div className="tc-demo-list">
              {TASK_CARDS.map((item) => (
                <TaskCard
                  key={item.title}
                  variant="long"
                  title={item.title}
                  label={item.label}
                  labelIcon={item.labelIcon}
                  description={item.description}
                  schedule={item.schedule}
                  nextRun={item.nextRun}
                  defaultChecked={item.checked}
                />
              ))}
            </div>
          </div>

          <div className="tc-demo-block">
            <span className="btn-lab-slotlabel">内容边界 · 长文案 / 缺省字段 / 开关禁用</span>
            <div className="tc-demo-list">
              {TASK_EDGE_CASES.map((item) => (
                <div className="tc-demo-case" key={item.caption}>
                  <span className="tc-demo-caption">{item.caption}</span>
                  <TaskCard {...item.props} />
                </div>
              ))}
            </div>
          </div>
        </div>
      </Section>

      <Section
        title="形态对照"
        description="两种形态共用同一套内容与原子组件，只改变首行的排布方式；底部信息行的样式完全一致。"
      >
        <div className="btn-table-wrap">
          <table className="btn-table btn-table--roomy">
            <thead>
              <tr>{["variant", "排布", "内容顺序"].map((t) => <th key={t}>{t}</th>)}</tr>
            </thead>
            <tbody>
              {TASK_VARIANT_ROWS.map((row) => (
                <tr key={row[0]}>
                  <th>{row[0]}</th>
                  <td>{row[1]}</td>
                  <td>{row[2]}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>

      <Section
        title="Color spec"
        description="层级为 Variant → State → Background / Outline / Text；未变化项标记为“同 Default”。两形态同色，无 size / shape；卡片本体不含悬浮 / 按下 / 聚焦外观，交互反馈全部来自内部原子 Toggle 与 Tag。"
      >
        <div className="btn-table-wrap">
          <table className="btn-table btn-table--color">
            <thead>
              <tr>{["Variant", "State", "Background", "Outline", "Text"].map((t) => <th key={t}>{t}</th>)}</tr>
            </thead>
            <tbody><TaskCardColorRows /></tbody>
          </table>
        </div>
        <p className="demo-note">
          实色为 token 解析链末端取值：<code>--surface-container-lowest → --color-background-primary → --white / --black</code>、
          <code>--on-surface → --color-font-primary → --primary-90</code>、
          <code>--color-comp-background-emphasize → --brand</code>（Light <code>#0A59F7</code> / Dark <code>#317AF7</code>）；
          <code>--container-*</code> 为递归混合色，Light 用黑、Dark 用白按百分比叠加。两条交互态（Hover / Pressed、Focus）在卡片本体上不改变任何颜色，与 Default 完全一致。
        </p>
      </Section>

      <Section title="Token contract" description="布局、间距、圆角与排印取值。">
        <div className="btn-table-wrap">
          <table className="btn-table btn-table--roomy">
            <thead>
              <tr>{["项目", "取值", "Token"].map((t) => <th key={t}>{t}</th>)}</tr>
            </thead>
            <tbody>
              {TASK_TOKEN_ROWS.map((row) => (
                <tr key={row[0]}>
                  <th>{row[0]}</th>
                  <td>{row[1]}</td>
                  <td><code>{row[2]}</code></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>

      <Section
        title="API contract"
        description="卡片是静态容器：不接收 onClick，不提供 size / shape / disabled（开关的 disabled 由原子 Toggle 透传）。"
      >
        <div className="btn-table-wrap">
          <table className="btn-table btn-table--roomy">
            <thead>
              <tr><th>Props</th><th>契约</th></tr>
            </thead>
            <tbody>
              <tr><th>variant</th><td><code>&quot;short&quot;</code>（默认，窄卡）· <code>&quot;long&quot;</code>（宽卡，首行并列）；非法值回退为 short。</td></tr>
              <tr><th>title</th><td>标题文案，单行超出显示省略号；始终渲染。</td></tr>
              <tr><th>label / labelIcon</th><td>标签文案与图标；label 缺省时整个标签不渲染，labelIcon 默认 <code>calendar-clock</code>。</td></tr>
              <tr><th>description</th><td>描述文案，最多两行超出省略；缺省时不渲染。</td></tr>
              <tr><th>schedule / nextRun</th><td>底部信息行的左右两端（时间周期 / 下次执行）；两者都缺省时整行不渲染。</td></tr>
              <tr><th>nextRunLabel</th><td>「下次执行」前缀，默认 <code>下次执行</code>。</td></tr>
              <tr><th>checked / defaultChecked</th><td>透传原子 Toggle：传 checked 为受控，否则用 defaultChecked 非受控。</td></tr>
              <tr><th>onChange</th><td><code>(next, event) =&gt; void</code>，开关切换回调。</td></tr>
              <tr><th>disabled</th><td>仅禁用开关，不影响卡片其他部分的展示。</td></tr>
              <tr><th>className</th><td>宿主布局扩展，不作为视觉变体。</td></tr>
              <tr><th>TaskCardGroup.children</th><td>一组短卡；负责 16px 间距、自动换行与「一行最少两张」。</td></tr>
              <tr><th>不提供的轴</th><td>无整卡 onClick、无 size / shape、无 loading / error 状态。</td></tr>
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

/* ==========================================================================
   组件注册表 + 页面壳
   ========================================================================== */

const COMPONENTS = [
  { id: "artifact-summary", label: "ArtifactSummary", Panel: ArtifactSummaryPanel },
  { id: "task-template-card", label: "TaskTemplateCard", Panel: TaskTemplateCardPanel },
  { id: "task-card", label: "TaskCard", Panel: TaskCardPanel },
];

function Demo() {
  const [dark, setDark] = useTheme();
  const [activeTab, setActiveTab] = useState(COMPONENTS[0].id);

  // Tab 键盘导航：方向键循环，Home / End 跳转首尾
  const handleTabKey = (event) => {
    const index = COMPONENTS.findIndex((c) => c.id === activeTab);
    let next = null;
    if (event.key === "ArrowRight") next = (index + 1) % COMPONENTS.length;
    else if (event.key === "ArrowLeft") next = (index - 1 + COMPONENTS.length) % COMPONENTS.length;
    else if (event.key === "Home") next = 0;
    else if (event.key === "End") next = COMPONENTS.length - 1;
    if (next === null) return;
    event.preventDefault();
    setActiveTab(COMPONENTS[next].id);
  };

  return (
    <div className="demo-page">
      <header className="demo-header">
        <div className="demo-headline">
          <div className="demo-title">
            <img src="./assets/uploads/logo.svg" alt="logo" style={{ width: 28, height: 28 }} />
            <span>组件预览</span>
          </div>
          <button
            type="button"
            role="switch"
            aria-checked={dark}
            aria-label={dark ? "切换为浅色主题" : "切换为深色主题"}
            className="demo-theme-toggle"
            onClick={() => setDark(!dark)}
          >
            <span className={dark ? "" : "is-on"}><Icon name="sun" size={16} /></span>
            <span className={dark ? "is-on" : ""}><Icon name="moon" size={16} /></span>
          </button>
        </div>
        <p className="demo-subtitle">Agentbox 组件预览 · ArtifactSummary / TaskTemplateCard / TaskCard</p>
      </header>

      <div className="demo-tabs" role="tablist" aria-label="组件列表" onKeyDown={handleTabKey}>
        {COMPONENTS.map((c) => (
          <button
            key={c.id}
            type="button"
            role="tab"
            id={"tab-" + c.id}
            className="demo-tab"
            aria-selected={activeTab === c.id}
            aria-controls={"panel-" + c.id}
            tabIndex={activeTab === c.id ? 0 : -1}
            onClick={() => setActiveTab(c.id)}
          >
            {c.label}
          </button>
        ))}
      </div>

      {/* 面板常驻挂载，切换 Tab 时保留各自配置 */}
      {COMPONENTS.map((c) => {
        const Panel = c.Panel;
        return (
          <div
            key={c.id}
            role="tabpanel"
            id={"panel-" + c.id}
            aria-labelledby={"tab-" + c.id}
            hidden={activeTab !== c.id}
          >
            <Panel />
          </div>
        );
      })}
    </div>
  );
}
  Object.assign(__export, { Demo });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.Demo));
</script>
</body>
</html>
